hkan jaminan-jaminan (sesuai keperluan) yang tertuang dalam Kerangka Acuan Kerja (KAK) / Term Of Reference (TOR), Rencana Kerja dan Syarat–Syarat Teknis (RKST) atau untuk Pekerjaan Konstruksi dengan nilai berapapun;","l":340,"h":340},{"m":"2.","t":"Jaminan pada Pengadaan Inbound sebagaimana dimaksud di atas terdiri dari:","l":340,"h":340},{"c":"[BAB IV.E angka 1, angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Jaminan atas pengadaan barang dan/ atau jasa terdiri atas:","l":340,"h":340},{"m":"a.","t":"Pada proses Pengadaan Barang/Jasa:","l":624,"h":340},{"m":"1)","t":"Jaminan Penawaran;","l":908,"h":340},{"m":"2)","t":"Jaminan Sanggahan.","l":908,"h":340},{"m":"b.","t":"Pada proses pelaksanaan pekerjaan:","l":624,"h":340},{"m":"1)","t":"Jaminan Pelaksanaan;","l":908,"h":340},{"m":"2)","t":"Jaminan Uang Muka; dan","l":908,"h":340},{"m":"3)","t":"Jaminan Pemeliharaan.","l":908,"h":340},{"m":"2.","t":"Jaminan sebagaimana dimaksud pada ayat (1) dapat berupa bank garansi atau surety bond.","l":340,"h":340},{"m":"3.","t":"Bentuk jaminan sebagaimana dimaksud pada ayat (1) bersifat :","l":340,"h":340},{"m":"a.","t":"tidak bersyarat;","l":624,"h":340},{"m":"b.","t":"mudah dicairkan;","l":624,"h":340},{"m":"c.","t":"harus dicairkan oleh penerbit jaminan paling lambat 14 (empat belas) hari kerja setelah surat perintah pencairan dari Unit Teknis terkait.","l":624,"h":340},{"m":"4.","t":"Pengadaan jasa konsultansi tidak diperlukan jaminan.","l":340,"h":340},{"m":"5.","t":"Jaminan dari Bank Umum, Perusahaan Penjaminan atau Perusahaan Asuransi, lembaga keuangan asuransi yang menjalankan usaha di bidang pembiayaan, penjaminan dan asuransi dapat digunakan untuk semua jenis Jaminan.","l":340,"h":340},{"m":"6.","t":"Perusahaan penjaminan, Perusahaan asuransi, dan lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi sebagaimana dimaksud pada ayat (5) adalah Perusahaan penerbit jaminan yang memiliki izin usaha dan pencatatan produk surety bond di Otoritas Jasa Keuangan (OJK).","l":340,"h":340},{"m":"7.","t":"Bukti jaminan diterima dan diverifikasi oleh Unit Teknis terkait.","l":340,"h":340},{"c":"[Pasal 38]"}]]},{"topik":"Jaminan Penawaran","cells":[[{"t":"JAMINAN"},{"m":"a.","t":"Jaminan Penawaran:","l":340,"h":340},{"m":"1)","t":"Peserta yang mengikuti tahapan penawaran Pengadaan Barang dan/atau Jasa harus menyerahkan Jaminan sebesar minimal 3% (tiga persen), yang dihitung dari Harga Perkiraan Sendiri (HPS)/Rencana Anggaran Biaya (RAB). Jaminan tersebut ditetapkan oleh Unit Yang Membidangi Fungsi PBJ Barang dan/atau Jasa dan disampaikan kepada Penyedia dalam bentuk angka nominal (tidak boleh menyebutkan persentase), sehingga nilai jaminan sama untuk semua peserta Pengadaan yang melakukan Penawaran;","l":624,"h":340},{"m":"2)","t":"Masa berlaku Jaminan tersebut terhitung sejak penyerahan dokumen penawaran sampai dengan pengumuman calon pemenang atau pengumuman sanggahan calon pemenang, kecuali untuk pemenang berlaku sampai dengan pemasukkan Jaminan Pelaksanaan;","l":624,"h":340},{"m":"3)","t":"Jaminan Penawaran menjadi milik Perusahaan apabila peserta mengundurkan diri setelah memasukkan dokumen penawaran;","l":624,"h":340},{"m":"4)","t":"Jaminan Penawaran disampaikan dalam bentuk Bank Garansi atau Asuransi.","l":624,"h":340},{"c":"[BAB III.G angka 3 huruf a]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PELELANGAN"},{"m":"3.4.7.","t":"Jaminan Penawaran","l":540,"h":540},{"m":"a.","t":"Jaminan Penawaran diwajibkan dalam proses Pelelangan.","l":624,"h":340},{"m":"b.","t":"Jaminan Penawaran dikeluarkan oleh bank umum milik pemerintah.","l":624,"h":340},{"m":"c.","t":"Asli Jaminan Penawaran diserahkan kepada unit yang membidangi perbendaharaan.","l":624,"h":340},{"m":"d.","t":"Kepala Unit yang membidangi perbendaharaan atau pejabat yang ditunjuk untuk menerima Jaminan Penawaran memberikan tanda terima Jaminan Penawaran.","l":624,"h":340},{"m":"e.","t":"Salinan Jaminan Penawaran dan salinan Tanda Terima Jaminan Penawaran dimasukkan bersamaan dengan pemasukan dokumen administrasi dan tidak boleh melebihi dari waktu yang sudah ditentukan di dalam Dokumen Pengadaan.","l":624,"h":340},{"m":"f.","t":"Jaminan Penawaran berupa Bank Garansi tidak dalam bentuk cek, giro, atau uang tunai, dengan nilai nominal sebesar minimal 1% (satu persen) sampai dengan 3% (tiga persen) dari total Harga Perkiraan Sendiri (HPS) Pengadaan Barang dan/atau Jasa atau dari nilai Harga Perkiraan Sendiri (HPS) untuk periode Perjanjian selama 1 (satu) tahun.","l":624,"h":340},{"m":"g.","t":"Nilai Nominal Jaminan Penawaran harus dicantumkan dalam Rencana Kerja dan Syarat (RKS).","l":624,"h":340},{"m":"h.","t":"Dalam proses evaluasi administrasi, dilakukan evaluasi jaminan penawaran dengan melihat nama Peserta, nama paket, besaran nominal, masa berlaku dan penerbit jaminan apakah sudah sesuai dengan yang dipersyaratkan atau belum, juga jaminan penawaran harus unconditional selama 14 (empat belas) hari, yaitu tanpa persyaratan apapun bila diminta oleh Pejabat Berwenang untuk dicairkan maka harus segera cair.","l":624,"h":340},{"m":"i.","t":"Penyerahan Jaminan Penawaran disertai Surat Kuasa Pencairan Bank Garansi kepada Perusahaan yaitu kepada Kepala Unit/petugas yang membidangi Perbendaharaan.","l":624,"h":340},{"m":"j.","t":"Jaminan Penawaran akan dikembalikan kepada Peserta selambat-lambatnya 7 (tujuh) hari kerja setelah penetapan pemenang atau setelah Peserta dinyatakan gugur.","l":624,"h":340},{"m":"k.","t":"Untuk melakukan pengambilan Jaminan Penawaran, Peserta yang gugur membawa dan menyerahkan asli Tanda Terima Jaminan Penawaran serta keterangan tertulis dari Pantia Pengadaan bahwa perusahaan tersebut dinyatakan gugur atau tidak dinyatakan sebagai pemenang.","l":624,"h":340},{"m":"l.","t":"Khusus kepada calon pemenang, Jaminan Penawaran akan dikembalikan setelah menyerahkan Jaminan pelaksanaan.","l":624,"h":340},{"c":"[BAB 3 angka 3.4.7]"}],[{"t":"JAMINAN"},{"m":"a.","t":"Jaminan Penawaran:","l":340,"h":340},{"m":"i.","t":"Peserta yang mengikuti tahapan penawaran Pengadaan Barang dan/atau Jasa harus menyerahkan Jaminan sebesar minimal 3% (tiga persen), yang dihitung dari Harga Perkiraan Sendiri (HPS). Jaminan tersebut ditetapkan oleh Unit Pengadaan Barang dan/atau Jasa dan disampaikan kepada calon penyedia Barang dan/atau Jasa dalam bentuk angka nominal (tidak boleh menyebutkan persentasenya), sehingga nilai jaminan adalah sama untuk semua peserta Pengadaan yang melakukan Penawaran;","l":624,"h":340},{"m":"ii.","t":"Masa berlaku Jaminan tersebut terhitung sejak penyerahan Dokumen Penawaran sampai dengan pengumuman Calon pemenang atau pengumuman sanggahan Calon pemenang, kecuali untuk Pemenang berlaku sampai dengan pemasukkan Jaminan Pelaksanaan;","l":624,"h":340},{"m":"iii.","t":"Jaminan Penawaran menjadi milik Perusahaan apabila peserta mengundurkan diri setelah memasukkan dokumen penawaran;","l":719,"h":435},{"m":"iv.","t":"Jaminan Penawaran disampaikan dalam bentuk Bank Garansi atau asuransi.","l":624,"h":340},{"c":"[BAB IV.E angka 2 huruf a]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"(1)","t":"Jaminan Penawaran diberikan oleh Calon Penyedia Barang/ Pekerjaan Konstruksi/ Jasa Konsultansi/ Jasa Lainnya sebelum memasukkan penawaran, yang besarnya diatur dalam Dokumen Pengadaan.","l":340,"h":340},{"m":"(2)","t":"Jaminan Penawaran dikembalikan kepada Calon Penyedia Barang/ Pekerjaan Konstruksi/ Jasa Konsultansi/ Jasa Lainnya setelah Calon Penyedia Barang dan/ atau Jasa tidak ditetapkan sebagai pemenang pelelangan/ kontes atau setelah diterimanya Jaminan Pelaksanaan (untuk Penyedia Barang dan/ atau Jasa yang ditetapkan sebagai pelaksana pekerjaan) sebelum penandatanganan Kontrak.","l":340,"h":340},{"m":"(3)","t":"Jaminan Penawaran tidak diperlukan dalam hal Pengadaan Barang/ Pekerjaan Konstruksi/ Jasa Konsultansi/ Jasa Lainnya dilaksanakan dengan Penunjukan Langsung.","l":340,"h":340},{"c":"[Pasal 39]"}]]},{"topik":"Jaminan Sanggah","cells":[[{"t":"JAMINAN"},{"m":"b.","t":"Jaminan Sanggah","l":340,"h":340},{"m":"1)","t":"Jaminan wajib diserahkan oleh Penyedia yang akan melakukan sanggahan calon Pemenang dan diserahkan pada saat penyampaian sanggahan calon pemenang dengan masa berlaku terhitung sejak penyampaian sanggahan calon pemenang sampai dengan saat tanda tangan kontrak. Jika diperlukan, masa berlaku Jaminan dapat diperpanjang;","l":624,"h":340},{"m":"2)","t":"Besarnya nilai jaminan 3% (tiga persen) dari Harga Perkiraan Sendiri (HPS)/Rencana Anggaran Biaya (RAB) dimana besarnya nilai nominal jaminan tersebut ditetapkan oleh Unit Yang Membidangi Fungsi PBJ dan disampaikan dalam bentuk angka nominal (bukan dalam bentuk persentase);","l":624,"h":340},{"m":"3)","t":"Jaminan menjadi milik Perusahaan apabila Sanggahan terbukti tidak benar;","l":624,"h":340},{"m":"4)","t":"Jaminan Sanggahan disampaikan dalam bentuk Bank Garansi atau Asuransi.","l":624,"h":340},{"c":"[BAB III.G angka 3 huruf b]"}],[{"m":"1.","t":"Jaminan sanggah banding ditentukan sebesar 1% (satu persen) dari HPS, dan jaminan sanggah banding diserahkan kepada fungsi pengadaan bersamaan dengan sanggah banding yang dimasukkan.","l":340,"h":340},{"m":"2.","t":"Masa berlaku jaminan sanggah banding minimal 30 (tiga puluh) hari kalender sejak surat sanggah banding diterima oleh fungsi pengadaan.","l":340,"h":340},{"m":"3.","t":"Jaminan sanggah banding menjadi milik Perusahaan apabila sanggah banding terbukti tidak benar.","l":340,"h":340},{"m":"4.","t":"Jaminan sanggah banding akan dikembalikan bilamana sanggahan terbukti benar/ diterima.","l":340,"h":340},{"c":"[Pasal 31]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"JAMINAN"},{"m":"4.","t":"Jaminan Sanggah:","l":340,"h":340},{"m":"a.","t":"Jaminan yang wajib diserahkan oleh Penyedia Barang dan/atau Jasa yang akan melakukan Sanggahan Calon Pemenang yang diserahkan pada saat penyampaian Sanggahan Calon Pemenang dengan masa berlaku terhitung sejak penyampaian Sanggahan Calon Pemenang sampai dengan saat tanda tangan Kontrak. Jika diperlukan, maka masa berlaku Jaminan dapat diperpanjang;","l":624,"h":340},{"m":"b.","t":"Besarnya nilai jaminan 3% (tiga persen) dari Harga Perkiraan Sendiri (HPS) dimana besarnya nilai nominal jaminan tersebut ditetapkan oleh Unit Pengadaan Barang dan/atau Jasa dan disampaikan dalam bentuk angka nominal (bukan dalam bentuk persentase);","l":624,"h":340},{"m":"c.","t":"Jaminan menjadi milik Perusahaan apabila Sanggahan terbukti tidak benar;","l":624,"h":340},{"m":"d.","t":"Jaminan Sanggahan disampaikan dalam bentuk Bank Garansi atau Asuransi.","l":624,"h":340},{"c":"[BAB IV.E angka 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Jaminan sanggah banding ditentukan sebesar 1% (satu persen) dari Harga Perkiraan Sendiri (HPS), dan jaminan sanggah banding diserahkan kepada Unit Kerja yang membidangi fungsi pengadaan barang dan/ atau jasa bersamaan dengan sanggah banding yang dimasukkan.","l":340,"h":340},{"m":"2.","t":"Masa berlaku jaminan sanggah banding minimal 30 (tiga puluh) hari kalender sejak surat sanggah banding diterima oleh Unit Kerja yang membidangi fungsi pengadaan barang dan/ atau jasa.","l":340,"h":340},{"m":"3.","t":"Jaminan sanggah banding menjadi milik Perusahaan apabila sanggah banding terbukti tidak benar.","l":340,"h":340},{"m":"4.","t":"Jaminan sanggah banding akan dikembalikan bilamana sanggahan terbukti benar/ diterima.","l":340,"h":340},{"c":"[Pasal 42]"}]]},{"topik":"Jaminan Uang Muka","cells":[[{"t":"JAMINAN"},{"m":"c.","t":"Jaminan Uang Muka","l":340,"h":340},{"m":"1)","t":"Pembayaran uang muka dilakukan setelah Penyedia menyerahkan Surat Jaminan Uang Muka yang dikeluarkan oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan berdasarkan peraturan perundangan yang berlaku dan nilai surat jaminan tersebut sama dengan uang muka;","l":624,"h":340},{"m":"2)","t":"Uang muka dapat diberikan maksimal sebesar 20% (dua puluh persen) dari nilai Perjanjian Pengadaan;","l":624,"h":340},{"m":"3)","t":"Jaminan Uang Muka dapat ditiadakan untuk kegiatan:","l":624,"h":340},{"m":"a)","t":"Yang bersifat deposit;","l":908,"h":340},{"m":"b)","t":"Yang bersifat rutin/dilaksanakan per-termin waktu tertentu (per-hari, per-minggu atau per-bulan);","l":908,"h":340},{"m":"c)","t":"Yang bersifat pembiayaan di depan;","l":908,"h":340},{"m":"d)","t":"Yang bersifat sewa menyewa;","l":908,"h":340},{"m":"e)","t":"Dimana Penyedia bisa menyediakan pengganti Barang dan/atau Jasa yang disepakati di dalam Perjanjian Pengadaan.","l":908,"h":340},{"m":"4)","t":"Mitigasi pemberian uang muka disepakati melalui Perjanjian Pengadaan;","l":624,"h":340},{"m":"5)","t":"Jaminan uang muka dikecualikan untuk Penunjukan Langsung kepada Anak Perusahaan.","l":624,"h":340},{"c":"[BAB III.G angka 3 huruf c]"}],[{"m":"1.","t":"Jaminan uang muka wajib disediakan untuk Pengadaan Barang dan/ atau Jasa yang mensyaratkan pemberian atau pembayaran uang muka. Jaminan Uang Muka diserahkan sebelum bersamaan dengan surat permintaan pembayaran Uang Muka diberikan.","l":340,"h":340},{"m":"2.","t":"Nilai jaminan uang muka ditetapkan sama dengan besaran pemberian uang muka yang diberikan sebesar maksimal 20% dari nilai total pekerjaan.","l":340,"h":340},{"m":"3.","t":"Masa berlaku jaminan uang muka ditetapkan dalam Dokumen Pengadaan. Minimal masa berlaku adalah sampai dengan barang atau jasa diserahterimakan.","l":340,"h":340},{"m":"4.","t":"Jaminan uang muka sebagaimana dimaksud dalam pasal 19 ayat (1) huruf b diserahkan penyedia kepada Divisi Finance & Accounting senilai uang muka.","l":340,"h":340},{"m":"5.","t":"Nilai jaminan uang muka sebagaimana dimaksud pada ayat (1) bertahap dapat dikurangi secara proporsional sesuai dengan sisa uang muka yang diterima.","l":340,"h":340},{"m":"6.","t":"Jaminan uang muka dikembalikan kepada penyedia bersamaan dengan penyerahan prestasi fisik Barang dan/ atau Jasa 100% (seratus persen) sesuai dengan yang tercantum dalam kontrak.","l":340,"h":340},{"c":"[Pasal 29]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"JAMINAN"},{"m":"3.","t":"Jaminan Uang Muka:","l":340,"h":340},{"m":"a.","t":"Pembayaran uang muka dilakukan setelah Penyedia Barang dan/atau Jasa menyerahkan surat Jaminan Uang Muka yang dikeluarkan oleh Bank BUMN/BUMD, berdasarkan peraturan perundangan yang berlaku dan nilai surat jaminan bank tersebut sama dengan uang muka. Ketentuan uang muka diberikan maksimal sebesar 20% (dua puluh persen) dari nilai Kontrak/SPK;","l":624,"h":340},{"m":"b.","t":"Uang muka dimaksud sepenuhnya dipergunakan bagi pelaksanaan pekerjaan bersangkutan;","l":624,"h":340},{"m":"c.","t":"Pengembalian uang muka diperhitungkan secara langsung pada tahapan pembayaran sesuai Kontrak/SPK;","l":624,"h":340},{"m":"d.","t":"Jaminan Uang Muka disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD.","l":624,"h":340},{"m":"e.","t":"Jaminan Uang Muka dapat ditiadakan untuk kegiatan:","l":624,"h":340},{"m":"i.","t":"Yang bersifat deposit;","l":908,"h":340},{"m":"ii.","t":"Yang bersifat rutin/dilaksanakan per-termin waktu tertentu (per-hari, per- minggu atau per-bulan);","l":908,"h":340},{"m":"iii.","t":"Yang bersifat pembiayaan di depan;","l":1003,"h":435},{"m":"iv.","t":"Yang bersifat sewa menyewa;","l":908,"h":340},{"m":"v.","t":"Dimana Penyedia bisa menyediakan pengganti Barang dan/atau Jasa yang disepakati di dalam Perjanjian Pengadaan.","l":908,"h":340},{"c":"[BAB IV.E angka 3]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Jaminan uang muka wajib disediakan untuk pengadaan barang dan/ atau jasa yang mensyaratkan pemberian atau pembayaran uang muka.","l":340,"h":340},{"m":"2.","t":"Jaminan Uang Muka diserahkan sebelum bersamaan dengan surat permintaan pembayaran Uang Muka diberikan.","l":340,"h":340},{"m":"3.","t":"Nilai jaminan uang muka ditetapkan sama dengan besaran pemberian uang muka yang diberikan sebesar maksimal 20% dari nilai total pekerjaan.","l":340,"h":340},{"m":"4.","t":"Masa berlaku jaminan uang muka ditetapkan dalam Dokumen Pengadaan. Minimal masa berlaku adalah sampai dengan barang atau jasa diserahterimakan.","l":340,"h":340},{"m":"5.","t":"Jaminan uang muka sebagaimana dimaksud dalam Pasal … ayat (…) diserahkan oleh Penyedia Barang dan/ atau Jasa kepada Unit Kerja yang membidangi fungsi Keuangan senilai uang muka.","l":340,"h":340},{"m":"6.","t":"Nilai jaminan uang muka sebagaimana dimaksud pada ayat (1) bertahap dapat dikurangi secara proporsional sesuai dengan sisa uang muka yang diterima.","l":340,"h":340},{"m":"7.","t":"Jaminan uang muka dikembalikan kepada Penyedia Barang dan/ atau Jasa bersamaan dengan penyerahan prestasi fisik Barang dan/ atau Jasa 100% (seratus persen) sesuai dengan yang tercantum dalam Bukti Perjanjian.","l":340,"h":340},{"c":"[Pasal 40]"}]]},{"topik":"Jaminan Pelaksanaan","cells":[[{"t":"JAMINAN"},{"m":"d.","t":"Jaminan Pelaksanaan","l":340,"h":340},{"m":"1)","t":"Jaminan wajib diserahkan oleh Penyedia sebelum menandatangani Perjanjian Pengadaan untuk pengadaan tertentu yang ditetapkan oleh Unit Bisnis atau Unit Teknis;","l":624,"h":340},{"m":"2)","t":"Nilai Jaminan Pelaksanaan sekurang-kurangnya sebesar 5% (lima persen) dari nilai Perjanjian Pengadaan, dimana besarnya nilai nominal (huruf dan angka) jaminan tersebut ditetapkan oleh Unit Bisnis atau Unit Teknis;","l":624,"h":340},{"m":"3)","t":"Masa berlaku Jaminan Pelaksanaan sesuai dengan masa Perjanjian Pengadaan sampai dengan berakhirnya masa Perjanjian Pengadaan minimal ditambah 60 (enam puluh) hari kalender;","l":624,"h":340},{"m":"4)","t":"Jaminan Pelaksanaan disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan;","l":624,"h":340},{"m":"5)","t":"Jaminan Pelaksanaan dikembalikan kepada Penyedia setelah ditandatanganinya Berita Acara Serah Terima Barang dan/atau Jasa;","l":624,"h":340},{"m":"6)","t":"Jaminan Pelaksanaan dikenakan untuk pekerjaan dalam bentuk Jasa Konstruksi;","l":624,"h":340},{"m":"7)","t":"Jaminan Pelaksanaan dikecualikan untuk Penunjukan Langsung kepada Anak Perusahaan.","l":624,"h":340},{"c":"[BAB III.G angka 3 huruf d]"}],[{"m":"1.","t":"Jaminan pelaksanaan sebagaimana dimaksud dalam pasal 19 ayat (1) huruf b diberlakukan untuk pengadaan barang dan/ atau jasa dengan nilai paling sedikit di atas Rp 1.000.000.000,- (Satu Milyar Rupiah).","l":340,"h":340},{"m":"2.","t":"Jaminan Pelaksanaan sebagaimana dimaksud pada ayat (1) dikecualikan untuk :","l":340,"h":340},{"m":"a.","t":"Penunjukan langsung kepada BUMN dan Anak Perusahaan;","l":624,"h":340},{"m":"b.","t":"Penunjukan langsung kepada Perguruan Tinggi Negeri (PTN) dan lembaga/ badan hukum yang kepemilikannya di bawah Perguruan Tinggi Negeri (PTN);","l":624,"h":340},{"m":"c.","t":"Pengadaan kepada instansi pemerintah;","l":624,"h":340},{"m":"d.","t":"Pengadaan jasa konsultansi perorangan;","l":624,"h":340},{"m":"e.","t":"Pengadaan jasa konsultansi non konstruksi;","l":624,"h":340},{"m":"f.","t":"Pengadaan jasa konsultan hukum;","l":624,"h":340},{"m":"g.","t":"Pengadaan jasa notaris;","l":624,"h":340},{"m":"h.","t":"Pengadaan asuransi;","l":624,"h":340},{"m":"i.","t":"Pembelian rumah dinas;","l":624,"h":340},{"m":"j.","t":"Pengadaan kendaraan dinas operasional;","l":624,"h":340},{"m":"k.","t":"Pengadaan barang dan/ atau jasa yang menggunakan kontrak payung (framework contract); dan","l":624,"h":340},{"m":"l.","t":"Pengadaan jasa lainnya yang aset penyedia sudah dikuasai oleh Perusahaan.","l":624,"h":340},{"m":"3.","t":"Besaran nilai jaminan pelaksanaan adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Untuk nilai penawaran terkoreksi antara 80% (delapan puluh persen) sampai dengan 100% (seratus persen) dari nilai Harga Perkiraan Sendiri (HPS), jaminan pelaksanaan sebesar 5% (lima persen) dari nilai kontrak; atau","l":624,"h":340},{"m":"b.","t":"Untuk nilai penawaran terkoreksi di bawah 80% (delapan puluh persen) dari nilai Harga Perkiraan Sendiri, jaminan pelaksanaan sebesar 5% (lima persen) dari nilai total Harga Perkiraan Sendiri (HPS).","l":624,"h":340},{"m":"4.","t":"Besaran nilai jaminan pelaksanaan untuk pekerjaan terintegrasi adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Untuk nilai penawaran antara 80% (delapan puluh persen) sampai dengan 100% (seratus persen) dari nilai Pagu Anggaran, Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai kontrak; atau","l":624,"h":340},{"m":"b.","t":"Untuk nilai penawaran di bawah 80% (delapan puluh persen) dari nilai pagu anggaran, jaminan pelaksanaan sebesar 5% (lima persen) dari nilai pagu anggaran.","l":624,"h":340},{"m":"5.","t":"Jaminan pelaksanaan diserahkan kepada Perusahaan selambat-lambatnya 14 (empat belas) hari kerja terhitung setelah penandatanganan Surat Perintah Kerja (SPK).","l":340,"h":340},{"m":"6.","t":"Masa berlaku jaminan pelaksanaan adalah jangka waktu pelaksanaan pekerjaan Pengadaan Barang dan/ atau Jasa ditambah 30 (tiga puluh) hari kalender.","l":340,"h":340},{"m":"7.","t":"Jaminan pelaksanaan menjadi milik Perusahaan apabila penyedia tidak menyelesaikan pekerjaan sesuai dengan kontrak.","l":340,"h":340},{"m":"8.","t":"Jaminan pelaksanaan dikembalikan kepada penyedia bersamaan dengan penyerahan prestasi fisik barang dan/ atau jasa 100% (seratus persen) sesuai dengan yang tercantum dalam kontrak.","l":340,"h":340},{"c":"[Pasal 30]"}],[{"t":"JAMINAN PELAKSANAAN"},{"m":"4.9.1","t":"Ketentuan mengenai Jaminan pelaksanaan harus dicantumkan dalam Rencana Kerja dan Syarat (RKS) atau dalam surat permintaan penawaran harga.","l":480,"h":480},{"m":"4.9.2","t":"Jaminan pelaksanaan diwajibkan untuk Pengadaan Barang dan/atau Jasa:","l":480,"h":480},{"m":"a.","t":"Dengan Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah);","l":624,"h":340},{"m":"b.","t":"Perjanjian dengan Harga Lumsum; dan/atau","l":624,"h":340},{"m":"c.","t":"Perjanjian yang mensyaratkan uang muka.","l":624,"h":340},{"m":"4.9.3","t":"Pengadaan jasa konstruksi dan pembelian barang Investasi, besaran jaminan pelaksanaan adalah 5% (lima persen) dari total harga Perjanjian sebelum PPN.","l":480,"h":480},{"m":"4.9.4","t":"Untuk Pengadaan Barang dan/atau Jasa selain butir 4.9.3, besaran jaminan pelaksanaan adalah 3% (tiga persen) dari total harga per tahun sebelum PPN yang diikat sesuai dengan jangka waktu Perjanjian.","l":480,"h":480},{"m":"4.9.5","t":"Apabila Perjanjian kurang dari 1 (satu) tahun, maka besaran jaminan pelaksanaan adalah 3% (tiga persen) dari total harga Perjanjian.","l":480,"h":480},{"m":"4.9.6","t":"Jaminan pelaksanaan diserahkan selambat-lambatnya 14 (empat belas) hari kerja sejak ditandatanganinya Surat Perintah Kerja (SPK).","l":480,"h":480},{"m":"4.9.7","t":"Penyerahan jaminan pelaksanaan wajib disertai dengan surat kuasa pencairan jaminan pelaksanaan. Pembuatan surat kuasa dilakukan sesuai dengan ketentuan hukum yang berlaku.","l":480,"h":480},{"m":"4.9.8","t":"Jaminan pelaksanaan diserahkan kepada Kepala Unit yang membidangi perbendaharaan di lokasi tempat dilaksanakannya proses Pengadaan. Sebagai bukti telah menyerahkan jaminan pelaksanaan, petugas yang menerima jaminan pelaksanaan mengeluarkan tanda terima jaminan pelaksanaan.","l":480,"h":480},{"m":"4.9.9","t":"Sebelum Perjanjian ditandatangani oleh Pejabat Berwenang, Unit Kerja Pengadaan wajib memastikan Penyedia Barang dan/atau Jasa telah menyerahkan jaminan pelaksanaan sesuai ketentuan yang berlaku.","l":480,"h":480},{"m":"4.9.10","t":"Untuk memastikan penyerahan jaminan pelaksanaan, pada saat menyerahkan Perjanjian yang telah ditandatangani oleh Penyedia Barang dan/atau Jasa, Penyedia Barang dan/atau Jasa wajib menyerahkan salinan jaminan pelaksanaan dan salinan tanda terima jaminan pelaksanaan yang telah ditandatangani oleh petugas Unit Kerja yang membidangi perbendaharaan.","l":570,"h":570},{"m":"4.9.11","t":"Jaminan pelaksanaan akan dikembalikan kepada Penyedia Barang dan/atau Jasa yang telah menyelesaikan seluruh pekerjaan yang ditetapkan. Pengembalian jaminan pelaksanaan dilakukan setelah Penyedia Barang dan/atau Jasa memberikan bukti tertulis penyelesaian pekerjaan/tanda terima barang yang ditandatangani oleh Penyedia Barang dan/atau Jasa dan petugas dari Unit Spesifikasi Teknis (UST) .","l":570,"h":570},{"m":"4.9.12","t":"Jaminan pelaksanaan tersebut tidak dibenarkan dalam bentuk uang tunai, deposito, cheque atau giro. Tetapi diberikan dalam bentuk surat garansi Bank yang dikeluarkan oleh Bank Pemerintah.","l":570,"h":570},{"m":"4.9.13","t":"Jaminan pelaksanaan menjadi milik dan dapat dicairkan oleh Perusahaan apabila Penyedia Barang dan/atau Jasa mengundurkan diri setelah menandatangani Perjanjian, atau selama melaksanakan pekerjaan, Penyedia Barang dan/atau Jasa melakukan kelalaian yang dapat merugikan Perusahaan.","l":570,"h":570},{"m":"4.9.14","t":"Apabila terjadi perpanjangan jangka waktu Perjanjian, Jaminan pelaksanaan wajib diperpanjang sampai dengan perpanjangan Perjanjian berakhir.","l":570,"h":570},{"m":"4.9.15","t":"Apabila terjadi kenaikan harga atau penambahan volume pekerjaan, maka Jaminan pelaksanaan dapat disesuaikan dengan total harga yang baru.","l":570,"h":570},{"m":"4.9.16","t":"Unit Kerja yang membidangi fungsi Pengadaan di lokasi tempat dilaksanakan proses Pengadaan bertanggung jawab untuk memastikan Pelaksana menyerahkan Jaminan pelaksanaan.","l":570,"h":570},{"m":"4.9.17","t":"Jaminan pelaksanaan tidak diperlukan dalam hal:","l":570,"h":570},{"m":"a.","t":"Pengadaan jasa konsultan, asuransi, rumah sakit, hotel dan pendidikan;","l":624,"h":340},{"m":"b.","t":"Pengadaan barang-barang strategis yang penyediaannya dikuasai oleh negara seperti namun tidak terbatas pada BBM, telepon, PDAM dan barang sejenis lainnya;","l":624,"h":340},{"m":"c.","t":"Pengadaan Barang yang selama masa Perjanjian barangnya dikuasai oleh Perusahaan seperti sewa kendaraaan, sewa Peralatan Ground Support Equipment (GSE), X-Ray, sewa ruangan, beli dengan leasing/kredit dan lainnya; dan/atau","l":624,"h":340},{"m":"d.","t":"Nilai Pengadaan yang jangka waktu pelaksanaannya kurang dari 14 (empat belas) hari kerja.","l":624,"h":340},{"c":"[BAB 4 angka 4.9.0]"}],[{"t":"JAMINAN"},{"m":"5.","t":"Jaminan Pelaksanaan:","l":340,"h":340},{"m":"a.","t":"Jaminan wajib diserahkan oleh Penyedia Barang dan/atau Jasa sebelum menandatangani Kontrak/SPK;","l":624,"h":340},{"m":"b.","t":"Nilai Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai Kontrak/SPK dimana besarnya nilai nominal (huruf dan angka) jaminan tersebut ditetapkan oleh Unit Pengadaan;","l":624,"h":340},{"m":"c.","t":"Masa berlaku Jaminan Pelaksanaan sesuai dengan masa kontrak sampai dengan berakhirnya masa kontrak minimal ditambah 60 (enam puluh) hari kalender;","l":624,"h":340},{"m":"d.","t":"Jaminan Pelaksanaan disampaikan dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD atau Asuransi BUMN;","l":624,"h":340},{"m":"e.","t":"Jaminan Pelaksanaan dikembalikan kepada Penyedia Barang dan/atau Jasa setelah ditandatanganinya Berita Acara Serah Terima Barang dan/atau Jasa terakhir.","l":624,"h":340},{"c":"[BAB IV.E angka 5]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Jaminan Pelaksanaan diberlakukan untuk pengadaan barang dan/ atau jasa dengan nilai paling sedikit di atas Rp 1.000.000.000,- (Satu Milyar Rupiah).","l":340,"h":340},{"m":"2.","t":"Jaminan Pelaksanaan sebagaimana dimaksud pada ayat (1) dikecualikan untuk :","l":340,"h":340},{"m":"a.","t":"Penunjukan langsung kepada Badan Usaha Milik Negara dan Anak Perusahaan;","l":624,"h":340},{"m":"b.","t":"Penunjukan langsung kepada Perguruan Tinggi Negeri (PTN) dan lembaga/ badan hukum yang kepemilikannya di bawah Perguruan Tinggi Negeri (PTN);","l":624,"h":340},{"m":"c.","t":"Pengadaan kepada instansi pemerintah;","l":624,"h":340},{"m":"d.","t":"Pengadaan jasa konsultansi perorangan;","l":624,"h":340},{"m":"e.","t":"Pengadaan jasa konsultansi non konstruksi;","l":624,"h":340},{"m":"f.","t":"Pengadaan jasa konsultan hukum;","l":624,"h":340},{"m":"g.","t":"Pengadaan jasa Notaris;","l":624,"h":340},{"m":"h.","t":"Pengadaan kantor akuntan atau Kantor Jasa Penilai Publik","l":624,"h":340},{"m":"i.","t":"Pengadaan asuransi;","l":624,"h":340},{"m":"j.","t":"Pembelian rumah dinas;","l":624,"h":340},{"m":"k.","t":"Pengadaan kendaraan dinas operasional;","l":624,"h":340},{"m":"l.","t":"Pengadaan barang dan/ atau jasa yang menggunakan kontrak payung (framework contract); dan","l":624,"h":340},{"m":"m.","t":"Pengadaan jasa lainnya yang aset Penyedia Barang dan/ atau Jasa sudah dikuasai oleh Perusahaan.","l":624,"h":340},{"m":"n.","t":"Pengadaan barang dan/ atau jasa yang bersifat rutin seperti consumables, pemeliharaan fasilitas/ peralatan, sewa kendaraan/peralatan, seragam atau yang bersifat rutin lainnya;","l":624,"h":340},{"m":"o.","t":"Pengadaan barang dan/ atau jasa yang bersifat karya seni;","l":624,"h":340},{"m":"p.","t":"Pengadaan barang dan/ atau jasa yang jangka waktu pelaksanaanya tidak melebihi 14 (empat belas) hari kalender;","l":624,"h":340},{"m":"3.","t":"Besaran nilai jaminan pelaksanaan adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Untuk nilai penawaran terkoreksi antara 80% (delapan puluh persen) sampai dengan 100% (seratus persen) dari nilai Harga Perkiraan Sendiri (HPS), jaminan pelaksanaan sebesar 5% (lima persen) dari nilai kontrak; atau","l":624,"h":340},{"m":"b.","t":"Untuk nilai penawaran terkoreksi di bawah 80% (delapan puluh persen) dari nilai Harga Perkiraan Sendiri, jaminan pelaksanaan sebesar 5% (lima persen) dari nilai total Harga Perkiraan Sendiri (HPS).","l":624,"h":340},{"m":"4.","t":"Besaran nilai jaminan pelaksanaan untuk pekerjaan terintegrasi adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Untuk nilai penawaran antara 80% (delapan puluh persen) sampai dengan 100% (seratus persen) dari nilai Pagu Anggaran, Jaminan Pelaksanaan sebesar 5% (lima persen) dari nilai kontrak; atau","l":624,"h":340},{"m":"b.","t":"Untuk nilai penawaran di bawah 80% (delapan puluh persen) dari nilai pagu anggaran, jaminan pelaksanaan sebesar 5% (lima persen) dari nilai pagu anggaran.","l":624,"h":340},{"m":"5.","t":"Jaminan Pelaksanaan sebagaimana dimaksud pada ayat (1) diberikan selambat-lambatnya 14 (empat belas) hari kerja setelah diterbitkannya Surat Penunjukan Penyedia Barang dan/ atau Jasa (SPPBJ) oleh Pelaksana Pengadaan Barang dan/ atau Jasa dan sebelum penandatanganan Bukti Perjanjian.","l":340,"h":340},{"m":"5.","t":"Jaminan pelaksanaan berlaku sejak tanggal Bukti Perjanjian dan masa berlakunya sekurang-kurangnya sama dengan jangka waktu pelaksanaan pekerjaan.","l":340,"h":340},{"m":"6.","t":"Jaminan pelaksanaan menjadi milik Perusahaan apabila Penyedia Barang dan/ atau Jasa tidak menyelesaikan pekerjaan sesuai dengan kontrak.","l":340,"h":340},{"m":"7.","t":"Jaminan pelaksanaan dikembalikan kepada Penyedia Barang dan/ atau Jasa setelah:","l":340,"h":340},{"m":"a.","t":"Penyerahan prestasi fisik barang dan/ atau jasa 100% (seratus persen) sesuai dengan yang tercantum dalam Bukti Perjanjian","l":624,"h":340},{"m":"b.","t":"Penyerahan Jaminan Pemeliharaan sebesar 5% (lima perseen) dari nilai pengadaan barang dan/ atau jasa, khusus bagi Penyedia Pekerjaan Konstruksi/ Jasa Lainnya","l":624,"h":340},{"m":"8.","t":"Apabila terjadi penambahan waktu pelaksanaan pekerjaan, maka Penyedia Barang dan/ atau Jasa wajib untuk memperpanjang masa berlaku jaminan pelaksanaan sesuai dengan penambahan waktu pelaksanaan pekerjaan.","l":340,"h":340},{"m":"9.","t":"Apabila terjadi pekerjaan tambah yang menyebabkan perubahan nilai pengadaan barang dan/ atau jasa, maka Penyedia Barang dan/ atau Jasa wajib untuk menyerahkan jaminan pelaksanaan tambahan sebesar 5% (lima persen) dari nilai pekerjaan tambahan.","l":340,"h":340},{"c":"[Pasal 41]"}]]},{"topik":"Jaminan Pemeliharaan","cells":[[{"t":"JAMINAN"},{"m":"e.","t":"Jaminan Pemeliharaan","l":340,"h":340},{"m":"1)","t":"Jaminan Pemeliharaan diberikan oleh Penyedia pada masa pemeliharaan sekurang-kurangnya 5% (lima persen) dari Nilai Perjanjian Pengadaan dalam bentuk Bank Garansi yang diterbikan oleh oleh Bank Umum, Perusahaan Penjaminan, dan Lembaga Keuangan yang bergerak dibidang penjaminan, atau bentuk uang retensi untuk pengadaan tertentu yang ditetapkan oleh Unit Bisnis atau Unit Teknis;","l":624,"h":340},{"m":"2)","t":"Jaminan Pemeliharaan dalam bentuk uang retensi diberlakukan pada PBJ yang memerlukan pemeliharaan atas hasil pekerjaan yang telah dilaksanakan;","l":624,"h":340},{"m":"3)","t":"Masa berlaku Jaminan Pemeliharaan adalah tanggal Serah Terima Akhir Pekerjaan ditambah minimal 90 (sembilan puluh) Hari kalender. Jika diperlukan, maka masa berlaku Jaminan Pemeliharaan dapat diperpanjang;","l":624,"h":340},{"m":"4)","t":"Apabila dengan kondisi-kondisi yang diperlukan, maka masa berlaku Jaminan Pemeliharaan dapat diperpanjang;","l":624,"h":340},{"m":"5)","t":"Jaminan Pemeliharaan dikembalikan kepada Penyedia setelah ditandatanganinya Berita Acara Penyelesaian Pekerjaan.","l":624,"h":340},{"c":"[BAB III.G angka 3 huruf e]"}],[{"m":"1.","t":"Retensi sebagai jaminan Pemeliharaan dapat diberlakukan untuk pekerjaan konstruksi dan jasa lainnya yang membutuhkan masa pemeliharaan.","l":340,"h":340},{"m":"2.","t":"Retensi dilaksanakan dengan cara penundaan pembayaran 5% (lima persen) dari nilai Kontrak.","l":340,"h":340},{"m":"3.","t":"Masa berlaku retensi sekurang-kurangnya dimulai sejak Berita Acara Serah Terima (BAST) pekerjaan sampai dengan masa pemeliharaan berakhir.","l":340,"h":340},{"m":"4.","t":"Retensi dapat ditagihkan oleh Penyedia setelah masa pemeliharaan berakhir yang dibuktikan dengan Berita Acara Serah Terima (BAST) masa pemeliharaan.","l":340,"h":340},{"m":"5.","t":"Retensi menjadi hak Perusahaan apabila Penyedia tidak melaksanakan kewajibannya pada masa pemeliharaan.","l":340,"h":340},{"c":"[Pasal 32]"}],[{"t":"MASA PEMELIHARAAN"},{"m":"6.3.1.","t":"Untuk pengadaan barang investasi dan pekerjaan jasa konstruksi diwajibkan adanya jaminan pemeliharaan sejak diterimanya barang atau hasil pekerjaan jasa konstruksi untuk pertama kalinya.","l":540,"h":540},{"m":"6.3.2.","t":"Penyedia Barang wajib melakukan pemeliharaan atas hasil pekerjaan selama masa yang ditetapkan dalam Perjanjian, sehingga kondisinya tetap seperti pada saat penyerahan hasil pekerjaan.","l":540,"h":540},{"m":"6.3.3.","t":"Masa pemeliharaan untuk barang investasi sesuai dengan masa garansi yang diberikan oleh pabrik/penyedia barang.","l":540,"h":540},{"m":"6.3.4.","t":"Masa pemeliharaan untuk hasil pekerjaan jasa konstruksi minimal selama 3 (tiga) bulan sejak diterimanya hasil pekerjaan jasa konstruksi untuk pertama kalinya.","l":540,"h":540},{"m":"6.3.5.","t":"Selama masa pemeliharaan, Penyedia Barang dan/atau Jasa wajib menyerahkan jaminan pemeliharaan sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Garansi Bank dari bank pemerintah minimal sebesar 5% (lima pesen) dari Nilai Perjanjian; atau","l":624,"h":340},{"m":"b.","t":"Retensi pembayaran minimal sebesar 5% (lima persen) dari nilai Perjanjian","l":624,"h":340},{"m":"6.3.6.","t":"Jangka waktu jaminan pemeliharaan sesuai dengan jangka waktu sebagaimana dimaksud pada butir 6.3.3. dan butir 6.3.4.","l":540,"h":540},{"m":"6.3.7.","t":"Setelah masa pemeliharaan selesai, Penyedia Barang dan/atau Jasa menandatangani Berita Acara Serah Terima Akhir Pekerjaan pada saat proses serah terima akhir.","l":540,"h":540},{"m":"6.3.8.","t":"Setelah masa pemeliharaan selesai, Unit Spesifikasi Teknis (UST) menyampaikan nota pemberitahuan kepada Pejabat Unit yang membidangi perbendaharaan dengan melampirkan salinan Berita Acara Serah Terima Akhir Pekerjaan untuk mengembalikan jaminan pemeliharaan/uang retensi kepada Penyedia Barang dan/atau Jasa.","l":540,"h":540},{"c":"[BAB 6 angka 6.3.0]"}],[{"t":"JAMINAN"},{"m":"6.","t":"Jaminan Pemeliharaan:","l":340,"h":340},{"m":"a.","t":"Jaminan Pemeliharaan diberikan oleh Penyedia Barang dan/atau Jasa pada masa pemeliharaan sekurang-kurangnya 5% (lima persen) dari Nilai Kontrak/SPK dalam bentuk Bank Garansi yang diterbitkan oleh Bank BUMN/BUMD, atau bentuk uang retensi;","l":624,"h":340},{"m":"b.","t":"Jaminan Pemeliharaan dalam bentuk uang retensi diberlakukan pada Pengadaan Barang dan/atau Jasa yang memerlukan pemeliharaan atas hasil pekerjaan yang telah dilaksanakan;","l":624,"h":340},{"m":"c.","t":"Masa berlaku Jaminan Pemeliharaan adalah tanggal Serah Terima Akhir Pekerjaan ditambah minimal 30 (tiga puluh) hari kalender.","l":624,"h":340},{"m":"d.","t":"Apabila dengan kondisi-kondisi yang diperlukan, maka masa berlaku Jaminan Pemeliharaan dapat diperpanjang;","l":624,"h":340},{"m":"e.","t":"Jaminan Pemeliharaan dikembalikan kepada Penyedia Barang dan/atau Jasa setelah ditandatanganinya Berita Acara Penyelesaian Pekerjaan.","l":624,"h":340},{"c":"[BAB IV.E angka 6]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Penyedia Barang dan/ atau Jasa pekerjaan konstruksi dapat memilih untuk memberikan Jaminan Pemeliharaan atau Retensi.","l":340,"h":340},{"m":"2.","t":"Penyedia Barang dan/ atau Jasa memberikan Jaminan Pemeliharaan kepada Unit Kerja yang membidangi fungsi Keuangan setelah pelaksanaan pekerjaan dinyatakan selesai 100% (seratus persen), dalam hal:","l":340,"h":340},{"m":"a.","t":"Pekerjaan Konstruksi;","l":624,"h":340},{"m":"b.","t":"Pengadaan Jasa Lainnya yang membutuhkan masa pemeliharaan.","l":624,"h":340},{"m":"3.","t":"Retensi sebagai jaminan Pemeliharaan dapat diberlakukan untuk pekerjaan konstruksi dan jasa lainnya yang membutuhkan masa pemeliharaan.","l":340,"h":340},{"m":"4.","t":"Nilai Jaminan Pemeliharaan atau Retensi sebesar 5% (lima persen) dari nilai pengadaan barang dan/ atau jasa.","l":340,"h":340},{"m":"5.","t":"Jaminan Pemeliharaan dikembalikan selambat-lambatnya 14 (empat belas) hari kerja setelah masa pemeliharaan selesai.","l":340,"h":340},{"m":"6.","t":"Masa berlaku retensi sekurang-kurangnya dimulai sejak Berita Acara Serah Terima (BAST) pekerjaan sampai dengan masa pemeliharaan berakhir.","l":340,"h":340},{"m":"7.","t":"Retensi dapat ditagihkan oleh Penyedia Jasa setelah masa pemeliharaan berakhir yang dibuktikan dengan Berita Acara Serah Terima (BAST) masa pemeliharaan.","l":340,"h":340},{"m":"8.","t":"Retensi dapat menjadi hak Perusahaan apabila Penyedia Jasa tidak melaksanakan kewajibannya pada masa pemeliharaan.","l":340,"h":340},{"c":"[Pasal 43]"}]]}]},{"heading":"H. KETENTUAN UMUM PENYEDIA","rows":[{"topik":"KETENTUAN UMUM PENYEDIA","cells":[[{"t":"KETENTUAN UMUM PENYEDIA"},{"t":"Penyedia harus:"},{"m":"1.","t":"Berupa Badan Usaha Milik Negara (BUMN), Badan Usaha Milik Daerah (BUMD) dan badan usaha milik swasta, badan hukum, subjek hukum (termasuk perorangan), atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan barang dan/atau jasa;","l":340,"h":340},{"m":"2.","t":"Wajib terverifikasi di dalam Sistem e-Procurement Perusahaan (pendaftaran Penyedia dapat dilakukan setiap hari kerja) kecuali untuk Penyedia yang terdapat di pasar maupun di e-Marketplace;","l":340,"h":340},{"m":"3.","t":"Secara hukum mempunyai kapasitas menandatangani Perjanjian Pengadaan, dan sebagai wajib pajak atau non pengusaha kena pajak sesuai ketentuan yang berlaku dan sudah memenuhi kewajiban perpajakan tahun terakhir;","l":340,"h":340},{"m":"4.","t":"Memiliki keahlian dan pengalaman untuk menyediakan Barang dan/atau Jasa yang dibuktikan dengan dokumen otentik terkait;","l":340,"h":340},{"m":"5.","t":"Memenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/kegiatan sebagai Penyedia yang dibuktikan dengan dokumen legalitas Perusahaan yang aktif;","l":340,"h":340},{"m":"6.","t":"Tidak dalam pengawasan Pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan dan/atau Direksi yang bertindak untuk dan atas nama Perusahaan tidak sedang dalam menjalani sanksi pidana dan tidak terlibat dalam penyuapan selama 3 (tiga) Tahun terakhir yang dinyatakan dengan surat pernyataan bermaterai;","l":340,"h":340},{"m":"7.","t":"Memiliki Sumber Daya Manusia (SDM), modal, peralatan dan fasilitas lain yang diperlukan dalam PBJ;","l":340,"h":340},{"m":"8.","t":"Tidak termasuk/terdaftar di dalam daftar hitam Penyedia di lingkungan PT Integrasi Aviasi Solusi (IAS Group) dan/atau PT Aviasi Pariwisata Indonesia (Persero) Group;","l":340,"h":340},{"m":"9.","t":"Memiliki alamat tetap dan jelas serta dapat dijangkau dengan pos/kurir;","l":340,"h":340},{"m":"10.","t":"Diwakili oleh personil sebagai pimpinan Penyedia atau penerima kuasa dengan Surat Kuasa Khusus di atas kertas bermaterai. Untuk menghindari kemungkinan terjadinya penyalahgunaan dan memberikan kesempatan yang luas kepada calon Penyedia, maka surat kuasa diberikan oleh pimpinan Penyedia kepada karyawan Penyedia yang bersangkutan yang dibuktikan dengan bukti tertulis, dan seorang penerima kuasa hanya diperkenankan menerima kuasa dari 1 (satu) Penyedia;","l":340,"h":340},{"m":"11.","t":"Penyedia yang keikutsertaannya menimbulkan pertentangan kepentingan dilarang menjadi Penyedia;","l":340,"h":340},{"m":"12.","t":"Tidak pernah terlibat masalah hukum yang terkait dengan masalah sosial dan lingkungan, dan menjamin produk yang dijual bukan produk yang dihasilkan oleh tenaga kerja dibawah umur, produk tidak dihasilkan dengan cara merusak lingkungan (termasuk dalam penggunaannya), serta tidak menggunakan bahan-bahan yang dilarang oleh ketentuan yang berlaku.","l":340,"h":340},{"c":"[BAB III.H]"}],[{"m":"1.","t":"Pencarian penyedia dilakukan oleh fungsi pengadaan yang membidangi Vendor Management dan purchasing.","l":340,"h":340},{"m":"2.","t":"Pendaftaran penyedia dilakukan secara online melalui Aplikasi e-procurement.","l":340,"h":340},{"m":"3.","t":"Persyaratan penyedia dalam pelaksanaan pengadaan barang dan/ atau Jasa secara umum adalah sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Memenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/ kegiatan sebagai penyedia;","l":624,"h":340},{"m":"b.","t":"Memiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan barang dan/ atau jasa;","l":624,"h":340},{"m":"c.","t":"Tidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan dan/ atau direksi yang bertindak untuk dan atas nama Penyedia tidak sedang dalam menjalani sanksi pidana;","l":624,"h":340},{"m":"d.","t":"Mempunyai kapasitas menandatangani Surat Perintah Kerja (SPK), surat perjanjian/ kontrak;","l":624,"h":340},{"m":"e.","t":"Memiliki sumber daya manusia, modal, peralatan, fasilitas lain yang diperlukan dalam Pengadaan Barang dan/ atau Jasa dan laporan keuangan audited untuk kualifikasi usaha menengah dan besar;","l":624,"h":340},{"m":"f.","t":"Tidak masuk dalam daftar hitam (blacklist) yang dikeluarkan oleh perusahaan, blacklist nasional atau perusahaan lain;","l":624,"h":340},{"m":"g.","t":"Penyedia dapat berbentuk Kerja Sama Operasi (KSO) yang dibuktikan dengan akta notaris.","l":624,"h":340},{"c":"[Pasal 14]"}],[{"t":"PENYEDIA BARANG DAN/ATAU JASA"},{"m":"2.14.1.","t":"Pelaku usaha yang menjadi Penyedia Barang dan/atau Jasa dapat berbentuk:","l":630,"h":630},{"m":"a.","t":"Perseroan Terbatas (PT);","l":624,"h":340},{"m":"b.","t":"Koperasi;","l":624,"h":340},{"m":"c.","t":"Yayasan;","l":624,"h":340},{"m":"d.","t":"Perusahaan Umum (Perum);","l":624,"h":340},{"m":"e.","t":"Perusahaan asing;","l":624,"h":340},{"m":"f.","t":"Commanditaire Vennootschap (CV);","l":624,"h":340},{"m":"g.","t":"Firma;","l":624,"h":340},{"m":"h.","t":"Perusahaan Dagang/Usaha Dagang (PD/UD);","l":624,"h":340},{"m":"i.","t":"Orang perseorangan;","l":624,"h":340},{"m":"j.","t":"Tenaga ahli asing;","l":624,"h":340},{"m":"k.","t":"Badan usaha dalam bentuk lainnya.","l":624,"h":340},{"m":"2.14.2.","t":"Instansi/Badan/Lembaga Pemerintah dapat menjadi Penyedia Barang dan/atau Jasa dengan pola kerjasama.","l":630,"h":630},{"c":"[BAB 2 angka 2.14.0]"},{"t":"PERSYARATAN UMUM PENYEDIA BARANG DAN/ATAU JASA"},{"t":"Penyedia Barang dan/atau Jasa secara umum harus memenuhi ketentuan persyaratan umum sebagai berikut:"},{"m":"a.","t":"Akta pendirian dan akta perubahan anggaran dasar terakhir beserta SK Kemenkumham.","l":340,"h":340},{"m":"b.","t":"Menjalankan usaha/kegiatan sebagai Penyedia Barang dan/atau Jasa sesuai dengan bidang usaha yang dibutuhkan.","l":340,"h":340},{"m":"c.","t":"Memiliki izin usaha sebagai Penyedia Barang dan/atau Jasa sesuai dengan bidang usaha yang dibutuhkan.","l":340,"h":340},{"m":"d.","t":"Memiliki keahlian, kemampuan dan pengalaman teknis dan manajerial untuk menyediakan Barang dan/atau Jasa yang dibutuhkan.","l":340,"h":340},{"m":"e.","t":"Penyedia Barang dan/atau Jasa:","l":340,"h":340},{"m":"1.","t":"Tidak termasuk dalam Daftar Hitam (Blacklist) pemerintah atau Perusahaan;","l":624,"h":340},{"m":"2.","t":"Tidak dalam pengawasan pengadilan;","l":624,"h":340},{"m":"3.","t":"Tidak pailit;","l":624,"h":340},{"m":"4.","t":"Kegiatan usahanya tidak sedang dihentikan; dan/atau","l":624,"h":340},{"m":"5.","t":"Direksi yang bertindak untuk dan atas nama perusahaan tidak sedang menjalani sanksi pidana dari pengadilan berdasarkan putusan yang berkekuatan hukum tetap.","l":624,"h":340},{"m":"f.","t":"Memiliki sumber daya manusia, modal peralatan dan fasilitas pendukung lainnya yang cukup dalam menyelenggarakan penyediaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"g.","t":"Wajib memiliki Nomor Pokok Wajib Pajak (NPWP) dan Surat Pengukuhan Pengusaha Kena Pajak (SPPKP) sesuai ketentuan peraturan perpajakan yang berlaku.","l":340,"h":340},{"m":"h.","t":"Secara hukum mempunyai kapasitas untuk mengikatkan diri dalam Perjanjian.","l":340,"h":340},{"m":"i.","t":"Memiliki alamat tetap dan jelas serta dapat dijangkau dengan jasa pengiriman.","l":340,"h":340},{"m":"j.","t":"Keikutsertaannya sebagai Penyedia Barang dan/atau Jasa di Perusahaan tidak menimbulkan benturan kepentingan dengan pihak lain.","l":340,"h":340},{"m":"k.","t":"Bersedia menandatangani Pakta Integritas.","l":340,"h":340},{"m":"l.","t":"Khusus untuk Jasa Penyediaan SDM dan/atau Paket Pekerjaan:","l":340,"h":340},{"m":"1.","t":"Jasa penyediaan paket pekerjaan wajib berbentuk badan hukum.","l":624,"h":340},{"m":"2.","t":"Jasa penyediaan SDM wajib berbentuk badan hukum Perseroan Terbatas (PT).","l":624,"h":340},{"c":"[BAB 2 angka 2.15.0]"},{"t":"PERSYARATAN ADMINISTRASI PENYEDIA BARANG DAN/ATAU JASA"},{"m":"2.16.1.","t":"Penyedia Barang dan/atau Jasa berupa badan usaha dapat diikutsertakan dalam proses Pengadaan Barang dan/atau Jasa di Perusahaan, dengan terlebih dahulu harus memiliki dan menyerahkan salinan persyaratan administratif sebagai berikut:","l":630,"h":630},{"m":"a.","t":"Data Person In Charge (PIC) (nama, email dan nomor telepon);","l":624,"h":340},{"m":"b.","t":"Akta pendirian beserta SK Kemenkumham;","l":624,"h":340},{"m":"c.","t":"Akta perubahan terakhir Anggaran Dasar, Akta perubahan susunan terakhir anggota Direksi dan Dewan Komisaris, serta Akta perubahan modal dan/atau peralihan saham terakhir beserta SK Kemenkumham;","l":624,"h":340},{"m":"d.","t":"Nomor Induk Berusaha (NIB) beserta Klasifikasi Baku Lapangan Usaha Indonesia (KBLI);","l":624,"h":340},{"m":"e.","t":"Nomor Pokok Wajib Pajak (NPWP) badan usaha;","l":624,"h":340},{"m":"f.","t":"KTP/KITAS/KITAP/ITAS/ITAP/KIMS dari Direktur perusahaan atau dokumen serupa lainnya sesuai ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;","l":624,"h":340},{"m":"g.","t":"Konfirmasi Kesesuaian Kegiatan Pemanfaatan Ruang (KKKPR)/ Persetujuan Kesesuaian Kegiatan Pemanfaatan Ruang (PKKPR)/Surat Pernyataan Usaha Mikro atau Usaha Kecil Terkait Tata Ruang;","l":624,"h":340},{"m":"h.","t":"Surat Pengukuhan Pengusaha Kena Pajak (SPPKP) dan Surat Keterangan Terdaftar (SKT) pajak/Surat Pernyataan Resmi non Pengusaha Kena Pajak (PKP);","l":624,"h":340},{"m":"i.","t":"Company profile/link website perusahaan;","l":624,"h":340},{"m":"j.","t":"Laporan Keuangan/Neraca dan Laba Rugi Perusahaan tahun terakhir diutamakan yang telah diaudit Kantor Akuntan Publik (KAP);","l":624,"h":340},{"m":"k.","t":"Struktur organisasi perusahaan;","l":624,"h":340},{"m":"l.","t":"Surat izin atau sertifikat lainnya (apabila ada);","l":624,"h":340},{"m":"m.","t":"Syarat-syarat lain yang ditetapkan oleh Perusahaan/Pelaksana Pengadaan sesuai kebutuhan dan/atau sesuai ketentuan peraturan perundang-undangan yang berlaku (Sertifikat Tingkat Komponen Dalam Negeri (TKDN), Surat Izin Operasional BUJP, Perizinan Berusaha Untuk Menunjang Kegiatan Usaha (PB UMKU), Sertifikat Badan Usaha (SBU)/Surat Pernyataan Resmi tidak memiliki Sertifikat Badan Usaha (SBU), Surat Referensi dari bank pemerintah dan lain-lain).","l":624,"h":340},{"m":"2.16.2.","t":"Penyedia Barang dan/atau Jasa berupa orang perseorangan atau tenaga ahli asing dapat diikutsertakan dalam proses Pengadaan Barang dan/atau Jasa di Perusahaan, dengan terlebih dahulu harus memiliki dan menyerahkan salinan persyaratan administratif sebagai berikut:","l":630,"h":630},{"m":"a.","t":"KTP/KITAS/KITAP/ITAS/ITAP/KIMS atau dokumen serupa lainnya sesuai ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;","l":624,"h":340},{"m":"b.","t":"NPWP perorangan; dan","l":624,"h":340},{"m":"c.","t":"Dokumen pendukung atas pengalaman kerja sesuai kebutuhan Perusahaan.","l":624,"h":340},{"m":"2.16.3.","t":"Untuk Penyedia Barang dan/atau Jasa yang merupakan perusahaan asing harus memiliki dan menyerahkan salinan persyaratan administratif sebagai berikut:","l":630,"h":630},{"m":"a.","t":"Sertifikat pendirian perusahaan (negara asal);","l":624,"h":340},{"m":"b.","t":"KITAS/KITAP/ITAS/ITAP/KIMS milik anggota Direksi dan anggota Dewan Komisaris atau dokumen serupa lainnya sesuai ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;","l":624,"h":340},{"m":"c.","t":"Laporan Keuangan/Neraca dan Laba Rugi Perusahaan tahun terakhir (audited);","l":624,"h":340},{"m":"d.","t":"Sertifikat domisili dan/atau sejenisnya; dan","l":624,"h":340},{"m":"e.","t":"Dokumen lain sesuai kebutuhan Perusahaan.","l":624,"h":340},{"m":"2.16.4.","t":"Dalam hal sifat dan lingkup kegiatan Pengadaan Barang dan/atau Jasa terlalu luas, atau jenis keahlian yang diperlukan untuk menyelesaikan pekerjaan tidak dapat dilakukan oleh 1 (satu) Penyedia Barang dan/atau Jasa, maka dapat dilakukan sebagai berikut:","l":630,"h":630},{"m":"a.","t":"Dimungkinkan para Penyedia Barang dan/atau Jasa saling bergabung dalam suatu konsorsium atau bentuk kerja sama lain; dan/atau","l":624,"h":340},{"m":"b.","t":"Penyedia Barang dan/atau Jasa atau konsorsium Penyedia Barang dan/atau Jasa menggunakan tenaga ahli asing.","l":624,"h":340},{"c":"[BAB 2 angka 2.16.0]"},{"t":"KUALIFIKASI PENYEDIA BARANG DAN/ATAU JASA"},{"t":"Penyedia Barang dan/atau Jasa harus mengikuti proses kualifikasi yang dilaksanakan oleh Perusahaan dengan syarat dan ketentuan yang ditetapkan oleh Perusahaan, antara lain tetapi tidak terbatas pada:"},{"m":"a.","t":"Salinan Akta pendirian beserta SK Kemenkumham;","l":340,"h":340},{"m":"b.","t":"Salinan Akta perubahan terakhir Anggaran Dasar, Akta perubahan susunan terakhir anggota Direksi dan Dewan Komisaris dan Akta perubahan modal dan/atau peralihan saham terakhir beserta SK Kemenkumham;","l":340,"h":340},{"m":"c.","t":"Salinan Nomor Induk Berusaha (NIB) beserta Klasifikasi Baku Lapangan Usaha Indonesia (KBLI);","l":340,"h":340},{"m":"d.","t":"Salinan Nomor Pokok Wajib Pajak (NPWP);","l":340,"h":340},{"m":"e.","t":"Salinan KTP/KITAS/KITAP/ITAS/ITAP/KIMS dari pengurus perusahaan atau dokumen serupa lainnya sesuai ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;","l":340,"h":340},{"m":"f.","t":"Salinan Konfirmasi Kesesuaian Kegiatan Pemanfaatan Ruang (KKKPR)/ Persetujuan Kesesuaian Kegiatan Pemanfaatan Ruang (PKKPR)/Surat Pernyataan Usaha Mikro atau Usaha Kecil Terkait Tata Ruang;","l":340,"h":340},{"m":"g.","t":"Salinan Surat Pengukuhan Pengusaha Kena Pajak (SPPKP) dan Surat Keterangan Terdaftar (SKT) pajak/surat pernyataan resmi non Pengusaha Kena Pajak (PKP);","l":340,"h":340},{"m":"h.","t":"Laporan Keuangan/Neraca dan Laba Rugi Perusahaan tahun terakhir diutamakan yang telah diaudit Kantor Akuntan Publik (KAP);","l":340,"h":340},{"m":"i.","t":"Salinan surat referensi dari bank pemerintah;","l":340,"h":340},{"m":"j.","t":"Salinan bukti kepatuhan dalam pemenuhan ketentuan perpajakan yang berlaku, berupa Bukti lapor SPT (PPN dan PPh); dan","l":340,"h":340},{"m":"k.","t":"Syarat-syarat lain yang ditetapkan oleh Perusahaan/Pelaksana Pengadaan sesuai kebutuhan dan/atau sesuai ketentuan peraturan perundang-undangan yang berlaku (Sertifikat Tingkat Komponen Dalam Negeri (TKDN), Surat Izin Operasional BUJP, Perizinan Berusaha Untuk Menunjang Kegiatan Usaha (PB UMKU), Sertifikat Badan Usaha (SBU)/Surat Pernyataan Resmi tidak memiliki Sertifikat Badan Usaha (SBU) dan lain-lain).","l":340,"h":340},{"c":"[BAB 2 angka 2.18.0]"}],[{"t":"PERSYARATAN UMUM CALON PENYEDIA"},{"m":"1.","t":"Calon penyedia Barang dan/atau Jasa harus:","l":340,"h":340},{"m":"a.","t":"Berupa Badan Usaha Milik Negara (BUMN), Badan Usaha Milik Daerah (BUMD) dan badan usaha milik swasta, badan hukum, subjek hukum (termasuk perorangan), atau Instansi Pemerintah/Badan Layanan Umum yang kegiatan usahanya menyediakan barang atau jasa;","l":624,"h":340},{"m":"b.","t":"Wajib terdaftar di dalam Vendor Management System (VMS) di lingkungan Perusahaan (pendaftaran calon penyedia Barang dan/atau Jasa dapat dilakukan setiap hari kerja), kecuali untuk mengikuti proses Tender/Seleksi Umum tidak wajib terdaftar di dalam VMS;","l":624,"h":340},{"m":"c.","t":"Secara hukum mempunyai kapasitas menandatangani Perjanjian Pengadaan, dan sebagai wajib pajak atau non pengusaha kena pajak sesuai ketentuan yang berlaku dan sudah memenuhi kewajiban perpajakan tahun terakhir;","l":624,"h":340},{"m":"d.","t":"Memiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan Barang dan/atau Jasa yang dibuktikan dengan dokumen otentik terkait;","l":624,"h":340},{"m":"e.","t":"Memenuhi ketentuan peraturan perundang-undangan untuk menjalankan usaha/kegiatan sebagai penyedia Barang dan/atau Jasa yang dibuktikan dengan dokumen legalitas perusahaan yang aktif;","l":624,"h":340},{"m":"f.","t":"Tidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan, dan/atau Direksi yang bertindak untuk dan atas nama perusahaan tidak sedang dalam menjalani sanksi pidana yang dinyatakan dengan surat pernyataan bermaterai;","l":624,"h":340},{"m":"g.","t":"Memiliki sumber daya manusia, modal, peralatan, dan fasilitas lain yang diperlukan dalam Pengadaan Barang dan/atau Jasa;","l":624,"h":340},{"m":"h.","t":"Tidak termasuk/terdaftar di dalam daftar hitam penyedia Barang dan/atau Jasa di lingkungan Perusahaan dan/atau PT Integrasi Aviasi Solusi Group;","l":624,"h":340},{"m":"i.","t":"Memiliki alamat tetap dan jelas serta dapat dijangkau dengan pos/kurir;","l":624,"h":340},{"m":"j.","t":"Diwakili oleh personil sebagai pimpinan badan usaha/mitra kerja atau penerima kuasa dengan Surat Kuasa Khusus di atas kertas bermaterai. Untuk menghindari kemungkinan terjadinya penyalahgunaan dan memberikan kesempatan yang luas kepada calon penyedia Barang dan/atau Jasa, maka surat kuasa diberikan oleh pimpinan badan usaha/mitra kerja calon penyedia Barang dan/atau Jasa kepada pegawai badan usaha/mitra kerja yang bersangkutan yang dibuktikan dengan bukti tertulis, dan seorang penerima kuasa hanya diperkenankan menerima kuasa dari 1 (satu) badan usaha/mitra kerja;","l":624,"h":340},{"m":"2.","t":"Penyedia Barang dan/atau Jasa yang keikutsertaannya menimbulkan pertentangan kepentingan dilarang menjadi penyedia Barang dan/atau Jasa;","l":340,"h":340},{"m":"3.","t":"Tidak pernah terlibat masalah hukum yang terkait dengan masalah sosial dan lingkungan, dan menjamin produk yang dijual bukan produk yang dihasilkan oleh tenaga kerja di bawah umur, produk tidak dihasilkan dengan cara merusak lingkungan (termasuk dalam penggunaannya), serta tidak menggunakan bahan- bahan yang dilarang oleh ketentuan yang berlaku.","l":340,"h":340},{"c":"[BAB III.A]"},{"t":"PERSYARATAN TAMBAHAN CALON PENYEDIA JASA"},{"m":"1.","t":"Calon penyedia jasa terdiri dari perusahaan jasa konsultasi, lembaga ilmiah, lembaga nirlaba (non-profit), aktuaris yang berbadan hukum dan lembaga lain yang ditetapkan oleh Pemerintah;","l":340,"h":340},{"m":"2.","t":"Penggunaan lembaga ilmiah diutamakan untuk melaksanakan pekerjaan- pekerjaan penelitian dan pengembangan sesuai dengan bidangnya;","l":340,"h":340},{"m":"3.","t":"Tenaga konsultan mempunyai pengalaman di bidangnya dengan melampirkan curriculum vitae (CV)/track record;","l":340,"h":340},{"m":"4.","t":"Tidak sedang terlibat masalah hukum yang terkait dengan pekerjaannya atau melanggar ketentuan yang berlaku.","l":340,"h":340},{"c":"[BAB III.B]"},{"t":"PENETAPAN PERSYARATAN PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"},{"m":"1.","t":"Penetapan persyaratan pemilihan penyedia Barang dan/atau Jasa harus sesuai dengan kriteria yang telah ditetapkan dalam Kerangka Acuan Kerja/Spesifikasi Teknis/Dokumen Pemilihan/Kebijakan Peraturan Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"2.","t":"Penetapan persyaratan penyedia jasa yang berhubungan dengan jasa hukum yang bersifat mendesak dengan metode penunjukan langsung ditetapkan oleh Direktur terkait, sedangkan yang tidak bersifat mendesak ditetapkan oleh Unit Legal.","l":340,"h":340},{"c":"[BAB III.G]"},{"t":"PENGGUNAAN VMS DAN P2TB"},{"m":"1.","t":"Pengadaan Barang dan/atau Jasa Perusahaan dilaksanakan dengan memilih penyedia Barang dan/atau Jasa yang telah terdaftar dan terverifikasi dalam VMS Perusahaan;","l":340,"h":340},{"c":"[BAB III.H angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Persyaratan dan Prakualifikasi Penyedia Barang dan/ atau Jasa"},{"m":"1.","t":"Persyaratan Penyedia Barang dan/ atau Jasa dalam pelaksanaan pengadaan barang dan/ atau jasa secara umum adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Memenuhi ketentuan peraturan perundang-undangan untuk menjalankan kegiatan/ usaha sebagai Penyedia Barang dan/ atau Jasa;","l":624,"h":340},{"m":"b.","t":"Memiliki keahlian, pengalaman, kemampuan teknis dan manajerial untuk menyediakan Barang dan/ atau Jasa;","l":624,"h":340},{"m":"c.","t":"Tidak dalam pengawasan pengadilan, tidak pailit, kegiatan usahanya tidak sedang dihentikan dan/ atau Direksi yang bertindak untuk dan atas nama Penyedia Barang dan/ atau Jasa tidak sedang dalam menjalani sanksi pidana;","l":624,"h":340},{"m":"d.","t":"Memiliki kewenangan atau kapasitas menandatangani Bukti Perjanjian sebagai Penyedia Barang dan/ atau Jasa;","l":624,"h":340},{"m":"e.","t":"Memiliki kemampuan pada bidang pekerjaan yang sesuai untuk usaha mikro, usaha kecil dan koperasi kecil serta kemampuan pada sub bidang pekerjaan yang sesuai untuk usaha non-kecil;","l":624,"h":340},{"m":"f.","t":"Dapat dipersyaratkan memiliki Kemampuan Dasar (KD) untuk usaha non-kecil, kecuali untuk Pengadaan Barang, dan Jasa Konsultansi;","l":624,"h":340},{"m":"g.","t":"Memiliki Sumber Daya Manusia (SDM), modal, peralatan dan fasilitas lain yang diperlukan dalam pengadaan barang dan/ atau jasa dan laporan keuangan audited untuk kualifikasi usaha menengah dan besar, serta pengadaan pekerjaan konstruksi yang disertakan dukungan dari bank;","l":624,"h":340},{"m":"h.","t":"Tidak masuk dalam Daftar Hitam (blacklist) yang dikeluarkan oleh Instansi/ Lembaga/ Badan Usaha Milik Negara dan anak-anak Badan Usaha Milik Negara/ Badan Usaha Milik Daerah dan anak-anak Badan Usaha Milik Daerah/ Perusahaan swasta;","l":624,"h":340},{"c":"[Pasal 17]"},{"m":"(1)","t":"KD sebagaimana dimaksud dalam Pasal 17 ayat (1) huruf h pada sub bidang pekerjaan yang sejenis untuk usaha non kecil dihitung dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Untuk Pekerjaan Konstruksi, KD sama dengan 3 NPT (Nilai Pengalaman Tertinggi dalam kurun waktu 10 tahun terakhir); dan","l":624,"h":340},{"m":"b.","t":"Untuk Pengadaan Jasa Lainnya, KD sama dengan 5 NPT (Nilai Pengalaman Tertinggi dalam kurun waktu 10 tahun terakhir).","l":624,"h":340},{"m":"(2)","t":"KD paling kurang sama dengan nilai total HPS/ RAB dari pekerjaan yang akan dilelangkan.","l":340,"h":340},{"m":"(3)","t":"Ketentuan pada ayat (1) dikecualikan dalam hal Pengadaan Barang dan/ atau Jasa tidak dapat diikuti oleh Calon Penyedia Barang dan/ atau Jasa dalam negeri karena belum ada Calon Penyedia Barang dan/ atau Jasa dalam negeri yang mampu memenuhi KD.","l":340,"h":340},{"m":"(4)","t":"Dalam hal Calon Penyedia Barang dan/ atau Jasa melakukan kemitraan, yang diperhitungkan adalah KD dari Perusahaan yang mewakili kemitraan (leadfirm).","l":340,"h":340},{"c":"[Pasal 18]"},{"m":"(1)","t":"Dalam hal sifat dan lingkup kegiatan Pengadaan Barang dan/ atau Jasa terlalu luas, atau jenis keahlian yang diperlukan untuk menyelesaikan kegiatan tidak dapat dilakukan oleh 1 (satu) Calon Penyedia Barang dan/ atau Jasa, maka dalam pelaksanaan Pengadaan Barang dan/ atau Jasa:","l":340,"h":340},{"m":"a.","t":"Diberikan kesempatan yang memungkinkan para Calon Penyedia Barang dan/ atau Jasa saling bergabung dalam suatu kerjasama/ konsorsium atau bentuk kerja sama lain; dan/atau","l":624,"h":340},{"m":"b.","t":"Diberikan kesempatan yang memungkinkan Calon Penyedia Barang dan/ atau Jasa atau kerjasama/ konsorsium Calon Penyedia Barang dan/ atau Jasa menggunakan tenaga ahli asing; dan/ atau","l":624,"h":340},{"m":"c.","t":"Pengadaan barang dan/ atau jasa dilakukan oleh beberapa Penyedia dalam satu atau beberapa kontrak (pemecahan paket pekerjaan).","l":624,"h":340},{"m":"(2)","t":"Tenaga ahli asing sebagaimana dimaksud pada ayat (1) huruf b, digunakan sepanjang diperlukan untuk mencukupi kebutuhan jenis keahlian yang belum dimiliki dan untuk meningkatkan kemampuan teknis guna menangani kegiatan atau pekerjaan. Persyaratan untuk tenaga ahli asing dapat dikecualikan dari ketentuan persyaratan penyediaan tenaga ahli dalam negeri atau dapat dipersyaratkan lain sesuai dengan kebutuhan.","l":340,"h":340},{"c":"[Pasal 19]"}]]}]},{"heading":"I. PENYEDIA PBJ","rows":[{"topik":"Prakualifikasi dan Verifikasi Penyedia","cells":[[{"t":"PENYEDIA PBJ"},{"m":"1.","t":"Dokumen dari Penyedia PBJ harus dijaga kerahasiaannya dan hanya digunakan untuk proses prakualifikasi sebagaimana mestinya.","l":340,"h":340},{"m":"2.","t":"Hasil dari proses prakualifikasi PBJ adalah telah terverifikasi di dalam Sistem e-Procurement Perusahaan, yang berlaku untuk proses kegiatan pengadaan di seluruh area operasi Perusahaan.","l":340,"h":340},{"m":"3.","t":"Proses prakualifikasi Penyedia PBJ dilakukan oleh Unit Yang Membidangi Fungsi PBJ, Penyedia dinyatakan lulus prakualifikasi apabila mempunyai klasifikasi dan kualifikasi yang sesuai dengan persyaratan yang ditetapkan oleh Perusahaan dan atas persetujuan Unit Yang Membidangi Fungsi PBJ.","l":340,"h":340},{"m":"4.","t":"Hasil keputusan dari proses prakualifikasi Penyedia bersifat final dan Unit Yang Membidangi Fungsi PBJ tidak menerima sanggahan dari penyedia atas hasil keputusan tersebut.","l":340,"h":340},{"m":"5.","t":"Dalam proses seleksi kualifikasi ini, jika diperlukan Unit Yang Membidangi Fungsi PBJ dapat dibantu oleh Unit Kerja lain atau jasa profesional, sesuai dengan kompetensi yang dibutuhkan.","l":340,"h":340},{"m":"7.","t":"Selain melakukan verifikasi dokumen persyaratan Penyedia, kunjungan kepada Penyedia juga dapat dilakukan untuk memastikan kemampuan dan kompetensi Penyedia.","l":340,"h":340},{"c":"[BAB III.I angka 1-5, 7]"}],[{"m":"1.","t":"Setiap penyedia barang dan/ atau jasa untuk mendaftar menjadi Penyedia Barang dan/ Atau Jasa Perusahaan harus menggunakan sistem e-Procurement berdasarkan kriteria yang telah ditentukan oleh Perusahaan, status penyedia barang dan/ atau jasa ditentukan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"In process (dalam proses)","l":624,"h":340},{"t":"Adalah status penyedia barang dan/ atau jasa yang telah terdaftar secara administrasi tetapi belum melengkapi semua persyaratan yang diminta atau belum dilakukan validasi.","l":624},{"m":"b.","t":"Verified (terverifikasi)","l":624,"h":340},{"t":"Adalah status penyedia yang telah melengkapi semua dokumen administrasi sesuai yang dipersyaratkan dan dipastikan keberadaannya di dalam kelompok/ bidang yang dipilih tidak memiliki keterkaitan dengan penyedia barang dan/ atau jasa lain. penyedia barang dan/ atau jasa dengan status verified boleh mengikuti semua pengadaan barang dan/ atau jasa sesuai dengan bidang kelompok yang dipilih.","l":624},{"m":"c.","t":"Suspend (ditangguhkan)","l":624,"h":340},{"t":"Adalah status penyedia dimana ada data yang tidak valid , bisa karena sudah habis masa berlaku dan perlu diperbarui. Pada status ini, penyedia tidak dapat mengikuti proses pengadaan barang dan/ atau jasa perusahaan hingga memenuhi semua persyaratan yang diperlukan.","l":624},{"m":"d.","t":"Blacklist (daftar hitam)","l":624,"h":340},{"t":"Adalah status penyedia yang tidak dapat mengikuti proses pengadaan barang dan/ atau jasa karena terbukti melakukan tindakan yang melanggar prinsip dan etika pengadaan serta tercantum dalam daftar hitam, baik dalam perusahaan maupun instansi lainnya.","l":624},{"m":"3.","t":"Tata cara pendaftaran penyedia barang dan/ atau jasa dan tata cara monitoring pekerjaan penyedia barang dan/ atau jasa diatur lebih lanjut di dalam SOP.","l":340,"h":340},{"c":"[Pasal 41 ayat (1), (3)]"}],[{"t":"PENDAFTARAN PENYEDIA BARANG DAN/ATAU JASA SEBAGAI REKANAN"},{"m":"2.17.1","t":"Setiap Penyedia Barang dan/atau Jasa berhak untuk menjadi Rekanan Perusahaan dengan melakukan pendaftaran kepada Perusahaan melalui:","l":570,"h":570},{"m":"a.","t":"Surat permohonan rekanan yang dikirmkan melalui email unit.procurement@gapura.id; dan/atau","l":624,"h":340},{"m":"b.","t":"Melalui Vendor Management System.","l":624,"h":340},{"m":"2.17.2","t":"Unit Pengelola Rekanan melakukan pengecekan terhadap dokumen-dokumen sebagaimana dimaksud pada butir 2.16.1 yang dikirimkan oleh Penyedia Barang dan/atau Jasa.","l":570,"h":570},{"m":"2.17.3","t":"Unit Pengelola Rekanan dapat meminta kelengkapan Fdokumen dan/atau pembaruan dokumen kepada Penyedia Barang dan/atau Jasa (apabila belum lengkap) dengan disertai informasi terkait dokumen-dokumen apa saja yang perlu dilengkapi dan/atau perlu diperbarui oleh Penyedia Barang dan/atau Jasa yang bersangkutan.","l":570,"h":570},{"m":"2.17.4","t":"Pengecekan terhadap dokumen Penyedia Barang dan/atau Jasa yang dikirimkan melalui email, dituangkan dalam form checklist kelengkapan dokumen Penyedia Barang dan/atau Jasa.","l":570,"h":570},{"m":"2.17.5","t":"Form checklist beserta dokumen kelengkapannya disimpan oleh Unit Pelaksana Pengadaan dan diberikan kepada Pelaksana Pengadaan untuk digunakan dalam proses Pengadaan Barang dan/atau Jasa.","l":570,"h":570},{"c":"[BAB 2 angka 2.17.0]"},{"t":"PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA BARU"},{"m":"7.4.1.","t":"Untuk memenuhi kebutuhan terhadap Penyedia Barang dan/atau Jasa baru, Kepala Unit Kerja Pengadaan dapat melakukan pemilihan Penyedia Barang dan/atau Jasa baru dengan cara sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Pengumuman di media masa atau di web resmi perusahaan.","l":624,"h":340},{"m":"b.","t":"Mengundang perusahaan yang diketahui dan dianggap dapat memenuhi syarat sebagai Penyedia Barang dan/atau Jasa Perusahaan.","l":624,"h":340},{"m":"c.","t":"Melakukan verifikasi atas dokumen administrasi calon Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"7.4.2.","t":"Terhadap setiap perusahaan yang mendaftar sebagai Penyedia Barang dan/atau Jasa baru harus dilakukan verifikasi dokumen baik secara administrasi maupun teknis untuk memastikan bahwa Penyedia Barang dan/atau Jasa tersebut dapat memenuhi persyaratan yang telah ditentukan.","l":540,"h":540},{"m":"7.4.3.","t":"Kepala Unit Kerja Pengadaan mencari/meminta data mengenai Penyedia Barang dan/atau Jasa tersebut mengenai Mutu Produk/Jasa yang dihasilkan, Harga Jual, Waktu Pengiriman, Syarat Pembayaran, Aspek Keselamatan, Kesehatan Kerja dan Lingkungan (K3L) dan lainnya.","l":540,"h":540},{"m":"7.4.4.","t":"Jika diperlukan, Kepala Unit Kerja Pengadaan bersama-sama dengan Unit Pengguna (User)/Unit Spesifikasi Teknis (UST) terkait dapat meninjau lokasi usaha/kantor untuk memastikan kesesuaian atas kriteria persyaratan yang telah di tetapkan.","l":540,"h":540},{"m":"7.4.5.","t":"Jika diperlukan, Kepala Unit Kerja Pengadaan dapat meminta contoh produk dari Penyedia Barang dan/atau Jasa untuk dilakukan pemeriksaan oleh pihak yang ditunjuk terlebih dahulu.","l":540,"h":540},{"m":"7.4.6.","t":"Peninjauan dilakukan sesuai dengan pelaksanaan evaluasi Penyedia Barang dan/atau Jasa di atas kecuali terhadap mutu produk/jasa yang akan diberikan berdasarkan spesifikasi tertulis dan/atau contoh produk, waktu pengiriman yang dijanjikan sesuai dengan kebutuhan perusahaan dan pemenuhan aspek Aspek Keselamatan, Kesehatan Kerja dan Lingkungan (K3L) sesuai dengan persyaratan hukum dan/atau perusahaan.","l":540,"h":540},{"m":"7.4.7.","t":"Hasilnya dicatatkan dalam lembar Evaluasi Penyedia Barang dan/atau Jasa dengan mencantumkan data-data Penyedia Barang dan/atau Jasa yang ditinjau serta hasil kesimpulan dari peninjauan yang dilakukan.","l":540,"h":540},{"m":"7.4.8.","t":"Berdasarkan hasil peninjauan tersebut, maka Kepala Unit Kerja Pengadaan akan menentukan apakah Penyedia Barang dan/atau Jasa dapat memenuhi persyaratan yang telah ditentukan.","l":540,"h":540},{"m":"7.4.9.","t":"Kepala Unit Kerja Pengadaan memasukkan data Penyedia Barang dan/atau Jasa tersebut ke dalam Daftar Penyedia Barang dan/atau Jasa kepala Unit Kerja Pengadaan akan memberitahukan Penyedia Barang dan/atau Jasa yang terpilih dan kemudian melakukan proses pembelian atau mengikutsertakan dalam proses Pengadaan Barang dan/atau Jasasesuai dengan Prosedur.","l":540,"h":540},{"c":"[BAB 7 angka 7.4.0]"}],[{"t":"CALON PENYEDIA BARANG JASA"},{"m":"1.","t":"Dokumen dari calon penyedia Barang dan/atau Jasa harus dijaga kerahasiaannya dan hanya digunakan untuk proses prakualifikasi sebagaimana mestinya;","l":340,"h":340},{"m":"2.","t":"Hasil dari proses prakualifikasi penyedia Barang dan/atau Jasa adalah VMS yang berlaku untuk proses kegiatan Pengadaan di seluruh area operasi perusahaan;","l":340,"h":340},{"m":"3.","t":"Proses prakualifikasi calon penyedia Barang dan/atau Jasa dilakukan oleh Unit Pengadaan. Calon Rekanan dinyatakan lulus prakualifikasi apabila mempunyai klasifikasi dan kualifikasi yang sesuai dengan persyaratan yang ditetapkan oleh Perusahaan dan atas persetujuan fungsi yang membidangi Vendor Management;","l":340,"h":340},{"m":"4.","t":"Hasil keputusan dari proses prakualifikasi calon penyedia Barang dan/atau Jasa bersifat final dan Unit Pengadaan tidak menerima sanggahan dari calon penyedia Barang dan/atau Jasa atas hasil keputusan tersebut;","l":340,"h":340},{"m":"5.","t":"Dalam proses seleksi kualifikasi ini, jika diperlukan Unit Pengadaan dapat dibantu oleh unit kerja lain atau jasa profesional, sesuai dengan kompetensi yang dibutuhkan;","l":340,"h":340},{"m":"6.","t":"Penyedia Barang dan/atau Jasa yang lulus prakualifikasi dan masuk dalam VMS Perusahaan, mempunyai kesempatan untuk diikutsertakan dalam Pengadaan Barang dan/atau Jasa di Perusahaan;","l":340,"h":340},{"m":"5.","t":"Untuk penyedia Barang dan/atau Jasa yang masih terikat Perjanjian Pengadaan dengan Perusahaan dilarang untuk diikutsertakan dalam proses Pengadaan Barang dan/atau Jasa, kecuali atas permintaan Unit Pengguna;","l":340,"h":340},{"m":"6.","t":"Atas ketentuan point 5 tersebut diatas tidak berlaku untuk tender/seleksi umum;","l":340,"h":340},{"c":"[BAB III.C angka 1-6, 5-6]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Setiap Penyedia Barang dan/ atau Jasa untuk mendaftar menjadi Penyedia Barang dan/ atau Jasa Perusahaan harus menggunakan sistem berdasarkan kriteria yang telah ditentukan oleh Perusahaan, status Penyedia Barang dan/ atau Jasa ditentukan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"In process (dalam proses)","l":624,"h":340},{"t":"Adalah status Penyedia Barang dan/ atau Jasa yang telah terdaftar secara administrasi tetapi belum melengkapi semua persyaratan yang diminta atau belum dilakukan validasi.","l":624},{"m":"b.","t":"Verified (terverifikasi)","l":624,"h":340},{"t":"Adalah status Penyedia Barang dan/ atau Jasa yang telah melengkapi semua dokumen administrasi sesuai yang dipersyaratkan dan dipastikan keberadaannya di dalam kelompok/ bidang yang dipilih tidak memiliki keterkaitan dengan Penyedia Barang dan/ atau Jasa lain. Penyedia Barang dan/ atau Jasa dengan status verified boleh mengikuti semua pengadaan barang dan/ atau jasa sesuai dengan bidang kelompok yang dipilih.","l":624},{"m":"c.","t":"Suspend (ditangguhkan)","l":624,"h":340},{"t":"Adalah status Penyedia Barang dan/ atau Jasa dimana ada data yang tidak valid , bisa karena sudah habis masa berlaku dan perlu diperbarui. Pada status ini, penyedia tidak dapat mengikuti proses pengadaan barang dan/ atau jasa perusahaan hingga memenuhi semua persyaratan yang diperlukan.","l":624},{"m":"d.","t":"Blacklist (daftar hitam)","l":624,"h":340},{"t":"Adalah status Penyedia Barang dan/ atau Jasa yang tidak dapat mengikuti proses pengadaan barang dan/ atau jasa karena terbukti melakukan tindakan yang melanggar prinsip dan etika pengadaan serta tercantum dalam daftar hitam, baik dalam perusahaan maupun instansi lainnya.","l":624},{"m":"3.","t":"Tata cara pendaftaran Penyedia Barang dan/ atau Jasa dan tata cara monitoring pekerjaan penyedia barang dan/ atau jasa diatur lebih lanjut di dalam SOP.","l":340,"h":340},{"c":"[Pasal 54 ayat (1), (3)]"}]]},{"topik":"Katalog Barang/Jasa Penyedia","cells":[[{"t":"PENYEDIA PBJ"},{"m":"6.","t":"Untuk Penyedia yang terdaftar di dalam sistem e-Procurement Perusahaan, dapat memasukan barang yang mereka sediakan ke dalam e-Katalog Perusahaan (jika ada).","l":340,"h":340},{"c":"[BAB III.I angka 6]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"CALON PENYEDIA BARANG JASA"},{"m":"4.","t":"Untuk penyedia Barang dan/atau Jasa yang terdaftar di dalam VMS Perusahaan, dapat memasukan barang yang mereka sediakan ke dalam e-Katalog Perusahaan (jika ada);","l":340,"h":340},{"c":"[BAB III.C angka 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Kendala Sistem e-Procurement","cells":[[{"t":"PENYEDIA PBJ"},{"m":"8.","t":"Apabila terdapat kendala pada sistem e-Procurement Perusahaan yang mengakibatkan Penyedia tidak dapat melakukan pendaftaran, maka kendala tersebut harus dibuktikan dengan surat pernyataan dari Unit Kerja yang membidangi fungsi Information Technology (IT).","l":340,"h":340},{"m":"9.","t":"Setelah surat pernyataan keluar dari Unit Kerja yang membidangi fungsi Information Technology (IT) yang menyatakan bahwa terdapat kendala pada sistem informasi di perusahaan, maka proses pendaftaran dapat dilakukan secara manual (Offline).","l":340,"h":340},{"c":"[BAB III.I angka 8-9]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"CALON PENYEDIA BARANG JASA"},{"m":"7.","t":"Apabila terdapat kendala pada Vendor Management System (VMS) Perusahaan yang mengakibatkan Calon Penyedia Barang dan/atau Jasa tidak dapat melakukan pendaftaran, maka kendala tersebut harus dibuktikan dengan surat pernyataan dari Unit Information Technology (IT).","l":340,"h":340},{"c":"[BAB III.C angka 7]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Informasi Penyedia dalam Sistem e-Procurement","cells":[[{"t":"PENYEDIA PBJ"},{"m":"10.","t":"Persyaratan Penyedia sebagaimana yang tercantum pada Sistem e-Procurement Perusahaan memuat informasi/keterangan daftar Penyedia badan usaha, antara lain:","l":340,"h":340},{"m":"a.","t":"Sertifikat Standar atau Izin Usaha;","l":624,"h":340},{"m":"b.","t":"SK Kemenkumham Akta Perubahan Anggaran Dasar Terakhir;","l":624,"h":340},{"m":"c.","t":"SK K  (SBU) atau yang setara (untuk perusahaan asing);","l":624,"h":340},{"m":"h.","t":"Izin atau Sertifikat yang dipersyaratkan atau yang setara (untuk perusahaan asing);","l":624,"h":340},{"m":"i.","t":"Nomor Pokok Wajib Pajak (NPWP) atau yang setara (untuk perusahaan asing);","l":624,"h":340},{"m":"j.","t":"Surat Pengukuhan Pengusaha Kena Pajak (SPPKP) atau yang setara (untuk perusahaan asing);","l":624,"h":340},{"m":"k.","t":"Persetujuan Kesesuaian Kegiatan Pemanfaatan Ruang (PKKPR) atau Kesesuaian Kegiatan Pemanfaatan Ruang (KKPR) atau surat pernyataan usaha mikro/usaha kecil terkait tata ruang;","l":624,"h":340},{"m":"l.","t":"Pengalaman kerja (jika ada);","l":624,"h":340},{"m":"m.","t":"Laporan Keuangan;","l":624,"h":340},{"m":"n.","t":"Struktur Organisasi yang ditandatangani oleh Direktur Perusahaan.","l":624,"h":340},{"c":"[BAB III.C angka 7]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"J. PROSES PENILAIAN PRAKUALIFIKASI","rows":[{"topik":"PROSES PENILAIAN PRAKUALIFIKASI","cells":[[{"t":"PROSES PENILAIAN PRAKUALIFIKASI"},{"m":"1.","t":"Penilaian dokumen prakualifikasi dilakukan berdasarkan data dan informasi yang ada dalam paket dokumen prakualifikasi yang telah dibuat oleh Penyedia.","l":340,"h":340},{"m":"2.","t":"Hal hal yang akan dievaluasi meliputi:","l":340,"h":340},{"m":"a.","t":"Kebenaran dan kelengkapan data administrasi;","l":624,"h":340},{"m":"b.","t":"Kebenaran data SDM;","l":624,"h":340},{"m":"c.","t":"Kebenaran data pengalaman kerja/reputasi/kondite;","l":624,"h":340},{"m":"d.","t":"Kebenaran domisili (dapat dilakukan dengan melakukan kunjungan fisik ke lokasi Perusahaan);","l":624,"h":340},{"m":"e.","t":"Pengecekan nama baik Perusahaan Penyedia melalui sumber yang terpercaya.","l":624,"h":340},{"m":"3.","t":"Proses Penilaian Prakualifikasi dapat dilakukan oleh Unit Yang Membidangi Fungsi PBJ di Perusahaan dan/atau Anak Perusahaan.","l":340,"h":340},{"c":"[BAB III.J]"}],[{"t":"Tidak diatur."},{"c":"[-]"
