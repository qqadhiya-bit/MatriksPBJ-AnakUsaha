ntuk Pengadaan Barang dan/atau Jasa dengan nilai di atas Rp250.000.000,- (dua ratus lima puluh juta Rupiah) sampai dengan Rp.3.000.000.000,- (tiga miliar Rupiah);","l":624,"h":340},{"m":"d.","t":"Tender/seleksi umum, untuk Pengadaan Barang dan/atau Jasa dengan nilai di atas Rp.3.000.000.000,- (tiga miliar Rupiah);","l":624,"h":340},{"m":"3.","t":"Metode Pengadaan Barang dan/Jasa untuk Pengadaan Outbond dilakukan dengan memilih salah satu metode :","l":340,"h":340},{"m":"a.","t":"Pengadaan langsung, untuk Pengadaan Barang dan/atau Jasa dengan nilai sampai Rp.1.000.000.000,- (satu milyar rupiah);","l":624,"h":340},{"m":"b.","t":"Tender/Seleksi Terbatas, untuk Pengadaan Barang dan/atau Jasa dengan nilai di atas Rp.1.000.000.000,- (satu milyar rupiah) sampai dengan Rp.3.000.000.000,- (Tiga milyar rupiah);","l":624,"h":340},{"m":"c.","t":"Tender/seleksi umum, untuk Pengadaan Barang dan/atau Jasa dengan nilai di atas Rp.3.000.000.000,- (Tiga milyar rupiah).","l":624,"h":340},{"m":"4.","t":"Penggunaan salah satu metode Pengadaan di lingkungan Perusahaan wajib memperhatikan batas kewenangan yang berlaku.","l":340,"h":340},{"m":"5.","t":"Penggunaan salah satu metode Pengadaan di lingkungan Perusahaan wajib memperhatikan batas kewenangan yang berlaku.","l":340,"h":340},{"m":"6.","t":"Negosiasi harga penawaran dengan Penyedia Barang dan/atau Jasa dalam pelaksanaan salah satu metode Pengadaan sebagaimana dimaksud di atas, dilaksanakan di kantor pusat/kantor cabang Perusahaan, kecuali untuk Pengadaan Langsung di remote area/lokasi proyek dilakukan di remote area/lokasi proyek dimaksud.","l":340,"h":340},{"c":"[BAB V.A]"}],[{"t":"BATASAN KEWENANGAN DAN NILAI PENGADAAN BARANG DAN/ATAU JASA"},{"t":"Batasan kewenangan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan diatur dengan ketentuan sebagai berikut:"},{"m":"e.","t":"Batasan nilai Pengadaan Barang dan/atau Jasa berdasarkan metode pengadaan di Kantor Pusat","l":340,"h":340},{"tbl":{"rows":[[{"t":"NO"},{"t":"METODE"},{"t":"NILAI (Rp)"},{"t":"PELAKSANA PROSES PENGADAAN"}],[{"t":"1"},{"t":"Pengadaan Langsung"},{"t":"s.d. 250 juta"},{"t":"Unit Teknis Kantor Pusat"}],[{"t":"2"},{"t":"Penunjukan Langsung"},{"t":">250 juta s.d. tidak terbatas"},{"t":"Unit Pengadaan Kantor Pusat","rs":3}],[{"t":"3"},{"t":"Tender/ Seleksi Terbatas"},{"t":">250 juta s.d. tidak terbatas"}],[{"t":"4"},{"t":"Tender/ Seleksi Umum"},{"t":">250 juta s.d. tidak terbatas"}]],"hdr":1}},{"m":"f.","t":"Batasan nilai Pengadaan Barang dan/atau Jasa berdasarkan metode pengadaan di di Strategic Business Unit (SBU)","l":340,"h":340},{"tbl":{"rows":[[{"t":"NO"},{"t":"METODE"},{"t":"NILAI (Rp)"},{"t":"PELAKSANA PROSES PENGADAAN"}],[{"t":"1"},{"t":"Pembelian Langsung"},{"t":"s.d. 50 juta (untuk bahan baku produksi bersifat darurat)"},{"t":"Unit Teknis SBU"}],[{"t":"2"},{"t":"Pengadaan Langsung"},{"t":">50 juta s.d. 150 juta"},{"t":"Unit Pengadaan SBU"}],[{"t":"3"},{"t":"Tender/ Seleksi Terbatas"},{"t":">150 juta s.d. tidak terbatas"},{"t":"Unit Pengadaan Kantor Pusat"}],[{"t":"4"},{"t":"Tender/ Seleksi Umum"},{"t":">150 juta s.d. tidak terbatas"},{"t":"Unit Pengadaan Kantor Pusat"}]],"hdr":1}},{"c":"[Pasal 9 huruf e-f]"},{"t":"METODE BARANG DAN/ATAU JASA"},{"m":"(1)","t":"Metode Pengadaan Barang dan/atau Jasa terdiri atas:","l":340,"h":340},{"m":"a.","t":"Tender;","l":624,"h":340},{"m":"b.","t":"Tender Terbatas;","l":624,"h":340},{"m":"c.","t":"Penunjukan Langsung; dan","l":624,"h":340},{"m":"d.","t":"Pengadaan Langsung.","l":624,"h":340},{"m":"(2)","t":"Syarat dan ketentuan serta tata cara Pengadaan Barang dan/atau Jasa sebagaimana ayat (1) Pasal ini akan diatur lebih lanjut dalam Standar Operasional Prosedur (SOP) yang menjadi Lampiran Keputusan ini.","l":340,"h":340},{"c":"[Pasal 10]"}],[{"m":"1.","t":"Metode pengadaan barang dan/ atau jasa dapat dilakukan dengan cara antara lain :","l":340,"h":340},{"m":"a.","t":"Pelelangan/ kontes adalah metode pengadaan barang dan/ atau jasa yang dilakukan dengan cara mengundang sekurang-kurangnya 2 (dua) Calon Penyedia Barang dan/ atau Jasa.","l":624,"h":340},{"m":"b.","t":"Penunjukan langsung adalah pengadaan barang dan/ atau jasa yang dilakukan secara langsung dengan menunjuk 1 (satu) Calon Penyedia Barang dan/ atau Jasa dengan keadaan tertentu.","l":624,"h":340},{"m":"c.","t":"Pengadaan langsung adalah pengadaan barang/ jasa konstruksi/ jasa konsultansi/ jasa lainnya yang bernilai paling tinggi diatur dalam lampiran Peraturan Direksi ini.","l":624,"h":340},{"m":"d.","t":"Pembelian langsung yaitu pembelian terhadap barang dan/ atau jasa yang dilakukan secara langsung, dapat melalui aplikasi Padi UMKM atau dibeli secara langsung kepada Penyedia Barang dan/ atau Jasa yang kebutuhannya bersifat segera dengan nilai paling tinggi Rp 10.000.000,- (Sepuluh Juta Rupiah) dalam 1 (satu) kali pengadaan barang dan/ atau jasa.","l":624,"h":340},{"m":"2.","t":"Metode pengadaan barang dan/ atau jasa sebagaimana pada ayat (1) diatur lebih lanjut dalam Prosedur.","l":340,"h":340},{"c":"[Pasal 23]"}]]},{"topik":"Negosiasi Harga","cells":[[{"t":"JENIS METODE PBJ UNTUK KEGIATAN BISNIS DAN KEGIATAN KANTOR PUSAT"},{"m":"4.","t":"Negosiasi harga penawaran dengan Penyedia dalam pelaksanaan salah satu metode Pengadaan sebagaimana dimaksud di atas, dilaksanakan di wilayah kerja Perusahaan.","l":340,"h":340},{"c":"[BAB IV.A angka 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENUNJUKAN LANGSUNG"},{"m":"3.2.4.","t":"Pelaksanaan Negosiasi Dalam Penunjukan Langsung","l":540,"h":540},{"m":"a.","t":"Setelah menerima surat penawaran harga, Pelaksana Pengadaan melakukan Negosiasi harga.","l":624,"h":340},{"m":"b.","t":"Negosiasi harga dilaksanakan selambat-lambatnya 2 (dua) hari kerja setelah dokumen surat penawaran harga diterima oleh Pelaksana Pengadaan.","l":624,"h":340},{"m":"c.","t":"Dalam melakukan Negosiasi harga, Pelaksana Pengadaan memperhatikan Harga Perkiraan Sendiri (HPS) dan/atau pagu anggaran yang tersedia.","l":624,"h":340},{"m":"d.","t":"Harga hasil Negosiasi maksimal sama dengan pagu anggaran.","l":624,"h":340},{"m":"e.","t":"Apabila harga hasil Negosiasi masih di atas pagu anggaran yang tersedia, maka Pelaksana Pengadaan menyatakan Penunjukan Langsung gagal.","l":624,"h":340},{"m":"f.","t":"Hasil Negosiasi dituangkan dalam berita acara yang ditandatangani oleh Pelaksana Pengadaan dan pihak Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"g.","t":"Berdasarkan hasil Negosiasi, Pelaksana Pengadaan menyusun Berita Acara Hasil Penunjukan Langsung dan mengajukan usulan persetujuan hasil Negosiasi secara tertulis kepada Pejabat Berwenang selambat-lambatnya 2 (dua) hari kerja sejak dokumen Berita Acara Klarifikasi dan Negosiasi diterima oleh Pelaksana Pengadaan.","l":624,"h":340},{"c":"[BAB 3 angka 3.2.4]"},{"t":"PEMILIHAN LANGSUNG"},{"m":"3.3.9.","t":"Pelaksanaan Negosiasi Dalam Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Negosiasi dalam Pemilihan Langsung dilaksanakan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Negosiasi dalam sistem nilai dilaksanakan terhadap Peserta dengan nilai tertinggi.","l":908,"h":340},{"m":"2.","t":"Negosiasi dalam sistem gugur dilaksanakan terhadap Peserta dengan penawaran harga terendah yang wajar.","l":908,"h":340},{"m":"3.","t":"Negosiasi dapat dilakukan terhadap lebih dari 1 (satu) Peserta apabila terdapat sekurang-kurangnya 2 (dua) harga penawaran terendah sama dan memiliki hasil evaluasi teknis yang sama, maka Pelaksana Pengadaan dapat melakukan Negosiasi terhadap keduanya dan memilih Peserta yang memiliki hasil Negosiasi harga terendah.","l":908,"h":340},{"m":"4.","t":"Dalam hal terdapat sekurang-kurangnya 2 (dua) harga penawaran terendah yang sama, namun hasil evaluasi teknis berbeda, maka Negosiasi dilakukan terhadap Peserta dengan nilai evaluasi teknis tertinggi.","l":908,"h":340},{"m":"5.","t":"Apabila harga penawaran terendah yang diajukan di atas pagu anggaran dan hasil Negosiasi masih di atas pagu anggaran maka Negosiasi dapat dilakukan kepada Peserta dengan penawaran harga terendah berikutnya sampai dengan Peserta penawar terendah ketiga.","l":908,"h":340},{"m":"6.","t":"Apabila sampai Peserta dengan penawaran terendah ketiga, hasil Negosiasi masih di atas pagu anggaran maka Pemilihan Langsung dinyatakan gagal.","l":908,"h":340},{"m":"b.","t":"Hasil Negosiasi harga dibuatkan Berita Acara Negosiasi Harga yang ditandatangani oleh Kepala Unit Pelaksana Pengadaan/Panitia Pengadaan dan wakil Peserta Pemilihan Langsung yang dinegosiasi.","l":624,"h":340},{"c":"[BAB 3 angka 3.3.9]"},{"t":"PELELANGAN"},{"m":"3.4.10.","t":"Pelaksanaan Negosiasi Dalam Pelelangan","l":630,"h":630},{"m":"a.","t":"Negosiasi dilaksanakan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Negosiasi dalam sistem nilai dilaksanakan terhadap Peserta dengan nilai tertinggi.","l":908,"h":340},{"m":"2.","t":"Negosiasi dalam sistem gugur dilaksanakan terhadap Peserta dengan penawaran harga terendah yang wajar.","l":908,"h":340},{"m":"3.","t":"Negosiasi dapat dilakukan terhadap lebih dari 1 (satu) Peserta apabila terdapat sekurang-kurangnya 2 (dua) harga penawaran terendah sama dan memiliki hasil evaluasi teknis yang sama, maka Panitia Pengadaan dapat melakukan Negosiasi terhadap keduanya dan memilih Peserta yang memiliki hasil Negosiasi harga terendah.","l":908,"h":340},{"m":"4.","t":"Dalam hal terdapat sekurang-kurangnya 2 (dua) harga penawaran terendah yang sama, namun hasil evaluasi teknis berbeda, maka Negosiasi dilakukan terhadap Peserta dengan nilai evaluasi teknis tertinggi.","l":908,"h":340},{"m":"5.","t":"Apabila harga penawaran terendah yang diajukan di atas pagu anggaran dan hasil Negosiasi masih di atas pagu anggaran, maka Negosiasi dapat dilakukan kepada Peserta dengan penawaran harga terendah berikutnya sampai dengan Peserta penawar terendah ketiga.","l":908,"h":340},{"m":"6.","t":"Apabila sampai Peserta dengan penawaran terendah ketiga, hasil Negosiasi masih di atas pagu anggaran, maka Pelelangan dinyatakan gagal dan dilakukan Pelelangan ulang.","l":908,"h":340},{"m":"b.","t":"Hasil Negosiasi harga dibuatkan Berita Acara Negosiasi Harga yang ditandatangani oleh anggota Panitia Pengadaan dan wakil Peserta Pelelangan yang dinegosiasi.","l":624,"h":340},{"c":"[BAB 3 angka 3.4.10]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"B. PENGADAAN LANGSUNG","rows":[{"topik":"PENGADAAN LANGSUNG","cells":[[{"t":"PENGADAAN LANGSUNG"},{"m":"1.","t":"Pengadaan Langsung dilakukan oleh Unit Bisnis atau Unit Teknis dengan nilai sampai dengan Rp200.000.000,- (dua ratus juta rupiah).","l":340,"h":340},{"m":"2.","t":"Pengadaan langsung dapat dilaksanakan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"PBJ melalui sistem e-Procurement Perusahaan; atau","l":624,"h":340},{"m":"b.","t":"Pembelian terhadap Barang dan/atau Jasa yang terdapat di pasar atau e-Marketplace yang nilainya berdasarkan harga pasar dan tidak harus merupakan Penyedia yang terverifikasi di dalam sistem e-Procurement Perusahaan.","l":624,"h":340},{"m":"3.","t":"Pelaksanaan Pengadaan Langsung dapat dilaksanakan untuk pekerjaan investasi maupun pekerjaan eksploitasi.","l":340,"h":340},{"m":"4.","t":"Tata Cara PBJ melalui Metode Pengadaan Langsung akan diatur dalam Peraturan tersendiri.","l":340,"h":340},{"c":"[BAB IV.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENGADAAN LANGSUNG"},{"m":"3.1.1.","t":"Ketentuan Umum Pengadaan Langsung","l":540,"h":540},{"m":"a.","t":"Nilai Pengadaan Barang dan/atau Jasa yang dapat dilaksanakan dengan Pengadaan Langsung adalah sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Kantor Pusat sampai dengan Rp50.000.000,- (lima puluh juta rupiah).","l":908,"h":340},{"m":"2.","t":"Kantor Cabang sampai dengan Rp50.000.000,- (lima puluh juta rupiah).","l":908,"h":340},{"m":"b.","t":"Pengadaan Langsung dapat dilakukan kepada Penyedia Barang dan/atau Jasa baik yang sudah terdaftar maupun belum terdaftar sebagai Rekanan di Perusahaan dan baik berbentuk orang perseorangan, badan usaha dan/atau e-catalogue/e-commerce.","l":624,"h":340},{"m":"c.","t":"Syarat badan usaha yang dapat menjadi Penyedia Barang dan/atau Jasa dalam Pengadaan Langsung diutamakan yang memiliki NPWP dan SPPKP sesuai ketentuan perpajakan yang berlaku.","l":624,"h":340},{"m":"d.","t":"Dalam melaksanakan proses Pengadaan Langsung, Pelaksana Pengadaan wajib memperhatikan kewajaran harga dan benefit bagi Perusahaan dengan melakukan perbandingan diantara beberapa Penyedia Barang dan/atau Jasa, kecuali untuk Pengadaan Barang dan/atau Jasa kebutuhan rumah tangga.","l":624,"h":340},{"m":"e.","t":"Pengadaan Langsung di Kantor Pusat dilaksanakan oleh Unit Pelaksana Pengadaan.","l":624,"h":340},{"m":"f.","t":"Pengadaan Langsung di Kantor Cabang HUB CGK dan CGO, DPS, KNO, SUB, UPG dan Kantor Cabang SPOKE Kelas 3, kelas 4 dan Kelas 5 dilaksanakan oleh Unit Pelaksana Pengadaan Kantor Cabang.","l":624,"h":340},{"m":"g.","t":"Pengadaan Langsung di Kantor Cabang SPOKE Kelas 6 dilaksanakan oleh General Manager (GM) di Kantor Cabang SPOKE.","l":624,"h":340},{"m":"h.","t":"Pengadaan Langsung dapat dilakukan oleh Gapura Pragata Logistik (GPL) untuk Pengadaan Barang dan/atau Jasa dalam rangka pemenuhan sewa menyewa alat transportasi dalam kegiatan logistik dengan Nilai Pengadaan sampai dengan Rp300.000.000,- (tiga ratus juta rupiah) berdasarkan pada surat permintaan/pesanan dari customer/pelanggan.","l":624,"h":340},{"m":"3.1.2.","t":"Tata Cara Pengadaan Langsung","l":540,"h":540},{"m":"a.","t":"Pengadaan Langsung dapat dilakukan dengan 2 (dua) cara, yaitu:","l":624,"h":340},{"m":"1.","t":"Dengan membeli langsung kepada Penyedia Barang dan/atau Jasa; atau","l":908,"h":340},{"m":"2.","t":"Dengan meminta penawaran harga kepada Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"b.","t":"Pengadaan Langsung di Kantor Pusat dengan cara membeli langsung kepada Penyedia Barang dan/atau Jasa dapat dilakukan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Unit Pengguna (User) mengajukan permintaan pengadaan kepada Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"2.","t":"Dalam hal Unit Pengguna (User) sekaligus sebagai Unit Spesifikasi Teknis (UST), maka permintaan pengadaan sebagaimana dimaksud pada huruf a tidak diperlukan, cukup mendasarkan pada Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah disetujui.","l":908,"h":340},{"m":"3.","t":"Unit Spesifikasi Teknis (UST) mengajukan Persetujuan Pemakaian Anggaran (PPA) sesuai dengan ketentuan Manual Anggaran yang berlaku, dengan menyertakan Spesifikasi Teknis Barang dan/atau Jasa yang akan diadakan.","l":908,"h":340},{"m":"4.","t":"Setelah mendapat Persetujuan Pemakaian Anggaran (PPA), Unit Spesifikasi Teknis (UST) menerbitkan Surat Permintaan Pengadaan (SPP) (untuk Nilai Pengadaan di atas Rp10.000.000,- (sepuluh juta rupiah)) yang ditandatangi oleh Kepala Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"5.","t":"Setelah ditandatangani lengkap dengan Spesifikasi Teknisnya, Surat Permintaan Pengadaan (SPP) disampaikan oleh Unit Spesifikasi Teknis (UST) kepada Kepala Unit Kerja Pengadaan.","l":908,"h":340},{"m":"6.","t":"Untuk Pengadaan Barang dan/atau Jasa yang tidak memerlukan Persetujuan Pemakaian Anggaran (PPA), Surat Permintaan Pengadaan (SPP) ditandatangani oleh Kepala Unit Spesifikasi Teknis (UST) dan Kepala Unit yang membidangi anggaran untuk dilakukan kontrol anggaran.","l":908,"h":340},{"m":"7.","t":"Berdasarkan Surat Permintaan Pengadaan (SPP) yang diterima, Kepala Unit Kerja Pengadaan melakukan pengajuan proses uang muka sesuai mekanisme yang diatur dalam Manual Unit Keuangan.","l":908,"h":340},{"m":"8.","t":"Pengajuan uang muka kepada Unit Keuangan dilakukan selambat-lambatnya 2 (dua) hari sejak diterimanya Surat Permintaan Pengadaan (SPP).","l":908,"h":340},{"m":"9.","t":"Setelah menerima uang muka, Unit Pelaksana Pengadaan mencari informasi tentang Barang dan/atau Jasa yang akan diadakan meliputi Spesifikasi Teknis, harga, lamanya pelaksanaan pekerjaan/waktu pengiriman barang, lokasi Penyedia Barang dan/atau Jasa, lokasi barang yang akan dibeli, serta merek/tipe dan informasi lainnya yang dianggap perlu.","l":908,"h":340},{"m":"10.","t":"Setelah mendapatkan data mengenai Barang dan/atau Jasa yang akan dibeli, termasuk Penyedia Barang dan/atau Jasanya, Unit Pelaksana Pengadaan melakukan pembelian langsung ke Penyedia Barang dan/atau Jasa toko atau tempat tersedianya barang.","l":908,"h":340},{"m":"11.","t":"Setelah membeli Barang dan/atau Jasa, Unit Pelaksana Pengadaan menyerahkan Barang dan/atau Jasa kepada Kepala Unit Spesifikasi Teknis (UST) yang dilengkapi dengan Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) dan menyampaikan pertanggungjawaban uang muka kepada Kepala Unit yang membidangi Akuntansi.","l":908,"h":340},{"m":"12.","t":"Untuk pengadaan barang investasi, Unit Sepesifikasi Teknis (UST) melaporkan penerimaan barang investasi tersebut kepada Kepala Unit yang membidangi pengelolaan aset untuk dilakukan pencatatan aset.","l":908,"h":340},{"m":"c.","t":"Pengadaan Langsung di Kantor Cabang HUB CGK dan CGO, DPS, KNO, SUB, UPG dan Cabang SPOKE Kelas 3, kelas 4 dan Kelas 5 dengan cara membeli langsung kepada Penyedia Barang dan/atau Jasa dapat dilakukan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Unit Pengguna (User) Kantor Cabang mengajukan permintaan pengadaan kepada Unit Spesifikasi Teknis (UST) Kantor Cabang.","l":908,"h":340},{"m":"2.","t":"Unit Spesifikasi Teknis (UST) Kantor Cabang menetapkan Spesifikasi Teknis Barang dan/atau Jasa yang akan diadakan dan meminta persetujuan Pejabat Berwenang Kantor Cabang untuk melakukan Pengadaan Langsung.","l":908,"h":340},{"m":"3.","t":"Khusus untuk pengadaan Barang spare part, Kantor Cabang mengajukan verifikasi ke Unit Spesifikasi Teknis (UST) Kantor Pusat.","l":908,"h":340},{"m":"4.","t":"Dalam hal Unit Pengguna (User) Kantor Cabang sekaligus sebagai Unit Spesifikasi Teknis (UST) Kantor Cabang, maka permintaan pengadaan tidak diperlukan, cukup mendasarkan pada Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah disetujui.","l":908,"h":340},{"m":"5.","t":"Berdasarkan permintaan Unit Pengguna (User) Kantor Cabang, Unit Spesifikasi Teknis (UST) Kantor Cabang mengajukan Persetujuan Pemakaian Anggaran (PPA) sesuai dengan ketentuan Manual anggaran yang berlaku.","l":908,"h":340},{"m":"6.","t":"Untuk Pengadaan Barang dan/atau Jasa yang tidak memerlukan Persetujuan Pemakaian Anggaran (PPA), Unit Spesifikasi Teknis (UST) Kantor Cabang cukup mengajukan Surat Permintaan Pengadaan (SPP) ke Unit Kontrol Anggaran untuk persetujuan anggaran dengan melampirkan Spesifikasi Teknis.","l":908,"h":340},{"m":"7.","t":"Setelah ditandatangani oleh Pejabat Penanggung Jawab Kontrol Anggaran dan Kepala Unit Spesifikasi Teknis (UST) Kantor Cabang lengkap dengan Spesifikasi Teknisnya, Surat Permintaan Pengadaan (SPP) disampaikan oleh Unit Spesifikasi Teknis (UST) Kantor Cabang ke Kepala Unit Pelaksana Pengadaan Kantor Cabang untuk proses permintaan uang muka sesuai mekanisme dalam Manual Unit Keuangan.","l":908,"h":340},{"m":"8.","t":"Setelah menerima uang muka, Unit Pelaksana Pengadaan Kantor Cabang melakukan pembelian langsung ke Penyedia Barang dan/atau Jasa toko atau tempat tersedianya barang.","l":908,"h":340},{"m":"9.","t":"Setelah membeli Barang dan/atau Jasa, Unit Pelaksana Pengadaan Kantor Cabang menyerahkan Barang dan/atau Jasa kepada Unit Spesifikasi Teknis (UST) Kantor Cabang yang dilengkapi dengan Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) dan menyampaikan pertanggungjawaban uang muka kepada Kepala Unit yang membidangi akuntansi.","l":908,"h":340},{"m":"10.","t":"Untuk pengadaan barang investasi, Unit Sepesifikasi Teknis (UST) Kantor Cabang melaporkan penerimaan barang investasi tersebut kepada Kepala Unit yang membidangi pengelolaan aset untuk dilakukan pencatatan aset.","l":908,"h":340},{"m":"d.","t":"Pengadaan Langsung di Kantor Cabang SPOKE Kelas 6 dilakukan dengan tahapan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"General Manager (GM) melakukan pembelian langsung ke Penyedia Barang dan/atau Jasa toko atau tempat tersedianya barang sesuai dengan kebutuhan rutin dan operasional cabang.","l":908,"h":340},{"m":"2.","t":"Khusus untuk pembelian sparepart, General Manager (GM) terlebih dahulu mengajukan verifikasi ke Unit Spesifikasi Teknis (UST) Kantor Pusat.","l":908,"h":340},{"m":"3.","t":"Untuk pembelian barang investasi, General Manager (GM) melakukan pencatatan aset.","l":908,"h":340},{"m":"e.","t":"Pengadaan Langsung dengan cara meminta penawaran kepada Penyedia Barang dan/atau Jasa dapat dilakukan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Berdasarkan permintaan pengadaan/Surat Permintaan Pengadaan (SPP), Kepala Unit Pengadaan menyiapkan dan menandatangani surat permintaan penawaran kepada Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"2.","t":"Pemasukan penawaran ditetapkan selambat-lambatnya 3 (tiga) hari kerja sejak tanggal surat permintaan penawaran kepada Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"3.","t":"Berdasarkan surat penawaran harga dari Penyedia Barang dan/atau Jasa, Unit Pelaksana Pengadaan melakukan Negosiasi harga.","l":908,"h":340},{"m":"4.","t":"Hasil Negosiasi diajukan kepada Kepala Unit Kerja Pengadaan/Kepala Unit Kerja Pengadaan Kantor Cabang/General Manager (GM) untuk mendapatkan persetujuan.","l":908,"h":340},{"m":"5.","t":"Apabila disetujui, Kepala Unit Kerja Pengadaan/Kepala Unit Kerja Pengadaan Kantor Cabang/General Manager (GM) menerbitkan Surat Perintah Kerja (SPK) yang kemudian dilanjutkan dengan menerbitkan Surat Pemesanan (Purchase Order/PO).","l":908,"h":340},{"m":"6.","t":"Setelah membeli Barang dan/atau Jasa, Kepala Unit Pelaksana Pengadaan/Kepala Unit Pelaksana Kantor Cabang/General Manager (GM) menyerahkan Barang dan/atau Jasa kepada Unit Spesifikasi Teknis (UST) yang dilengkapi dengan Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) dan menyampaikan pertanggungjawaban kepada Kepala Unit yang membidangi Akuntansi.","l":908,"h":340},{"m":"7.","t":"Untuk pengadaan barang investasi, Unit Sepesifikasi Teknis (UST) melaporkan penerimaan barang investasi tersebut kepada Kepala Unit yang membidangi pengelolaan aset untuk dilakukan pencatatan aset.","l":908,"h":340},{"m":"f.","t":"Hasil Pengadaan Langsung untuk Barang dan/atau Jasa yang pelaksanaannya dilakukan dalam periode tertentu, baik secara rutin maupun tidak rutin, atau terdiri dari tahapan-tahapan pekerjaan wajib diikat dengan suatu Perjanjian.","l":624,"h":340},{"m":"g.","t":"Pembayaran untuk Pengadaan Langsung yang penyerahan barang/penyelesaian pekerjaan dilaksanakan sekaligus, dibuktikan dengan struk/nota pembayaran/invoice dan kwitansi bermeterai cukup sesuai ketentuan yang berlaku serta faktur pajak (untuk Penyedia Barang dan/atau Jasa berbentuk badan usaha yang memiliki Surat Pengukuhan Pengusaha Kena Pajak (SPPKP)).","l":624,"h":340},{"m":"h.","t":"Pembayaran untuk Pengadaan Langsung yang penyerahan barang/penyelesaian pekerjaan dilaksanakan dalam periode tertentu/rutin, dilaksanakan sesuai dengan syarat pembayaran yang dicantumkan dalam Perjanjian.","l":624,"h":340},{"m":"i.","t":"Tata cara Pengadaan Langsung dapat dilakukan secara elektronik (email/e-letter/website/conference call melalui aplikasi yang ditetapkan oleh Unit IT).","l":624,"h":340},{"m":"3.1.3.","t":"Dokumen Pengadaan Langsung sekurang-kurangnya memuat sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Apabila Pengadaan Langsung dilakukan dengan membeli langsung kepada Penyedia Barang dan/atau Jasa:","l":624,"h":340},{"m":"1.","t":"Form Persetujuan Pemakaian Anggaran (PPA) dan/atau Surat Permintaan Pengadaan (SPP);","l":908,"h":340},{"m":"2.","t":"Bukti bayar/kuitansi/struk pembelian;","l":908,"h":340},{"m":"3.","t":"Dapat melampirkan bukti/dokumen penilaian kewajaran harga dan hasil perbandingan diantara beberapa Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"4.","t":"Berita Acara Serah Terima Barang/Jasa (BASTB/J).","l":908,"h":340},{"m":"b.","t":"Apabila Pengadaan Langsung dilakukan dengan meminta penawaran harga kepada Penyedia Barang dan/atau Jasa:","l":624,"h":340},{"m":"1.","t":"Form Persetujuan Pemakaian Anggaran (PPA) dan/atau Surat Permintaan Pengadaan (SPP);","l":908,"h":340},{"m":"2.","t":"Harga Perkiraan Sendiri (HPS) yang dapat dilengkapi dengan bukti perbandingan diantara Penyedia Barang dan/atau Jasa berdasarkan penawaran harga tertulis;","l":908,"h":340},{"m":"3.","t":"Surat Pemesanan (Purchase Order/PO); dan","l":908,"h":340},{"m":"4.","t":"Berita Acara Serah Terima Barang/Jasa (BASTB/J).","l":908,"h":340},{"m":"c.","t":"Seluruh dokumen Pengadaan Langsung sebagaimana dimakusd pada huruf a dan b dijadikan 1 (satu) dan disimpan oleh Unit Kerja Pengadaan.","l":624,"h":340},{"c":"[BAB 3 angka 3.1.0]"}],[{"t":"PENGADAAN LANGSUNG"},{"m":"1.","t":"Pengadaan langsung, yaitu pembelian terhadap Barang dan/atau Jasa yang terdapat di pasar atau melalui E-Purchasing atau pada E-Marketplace, dengan demikian nilainya berdasarkan harga pasar, dan tidak harus merupakan penyedia yang terdaftar di VMS Perusahaan;","l":340,"h":340},{"m":"2.","t":"Jika diperlukan, Pengadaan langsung dilakukan dengan salah satu cara berikut:","l":340,"h":340},{"m":"a.","t":"Memperbandingkan harga di antara penyedia Barang dan/atau Jasa yang ada di pasar; atau","l":624,"h":340},{"m":"b.","t":"Memperbandingkan harga di antara penyedia Barang dan/atau Jasa yang ada di pasar dengan kualitas Barang dan/atau Jasa berikut dengan aspek pendukung (seperti garansi untuk barang, atau lainnya); atau Negosiasi harga langsung dengan penyedia Barang dan/atau Jasa untuk mendapatkan nilai terbaik dari Barang dan/atau Jasa.","l":624,"h":340},{"m":"3.","t":"Metode pembayaran untuk Pengadaan langsung adalah secara tunai atau non tunai;","l":340,"h":340},{"m":"4.","t":"Metode pembayaran secara tunai untuk Pengadaan Barang dan/atau Jasa Inbound ndangan disampaikan kepada Penyedia Barang dan/atau Jasa;","l":624,"h":340},{"m":"c.","t":"pembukaan dokumen penawaran dilaksanakan pada hari yang sama dengan dokumen penawaran diterima dan dilanjutkan dengan klarifikasi dan negosiasi harga. Proses pelaksanaannya dituangkan dalam Berita Acara Klarifikasi dan Negosiasi yang ditanda tangani oleh Unit Pengadaan dan Penyedia Barang dan/atau Jasa;","l":624,"h":340},{"m":"d.","t":"Penerbitan Surat Perjanjian Kerja (SPK) maksimal 3 (tiga) hari setelah tercapai kesepakatan harga, dan memuat sekurang-kurangnya:","l":624,"h":340},{"m":"i.","t":"nama pekerjaan berikut spesifikasinya;","l":908,"h":340},{"m":"ii.","t":"nama dan alamat Penyedia Barang dan Jasa;","l":908,"h":340},{"m":"iii.","t":"harga Pengadaan;","l":1003,"h":435},{"m":"iv.","t":"waktu Pengadaan.","l":908,"h":340},{"c":"[BAB VII.B angka 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"C. TENDER/SELEKSI TERBATAS","rows":[{"topik":"TENDER/SELEKSI TERBATAS","cells":[[{"t":"TENDER/SELEKSI TERBATAS"},{"m":"1.","t":"Tender/Seleksi Terbatas adalah PBJ yang ditawarkan kepada Penyedia yang terverifikasi di sistem e-Procurement Perusahaan dengan sekurang-kurangnya 2 (dua) Penyedia.","l":340,"h":340},{"m":"2.","t":"Tender/Seleksi Terbatas dilaksanakan dalam hal:","l":340,"h":340},{"m":"a.","t":"Pembangunan atau pengembangan lini bisnis perusahaan;","l":624,"h":340},{"m":"b.","t":"Pekerjaan yang termasuk dalam pengadaan strategis (Strategic Project);","l":624,"h":340},{"m":"c.","t":"Penyedia antar penyedia BUMN/perusahaan terafiliasi BUMN;","l":624,"h":340},{"m":"d.","t":"Penyedia yang termasuk dalam Selected Vendor List dan sudah terverifkasi dalam sistem e-Procurement Perusahaan;","l":624,"h":340},{"m":"e.","t":"PBJ yang dilaksanakan oleh penyedia tertentu, misalnya agen/pemegang merek/distributor tunggal/dealer/kantor akuntan publik/konsultan tertentu yang produk dan/atau jasanya telah dipergunakan dan kehandalannya sudah teruji;","l":624,"h":340},{"m":"f.","t":"Pekerjaan lainnya yang ditentukan oleh Direktur Terkait.","l":624,"h":340},{"m":"3.","t":"Tender/Seleksi Terbatas dilaksanakan oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat dengan melibatkan Unit Bisnis atau Unit Teknis.","l":340,"h":340},{"m":"4.","t":"Tata Cara PBJ melalui Metode Tender/Seleksi Terbatas akan diatur dalam Peraturan tersendiri.","l":340,"h":340},{"c":"[BAB IV.C]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PEMILIHAN LANGSUNG"},{"m":"3.3.1.","t":"Ketentuan Umum Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Pemilihan Langsung dilakukan dengan cara menyeleksi sekurang-kurangnya 3 (tiga) Penyedia Barang dan/atau Jasa yang pernah bekerjasama dengan Perusahaan dan/atau yang sudah terdaftar sebagai Rekanan di Perusahaan baik terdaftar di Kantor Pusat maupun terdaftar di Kantor Cabang.","l":624,"h":340},{"m":"b.","t":"Barang dan/atau Jasa yang dapat dilaksanakan pengadaannya dengan Pemilihan Langsung diantaranya:","l":624,"h":340},{"m":"1.","t":"Barang Umum/Jasa umum yang tersedia bebas di pasaran sehingga tersedia banyak Penyedia Barang dan/atau Jasanya dengan Nilai Pengadaan:","l":908,"h":340},{"m":"a)","t":"Kantor Pusat di atas Rp50.000.000,- (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":1192,"h":340},{"m":"b)","t":"Kantor Cabang di atas Rp50.000.000,- (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":1192,"h":340},{"m":"2.","t":"Barang dan/atau Jasa tertentu dengan Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":908,"h":340},{"m":"c.","t":"Barang dan/atau Jasa tertentu sebagaimana dimaksud pada huruf b angka 2 adalah sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Barang penunjang ground handling seperti Peralatan Ground Support Equipment (GSE) motorized dan non motorized;","l":908,"h":340},{"m":"2.","t":"Suku cadang/komponen pendukung Peralatan Ground Support Equipment (GSE) non merek;","l":908,"h":340},{"m":"3.","t":"Apron bus dan kendaraan operasional apron yang memiliki spesifikasi khusus;","l":908,"h":340},{"m":"4.","t":"Jasa Penyediaan SDM dan/atau Paket Pekerjaan;","l":908,"h":340},{"m":"5.","t":"Teknologi informasi.","l":908,"h":340},{"m":"d.","t":"Peserta yang diundang dalam proses Pemilihan Langsung adalah Penyedia Barang dan/atau Jasa yang sudah terdaftar di Perusahaan dan secara administrasi sudah memenuhi persyaratan yang ditetapkan dan/atau telah memiliki pengalaman Kerjasama di lingkungan Perusahaan dengan penilaian baik.","l":624,"h":340},{"m":"e.","t":"Pelaksana Pengadaan yang berwenang melakukan Pemilihan Langsung untuk Barang dan/atau Jasa umum sebagaimana dimaksud pada huruf b angka 1 adalah Unit Pelaksana Pengadaan dengan melibatkan Unit Spesifikasi Teknis (UST) dan/atau Unit Pengguna (User).","l":624,"h":340},{"m":"f.","t":"Pelaksana Pengadaan yang berwenang melakukan Pemilihan Langsung untuk Barang dan/atau Jasa tertentu sebagaimana dimaksud pada huruf b angka 2 adalah Panitia Pengadaan.","l":624,"h":340},{"m":"3.3.2.","t":"Tata Cara Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Tata cara Pemilihan Langsung untuk Barang dan/atau Jasa umum adalah sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Setelah menerima Surat Permintaan Pengadaan (SPP), Kepala Unit Pelaksana Pengadaan mengumpulkan data mengenai Spesifikasi Teknis atas Barang dan/atau Jasa yang akan diadakan, mencari informasi harga pasar dan data dukung lainnya yang dapat dipergunakan sebagai dasar penyusunan Rencana Kerja dan Syarat (RKS) dan Harga Perkiraan Sendiri (HPS).","l":908,"h":340},{"m":"2.","t":"Setelah data dukung sebagaimana dimasud pada angka 1 cukup lengkap, Pelaksana Pengadaan menyusun Harga Perkiraan Sendiri (HPS) dan meminta persetujuan Pejabat Berwenang.","l":908,"h":340},{"m":"3.","t":"Pelaksana Pengadaan mempersiapkan Rencana Kerja dan Syarat (RKS) Pemilihan Langsung selambat-lambatnya 1 (satu) hari kerja sebelum diberikannya undangan kepada Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"4.","t":"Untuk menetapkan Rencana Kerja dan Syarat (RKS) dalam Pemilihan Langsung, Unit Pelaksana Pengadaan menetapkan syarat adminisitrasi yang wajib dipenuhi oleh Peserta Pemilihan Langsung, melakukan koordinasi dengan Unit Spesifikasi Teknis (UST) dan Unit Pengguna (User) untuk menetapkan Spesifikasi Teknis Barang dan/atau Jasa yang dibutuhkan, termasuk engineering specification, approval specification, gambar-gambar, uraian rinci pekerjaan dan hal-hal lain yang diperlukan.","l":908,"h":340},{"m":"5.","t":"Sebelum Rencana Kerja dan Syarat (RKS) disampaikan kepada Peserta Pemilihan Langsung, Rencana Kerja dan Syarat (RKS) tersebut terlebih dahulu harus ditandatangani oleh Kepala Unit Pelaksana Pengadaan dan Kepala Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"6.","t":"Setelah Rencana Kerja dan Syarat (RKS) ditandatangani, Unit Pelaksana Pengadaan melakukan pengecekan kembali dokumen administrasi Penyedia Barang dan/atau Jasa dalam daftar Rekanan.","l":908,"h":340},{"m":"b.","t":"Tata cara Pemilihan Langsung untuk Barang dan/atau Jasa tertentu adalah sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Setelah menerima Surat Permintaan Pengadaan (SPP), Panitia Pengadaan mengumpulkan data mengenai Spesifikasi Teknis atas Barang dan/atau Jasa yang akan diadakan, mencari informasi harga pasar dan data dukung lainnya yang dapat dipergunakan sebagai dasar penyusunan Rencana Kerja dan Syarat (RKS) dan Harga Perkiraan Sendiri (HPS).","l":908,"h":340},{"m":"2.","t":"Setelah data dukung sebagaimana dimasud pada angka 1 cukup lengkap, Panitia Pengadaan menyusun Harga Perkiraan Sendiri (HPS) dan meminta persetujuan Pejabat Berwenang.","l":908,"h":340},{"m":"3.","t":"Pelaksana Pengadaan mempersiapkan Rencana Kerja dan Syarat (RKS) Pemilihan Langsung selambat-lambatnya 1 (satu) hari kerja sebelum diberikannya undangan kepada Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"4.","t":"Untuk menetapkan Rencana Kerja dan Syarat (RKS) dalam Pemilihan Langsung, Panitia Pengadaan menetapkan syarat teknis yang wajib dipenuhi oleh Peserta Pemilihan Langsung, melakukan koordinasi dengan Unit Spesifikasi Teknis (UST) dan Unit Pengguna (User) untuk menetapkan Spesifikasi Teknis Barang dan/atau Jasa yang dibutuhkan,termasuk engineering specification, approval specification, gambar-gambar, uraian rinci pekerjaan dan hal-hal lain yang diperlukan.","l":908,"h":340},{"m":"5.","t":"Sebelum Rencana Kerja dan Syarat (RKS) disampaikan kepada Peserta Pemilihan Langsung, Rencana Kerja dan Syarat (RKS) tersebut terlebih dahulu harus ditandatangani oleh Panitia Pengadaan.","l":908,"h":340},{"m":"6.","t":"Setelah Rencana Kerja dan Syarat (RKS) ditandatangani, Panitia Pengadaan melakukan pengecekan kembali dokumen administrasi Penyedia Barang dan/atau Jasa dalam daftar Rekanan.","l":908,"h":340},{"m":"c.","t":"Tata cara Pemilihan Langsung dapat dilakukan secara elektronik (email/e-letter/website/conference call melalui aplikasi yang ditetapkan oleh Unit IT).","l":624,"h":340},{"m":"3.3.3.","t":"Undangan Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Setelah dilakukan pengecekan dokumen administrasi dan memenuhi persyaratan sekurang-kurangnya 3 (tiga) Penyedia barang dan/atau Jasa, Pelaksana Pengadaan menyiapkan surat undangan.","l":624,"h":340},{"m":"b.","t":"Surat undangan ditandatangani oleh Kepala Unit Kerja Pengadaan (apabila untuk Barang dan/atau Jasa umum) atau Ketua Panitia Pengadaan (apabila untuk Barang dan/atau Jasa tertentu) .","l":624,"h":340},{"m":"c.","t":"Surat undangan diberikan secara tertulis minimal kepada 3 (tiga) Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"d.","t":"Dalam menyampaikan undangan, Pelaksana Pengadaan wajib memastikan bahwa undangan tersebut sudah diterima oleh Peserta yang dibuktikan dengan tanda terima yang ditandatangani oleh pihak Peserta atau bukti email/fax yang sudah terkirim.","l":624,"h":340},{"m":"e.","t":"Undangan sekurang-kurangnya memuat:","l":624,"h":340},{"m":"1.","t":"Jenis Pengadaan Barang dan/atau Jasa yang akan diadakan;","l":908,"h":340},{"m":"2.","t":"Lokasi kebutuhan Barang dan/atau Jasa;","l":908,"h":340},{"m":"3.","t":"Waktu pendaftaran (hari, tanggal, bulan, tahun, jam); dan","l":908,"h":340},{"m":"4.","t":"Tempat pendaftaran.","l":908,"h":340},{"m":"f.","t":"Rencana Kerja dan Syarat (RKS) dan Pakta Integritas dilampirkan bersamaan dengan undangan.","l":624,"h":340},{"m":"g.","t":"Pakta Integritas harus diisi dan ditandatangani oleh pimpinan perusahaan masing-masing Peserta.","l":624,"h":340},{"m":"h.","t":"Ketidakhadiran/ketidakikutsertaan Peserta yang diundang dan telah menerima undangan dalam proses Pemilihan Langsung harus dibuktikan dengan konfirmasi tertulis.","l":624,"h":340},{"m":"i.","t":"Peserta yang tidak hadir tanpa konfirmasi akan dikenai sanksi berupa dimasukkan ke Daftar Hitam (Blacklist) Perusahaan.","l":624,"h":340},{"m":"3.3.4.","t":"Pendaftaran Peserta Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Pendaftaran dilaksanakan dalam waktu 3 (tiga) hari kerja sejak tanggal surat undangan.","l":624,"h":340},{"m":"b.","t":"Peserta yang mendaftar minimal 3 (tiga) Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"c.","t":"Pendaftaran Peserta dapat dilakukan oleh wakil Perusahaan dengan menunjukan surat kuasa bermeterai yang ditandatangani oleh Direktur Perusahaan.","l":624,"h":340},{"m":"3.3.6.","t":"Pemasukan Dokumen Penawaran Dalam Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Setelah penjelasan umum (aanwijzing) dilaksanakan, maka proses Pemilihan Langsung dilanjutkan dengan proses pemasukan Dokumen Penawaran.","l":624,"h":340},{"m":"b.","t":"Dalam proses Pemilihan Langsung tidak disyaratkan adanya Jaminan Penawaran.","l":624,"h":340},{"m":"c.","t":"Pemasukan Dokumen Penawaran harus ditetapkan selambat-lambatnya 14 (empat belas) hari kerja setelah penjelasan umum (aanwijzing), namun apabila Barang dan/atau Jasa yang akan diadakan memiliki spesifikasi yang rumit dan memerlukan perhitungan yang membutuhkan waktu cukup lama, maka waktu pemasukan penawaran dapat ditetapkan berdasarkan kesepakatan para Peserta pada saat penjelasan umum (aanwijzing).","l":624,"h":340},{"m":"d.","t":"Pemasukan Dokumen Penawaran dapat dilakukan dengan sistem sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Satu Tahap Satu Sampul","l":908,"h":340},{"t":"Pemasukan Dokumen Penawaran dengan sistem satu tahap satu sampul, yaitu penyampaian Dokumen Penawaran yang terdiri dari persyaratan teknis dan penawran harga yang dimasukkan dalam 1 (satu) sampul tertutup.","l":908},{"m":"2.","t":"Satu Tahap Dua Sampul","l":908,"h":340},{"t":"Pemasukan Dokumen Penawaran dengan sistem satu tahap dua sampul, yaitu penyampaian Dokumen Penawaran yang terdiri dari persyaratan teknis dan penawaran harga, yang masing-masing dokumen dimasukkan ke dalam sampul tertutup secara terpisah, di mana sampul satu berisi dokumen persyaratan teknis dan sampul dua berisi dokumen penawaran harga. Selanjutnya kedua sampul tersebut dimasukkan ke dalam satu sampul tertutup dan disampaikan kepada Pelaksana Pengadaan secara bersamaan pada waktu yang telah ditentukan dalam Rencana Kerja dan Syarat (RKS) dan disepakati bersama dalam penjelasan umum (aanwijzing).","l":908},{"m":"e.","t":"Peserta yang memasukan Dokuem Penawaran dan Peserta yang lulus persyaratan teknis minimal 2 (dua) Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"f.","t":"Apabila Peserta yang memasukkan Dokumen Penawaran atau Peserta yang lulus evaluasi teknis kurang dari 2 (dua) Peserta maka Pelaksana Pengadaan menyatakan Pemilihan Langsung gagal dan dilakukan Pemilihan Langsung ulang.","l":624,"h":340},{"m":"g.","t":"Apabila dalam Pemilihan Langsung ulang, Peserta yang memasukkan penawaran atau yang Peserta yang lulus evaluasi adminisitrasi dan teknis kurang dari 2 (dua) Peserta, Pelaksana Pengadaan dapat mengajukan usulan kepada Pejabat Berwenang untuk melanjutkan proses Pemilihan Langsung ke tahap berikutnya.","l":624,"h":340},{"m":"h.","t":"Atas persetujuan Pejabat Berwenang, Pelaksana Pengadaan melanjutkan proses Pemilihan Langsung sepanjang Peserta yang memasukkan surat penawaran telah memenuhi syarat teknis.","l":624,"h":340},{"m":"i.","t":"Setiap pemasukan Dokumen Penawaran dilakukan pada waktu yang telah ditentukan dan dilakukan secara bersama-sama.","l":624,"h":340},{"m":"j.","t":"Peserta Pemilihan Langsung tidak diperkenankan memasukkan Dokumen Penawaran sebelum waktu ataupun setelah melewati batas waktu yang telah ditentukan.","l":624,"h":340},{"m":"k.","t":"Apabila Peserta memasukkan Dokumen Penawaran pada waktu sebelum ataupun setelah melewati batas waktu yang telah ditentukan, maka Pelaksana Pengadaan wajib untuk menolak Dokumen Penawaran tersebut dan Peserta dianggap tidak memasukkan Dokumen Penawaran.","l":624,"h":340},{"m":"l.","t":"Selain menurut ketentuan sebagaimana dimaksud pada huruf c, Dokumen Penawaran tidak dapat diterima apabila dititipkan/diberikan secara pribadi kepada anggota Pelaksana Pengadaan.","l":624,"h":340},{"m":"m.","t":"Peserta yang tidak memasukkan Dokumen Penawaran dinyatakan gugur.","l":624,"h":340},{"m":"n.","t":"Pelaksana Pengadaan wajib membuat Berita Acara Pemasukan Dokumen Penawaran dan ditandatangani oleh Pelaksana Pengadaan dan sekurang-kurangnya dari 2 (dua) Peserta yang disepakati oleh seluruh Peserta yang hadir.","l":624,"h":340},{"m":"3.3.7.","t":"Pembukaan Dokumen Penawaran Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Pembukaan Dokumen Penawaran dapat dilakukan sesuai dengan sistem pemasukan yang ditetapkan dalam Pemilihan Langsung, dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Satu Tahap Satu Sampul.","l":908,"h":340},{"t":"Pembukaan Dokumen Penawaran dengan sistem satu tahap satu sampul dilakukan sekaligus yang dilaksanakan selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan Dokumen Penawaran.","l":908},{"m":"2.","t":"Satu Tahap Dua Sampul.","l":908,"h":340},{"t":"Pembukaan Dokumen Penawaran dengan sistem satu tahap dua sampul dilakukan secara bertahap, yaitu pertama sampul satu yang berisi persyaratan teknis dibuka selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan Dokumen Penawaran dan selanjutnya sampul dua yang berisi penawaran harga dibuka hanya untuk Peserta yang telah dinyatakan memenuhi persyaratan teknis.","l":908},{"m":"b.","t":"Ketentuan mengenai mekanisme pembukaan Dokumen Penawaran harus disampaikan kepada Peserta atau dituangkan dalam Rencana Kerja dan Syarat (RKS).","l":624,"h":340},{"m":"c.","t":"Untuk Pemilihan Langsung dengan sistem satu tahap satu sampul, proses pembukaan Dokumen Penawaran (teknis dan harga) dilakukan secara tertutup oleh Pelaksana Pengadaan.","l":624,"h":340},{"m":"d.","t":"Untuk Pemilihan Langsung dengan sistem satu tahap satu sampul, Pelaksana Pengadaan mengundang seluruh Peserta untuk menyampaikan hasil penilaian teknis dan harga secara terbuka.","l":624,"h":340},{"m":"e.","t":"Pemilihan Langsung dengan sistem satu tahap satu sampul, hasil pembukaan Dokumen Penawaran dituangkan dalam Berita Acara yang ditandatangani oleh Pelaksana Pengadaan dan seluruh Peserta yang hadir.","l":624,"h":340},{"m":"f.","t":"Untuk Pemilihan Langsung dengan sistem satu tahap dua sampul, proses pembukaan Dokumen Penawaran sampul satu (teknis) dilakukan secara tertutup oleh Pelaksana Pengadaan, sedangkan proses pembukaan Dokumen Penawaran sampul dua (harga) dilakukan secara terbuka dihadapan Peserta Pemilihan Langsung.","l":624,"h":340},{"m":"g.","t":"Untuk Pemilihan Langsung dengan sistem satu tahap dua sampul, Pelaksana Pengadaan mengundang seluruh Peserta untuk menyampaikan hasil penilaian sampul satu (teknis) dan melakukan pembukaan penawaran harga sebagaimana sampul dua (harga) terhadap Peserta yang dinyatakan lulus evaluasi teknis secara terbuka.","l":624,"h":340},{"m":"h.","t":"Untuk Pemilihan Langsung dengan sistem satu tahap dua sampul, hasil pembukaan sampul satu (teknis) dituangkan dalam Berita Acara yang ditandatangani oleh Pelaksana Pengadaan dan pembukaan sampul dua (harga) ditandatangani oleh Pelaksana Pengadaan dan seluruh Peserta yang hadir.","l":624,"h":340},{"m":"i.","t":"Apabila terjadi penundaan acara penyerahan maupun pembukaan Dokumen Penawaran, maka harus diberitahukan secara tertulis kepada seluruh Peserta yang memasukkan penawaran.","l":624,"h":340},{"m":"3.3.8.","t":"Evaluasi/Penilaian Dokumen Penawaran Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Batas waktu pelaksanaan evaluasi/penilaian Dokumen Penawaran antara lain sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Evaluasi terhadap dokumen Pemilihan Langsung (teknis dan harga) dilakukan selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan sampul, apabila Pemilihan Langsung dilaksanakan dengan metode satu tahap satu sampul.","l":908,"h":340},{"m":"2.","t":"Evaluasi terhadap dokumen Pemilihan Langsung sampul satu (teknis) dilakukan selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan sampul dan evaluasi terhadap dokumen sampul dua (harga) dilakukan selambat-lambatnya 3 (tiga) hari kerja setelah evaluasi sampul satu (teknis) selesai, apabila Pemilihan Langsung dilaksanakan dengan metode satu tahap dua sampul.","l":908,"h":340},{"m":"b.","t":"Evaluasi/penilaian Dokumen Penawaran dapat dilakukan sesuai dengan sistem pemasukan yang ditetapkan dalam Pemilihan Langsung, yaitu sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Sistem Gugur","l":908,"h":340},{"m":"a)","t":"Sistem gugur dilakukan untuk Pengadaan Barang dan/atau Jasa yang menggunakan metode penyampaian satu tahap dua sampul.","l":1192,"h":340},{"m":"b)","t":"Dalam proses Pemilihan Langsung dengan menggunakan sistem gugur tidak diwajibkan Negosiasi, sehingga Peserta dengan penawaran harga terendah yang wajar dapat diusulkan sebagai pemenang.","l":1192,"h":340},{"m":"c)","t":"Apabila akan dilakukan Negosiasi, maka Negosiasi dilakukan kepada Peserta dengan harga terendah wajar yang telah dinyatakan memenuhi syarat teknis, hasil Negosiasi tidak boleh melebihi pagu anggaran.","l":1192,"h":340},{"m":"d)","t":"Hasil Negosiasi dituangkan dalam Berita Acara Negosiasi yang ditandatangani oleh Pelaksana Pengadaan dan wakil dari Penyedia Barang dan/atau Jasa.","l":1192,"h":340},{"m":"2.","t":"Sistem Nilai","l":908,"h":340},{"m":"a)","t":"Sistem nilai dilakukan untuk Pengadaan Barang dan/atau Jasa yang menggunakan metode penyampaian satu tahap satu sampul.","l":1192,"h":340},{"m":"b)","t":"Evaluasi/Penilaian Dokumen Penawaran dengan sistem nilai, penilaian terhadap syarat teknis dan harga dilakukan secara kumulatif dan Peserta yang meraih nilai tertinggi yang akan dipilih sebagai pemenang, sehingga dalam sistem ini penilaian terhadap harga memiliki pengaruh dalam penilaian secara keseluruhan.","l":1192,"h":340},{"m":"c)","t":"Dalam proses Pemilihan Langsung dengan menggunakan sistem nilai diwajibkan untuk dilakukan Negosiasi.","l":1192,"h":340},{"m":"d)","t":"Negosiasi dilakukan kepada Peserta yang memperoleh nilai tertinggi.","l":1192,"h":340},{"m":"e)","t":"Hasil Negosiasi tidak boleh melebihi pagu anggaran dan hasil Negosiasi dituangkan dalam Berita Acara yang ditandatangani oleh Pelaksana Pengadaan dan wakil dari Penyedia Barang dan/atau Jasa.","l":1192,"h":340},{"m":"f)","t":"Sistem nilai dilakukan dengan ketentuan sebagai berikut:","l":1192,"h":340},{"m":"1)","t":"besaran bobot teknis minimal 60% (enam puluh persen) dari total bobot keseluruhan dan besaran bobot harga ditentukan maksimal 40% (empat puluh persen);","l":1476,"h":340},{"m":"2)","t":"unsur yang dinilai harus yang bersifat kuantitaif atau yang dapat dikuantitatifkan;","l":1476,"h":340},{"m":"3)","t":"dilakukan evaluasi terhadap persyaratan teknis dengan terlebih dahulu menetapkan batas kelulusan (passing grade);","l":1476,"h":340},{"m":"4)","t":"Peserta yang tidak memenuhi syarat teknis dan/atau harga yang ditawarkan tidak wajar tidak akan dinilai; dan","l":1476,"h":340},{"m":"5)","t":"Tata cara dan kriteria penilaian harus dicantumkan dengan jelas dan rinci dalam Rencana Kerja dan Syarat (RKS).","l":1476,"h":340},{"m":"c.","t":"Evaluasi/penilaian Dokumen Penawaran dengan sistem satu tahap dua sampul dilakukan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Dilakukan evaluasi teknis atau evaluasi terhadap persyaratan teknis dengan terlebih dahulu menetapkan batas kelulusan (passing grade).","l":908,"h":340},{"m":"2.","t":"Peserta yang memenuhi syarat teknis dilanjutkan pada evaluasi/penilaian harga atau sampul dua (harga).","l":908,"h":340},{"m":"3.","t":"Pelaksana Pengadaan melakukan evaluasi harga dilihat dari kewajarannya dengan mengacu pada Harga Perkiraan Sendiri (HPS).","l":908,"h":340},{"m":"4.","t":"Harga yang terendah dan dinilai wajar diusulkan untuk ditetapkan sebagai pemenang.","l":908,"h":340},{"m":"d.","t":"Evaluasi teknis dilakukan terhadap unsur-unsur antara lain:","l":624,"h":340},{"m":"1.","t":"Pengadaan Barang:","l":908,"h":340},{"m":"a)","t":"Identitas/spesifikasi dan kualitas barang.","l":1192,"h":340},{"m":"b)","t":"Jadwal waktu penyerahan/pengiriman barang.","l":1192,"h":340},{"m":"c)","t":"Pelayanan purna jual.","l":1192,"h":340},{"m":"2.","t":"Pengadaan Jasa:","l":908,"h":340},{"m":"a)","t":"Jadwal waktu pelaksanaan pekerjaan.","l":1192,"h":340},{"m":"b)","t":"Jenis, kapasitas, komposisi dan jumlah peralatan yang disediakan.","l":1192,"h":340},{"m":"c)","t":"Personel inti yang digunakan dalam pelaksanaan pekerjaan.","l":1192,"h":340},{"m":"e.","t":"Apabila di dalam evaluasi teknis terdapat hal-hal yang dianggap kurang dan atau tidak jelas/meragukan, untuk meyakinkan kebenaran dokumen yang disampaikan, Pelaksana Pengadaan dapat melakukan klarifikasi dan konfirmasi kepada Peserta Pemilihan Langsung yang dilaksanakan, termasuk mengadakan pemeriksaan barang di pabrik dan lokasi pelaksanaan pekerjaan.","l":624,"h":340},{"m":"f.","t":"Klarifikasi sebagaimana dimaksud pada huruf e dilaksanakan selambat-lambatnya 2 (dua) hari kerja setelah evaluasi dokumen Pemilihan Langsung.","l":624,"h":340},{"m":"g.","t":"Hasil evaluasi teknis dan klarifikasi yang dilakukan tidak boleh menambah, merubah, atau mengurangi isi dari surat penawaran Peserta dan kemudian dituangkan dalam Berita Acara Evaluasi Teknis dan Klarifikasi.","l":624,"h":340},{"m":"h.","t":"Berita Acara Evaluasi dan Klarifikasi ditandatangani oleh Pelaksana Pengadaan dan pihak Peserta Pemilihan Langsung.","l":624,"h":340},{"m":"i.","t":"Evaluasi/Penilaian dan Klarifikasi harga dilakukan untuk hal-hal antara lain:","l":624,"h":340},{"m":"1.","t":"Untuk Barang dan/atau Jasa dengan spesifikasi yang kompleks yang membutuhkan rincian harga; dan/atau","l":908,"h":340},{"m":"2.","t":"Harga jauh di atas/di bawah 20% (dua puluh persen) dari Harga Perkiraan Sendiri (HPS) yang telah ditetapkan.","l":908,"h":340},{"m":"3.3.10.","t":"Hasil Pemilihan Langsung","l":630,"h":630},{"m":"a.","t":"Setelah Pelaksana Pengadaan menyelesaikan seluruh tahapan proses Pemilihan Langsung dan setelah kesepakatan harga dengan Peserta tercapai, maka Pelaksana Pengadaan menyusun Berita Acara Hasil Pemilihan Langsung (BAHPL).","l":624,"h":340},{"m":"b.","t":"Materi yang dituangkan dalam Berita Acara Hasil Pemilihan Langsung (BAHPL) sekurang-kurangnya terdiri dari:","l":624,"h":340},{"m":"1.","t":"Peserta yang diundang, mendaftar Pemilihan Langsung dan mengikuti penjelasan umum (aanwijzing).","l":908,"h":340},{"m":"2.","t":"Hasil pemasukan surat penawaran.","l":908,"h":340},{"m":"3.","t":"Hasil evaluasi / penilaian teknis.","l":908,"h":340},{"m":"4.","t":"Hasil pembukaan surat penawaran harga.","l":908,"h":340},{"m":"5.","t":"Hasil Negosiasi.","l":908,"h":340},{"m":"6.","t":"Usulan penetapan calon pemenang.","l":908,"h":340},{"m":"c.","t":"Dalam hal Pemilihan Langsung dengan Nilai Pengadaan di atas kewenangan Kantor Cabang dilimpahkan pelaksanaannya ke Kantor Cabang HUB, maka setelah Panitia Pengadaan Kantor Cabang menyelesaikan seluruh tahapan proses Pemilihan Langsung, Panitia Pengadaan Kantor Cabang melaporkan hasil Pengadaan ke Executive General Manager (EGM).","l":624,"h":340},{"m":"d.","t":"Berdasarkan laporan Panitia Pengadaan Kantor Cabang, Executive General Manager (EGM) mengajukan usulan penetapan pemenang ke Pejabat Berwenang dengan melampirkan dokumen sebagaimana dimaksud pada huruf b.","l":624,"h":340},{"m":"e.","t":"Hasil Pemilihan Langsung diusulkan kepada Pejabat Berwenang untuk disetujui dan ditetapkan pemenangnya.","l":624,"h":340},{"m":"3.3.11.","t":"Penetapan Pemenang Pemilihan Langsung","l":630,"h":630},{"m":"a.","t":"Usulan calon pemenang Pemilihan Langsung dilakukan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Peserta dengan harga penawaran terendah pada sistem gugur.","l":908,"h":340},{"m":"2.","t":"Peserta dengan nilai tertinggi pada sistem nilai.","l":908,"h":340},{"m":"3.","t":"Terdapat 2 (dua) atau lebih harga penawaran terendah yang sama, maka Panitia Pengadaan dapat memilih Peserta yang memiliki nilai evaluasi teknis tertinggi.","l":908,"h":340},{"m":"b.","t":"Usulan penetapan calon pemenang Pemilihan Langsung selambat-lambatnya dilaksanakan:","l":624,"h":340},{"m":"1.","t":"3 (tiga) hari kerja sejak evaluasi teknis dan harga atau klarifikasi/Negosiasi apabila Pemilihan Langsung dilakukan dengan metode satu tahap satu sampul.","l":908,"h":340},{"m":"2.","t":"3 (tiga) hari kerja sejak pembukaan sampul dua (harga)/evaluasi harga apabila Pemilihan Langsung dilakukan dengan metode satu tahap dua sampul.","l":908,"h":340},{"m":"c.","t":"Setelah proses Pemilihan Langsung selesai, Kepala Unit Pelaksana Pengadaan/Panitia Pengadaan mengajukan usulan penetapan calon pemenang Pemilihan Langsung kepada Pejabat Berwenang sesuai dengan kewenangannya, dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Kantor Pusat","l":908,"h":340},{"m":"a)","t":"Nilai Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Kerja Pengadaan.","l":1192,"h":340},{"m":"b)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"c)","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Utama secara bersama sama dengan Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"2.","t":"Kantor Cabang","l":908,"h":340},{"m":"a)","t":"Nilai Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah) s.d. batas kewenangan Kantor Cabang dilakukan oleh Pejabat Berwenang Kantor Cabang.","l":1192,"h":340},{"m":"b)","t":"Nilai Pengadaan di atas batas kewenangan Kantor Cabang s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Kerja Pengadaan.","l":1192,"h":340},{"m":"c)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"d)","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Utama secara bersama sama dengan Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"d.","t":"Usulan penetapan calon pemenang Pemilihan Langsung sekurang-kurangnya memuat informasi:","l":624,"h":340},{"m":"1.","t":"Nama perusahaan Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"2.","t":"Alamat perusahaan.","l":908,"h":340},{"m":"3.","t":"Nama pekerjaan yang akan dilaksanakan.","l":908,"h":340},{"m":"4.","t":"Jumlah total harga penawaran.","l":908,"h":340},{"m":"5.","t":"Jangka waktu pelaksanaan Pengadaan.","l":908,"h":340},{"m":"6.","t":"Lokasi pelaksanaan pekerjaan.","l":908,"h":340},{"m":"e.","t":"Dalam proses penetapan pemenang Pemilihan Langsung tidak diberikan masa sanggah.","l":624,"h":340},{"m":"f.","t":"Bagi Peserta yang ditetapkan sebagai pemenang Pemilihan Langsung kemudian mengundurkan dengan alasan apapun, maka terhadap Peserta yang bersangkutan diberikan sanksi sesuai ketentuan yang berlaku.","l":624,"h":340},{"m":"3.3.12.","t":"Pengumuman Pemenang Pemilihan Langsung","l":630,"h":630},{"m":"a.","t":"Untuk Pengadaan Barang dan/atau Jasa yang Nilai Pengadaannya lebih dari Rp1.500.000.000 (satu miliar lima ratus juta rupiah), setelah usulan pemenang disetujui dan ditetapkan, pemenang Pemilihan Langsung wajib diumumkan dan diberitahukan oleh Panitia Pengadaan kepada para Peserta Pemilihan Langsung selambat-lambatnya 2 (dua) hari kerja dari tanggal penetapan pemenang oleh Pejabat Berwenang.","l":624,"h":340},{"m":"b.","t":"Untuk Pengadaan Barang dan/atau Jasa yang Nilai Pengadaannya sampai dengan Rp1.500.000.000 (satu miliar lima ratus juta rupiah) tidak wajib diumumkan oleh Pelaksana Pengadaan.","l":624,"h":340},{"m":"c.","t":"Pelaksana Pengadaan kemudian menyiapkan Surat Perintah Kerja (SPK) yang akan diberikan kepada pemenang sebagai dasar pelaksanaan pekerjaan.","l":624,"h":340},{"m":"d.","t":"Surat Perintah Kerja (SPK) sekurang-kurangnya memuat informasi sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Nama Penyedia Barang dan/atau Jasa;","l":908,"h":340},{"m":"2.","t":"Alamat Penyedia Barang dan/atau Jasa;","l":908,"h":340},{"m":"3.","t":"Nama pekerjaan yang akan dilaksanakan;","l":908,"h":340},{"m":"4.","t":"Harga Barang dan/atau Jasa;","l":908,"h":340},{"m":"5.","t":"Cara pembayaran;","l":908,"h":340},{"m":"6.","t":"Waktu pengiriman/pelaksanaan pekerjaan; dan","l":908,"h":340},{"m":"7.","t":"Lokasi pengiriman/pelaksanaan pekerjaan.","l":908,"h":340},{"m":"e.","t":"Surat Perintah Kerja (SPK) sebagaimana dimaksud pada huruf c ditandatangani oleh Pejabat Berwenang dan pelaksana pekerjaan.","l":624,"h":340},{"m":"f.","t":"Setelah menyampaikan Surat Perintah Kerja (SPK), Pelaksana Pengadaan menyerahkan seluruh dokumen Pemilihan Langsung kepada unit yang membidangi Perjanjian.","l":624,"h":340},{"m":"3.3.14.","t":"Dokumen Pemilihan Langsung","l":630,"h":630},{"m":"a.","t":"Dokumen Pemilihan Langsung terdiri dari:","l":624,"h":340},{"m":"2.","t":"Surat Permintaan Pengadaan (SPP);","l":908,"h":340},{"m":"3.","t":"Harga Perkiraan Sendiri (HPS);","l":908,"h":340},{"m":"4.","t":"Rencana Kerja dan Syarat (RKS) berikut perubahannya;","l":908,"h":340},{"m":"5.","t":"Undangan Pemilihan Langsung;","l":908,"h":340},{"m":"6.","t":"Form-form yang diperlukan (misal: daftar hadir, dll);","l":908,"h":340},{"m":"7.","t":"Seluruh Berita Acara tahapan Pemilihan Langsung beserta lampirannya, antara lain namun tidak terbatas pada:","l":908,"h":340},{"m":"a)","t":"Berita Acara Penjelasan;","l":1192,"h":340},{"m":"b)","t":"Berita Acara Pemasukan Surat Penawaran Harga;","l":1192,"h":340},{"m":"c)","t":"Berita Acara Evaluasi Teknis;","l":1192,"h":340},{"m":"d)","t":"Berita Acara Klarifikasi;","l":1192,"h":340},{"m":"e)","t":"Berita Acara Pembukaan Harga;","l":1192,"h":340},{"m":"f)","t":"Berita Acara Negosiasi (dengan memperhatikan ketentuan butir 3.3.8 huruf b angka 1 poin b); dan","l":1192,"h":340},{"m":"g)","t":"Berita Acara Hasil Pemilihan Langsung.","l":1192,"h":340},{"m":"8.","t":"Berkas administrasi Peserta Pemilihan Langsung;","l":908,"h":340},{"m":"9.","t":"Surat penawaran harga Peserta Pemilihan Langsung; dan","l":908,"h":340},{"m":"10.","t":"Hal-hal lain yang berkaitan dengan Pemilihan Langsung dan perlu didokumentasikan.","l":908,"h":340},{"m":"b.","t":"Seluruh dokumen Pemilihan Langsung sebagaimana dimakusd pada huruf a dijadikan 1 (satu) dan disimpan oleh Unit Kerja Pengadaan.","l":624,"h":340},{"c":"[BAB 3 angka 3.3.1-3.3.4, 3.3.6-3.3.8, 3.3.10-3.3.12, 3.3.14]"}],[{"t":"TENDER/SELEKSI TERBATAS"},{"m":"1.","t":"Tender Terbatas adalah Pengadaan Barang yang ditawarkan kepada penyedia barang yang terdaftar di VMS dengan sekurang-kurangnya 2 (dua) penyedia barang;","l":340,"h":340},{"m":"2.","t":"Seleksi Terbatas adalah Pengadaan Jasa yang ditawarkan kepada penyedia barang yang terdaftar di VMS dengan sekurang-kurangnya 2 (dua) penyedia jasa;","l":340,"h":340},{"m":"3.","t":"Tender/Seleksi Terbatas dilaksanakan dalam hal:","l":340,"h":340},{"m":"a.","t":"Spesifikasi dan volume pekerjaannya sudah ditentukan secara rinci; dan","l":624,"h":340},{"m":"b.","t":"Calon Penyedia Barang dan/atau Jasa telah terkualifikasi dalam VMS Perusahaan sehingga tidak diperlukan lagi Prakualifikasi.","l":624,"h":340},{"m":"4.","t":"Pemenang Tender/Seleksi Terbatas dipilih atas harga terendah atau penilaian penawaran terbaik melalui evaluasi penawaran dan dilanjutkan dengan negosiasi harga;","l":340,"h":340},{"m":"5.","t":"Metode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode tender/seleksi terbatas adalah secara non tunai;","l":340,"h":340},{"m":"6.","t":"Tender/Seleksi terbatas dinyatakan gagal oleh Unit Pengadaan, apabila:","l":340,"h":340},{"m":"a.","t":"jumlah Penyedia Barang dan/atau Jasa yang memasukkan penawaran kurang dari 2 (dua) peserta; atau","l":624,"h":340},{"m":"b.","t":"tidak ada penawaran yang memenuhi persyaratan administrasi dan teknis; atau","l":624,"h":340},{"m":"c.","t":"harga penawaran terendah melebihi HPS sebelum tahap Negosiasi dan Klarifikasi.","l":624,"h":340},{"m":"7.","t":"Tender/Seleksi terbatas dinyatakan gagal oleh Direksi, apabila :","l":340,"h":340},{"m":"a.","t":"sanggahan dari Penyedia Barang dan/atau Jasa ternyata benar;","l":624,"h":340},{"m":"b.","t":"pelaksanaan Tender/Seleksi terbatas tidak sesuai atau menyimpang dari dokumen pemilihan yang telah ditetapkan; atau","l":624,"h":340},{"m":"c.","t":"ditemukan adanya ketidakpatutan dalam proses pelaksanaan Pengadaan Barang dan/atau Jasa oleh pejabat Pengadaan dan/atau penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"8.","t":"Apabila Tender/Seleksi terbatas dinyatakan gagal, maka Unit Pengadaan segera melakukan Tender/Seleksi terbatas ulang;","l":340,"h":340},{"m":"9.","t":"Apabila dalam Tender/Seleksi terbatas ulang ini jumlah yang memasukkan penawaran hanya 1 (satu) peserta, maka dilakukan Penunjukan Langsung sesuai dengan prosedur Penunjukan Langsung.","l":340,"h":340},{"c":"[BAB V.E]"},{"t":"JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"},{"m":"2.","t":"Jadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode Tender/Seleksi Terbatas meliputi:","l":340,"h":340},{"m":"a.","t":"penyampaian surat undangan kepada peserta terpilih Penyedia Barang dan/atau Jasa yang terdapat dalam VMS perusahaan sekurang­kurangnya 2 (dua) penawaran;","l":624,"h":340},{"m":"b.","t":"pendaftaran, pengambilan dan pengiriman dokumen Tender/Seleksi Terbatas dilakukan selambat­ lambatnya 2 (dua) hari setelah dikeluarkannya surat undangan;","l":624,"h":340},{"m":"c.","t":"jika diperlukan, penjelasan (aanwijzing) dapat dilaksanakan selambat­lambatnya 2 (dua) hari sejak tanggal terakhir pengambilan dokumen dan proses pelaksanaannya dituangkan dalam Berita Acara Aanwijzing yang ditanda tangani Unit Pengadaan dan calon peserta Tender/Seleksi Terbatas;","l":624,"h":340},{"m":"d.","t":"penyampaian dokumen penawaran dilaksanakan selambat­lambatnya 2 (dua) hari setelah penjelasan (aanwijzing);","l":624,"h":340},{"m":"e.","t":"pembukaan dokumen penawaran dilaksanakan selambat­lambatnya 2 (dua) hari setelah penutupan pemasukan dokumen dan proses pelaksanaannya dituangkan dalam Berita Acara Pembukaan Penawaran yang ditanda tangani Unit Pengadaan dan dilanjutkan dengan evaluasi dokumen dan evaluasi penawaran;","l":624,"h":340},{"m":"f.","t":"klarifikasi serta negosiasi dilaksanakan selambat­ lambatnya 2 (dua) hari setelah adanya hasil evaluasi penawaran dan proses pelaksanaannya dituangkan dalam Berita Acara Klarifikasi dan Negosiasi yang ditanda tangani oleh Unit Pengadaan dan calon Penyedia Barang dan/atau Jasa sesuai peringkat hasil evaluasi;","l":624,"h":340},{"m":"g.","t":"usulan calon pemenang Tender/Seleksi Terbatas dari Unit Pengadaan kepada Unit Pengguna/ Pemohon dilakukan selambat­ lambatnya 2 (dua) hari setelah klarifikasi serta negosiasi disertai dengan draft Surat Penetapan Penyedia Barang dan/atau Jasa untuk ditandatangani oleh Unit Pengguna;","l":624,"h":340},{"m":"h.","t":"penerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa dilakukan oleh Pejabat Pemohon sesuai Batas Kewenangan selambat- lambatnya 2 (dua) hari;","l":624,"h":340},{"m":"i.","t":"penerbitan surat Perjanjian Pengadaan dilakukan selambat-lambatnya 2 (dua) hari setelah diterbitkannya surat keputusan penetapan Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"c":"[BAB VII.B angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"D. TENDER/SELEKSI UMUM","rows":[{"topik":"TENDER/SELEKSI UMUM","cells":[[{"t":"TENDER/SELEKSI UMUM"},{"m":"1.","t":"Tender/Seleksi Umum yaitu PBJ yang diumumkan secara luas melalui website Perusahaan dan/atau media massa guna memberi kesempatan kepada masyarakat luas atau dunia usaha yang berminat dan memenuhi kualifikasi untuk mengikuti Tender/Seleksi Umum.","l":340,"h":340},{"m":"2.","t":"Tender/Seleksi umum dilaksanakan oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat dengan melibatkan Unit Bisnis atau Unit Teknis.","l":340,"h":340},{"m":"3.","t":"Tata Cara PBJ melalui Metode Tender/Seleksi Umum akan diatur dalam Peraturan tersendiri.","l":340,"h":340},{"c":"[BAB IV.D]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PELELANGAN"},{"m":"3.4.1.","t":"Ketentuan Umum Pelelangan","l":540,"h":540},{"m":"a.","t":"Pelelangan dilakukan dengan cara menyeleksi sekurang-kurangnya 5 (lima) Penyedia Barang dan/atau Jasa dengan cara membandingkan baik kualitas maupun harga yang ditawarkan oleh Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"b.","t":"Barang dan/atau Jasa yang dapat dilaksanakan pengadaannya dengan Pelelangan adalah Barang dan/atau Jasa umum dengan Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":624,"h":340},{"m":"c.","t":"Peserta yang diundang dalam proses Pelelangan adalah Penyedia barang dan/atau Jasa yang telah memenuhi persyaratan yang ditetapkan, baik Perusahaan yang telah terdaftar maupun belum terdaftar sebagai Rekanan di Perusahaan.","l":624,"h":340},{"m":"d.","t":"Penyedia Barang dan/atau Jasa yang dapat menjadi Peserta dalam Pelelangan Barang dan/atau Jasa adalah badan usaha.","l":624,"h":340},{"m":"e.","t":"Pelaksana Pengadaan yang berwenang melakukan Pelelangan untuk Barang dan/atau Jasa adalah Panitia Pengadaan.","l":624,"h":340},{"m":"3.4.2.","t":"Tata Cara Pelelangan","l":540,"h":540},{"m":"a.","t":"Pelelangan dapat dilakukan dengan 2 (dua) cara, yaitu:","l":624,"h":340},{"m":"1.","t":"Pelelangan terbatas, yaitu apabila keikutsertaan Peserta dalam Pelelangan didasarkan pada undangan Pelelangan; atau","l":908,"h":340},{"m":"2.","t":"Pelelangan umum, yaitu apabila keikutsertaan Peserta dalam Pelelangan didasarkan pada pengumuman Pelelangan.","l":908,"h":340},{"m":"b.","t":"Dalam Pelelangan terbatas yang didasarkan pada undangan hanya dapat dilaksanakan oleh Penyedia Barang dan/atau Jasa yang telah terdaftar sebagai Rekanan Perusahaan;","l":624,"h":340},{"m":"c.","t":"Dalam Pelelangan umum yang didasarkan pada pengumuman dapat dilaksanakan oleh Penyedia Barang dan/atau Jasa baik yang sudah terdaftar sebagai Rekanan maupun yang belum terdaftar sebagai Rekanan.","l":624,"h":340},{"m":"d.","t":"Setelah menerima Surat Permintaan Pengadaan (SPP), Panitia Pengadaan mengumpulkan data mengenai Spesifikasi Teknis atas Barang dan/atau Jasa yang akan diadakan, mencari informasi harga pasar dan data dukung lainnya yang dapat dipergunakan sebagai dasar penyusunan Rencana Kerja dan Syarat (RKS) dan Harga Perkiraan Sendiri (HPS).","l":624,"h":340},{"m":"e.","t":"Setelah data dukung yang diperlukan cukup lengkap, Panitia Pengadaan menyusun Harga Perkiraan Sendiri (HPS) dan meminta persetujuan Pejabat Berwenang.","l":624,"h":340},{"m":"f.","t":"Panitia Pengadaan mempersiapkan Rencana Kerja dan Syarat (RKS) Pelelangan selambat-lambatnya 1 (satu) hari kerja sebelum Pelelangan diumumkan atau diberikannya undangan kepada Penyedia Barag dan/atau Jasa.","l":624,"h":340},{"m":"g.","t":"Untuk menetapkan Rencana Kerja dan Syarat (RKS) dalam Pelelangan, Panitia Pengadaan menetapkan syarat adminisitrasi yang wajib dipenuhi oleh Peserta Pelelangan, melakukan koordinasi dengan Unit Spesifikasi Teknis (UST) dan Unit Pengguna (User) untuk menetapkan Spesifikasi Teknis Barang dan/atau Jasa yang dibutuhkan, termasuk engineering specification, approval specification, gambar-gambar, uraian rinci pekerjaan dan hal-hal lain yang diperlukan.","l":624,"h":340},{"m":"h.","t":"Sebelum Rencana Kerja dan Syarat (RKS) disampaikan kepada Peserta Pelelangan, Rencana Kerja dan Syarat (RKS) tersebut terlebih dahulu harus ditandatangani oleh seluruh anggota Panitia Pengadaan.","l":624,"h":340},{"m":"i.","t":"Setelah Rencana Kerja dan Syarat (RKS) ditandatangani, Panitia Pengadaan melakukan pengecekan terhadap dokumen administrasi Penyedia Barang dan/atau Jasa, yang terdiri dari:","l":624,"h":340},{"m":"1.","t":"Salinan Akta pendirian beserta SK Kemenkumham;","l":908,"h":340},{"m":"2.","t":"Salinan Akta perubahan terakhir Anggaran Dasar, Akta perubahan susunan terakhir anggota Direksi dan Dewan Komisaris dan Akta perubahan modal dan/atau peralihan saham terakhir beserta SK Kemenkumham;","l":908,"h":340},{"m":"3.","t":"Salinan Nomor Induk Berusaha (NIB) beserta Klasifikasi Baku Lapangan Usaha Indonesia (KBLI);","l":908,"h":340},{"m":"4.","t":"Salinan Nomor Pokok Wajib Pajak (NPWP);","l":908,"h":340},{"m":"5.","t":"Salinan KTP/KITAS/KITAP/ITAS/ITAP/KIMS dari pengurus perusahaan atau dokumen serupa lainnya sesuai ketentuan peraturan perundang-undangan yang berlaku di Republik Indonesia;","l":908,"h":340},{"m":"6.","t":"Salinan Konfirmasi Kesesuaian Kegiatan Pemanfaatan Ruang (KKKPR)/ Persetujuan Kesesuaian Kegiatan Pemanfaatan Ruang (PKKPR)/Surat Pernyataan Usaha Mikro atau Usaha Kecil Terkait Tata Ruang;","l":908,"h":340},{"m":"7.","t":"Salinan Surat Pengukuhan Pengusaha Kena Pajak (SPPKP) dan Surat Keterangan Terdaftar (SKT) pajak/surat pernyataan resmi non Pengusaha Kena Pajak (PKP);","l":908,"h":340},{"m":"8.","t":"Laporan Keuangan/Neraca dan Laba Rugi Perusahaan tahun terakhir diutamakan yang telah diaudit Kantor Akuntan Publik (KAP);","l":908,"h":340},{"m":"9.","t":"Salinan surat referensi dari bank pemerintah;","l":908,"h":340},{"m":"10.","t":"Salinan bukti kepatuhan dalam pemenuhan ketentuan perpajakan yang berlaku, berupa Bukti lapor SPT (PPN dan PPh); dan","l":908,"h":340},{"m":"11.","t":"Syarat-syarat lain yang ditetapkan oleh Perusahaan/Pelaksana Pengadaan sesuai kebutuhan dan/atau sesuai ketentuan peraturan perundang-undangan yang berlaku (Sertifikat Tingkat Komponen Dalam Negeri (TKDN), Surat Izin Operasional BUJP, Perizinan Berusaha Untuk Menunjang Kegiatan Usaha (PB UMKU), Sertifikat Badan Usaha (SBU)/Surat Pernyataan Resmi tidak memiliki Sertifikat Badan Usaha (SBU) dan lain-lain).","l":908,"h":340},{"m":"j.","t":"Dalam hal Pelelangan akan dilaksanakan di Kantor Cabang maka dalam proses penyusunan Rencana Kerja dan Syarat (RKS), Panitia Pengadaan Kantor Cabang melakukan koordinasi dengan unit terkait di Kantor Pusat.","l":624,"h":340},{"m":"k.","t":"Pelelangan dapat dilakukan secara elektronik (email/e-letter/website/conference call melalui aplikasi yang ditetapkan oleh Unit IT).","l":624,"h":340},{"m":"3.4.3.","t":"Undangan dan Pengumuman Pelelangan","l":540,"h":540},{"m":"a.","t":"Setelah dilakukan pengecekan dokumen administrasi dan memenuhi persyaratan sekurang-kurangnya 5 (lima) Penyedia Barang dan/atau Jasa, Panitia Pengadaan menyiapkan surat undangan.","l":624,"h":340},{"m":"b.","t":"Undangan dalam Pelelangan Terbatas:","l":624,"h":340},{"m":"1.","t":"Undangan Pelelangan dilakukan untuk Pelelangan dengan nilai Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) sampai dengan Rp50.000.000.000,- (lima puluh miliar rupiah).","l":908,"h":340},{"m":"2.","t":"Surat Undangan ditandatangani oleh ketua Panitia Pengadaan.","l":908,"h":340},{"m":"3.","t":"Undangan diberikan kepada perusahaan-perusahaan yang dianggap mampu untuk memenuhi kebutuhan perusahaan terhadap Barang dan/atau Jasa yang akan diadakan.","l":908,"h":340},{"m":"4.","t":"Surat undangan diberikan secara tertulis minimal kepada 5 (lima) perusahaan.","l":908,"h":340},{"m":"5.","t":"Dalam menyampaikan undangan, Panitia Pengadaan wajib memastikan bahwa undangan tersebut sudah diterima oleh Peserta yang dibuktikan dengan tanda terima yang ditandatangani oleh pihak Peserta atau bukti email/fax yang sudah terkirim.","l":908,"h":340},{"m":"6.","t":"Undangan sekurang-kurangnya memuat:","l":908,"h":340},{"m":"a)","t":"Jenis Pengadaan Barang dan/atau Jasa yang akan diadakan;","l":1192,"h":340},{"m":"b)","t":"Lokasi kebutuhan Barang dan/atau Jasa;","l":1192,"h":340},{"m":"c)","t":"Waktu pendaftaran (hari, tanggal, bulan, tahun, jam);","l":1192,"h":340},{"m":"d)","t":"Tempat pendaftaran;","l":1192,"h":340},{"m":"7.","t":"Ketidakhadiran/ketidakikutsertaan Peserta yang diundang dan telah menerima undangan dalam proses Pelelangan harus dibuktikan dengan konfirmasi tertulis.","l":908,"h":340},{"m":"8.","t":"Peserta yang tidak hadir tanpa konfirmasi akan dikenai sanksi berupa dimasukkan ke Daftar Hitam (Blacklist) Perusahaan.","l":908,"h":340},{"m":"c.","t":"Pengumuman dalam Pelelangan Umum:","l":624,"h":340},{"m":"1.","t":"Pengumuman Pelelangan dilakukan untuk Pelelangan dengan Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah).","l":908,"h":340},{"m":"2.","t":"Pengumuman Pelelangan dilakukan melalui website Perusahaan/fasilitas lain yang sejenis.","l":908,"h":340},{"m":"3.","t":"Pengumuman Pelelangan ditayangkan sekurang-kurangnya 3 (tiga) hari kerja sebelum pendaftaran dimulai.","l":908,"h":340},{"m":"4.","t":"Pengumuman Pelelangan sekurang-kurangnya memuat:","l":908,"h":340},{"m":"a)","t":"Jenis Pengadaan Barang dan/atau Jasa yang akan diadakan;","l":1192,"h":340},{"m":"b)","t":"Lokasi kebutuhan Barang dan/atau Jasa;","l":1192,"h":340},{"m":"c)","t":"Waktu pendaftaran (hari, tanggal, bulan, tahun, jam);","l":1192,"h":340},{"m":"d)","t":"Tempat pendaftaran;","l":1192,"h":340},{"m":"e)","t":"Syarat dan ketentuan yang harus dipenuhi oleh calon Peserta;","l":1192,"h":340},{"m":"f)","t":"Dokumen yang harus dibawa pada saat pendaftaran; dan","l":1192,"h":340},{"m":"g)","t":"Jaminan Penawaran.","l":1192,"h":340},{"m":"3.4.4.","t":"Pendaftaran Peserta Pelelangan","l":540,"h":540},{"m":"a.","t":"Pendaftaran dilaksanakan dalam waktu 3 (tiga) hari kerja sejak tanggal surat undangan/pengumuman.","l":624,"h":340},{"m":"b.","t":"Peserta yang mendaftar minimal 5 (lima) perusahaan.","l":624,"h":340},{"m":"c.","t":"Pendaftaran Peserta dapat dilakukan oleh wakil Perusahaan dengan menunjukan surat kuasa bermeterai yang ditandatangani oleh Direktur Perusahaan.","l":624,"h":340},{"m":"d.","t":"Rencana Kerja dan Syarat (RKS) dan Pakta Integritas dikirimkan setelah Penyedia Barang dan/atau Jasa melakukan pendaftaran.","l":624,"h":340},{"t":"Pakta Integritas harus diisi dan ditandatangani oleh pimpinan perusahaan masing-masing Peserta.","l":624},{"m":"3.4.6.","t":"Pemasukan Dokumen Penawaran Dalam Pelelangan","l":540,"h":540},{"m":"a.","t":"Setelah penjelasan umum (aanwijzing) dilaksanakan, maka proses Pelelangan dilanjutkan dengan proses pemasukan Dokumen Penawaran.","l":624,"h":340},{"m":"b.","t":"Dalam proses Pelelangan disyaratkan adanya Jaminan Penawaran.","l":624,"h":340},{"m":"c.","t":"Pemasukan Dokumen Penawaran ditetapkan selambat-lambatnya 14 (empat belas) hari kerja setelah penjelasan umum (aanwijzing), namun apabila Barang dan/atau Jasa yang akan diadakan memiliki spesifikasi yang rumit yang memerlukan perhitungan dan membutuhkan waktu cukup lama, maka waktu pemasukan penawaran dapat ditetapkan berdasarkan kesepakatan Peserta pada saat penjelasan.","l":624,"h":340},{"m":"d.","t":"Pemasukan Dokumen Penawaran dapat dilakukan dengan sistem sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Satu Tahap Satu Sampul","l":908,"h":340},{"t":"Pemasukan Dokumen Penawaran dengan sistem satu tahap satu sampul yaitu penyampaian Dokumen Penawaran yang terdiri dari persyaratan administrasi, teknis dan harga dimasukkan dalam 1 (satu) sampul tertutup.","l":908},{"m":"2.","t":"Satu Tahap Dua Sampul","l":908,"h":340},{"t":"Pemasukan surat penawaran dengan sistem satu tahap dua sampul yaitu penyampaian Dokumen Penawaran yang terdiri dari persyaratan administrasi, teknis dan penawaran harga masing-masing dimasukkan ke dalam 1 (satu) sampul tertutup secara terpisah, selanjutnya kedua sampul tersebut, sampul satu (teknis) dan sampul dua (harga) dimasukkan ke dalam satu sampul tertutup dan disampaikan kepada Panitia Pengadaan secara bersamaan pada waktu yang telah ditentukan dalam Rencana Kerja dan Syarat (RKS) dan disepakati bersama dalam penjelasan umum (aanwijzing).","l":908},{"m":"e.","t":"Peserta yang memasukan Dokumen Penawaran dan Peserta yang lulus persyaratan administrasi dan teknis minimal 3 (tiga) perusahaan.","l":624,"h":340},{"m":"f.","t":"Apabila Peserta yang memasukkan Dokumen Penawaran atau Peserta yang lulus evaluasi administrasi dan teknis kurang dari 3 (tiga) Peserta maka Panitia Pengadaan menyatakan Pelelangan gagal dan dilakukan Pelelangan ulang.","l":624,"h":340},{"m":"g.","t":"Apabila dalam Pelelangan ulang, Peserta yang memasukkan penawaran atau yang Peserta yang lulus evaluasi adminisitrasi dan teknis kurang dari 3 (tiga) Peserta, Panitia Pengadaan dapat mengajukan usulan kepada Pejabat Berwenang untuk melanjutkan proses Pelelangan ke tahap berikutnya.","l":624,"h":340},{"m":"h.","t":"Atas persetujuan Pejabat Berwenang, Panitia Pengadaan melanjutkan proses Pelelangan sepanjang Peserta yang memasukkan surat penawaran telah memenuhi syarat administrasi dan teknis.","l":624,"h":340},{"m":"i.","t":"Setiap Pemasukan Dokumen Penawaran dilakukan pada waktu yang telah ditentukan dan dilakukan secara bersama-sama.","l":624,"h":340},{"m":"j.","t":"Peserta Pelelangan tidak diperkenankan memasukkan Dokumen Penawaran sebelum waktu ataupun setelah melewati batas waktu yang telah ditentukan.","l":624,"h":340},{"m":"k.","t":"Apabila Peserta memasukkan Dokumen Penawaran pada waktu sebelum ataupun setelah melewati batas waktu yang telah ditentukan, maka Panitia Pengadaan wajib untuk menolak Dokumen Penawaran tersebut dan Peserta dianggap tidak memasukkan Dokumen Penawaran.","l":624,"h":340},{"m":"l.","t":"Selain menurut ketentuan sebagaimana dimaksud pada huruf c, Dokumen Penawaran tidak dapat diterima apabila dititipkan/diberikan secara pribadi kepada Panitia Pengadaan.","l":624,"h":340},{"m":"m.","t":"Peserta yang tidak memasukkan Dokumen Penawaran dinyatakan gugur.","l":624,"h":340},{"m":"n.","t":"Panitia Pengadaan wajib membuat Berita Acara Pemasukan Surat Penawaran dan ditandatangani oleh anggota Panitia Pengadaan dan wakil dari Peserta yang hadir.","l":624,"h":340},{"m":"o.","t":"Penunjukan wakil Peserta untuk menandatangani Berita Acara harus disepakati oleh seluruh Peserta yang hadir.","l":624,"h":340},{"m":"3.4.8.","t":"Pembukaan Dokumen Penawaran Pelelangan","l":540,"h":540},{"m":"a.","t":"Pembukaan Dokumen Penawaran dapat dilakukan sesuai dengan sistem pemasukan yang ditetapkan dalam Pelelangan, dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Satu Tahap Satu Sampul.","l":908,"h":340},{"t":"Pembukaan Dokumen Penawaran dengan sistem satu tahap satu sampul dilakukan sekaligus yang dilaksanakan selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan Dokumen Penawaran.","l":908},{"m":"2.","t":"Satu Tahap Dua Sampul.","l":908,"h":340},{"t":"Pembukaan Dokumen Penawaran dengan sistem satu tahap dua sampul dilakukan secara bertahap yaitu pertama sampul satu yang berisi persyaratan administrasi dan teknis dibuka paling lambat 3 (tiga) hari kerja setelah pemasukan Dokumen Penawaran dan selanjutnya sampul dua yang berisi penawaran harga dibuka hanya untuk Peser
