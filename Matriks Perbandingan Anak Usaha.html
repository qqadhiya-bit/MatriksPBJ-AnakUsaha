njian;","l":908,"h":340},{"m":"4.","t":"Nama Pekerjaan; dan","l":908,"h":340},{"m":"5.","t":"Pelaksana Pekerjaan.","l":908,"h":340},{"m":"b.","t":"Kalimat pembuka, menjelaskan pada hari, tanggal, bulan dan tahun dalam penandatanganan Perjanjian.","l":624,"h":340},{"m":"c.","t":"Para pihak dalam Perjanjian, menjelaskan identitas para pihak yang menandatangani Perjanjian meliputi, nama, jabatan dan alamat serta kedudukan para pihak/pihak pertama dan pihak kedua (konsideran).","l":624,"h":340},{"m":"d.","t":"Isi Perjanjian, menjelaskan pokok pekerjaan yang diperjanjikan sesuai Rencana Kerja dan Syarat (RKS) dan Spesifikasi Teknis yang meliputi sekurang-kurangnya:","l":624,"h":340},{"m":"1.","t":"Harga yang ditetapkan serta syarat pembayarannya;","l":908,"h":340},{"m":"2.","t":"Jangka waktu penyelesaian/penyerahan pekerjaan, termasuk syarat-syarat penyerahannya;","l":908,"h":340},{"m":"3.","t":"Lokasi penyerahan Barang dan/atau Jasa;","l":908,"h":340},{"m":"4.","t":"Jaminan hasil pekerjaan yang dilaksanakan (warranty);","l":908,"h":340},{"m":"5.","t":"Hak dan kewajiban para pihak;","l":908,"h":340},{"m":"6.","t":"Larangan pengalihan pekerjaan pada pihak lain tanpa pemberitahuan tertulis terlebih dahulu kepada pemberi tugas;","l":908,"h":340},{"m":"7.","t":"Sanksi dalam hal salah Satu pihak tidak memenuhi kewajibannya (denda/ganti rugi);","l":908,"h":340},{"m":"8.","t":"Penyelesaian perselisihan dalam hal salah Satu pihak wan-prestasi dan kedudukan hukum penyelesaian; dan","l":908,"h":340},{"m":"9.","t":"Dan hal lainnya yang dipandang perlu untuk ditetapkan sebagai ketentuan dalam Perjanjian sepanjang tidak bertentangan dengan Rencana Kerja dan Syarat (RKS) dan Spesifikasi Teknis dan ketentuan/peraturan pemerintah yang berlaku.","l":908,"h":340},{"m":"4.1.9.","t":"Setelah penetapan pemenang, Perusahaan akan mengeluarkan Surat Perintah Kerja (SPK) sebagai dasar pelaksanaan pekerjaan yang dikeluarkan selambat-lambatnya 14 (empat belas) hari kerja sejak tanggal penetapan pemenang.","l":540,"h":540},{"m":"4.1.10.","t":"Setelah Surat Perintah Kerja (SPK) dikeluarkan maka untuk selanjutnya akan diterbitkan Perjanjian.","l":630,"h":630},{"c":"[BAB 4 angka 4.1.0]"},{"t":"TATA CARA PENYUSUNAN PERJANJIAN"},{"m":"4.6.1","t":"Perjanjian untuk kebutuhan Pengadaan Kantor Pusat dan Perjanjian untuk kebutuhan Kantor Cabang dengan Nilai Pengadaan di atas kewenangan Kantor Cabang dibuat oleh Satuan Unit Kerja yang membidangi hukum di Kantor Pusat.","l":480,"h":480},{"m":"4.6.2","t":"Perjanjian untuk kebutuhan Pengadaan Kantor Cabang dengan Nilai Pengadaan sampai dengan batas kewenangan Kantor Cabang dibuat oleh unit yang membidangi fungsi administrasi umum di Kantor Cabang.","l":480,"h":480},{"m":"4.6.3","t":"Penyusunan dan penomoran:","l":480,"h":480},{"m":"a.","t":"Surat Pemesanan (Purchase Order/PO) dilaksanakan oleh Unit Kerja Pengadaan.","l":624,"h":340},{"m":"b.","t":"Perjanjian dilaksanakan oleh Unit Kerja yang membidangi hukum.","l":624,"h":340},{"m":"4.6.4","t":"Sebelum melakukan penyusunan Perjanjian, Unit yang ditunjuk membuat Perjanjian terlebih dahulu harus meneliti kelengkapan dokumen dari proses Pengadaan Barang dan/atau Jasa yang merupakan bagian yang tidak terpisahkan dari Perjanjian, antara lain:","l":480,"h":480},{"m":"a.","t":"Rencana Kerja dan Syarat (RKS).","l":624,"h":340},{"m":"b.","t":"Seluruh Berita Acara berikut lampiran-lampiranya.","l":624,"h":340},{"m":"c.","t":"Dokumen administrasi Pemenang.","l":624,"h":340},{"m":"d.","t":"Surat Penawaran.","l":624,"h":340},{"m":"e.","t":"Surat Penetapan Pemenang.","l":624,"h":340},{"m":"f.","t":"Surat Perintah Kerja (SPK).","l":624,"h":340},{"m":"g.","t":"Klausul-klausul yang menjadi ketentuan pasal dalam Ikatan Kerja dengan memperhatikan ketentuan peraturan dan perundang-undangan yang berlaku.","l":624,"h":340},{"m":"4.6.5","t":"Dalam Perjanjian dapat mencantumkan klausul tambahan tentang:","l":480,"h":480},{"m":"a.","t":"Penyedia Barang dan/atau Jasa yang ditunjuk dapat mensubkontrakkan dengan Penyedia Barang dan/atau Jasa lainnya/ pihak ketiga dengan izin tertulis terlebih dahulu.","l":624,"h":340},{"m":"b.","t":"Tanggung jawab atas seluruh pekerjaan yang diserahkan/ disubkontrakan kepada pihak lain tersebut tetap pada Penyedia Barang dan/atau Jasa yang ditunjuk.","l":624,"h":340},{"m":"c.","t":"Pekerjaan sub kontrak sebagaimana dimaksud hanya untuk sebagian pekerjaan dan tidak dibenarkan untuk mensubkontrakkan pekerjaan utama.","l":624,"h":340},{"m":"4.6.6","t":"Setiap penyusunan Perjanjian, Unit Kerja atau Satuan Unit Kerja yang mengusulkan wajib menyertakan seluruh kelengkapan Dokumen Pengadaan sebagaimana dimaksud pada butir 4.6.4., Apabila kelengkapan dokumen yang diperlukan dalam penyusunan dan/atau penandatanganan Perjanjian tidak lengkap dan/atau tidak sesuai, maka unit yang berwenang membuat Perjanjian berhak menolak dan mengembalikan dokumen untuk dilengkapi.","l":480,"h":480},{"m":"4.6.7","t":"Perjanjian yang dipergunakan dapat berupa Perjanjian dengan format standar Perusahaan atau Perjanjian dengan format standar Penyedia Barang dan/atau Jasa.","l":480,"h":480},{"m":"4.6.8","t":"Untuk Perjanjian yang tidak mengikuti format standar yang dikeluarkan oleh Perusahaan sebelum Perjanjian tersebut ditandatangani oleh Para Pihak, terlebih dahulu dapat dikoordinasikan dengan Satuan Unit Kerja yang membidangi Hukum di Kantor Pusat untuk dievaluasi dari aspek hukumnya.","l":480,"h":480},{"m":"4.6.9","t":"Proses evaluasi Perjanjian sebagaimana dimaksud pada butir 4.6.8 dilaksanakan sebagai berikut:","l":480,"h":480},{"m":"a.","t":"Draft Perjanjian yang sudah disusun oleh unit yang membidangi administrasi umum di Kantor Cabang disampaikan kepada kepala Unit Kerja yang membidangi fungsi hukum di Kantor Pusat.","l":624,"h":340},{"m":"b.","t":"Satuan Unit kerja yang membidangi fungsi hukum di Kantor Pusat melakukan evaluasi atas aspek hukum dan melakukan koreksi bila diperlukan.","l":624,"h":340},{"m":"c.","t":"Apabila draft Perjanjian memerlukan koreksi atau perbaikan maka draft Perjanjian dikembalikan ke unit yang mengirim untuk diperbaiki.","l":624,"h":340},{"m":"d.","t":"Apabila sudah memenuhi aspek hukum dan tidak memerlukan koreksi/perbaikan, kepala Unit Kerja atau kepala unit yang membidangi hukum membubuhkan bukti pengesahan pada setiap halaman dan mengembalikan draft dimaksud kepada unit yang mengirim untuk proses penandatanganan para pihak.","l":624,"h":340},{"m":"e.","t":"Pengiriman draft Perjanjian sebagaimana dimaksud dapat dilakukan melalui surat elektronik (email) atau dengan mengirim hardcopy secara langsung melalui kurir.","l":624,"h":340},{"m":"f.","t":"Setiap pengiriman draft Perjanjian baik untuk dievaluasi/koreksi maupun hasil evaluasi dilakukan dengan surat pengantar secara tertulis.","l":624,"h":340},{"m":"g.","t":"Unit kerja yang membidangi hukum dapat menolak evaluasi dan pengesahan Perjanjian yang sudah ditandatangani para pihak dengan memberikan catatan-catatan bila diperlukan.","l":624,"h":340},{"m":"4.6.10","t":"Untuk setiap Perjanjian yang dibuat oleh Satuan Unit Kerja yang membidangi hukum di Kantor Pusat sebagaimana dimaksud pada butir 4.6.1, kepala Unit Kerja atau kepala Satuan Unit Kerja yang membidangi hukum akan membubuhkan bukti pengesahan pada setiap halaman untuk selanjutnya dilakukan proses penandatanganan para pihak.","l":570,"h":570},{"m":"4.6.11","t":"Penandatanganan Perjanjian dapat ditandatangani secara elektronik sesuai kesepakatan para pihak dengan menggunakan tanda tangan elektronik yang dilakukan melalui sistem atau lembaga yang memiliki perizinan.","l":570,"h":570},{"c":"[BAB 4 angka 4.6.0]"},{"t":"PENANDATANGANAN IKATAN KERJA"},{"m":"4.7.1","t":"Penandatanganan Ikatan Kerja dalam bentuk Surat Pemesanan (Purchase Order/PO) dan/atau Perjanjian dilakukan oleh pejabat sebagai berikut:","l":480,"h":480},{"m":"a.","t":"dilakukan oleh Kepala Unit Kerja Pengadaan sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":624,"h":340},{"m":"b.","t":"Kantor Cabang:","l":624,"h":340},{"m":"1.","t":"Dilakukan oleh Pejabat Berwenang Kantor Cabang dengan Nilai Pengadaan maksimal sampai batas kewenangannya.","l":908,"h":340},{"m":"2.","t":"Dilakukan oleh Kepala Unit Kerja Pengadaan dengan Nilai Pengadaan di atas kewenangan Kantor Cabang sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":908,"h":340},{"m":"c.","t":"Direktur Unit Spesifikasi Teknis (UST) dengan Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) sampai dengan Rp50.000.000.000,- (lima puluh miliar rupiah).","l":624,"h":340},{"m":"d.","t":"Direktur Utama dengan Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah).","l":624,"h":340},{"m":"e.","t":"Penandatanganan Perjanjian dapat dilimpahkan kepada pejabat lain yang diberi kewenangan untuk itu secara tertulis dengan Surat Pelimpahan Wewenang/Surat Kuasa.","l":624,"h":340},{"m":"4.7.2","t":"Ikatan Kerja dalam bentuk Perjanjian dibuat sekurang-kurangnya dalam rangkap 2 (dua) dokumen asli yang masing-masing dibubuhi meterai dan ditanda tangani serta dicap asli dari masing-masing pihak perusahaan yang terikat dalam Perjanjian tersebut.","l":480,"h":480},{"m":"4.7.3","t":"Khusus untuk Ikatan Kerja yang penandatanganannya dilakukan di Kantor Cabang, maka salinan Perjanjian dan /atau Surat Pemesanan (Purchase Order/PO) dikirimkan ke Kantor Pusat c.q. Kepala Unit Kerja Pengadaan.","l":480,"h":480},{"m":"4.7.4","t":"Distribusi Ikatan Kerja yang sudah ditandatangani sebagai berikut:","l":480,"h":480},{"m":"a.","t":"Unit Spesifikasi Teknis (UST);","l":624,"h":340},{"m":"b.","t":"Unit Pengguna (User);","l":624,"h":340},{"m":"c.","t":"Unit Pengelola Aset (barang investasi);","l":624,"h":340},{"m":"d.","t":"Unit Akuntansi.","l":624,"h":340},{"c":"[BAB 4 angka 4.7.0]"}],[{"t":"PEMBUATAN DAN BENTUK IKATAN KERJA"},{"m":"1.","t":"Pelaksanaan Pengadaan Barang dan/atau Jasa dituangkan dalam Ikatan Kerja dengan Penyedia Barang dan/atau Jasa yang mengatur se  Acara Negosiasi/Hasil Evaluasi Penawaran Harga.","l":624,"h":340},{"m":"6.","t":"Untuk Pengadaan Barang Murni, PO dibuat dengan melampirkan :","l":340,"h":340},{"m":"a.","t":"PPBJ;","l":624,"h":340},{"m":"b.","t":"Kerangka Acuan Kerja (KAK)/Term of Reference (TOR);","l":624,"h":340},{"m":"c.","t":"Harga Perkiraan Sendiri (HPS);","l":624,"h":340},{"m":"d.","t":"Berita Acara Negosiasi/Hasil Evaluasi Penawaran .","l":624,"h":340},{"m":"7.","t":"Untuk Pengadaan langsung e-purchasing, Ikatan Kerjanya berbentuk PO/Bukti Pembayaran/Bukti Pembelian, atau mengikuti standar toko daring yang bersangkutan;","l":340,"h":340},{"m":"8.","t":"Untuk Pengadaan langsung non e-purchasing berbentuk PO/Bukti Pembayaran/Bukti Pembelian/Kuitansi/SPK;","l":340,"h":340},{"m":"9.","t":"Perubahan terhadap dokumen Ikatan Kerja harus disertai dengan alasan yang jelas (waktu, nilai, dan ruang lingkup pekerjaan) dan disetujui oleh pejabat yang berwenang.","l":340,"h":340},{"c":"[BAB VIII.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Bukti perjanjian yang diakui di Perusahaan adalah sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Purchase Order (PO) digunakan untuk pengadaan barang dan/ atau jasa dengan nilai paling banyak Rp … (…).","l":624,"h":340},{"m":"b.","t":"Surat Perintah Kerja (SPK) digunakan untuk pengadaan barang dan/ atau jasa dengan nilai diatas Rp … (…) sampai dengan Rp … (…).","l":624,"h":340},{"m":"c.","t":"Surat perjanjian/ kontrak digunakan untuk pengadaan barang dan/ atau jasa dengan nilai di atas Rp. … (…) atau pekerjaan tertentu yang sifatnya senantiasa dibutuhkan secara berulang (rutin) dan/ atau dalam jangka waktu tertentu.","l":624,"h":340},{"m":"2.","t":"Penyusunan dan pengelolaan dokumen surat perjanjian/ kontrak dilakukan oleh Unit Kerja yang membidangi fungsi legal.","l":340,"h":340},{"m":"11.","t":"Dalam pembuatan jenis Purchase Order (PO) dan Surat Perintah Kerja (SPK) mengikuti aturan jenis surat perjanjian/ kontrak berdasarkan cara pembayarannya.","l":340,"h":340},{"c":"[Pasal 45 ayat (1)-(2), (11)]"}]]}]},{"heading":"B. KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN","rows":[{"topik":"Persetujuan dan Bentuk Kontrak/PO","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"1.","t":"Untuk PBJ, Perjanjian wajib disetujui oleh Unit Bisnis atau Unit Teknis sesuai dengan lampiran Batasan kewenangan pada Pedoman ini, dan antara lain berbentuk:","l":340,"h":340},{"m":"a.","t":"PO/Bukti Pembelian/Kuitansi untuk Pengadaan dengan nilai sampai dengan Rp200.000.000,- (dua ratus juta rupiah); dan/atau","l":624,"h":340},{"m":"b.","t":"Kontrak, untuk Pengadaan dengan nilai di atas Rp200.000.000,- (dua ratus juta rupiah).","l":624,"h":340},{"m":"2.","t":"Kontrak/PO dapat digunakan apabila hak dan kewajiban Penyedia dimitigasi dengan langsung mengacu kepada hak dan kewajiban dalam Kesepakatan/Perjanjian dengan pemberi kerja.","l":340,"h":340},{"c":"[BAB V.B angka 1-2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Muatan Kontrak/PO","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"3.","t":"Kontrak/PO dibuat dengan memperhatikan ketentuan peraturan perundang-undangan yang berlaku dan tata kelola Perusahaan yang baik (Good Corporate Governance/GCG) serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgment rule), dan antara lain memuat aspek-aspek sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Identitas Para Pihak yang mengadakan kesepakatan, yang meliputi nama, jabatan, alamat badan usaha masing-masing dan ditandatangani oleh Pihak yang bersangkutan;","l":624,"h":340},{"m":"b.","t":"Pokok pekerjaan yang diperjanjikan dengan uraian yang jelas mengenai jenis dan jumlah Barang dan/atau Jasa yang diperjanjikan;","l":624,"h":340},{"m":"c.","t":"Hak dan kewajiban Para Pihak yang terikat di dalam Perjanjian yang bersangkutan;","l":624,"h":340},{"m":"d.","t":"Nilai atau harga pekerjaan yang tetap dan pasti, serta syarat-syarat pembayarannya;","l":624,"h":340},{"m":"e.","t":"Di dalam Perjanjian Pengadaan dapat dicantumkan klausul pembayaran dalam bentuk mata uang asing;","l":624,"h":340},{"m":"f.","t":"Persyaratan dan spesifikasi teknis yang jelas dan terinci;","l":624,"h":340},{"m":"g.","t":"Keluaran atau hasil (output) dari PBJ;","l":624,"h":340},{"m":"i.","t":"Lampiran kesepakatan kedua belah pihak ataupun lampiran lainnya yang belum tercantum pada huruf (a) sampai dengan (h).","l":624,"h":340},{"c":"[BAB V.B angka 3 huruf a-g, i]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"1.","t":"Ikatan Kerja dibuat dengan mengindahkan ketentuan peraturan perundang- undangan yang berlaku dan tata kelola perusahaan yang baik (Good Corporate Governance) serta prinsip kehati-hatian dalam pengambilan keputusan bisnis (business judgment rule), dan antara lain memuat aspek-aspek sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Identitas Para pihak yang mengadakan kesepakatan, yang meliputi nama, jabatan, alamat badan usaha masing-masing dan ditanda tangani oleh pihak yang bersangkutan;","l":624,"h":340},{"m":"b.","t":"Pokok pekerjaan yang diperjanjikan dengan uraian yang jelas mengenai jenis dan jumlah Barang dan/atau Jasa yang diperjanjikan;","l":624,"h":340},{"m":"c.","t":"Hak dan kewajiban para pihak yang terikat di dalam Perjanjian Pengadaan yang bersangkutan;","l":624,"h":340},{"m":"d.","t":"Nilai atau Harga pekerjaan yang tetap dan pasti, serta syarat-syarat pembayarannya;","l":624,"h":340},{"m":"e.","t":"Di dalam Perjanjian Pengadaan dapat dicantumkan klausul pembayaran dalam bentuk mata uang asing;","l":624,"h":340},{"m":"f.","t":"Persyaratan dan spesifikasi teknis yang jelas dan terinci;","l":624,"h":340},{"m":"g.","t":"Keluaran atau hasil (output) dari Pengadaan Barang dan/atau Jasa;","l":624,"h":340},{"c":"[BAB VIII.A angka 1 huruf a-g]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Jangka Waktu Perjanjian","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"h.","t":"Jangka waktu berlakunya Perjanjian, dengan disertai jadwal/jangka waktu penyelesaian/penyerahan yang pasti serta syarat-syarat dan kondisi penyerahannya;","l":340,"h":340},{"c":"[BAB V.B angka 3 huruf h]"}],[{"m":"1.","t":"Kontrak tahun tunggal (single year)","l":340,"h":340},{"t":"Kontrak tahun tunggal adalah kontrak yang pelaksanaan pekerjaannya kurang dari atau sama dengan satu kali tahun anggaran.","l":340},{"m":"2.","t":"Kontrak tahun jamak (multi years)","l":340,"h":340},{"t":"Kontrak tahun jamak adalah Kontrak yang pelaksanaan pekerjaannya melebihi dari 12 (dua belas) bulan atau kurang dari 12 (dua belas) bulan tetapi lebih dari 1 (satu) tahun anggaran namun tidak boleh melebihi 3 (tiga) tahun anggaran. Kontrak tahun jamak digunakan apabila:","l":340},{"m":"a.","t":"Pekerjaan merupakan satu kesatuan dan merupakan kebutuhan dasar.","l":624,"h":340},{"m":"b.","t":"Infrastruktur.","l":624,"h":340},{"m":"c.","t":"Sewa kantor, sewa fasilitas kantor, pemeliharaan fasilitas kantor, sewa rumah dinas, sewa fasilitas rumah dinas.","l":624,"h":340},{"m":"d.","t":"Konsultan hukum.","l":624,"h":340},{"m":"e.","t":"Jasa Konsultansi yang bersifat knowledge intensive (long term services agreement) dari Original Equipment Manufacturer (OEM).","l":624,"h":340},{"c":"[Pasal 35]"}],[{"t":"JANGKA WAKTU PERJANJIAN"},{"m":"4.8.1","t":"Pada prinsipnya jangka waktu Perjanjian ditentukan oleh Unit Spesifikasi Teknis (UST) dengan mempertimbangkan:","l":480,"h":480},{"m":"a.","t":"Waktu penyelesaian pekerjaan yang disesuaikan dengan tahun anggaran.","l":624,"h":340},{"m":"b.","t":"Memberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran atau berdasarkan kriteria yang ditentukan oleh Direksi dengan persetujuan Dewan Komisaris;","l":624,"h":340},{"m":"c.","t":"Memerlukan investasi jangka panjang; atau","l":624,"h":340},{"m":"d.","t":"Bersifat rutin yang harus tersedia di awal tahun.","l":624,"h":340},{"m":"4.8.2","t":"Ketentuan masa berlaku Perjanjian diatur sebagai berikut:","l":480,"h":480},{"m":"a.","t":"Masa berlaku Perjanjian untuk Pengadaan Barang dan/atau Jasa maksimal selama 3 (tiga) tahun dan dapat diperpanjang maksimal 2 (dua) kali dengan perpanjangan masing-masing maksimal 2 (dua) tahun.","l":624,"h":340},{"m":"b.","t":"Khusus untuk Pengadaan sewa kendaraan operasional, masa berlaku Perjanjian maksimal 5 (lima) tahun dan dapat diperpanjang maksimal 1 (satu) kali dengan jangka waktu perpanjangan maksimal 2 (dua) tahun.","l":624,"h":340},{"m":"c.","t":"Pengadaan sewa ruangan kantor baik di area bandara maupun di luar area bandara maksimal 7 (tujuh) tahun dan dapat diperpanjang sesuai kebutuhan dengan perpanjangan masing-masing maksimal 5 (lima) tahun.","l":624,"h":340},{"m":"d.","t":"Khusus untuk Pengadaan sewa Peralatan Ground Support Equipment (GSE) termasuk Apron Passenger Bus (APB) dan sewa teknologi informasi, masa berlaku Perjanjian maksimal selama 10 (sepuluh) tahun dan dapat diperpanjang maksimal 2 (dua) kali dengan perpanjangan masing-masing maksimal 3 (tiga) tahun.","l":624,"h":340},{"m":"4.8.3","t":"Untuk Pengadaan Barang dan/atau Jasa dengan jangka waktu lebih dari 1 (satu) tahun, Direksi dapat membuat formula penyesuaian harga (price adjustment) tertentu baik untuk kenaikan maupun penurunan untuk mendapatkan harga wajar yang disesuaikan dengan antara lain:","l":480,"h":480},{"m":"a.","t":"Praktik yang berlaku umum (best practice);","l":624,"h":340},{"m":"b.","t":"Kondisi pasar; dan/atau","l":624,"h":340},{"m":"c.","t":"Fluktuasi harga bahan baku/bakar.","l":624,"h":340},{"c":"[BAB 4 angka 4.8.0]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"h.","t":"Jangka waktu berlakunya Perjanjian Pengadaan, jadwal/jangka waktu penyelesaian/penyerahan, dengan disertai jadwal waktu penyelesaian/penyerahan yang pasti serta syarat-syarat dan kondisi penyerahannya.","l":340,"h":340},{"c":"[BAB VIII.A angka 1 huruf h]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Kontrak tahun tunggal (single year)","l":340,"h":340},{"t":"Kontrak tahun tunggal adalah kontrak yang pelaksanaan pekerjaannya kurang dari atau sama dengan 1 (satu) kali tahun anggaran.","l":340},{"m":"2.","t":"Kontrak tahun jamak (multi years)","l":340,"h":340},{"t":"Kontrak tahun jamak adalah Kontrak yang pelaksanaan pekerjaannya melebihi dari 12 (dua belas) bulan atau kurang dari 12 (dua belas) bulan tetapi lebih dari 1 (satu) tahun anggaran namun tidak boleh melebihi 3 (tiga) tahun anggaran. Kontrak tahun jamak digunakan apabila:","l":340},{"m":"a.","t":"Pekerjaan merupakan satu kesatuan dan merupakan kebutuhan dasar.","l":624,"h":340},{"m":"b.","t":"Infrastruktur.","l":624,"h":340},{"m":"c.","t":"Sewa kantor, sewa fasilitas kantor, pemeliharaan fasilitas kantor, sewa rumah dinas, sewa fasilitas rumah dinas.","l":624,"h":340},{"m":"d.","t":"Konsultan hukum.","l":624,"h":340},{"m":"e.","t":"Jasa Konsultansi yang bersifat knowledge intensive (long term services agreement) dari Original Equipment Manufacturer (OEM).","l":624,"h":340},{"c":"[Pasal 46]"}]]},{"topik":"Ketentuan Lain dalam Kontrak/PO","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"4.","t":"Kontrak/PO juga dapat memuat antara lain ketentuan:","l":340,"h":340},{"m":"a.","t":"Jaminan teknis/hasil pekerjaan yang dilaksanakan dan/atau ketentuan mengenai kelayakannya;","l":624,"h":340},{"m":"c.","t":"Jaminan Pelaksanaan dan Jaminan Pemeliharaan;","l":624,"h":340},{"m":"f.","t":"Penyelesaian tindak lanjut Perjanjian Pengadaan dalam hal salah satu Pihak tidak memenuhi kewajibannya;","l":624,"h":340},{"m":"h.","t":"Kepastian adanya jaminan terhadap Barang dan/atau Jasa yang diperjanjikan;","l":624,"h":340},{"m":"i.","t":"Penggunaan Barang dan/atau Jasa hasil produksi dalam negeri secara terperinci dalam lampiran kontrak, dan/atau kewajiban melakukan sub-kontrak sebagian pekerjaan kepada usaha kecil setempat/konsultan dalam negeri;","l":624,"h":340},{"m":"k.","t":"Pakta Integritas (integrity pact) dan Non Disclosure Agreement (“NDA”) yang ditandatangani oleh Penyedia;","l":624,"h":340},{"m":"l.","t":"Memenuhi persyaratan Sistem Manajemen Anti Penyuapan (”SMAP”) sebagaimana ISO 37001:2016.","l":624,"h":340},{"c":"[BAB V.B angka 4 huruf a, c, f, h-i, k-l]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"2.","t":"Untuk Surat Perjanjian Kerja (SPK) atau Kontrak, maka Perjanjian Pengadaan antara lain memuat juga ketentuan:","l":340,"h":340},{"m":"a.","t":"Jaminan teknis/hasil pekerjaan yang dilaksanakan dan/atau ketentuan mengenai kelayakannya;","l":624,"h":340},{"m":"c.","t":"Jaminan pelaksanaan dan jaminan pemeliharaan;","l":624,"h":340},{"m":"f.","t":"Penyelesaian tindak lanjut Kontrak dalam hal salah satu pihak tidak memenuhi kewajibannya;","l":624,"h":340},{"m":"h.","t":"Kepastian adanya jaminan terhadap Barang dan/atau Jasa yang diperjanjikan;","l":624,"h":340},{"m":"i.","t":"Penggunaan Barang dan/atau Jasa hasil produksi dalam negeri secara terperinci dalam lampiran kontrak, dan/atau kewajiban mensub-kontrakan sebagian pekerjaan kepada usaha kecil setempat/konsultan dalam negeri;","l":624,"h":340},{"m":"l.","t":"Pakta Integritas (letter of undertaking) dan Non Disclosure Agreement (NDA) yang ditandatangani oleh Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"3.","t":"Apabila terjadi perbedaan antara Perjanjian Pengadaan dengan KAK/TOR serta risalah penjelasan (Aanwijzing), maka yang menjadi dasar acuan adalah Perjanjian Pengadaan.","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf a, c, f, h-i, l, angka 3]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Cedera Janji dan Sanksi","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"b.","t":"Cedera janji dan sanksi dalam hal Penyedia ternyata tidak atau terlambat memenuhi kewajibannya;","l":340,"h":340},{"c":"[BAB V.B angka 4 huruf b]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"JENIS-JENIS SANKSI"},{"m":"5.1.1.","t":"Kepada Penyedia Barang dan/atau Jasa yang melakukan pelanggaran/kelalaian (wanprestasi) dapat diberikan sanksi berupa:","l":540,"h":540},{"m":"a.","t":"Pembatalan kepesertaan dalam Proses Pengadaan.","l":624,"h":340},{"m":"b.","t":"Pembatalan penunjukan sebagai pemenang.","l":624,"h":340},{"m":"c.","t":"Teguran/Peringatan.","l":624,"h":340},{"m":"d.","t":"Denda.","l":624,"h":340},{"m":"e.","t":"Pemutusan Perjanjian.","l":624,"h":340},{"m":"f.","t":"Tuntutan ganti rugi.","l":624,"h":340},{"m":"g.","t":"Dimasukkan ke dalam Daftar Hitam (Blacklist) Perusahaan.","l":624,"h":340},{"m":"5.1.2.","t":"Apabila dianggap perlu, sanksi selain sebagaimana dimaksud pada butir 5.1.1 dapat diatur kembali sesuai dengan kondisi yang dihadapi dan dituangkan dalam Rencana Kerja dan Syarat (RKS) dan Perjanjian.","l":540,"h":540},{"c":"[BAB 5 angka 5.1.0]"},{"t":"PEMBATALAN KEPESERTAAN DALAM PROSES PENGADAAN"},{"m":"5.2.1.","t":"Sanksi Pembatalan kepesertaan dalam Proses Pengadaan dijatuhkan kepada Penyedia Barang dan/atau Jasa yang melakukan pelanggaran dan kesalahan selama proses Pengadaan Barang dan/atau Jasa.","l":540,"h":540},{"m":"5.2.2.","t":"Jenis-jenis pelanggaran yang kepesertaanya dapat dibatalkan antara lain sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Berusaha mempengaruhi Pelaksana Pengadaan atau Pejabat Berwenang dalam bentuk dan cara apapun, baik langsung maupun tidak langsung guna memenuhi keinginannya yang bertentangan dengan ketentuan dan prosedur yang telah ditetapkan dalam Dokumen Pengadaan/Perjanjian/peraturan perundang-undangan yang berlaku.","l":624,"h":340},{"m":"b.","t":"Melakukan persekongkolan dengan Penyedia Barang dan/atau Jasa lain untuk untuk mengatur harga penawaran di luar prosedur pelaksanaan Pengadaan Barang dan/atau Jasa sehingga mengurangi/menghambat/ memperkecil dan/atau meniadakan persaingan yang sehat dan/atau merugikan pihak lain.","l":624,"h":340},{"m":"c.","t":"Apabila terdapat bukti yang kuat bahwa sebagian besar atau seluruh Peserta Pelelangan berada dalam satu kekuatan pengaruh pemilik modal dan atau kepengurusan dan atau kerjasama dalam bentuk lainnya, sehingga patut diduga terjadi pengaturan/kerjasama diantara Peserta Pelelangan dan atau persaingan yang tidak wajar.","l":624,"h":340},{"m":"d.","t":"Terhadap Penyedia Barang dan/atau Jasa (termasuk pengurusnya) yang terbukti membuat dan atau menyampaikan dokumen dan keterangan lain yang tidak benar dalam rangka untuk memenuhi persyaratan Pengadaan Barang dan/atau Jasa yang telah ditentukan dalam Dokumen Pengadaan.","l":624,"h":340},{"m":"e.","t":"ketidakhadiran/ketidakikutsertaan Peserta yang diundang dan telah menerima undangan dalam proses Pemilihan Langsung harus dibuktikan dengan konfirmasi tertulis.","l":624,"h":340},{"m":"f.","t":"Apabila dalam suatu proses Pengadaan diketahui terdapat Peserta yang mempunyai hubungan sedarah sampai dengan derajat ke tiga baik menurut garis lurus maupun garis kesamping atau hubungan semenda antara Penyedia Barang dan/atau Jasa dengan sesama Penyedia Barang dan/atau Jasa dan atau antara Penyedia Barang dan/atau Jasa dengan Pelaksana Pengadaan, atau dalam Satu Badan Usaha, seorang anggota Direksi atau Dewan Komisaris merangkap sebagai anggota Direksi atau Dewan Komisaris pada badan usaha lainnya yang menjadi Peserta pada Pengadaan yang sama.","l":624,"h":340},{"m":"g.","t":"Apabila dalam suatu proses Pengadaan diketahui terdapat Peserta yang anggota Direksi atau anggota Dewan Komisarisnya pernah atau masih menjabat sebagai anggota Direksi atau anggota Dewan Komisaris di Perusahaan yang sedang berada dalam Daftar Hitam (Blacklist) Perusahaan.","l":624,"h":340},{"m":"h.","t":"Apabila terdapat Pengurus Koperasi Pegawai yang mengikuti Pengadaan Barang dan/atau Jasa dan bersaing dengan perusahaan lainnya, merangkap sebagai anggota Pelaksana Pengadaan atau Pejabat Berwenang menentukan pemenang.","l":624,"h":340},{"m":"5.2.3.","t":"Kepada Penyedia Barang dan/atau Jasa yang melakukan pelangaran sebagaimana dimaksud pada butir 5.2.1, dimasukkan ke dalam Daftar Hitam (Blacklist) selama 1 (satu) tahun.","l":540,"h":540},{"c":"[BAB 5 angka 5.2.0]"},{"t":"PEMBATALAN PENUNJUKAN SEBAGAI PEMENANG"},{"m":"5.3.1.","t":"Pembatalan Penunjukan sebagai pemenang diberikan apabila:","l":540,"h":540},{"m":"a.","t":"Penyedia Barang dan/atau Jasa (termasuk pengurusnya) yang ditunjuk sebagai Pelaksana Pekerjaan kemudian mengundurkan diri dengan alasan apapun dan atau tidak menandatangani Surat Pemesanan (Purchase Order/PO) atau Surat Perjanjian tanpa adanya pemberitahuan.","l":624,"h":340},{"m":"b.","t":"Penyedia Barang dan/atau Jasa yang diketahui anggota Direksi atau anggota Dewan Komisarisnya pernah atau masih menjabat sebagai anggota Direksi atau anggota Dewan Komisaris di perusahaan yang sedang berada dalam Daftar Hitam (Blacklist) Perusahaan.","l":624,"h":340},{"m":"c.","t":"Penyedia Barang dan/atau Jasa tidak menyerahkan jaminan pelaksanaan sampai batas akhir penyerahan dan kepadanya telah diberikan surat teguran.","l":624,"h":340},{"m":"d.","t":"Penyedia Barang dan/atau Jasa terbukti menyerahkan dokumen yang tidak benar pada saat proses Pengadaan Barang dan/atau Jasa.","l":624,"h":340},{"m":"5.3.2.","t":"Kepada Penyedia Barang dan/atau Jasa yang melakukan pelangaran sebagaimana dimaksud pada butir 5.3.1, dimasukkan ke dalam Daftar Hitam (Blacklist) selama 1 (satu) tahun.","l":540,"h":540},{"c":"[BAB 5 angka 5.3.0]"},{"t":"TEGURAN/PERINGATAN"},{"m":"5.4.1.","t":"Teguran/Peringatan diberikan kepada Penyedia Barang dan/atau Jasa yang dianggap lalai dalam melaksanakan pekerjaan dan melakukan kesalahan atau pelanggaran ringan dan sedang.","l":540,"h":540},{"m":"5.4.2.","t":"Teguran/Peringatan dapat dilakukan secara lisan dan secara tertulis disesuaikan dengan tingkat kesalahan yang dilakukan oleh Penyedia Barang dan/atau Jasa.","l":540,"h":540},{"m":"5.4.3.","t":"Tahapan teguran dilakukan sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Teguran/peringatan lisan maksimal diberikan 3 (tiga) kali.","l":624,"h":340},{"m":"b.","t":"Teguran/peringatan tertulis maksimal diberikan 3 (tiga) kali.","l":624,"h":340},{"m":"5.4.4.","t":"Kepada Penyedia Barang dan/atau Jasa yang telah diberikan teguran/peringatan melebihi ketentuan sebagaimana dimaksud pada butir 5.4.3. dapat dilakukan pemutusan Perjanjian.","l":540,"h":540},{"c":"[BAB 5 angka 5.4.0]"},{"t":"TUNTUTAN GANTI RUGI"},{"m":"5.7.1.","t":"Tuntutan ganti rugi dapat dikenakan kepada Penyedia Barang dan/atau Jasa atas kesalahan yang dilakukannya menimbulkan kerugian bagi perusahaan.","l":540,"h":540},{"m":"5.7.2.","t":"Kerugian dimaksud tidak hanya sebatas pada kerusakan fisik yang terjadi tetapi juga potensi potensi kerugian yang sangat erat kaitannya dengan akibat yang ditimbulkannya.","l":540,"h":540},{"c":"[BAB 5 angka 5.7.0]"},{"t":"PELAKSANAAN PENJATUHAN SANKSI"},{"m":"5.9.1.","t":"Sanksi berupa teguran baik lisan maupun tertulis dapat dilakukan oleh kepala Unit Pengguna (User).","l":540,"h":540},{"m":"5.9.2.","t":"Sanksi berupa pembatalan penetapan sebagai pemenang dilakukan oleh Pejabat Berwenang setelah mendapat usulan dari Pelaksana Pengadaan.","l":540,"h":540},{"m":"5.9.3.","t":"Sanksi denda, pemutusan Perjanjian dan ganti rugi dijatuhkan oleh Pejabat Berwenang setelah mendapat masukan/usulan tertulis dari Unit Pengguna (User) dan/atau Unit Spesifikasi Teknis (UST).","l":540,"h":540},{"m":"5.9.4.","t":"Pemberian sanksi sebagaimana dimaksud dengan tembusan kepada:","l":540,"h":540},{"m":"a.","t":"Kepala Unit Kerja Pengadaan;","l":624,"h":340},{"m":"b.","t":"Kepala Unit Kerja Spesifikasi Teknis (UST); dan","l":624,"h":340},{"m":"c.","t":"Pejabat Berwenang.","l":624,"h":340},{"c":"[BAB 5 angka 5.9.0]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"b.","t":"Cedera janji dan Sanksi dalam hal penyedia Barang dan/atau Jasa ternyata tidak atau terlambat memenuhi kewajibannya;","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf b]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Uang Muka","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"d.","t":"Uang muka, apabila kepada Penyedia yang bersangkutan diberikan uang muka;","l":340,"h":340},{"c":"[BAB V.B angka 4 huruf d]"}],[{"t":"Uang muka dapat diberikan atau tidak diberikan kepada penyedia sesuai dengan ketentuan Perusahaan."},{"c":"[Pasal 27]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"d.","t":"Uang muka, apabila kepada penyedia Barang dan/atau Jasa yang bersangkutan diberikan uang muka;","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf d]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Uang muka dapat diberikan atau tidak diberikan kepada Penyedia Barang dan/ atau Jasa sesuai dengan ketentuan Perusahaan."},{"c":"[Pasal 37]"}]]},{"topik":"Keadaan Memaksa (Force Majeure)","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"e.","t":"Keadaan memaksa (force majeure) dan cara penanganannya;","l":340,"h":340},{"c":"[BAB V.B angka 4 huruf e]"}],[{"m":"1.","t":"Dalam hal terjadi Keadaan kahar (force majeure), penyedia memberitahukan tentang terjadinya Keadaan kahar (force majeure) kepada pejabat berwenang yang menandatangani kontrak secara tertulis dalam waktu paling lambat 14 (empat belas) hari kalender sejak terjadinya keadaan kahar (force majeure), dengan menyertakan salinan pernyataan Keadaan kahar (force majeure) yang dikeluarkan oleh pihak/ instansi yang berwenang sesuai ketentuan peraturan perundang-undangan.","l":340,"h":340},{"m":"2.","t":"Yang tidak termasuk keadaan kahar (force majeure) adalah hal-hal merugikan yang disebabkan oleh perbuatan atau kelalaian para pihak.","l":340,"h":340},{"m":"3.","t":"Keterlambatan pelaksanaan pekerjaan yang diakibatkan oleh terjadinya keadaan kahar (force majeure) tidak dikenakan sanksi.","l":340,"h":340},{"c":"[Pasal 38]"}],[{"t":"KEADAAN KAHAR"},{"m":"4.11.1","t":"Keadaan Kahar adalah suatu keadaan yang terjadi di luar kehendak para pihak dan tidak dapat diperkirakan sebelumnya, sehingga sebagian atau seluruh kewajiban yang ditetapkan dalam Perjanjian menjadi tidak terpenuhi.","l":570,"h":570},{"m":"4.11.2","t":"Keadaan yang dapat digolongkan sebagai Keadaan Kahar dalam Perjanjian Pengadaan Barang dan/atau Jasa adalah meliputi dan tidak terbatas pada:","l":570,"h":570},{"m":"a.","t":"Bencana alam;","l":624,"h":340},{"m":"b.","t":"Bencana non alam;","l":624,"h":340},{"m":"c.","t":"Bencana sosial;","l":624,"h":340},{"m":"d.","t":"Pemogokan;","l":624,"h":340},{"m":"e.","t":"Kebakaran; dan/atau","l":624,"h":340},{"m":"f.","t":"Gangguan industri lainnya.","l":624,"h":340},{"m":"4.11.3","t":"Dalam hal terjadi Keadaan Kahar, Penyedia Barang dan/atau Jasa memberitahukan tentang terjadinya sebab Keadaan Kahar kepada Pejabat Berwenang dalam waktu paling lambat 7 (tujuh) hari kalender sejak terjadinya Keadaan Kahar, dengan menyertakan salinan pernyataan Keadaan Kahar yang dikeluarkan oleh pihak/instansi yang berwenang sesuai ketentuan peraturan perundang-undangan. Atau apabila sebab kahar tersebut terjadi di luar negeri yang berpengaruh pada jadwal pengiriman barang import maka pernyataan terjadinya sebab kahar dimaksud dikeluarkan oleh pejabat berwenang dari negara tersebut atau sekurang-kurangnya dari prinsipal.","l":570,"h":570},{"m":"4.11.4","t":"Tidak termasuk Keadaan Kahar adalah hal-hal merugikan yang disebabkan oleh perbuatan atau kelalaian para pihak.","l":570,"h":570},{"m":"4.11.5","t":"Keterlambatan/tidak terjadinya pelaksanaaan pekerjaan karena Keadaan Kahar tidak dikenakan sanksi.","l":570,"h":570},{"m":"4.11.6","t":"Setelah terjadinya Keadaan Kahar para pihak dapat melakukan kesepakatan yang dituangkan dalam perubahan Perjanjian.","l":570,"h":570},{"c":"[BAB 4 angka 4.11.0]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"e.","t":"Keadaan memaksa (force majeure) dan cara penanganannya;","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf e]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Dalam hal terjadi Keadaan Kahar (Force Majeure), Penyedia Barang dan/ atau Jasa memberitahukan tentang terjadinya Keadaan Kahar (Force Majeure) kepada Unit Teknis secara tertulis dalam waktu paling lambat 14 (empat belas) hari kalender sejak terjadinya Keadaan Kahar (Force Majeure), dengan menyertakan salinan pernyataan Keadaan Kahar (Force Majeure) yang dikeluarkan oleh pihak/ instansi yang berwenang sesuai ketentuan peraturan perundang-undangan.","l":340,"h":340},{"m":"2.","t":"Tidak termasuk Keadaan Kahar (Force Majeure) adalah hal-hal merugikan yang disebabkan oleh perbuatan atau kelalaian para pihak.","l":340,"h":340},{"m":"3.","t":"Keterlambatan pelaksanaan pekerjaan yang diakibatkan oleh terjadinya Keadaan Kahar (Force Majeure) tidak dikenakan sanksi.","l":340,"h":340},{"c":"[Pasal 50]"}]]},{"topik":"Penyelesaian Perselisihan/Sengketa","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"g.","t":"Penyelesaian perselisihan/sengketa yang mengutamakan penyelesaian melalui musyawarah dan alternatif penyelesaian sengketa serta pilihan domisili hukum;","l":340,"h":340},{"c":"[BAB V.B angka 4 huruf g]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENYELESAIAN PERSELISIHAN"},{"m":"4.12.1","t":"Dalam hal terjadi perselisihan antara para pihak dalam penyediaan Barang dan/atau Jasa, para pihak terlebih dahulu menyelesaikan perselisihan tersebut melalui musyawarah untuk mufakat.","l":570,"h":570},{"m":"4.12.2","t":"Dalam hal penyelesaian perselisihan sebagaimana dimaksud pada butir 4.12.1 tidak tercapai, penyelesaian perselisihan dapat dilakukan melalui:","l":570,"h":570},{"m":"a.","t":"Arbitrase;","l":624,"h":340},{"m":"b.","t":"Alternatif penyelesaian sengketa; atau","l":624,"h":340},{"m":"c.","t":"Pengadilan.","l":624,"h":340},{"t":"sesuai dengan ketentuan peraturan perundang-undangan yang berlaku.","l":624},{"c":"[BAB 4 angka 4.12.0]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"g.","t":"Penyelesaian perselisihan/sengketa yang mengutamakan penyelesaian melalui musyawarah dan alternatif penyelesaian sengketa serta pilihan domisili hukum;","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf g]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Pemutusan Perjanjian Pengadaan","cells":[[{"t":"KETENTUAN DAN ASPEK PERJANJIAN PENGADAAN"},{"m":"j.","t":"Cara pemutusan Perjanjian Pengadaan;","l":340,"h":340},{"c":"[BAB V.B angka 4 huruf j]"}],[{"t":"Pemutusan Kontrak"},{"m":"1.","t":"Pejabat berwenang yang menandatangani kontrak dapat memutuskan kontrak secara sepihak apabila :","l":340,"h":340},{"m":"a.","t":"Penyedia lalai atau cidera janji dalam melaksanakan kewajibannya dan tidak memperbaiki kelalaiannya dalam jangka waktu yang telah ditetapkan;","l":624,"h":340},{"m":"b.","t":"Penyedia terbukti melakukan kecurangan, pemalsuan dokumen, identitas bisnis dan/ atau Kolusi, Korupsi dan Nepotisme (KKN);","l":624,"h":340},{"m":"c.","t":"Terdapat indikasi manipulasi harga, kegiatan fiktif, dan/ atau barang dan/ atau jasa dibawah spesifikasi yang disepakati;","l":624,"h":340},{"m":"d.","t":"Ditemukan adanya kesalahan prosedur yang berpotensi menimbulkan kerugian keuangan Perusahaan dan/ atau berpotensi menimbulkan masalah hukum;","l":624,"h":340},{"m":"e.","t":"Penyedia dinyatakan pailit oleh Pengadilan;","l":624,"h":340},{"m":"f.","t":"Denda keterlambatan pelaksanaan pekerjaan akibat kelalaian penyedia telah melampaui nilai jaminan pelaksanaan.","l":624,"h":340},{"m":"2.","t":"Pemutusan kontrak secara sepihak dapat dilakukan dengan surat peringatan.","l":340,"h":340},{"m":"3.","t":"Pejabat yang Berwenang yang menandatangani kontrak dapat menyampaikan surat peringatan kepada Penyedia dengan tahapan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Surat peringatan I (pertama), disampaikan kepada Penyedia apabila tidak melaksanakan kewajibannya sesuai Kontrak;","l":624,"h":340},{"m":"b.","t":"Surat peringatan II (kedua), disampaikan kepada Penyedia apabila dalam jangka waktu 10 (sepuluh) hari kalender sejak surat peringatan pertama Penyedia tidak melaksanakan kewajibannya sesuai Kontrak; dan","l":624,"h":340},{"m":"c.","t":"Surat peringatan III (ketiga)/ pemberitahuan pemutusan Kontrak, disampaikan kepada Penyedia apabila dalam jangka waktu 10 (sepuluh) hari kalender sejak Surat peringatan kedua Penyedia tidak melaksanakan kewajibannya sesuai Kontrak.","l":624,"h":340},{"m":"4.","t":"Pemutusan kontrak dapat dilakukan apabila terjadi hal-hal diluar kekuasaan para pihak untuk melaksanakan kewajiban yang ditentukan dalam kontrak, yang disebabkan oleh keadaan kahar (force majeure).","l":340,"h":340},{"m":"5.","t":"Jaminan pelaksanaan atas pemutusan kontrak akan menjadi milik Perusahaan.","l":340,"h":340},{"m":"6.","t":"Dalam hal pejabat yang berwenang memutuskan pelaksanaan sesuai kontrak secara sepihak dengan penyedia, maka sisa pekerjaan dapat dilanjutkan dengan penunjukan langsung kepada pemenang cadangan pertama atau pemenang cadangan kedua.","l":340,"h":340},{"m":"7.","t":"Dalam hal pekerjaan konstruksi, penyedia yang melanjutkan sisa pekerjaan sebelumnya dapat menggunakan barang-barang, dokumen, ataupun dokumen desain yang telah dibuat.","l":340,"h":340},{"m":"8.","t":"Apabila pemenang cadangan pertama atau pemenang cadangan kedua sebagaimana dimaksud pada ayat (6) tidak dapat melanjutkan sisa pekerjaan, maka akan dilakukan Tender/ seleksi ulang.","l":340,"h":340},{"m":"9.","t":"Setelah pemberitahuan pemutusan berlaku efektif, pejabat berwenang yang menandatangani kontrak dapat :","l":340,"h":340},{"m":"a.","t":"Menerima ganti rugi dari penyedia atas kerugian dan kompensasi kepada Perusahaan serta biaya extra lainnya untuk menyelesaikan pekerjaan setelah memperhitungkan jumlah yang menjadi hak penyedia berdasarkan hasil evaluasi dari pejabat yang berwenang yang akan disetorkan kepada Perusahaan.","l":624,"h":340},{"m":"b.","t":"Membayarkan sisa kewajiban sesuai kontrak kepada penyedia setelah menerima ganti rugi atas kerugian, kompensasi dan biaya extra lainnya sebagaimana dimaksud pada huruf a.","l":624,"h":340},{"m":"c.","t":"Dalam jenis kontrak lump sum atau turnkey dapat menggunakan jasa konsultan untuk melakukan perhitungan prestasi pekerjaan yang akan dibayarkan kepada penyedia dan dinyatakan dalam Berita Acara.","l":624,"h":340},{"c":"[Pasal 37]"},{"t":"Pengakhiran Kontrak"},{"t":"Kontrak dinyatakan berakhir apabila :"},{"m":"1.","t":"Penyelesaian pekerjaan telah mencapai 100% (seratus persen) dan telah diserahterimakan;","l":340,"h":340},{"m":"2.","t":"Untuk pekerjaan yang memiliki masa pemeliharan, maka kontrak berakhir sampai dengan selesainya masa pemeliharaan.","l":340,"h":340},{"c":"[Pasal 40]"}],[{"t":"PEMUTUSAN PERJANJIAN"},{"m":"5.6.1.","t":"Pemutusan Perjanjian secara sepihak dapat dikenakan Kepada Penyedia Barang dan/atau Jasa dengan ketentuan antara lain dan tidak terbatas sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Melakukan kesalahan berat yang dapat merugikan Perusahaan.","l":624,"h":340},{"m":"b.","t":"Berdasarkan penilaian Unit Pengguna (User), Penyedia Barang dan/atau Jasa memiliki kinerja yang buruk/tidak menunjukkan kerjasama yang baik.","l":624,"h":340},{"m":"c.","t":"Penyedia Barang dan/atau Jasa tidak dapat melaksanakan atau menyelesaikan pekerjaannya, cidera janji (wanprestasi) dan atau tidak dapat memenuhi kewajiban dan tanggung-jawabnya sebagaimana diatur dalam Perjanjian dan telah diberikan teguran atau surat peringatan maksimal.","l":624,"h":340},{"m":"d.","t":"Penyedia Barang dan/atau Jasa mengalihkan sebagian atau seluruh pelaksanaan pekerjaan kepada pihak lain tanpa persetujuan tertulis dari pemberi tugas.","l":624,"h":340},{"m":"e.","t":"Penyedia Barang dan/atau Jasa telah melakukan kesalahan dan terhadapnya telah diberikan teguran/peringatan tertulis yang melebihi ketentuan sebagaimana dimaksud pada butir 5.4.3.","l":624,"h":340},{"m":"f.","t":"Apabila denda keterlambatan pengiriman Barang dan/atau Jasa atau penyelesaian pekerjaan akibat kesalahan Penyedia Barang dan/atau Jasa sudah melampaui 5% (lima persen) dari Nilai Perjanjian.","l":624,"h":340},{"m":"g.","t":"Apabila denda keterlambatan dalam menyelesaikan perbaikan terhadap barang/hasil pekerjaan dalam masa pemeliharaan melampaui 5% (lima persen) dari Nilai Perjanjian.","l":624,"h":340},{"m":"h.","t":"Apabila dalam proses pengadaan atau dalam pelaksanaan perjanjian, terbukti telah melakukan perbuatan-perbuatan sebagaimana dimaksud pada butir 2.24.1 berdasarkan putusan dari lembaga yang berwenang.","l":624,"h":340},{"m":"5.6.2.","t":"Kepada Penyedia Barang dan/atau Jasa yang dilakukan pemutusan Perjanjian karena alasan sebagaimana dimaksud pada butir 5.4.4 dan butir 5.6.1. dimasukkan ke dalam Daftar Hitam (Blacklist) selama 2 (dua) tahun.","l":540,"h":540},{"c":"[BAB 5 angka 5.6.0]"}],[{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"k.","t":"Cara pemutusan kontrak;","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf k]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Pemutusan Surat Perjanjian/ Kontrak"},{"m":"1.","t":"Pejabat berwenang yang menandatangani Surat Perjanjian/ Kontrak dapat memutuskan kontrak secara sepihak apabila:","l":340,"h":340},{"m":"a.","t":"Penyedia Barang dan/ atau Jasa lalai atau cidera janji dalam melaksanakan kewajibannya dan tidak memperbaiki kelalaiannya dalam jangka waktu yang telah ditetapkan;","l":624,"h":340},{"m":"b.","t":"Penyedia terbukti melakukan kecurangan, pemalsuan dokumen, identitas bisnis dan/ atau Kolusi, Korupsi dan Nepotisme (KKN);","l":624,"h":340},{"m":"c.","t":"Terdapat indikasi manipulasi harga, kegiatan fiktif, dan/ atau barang dan/ atau jasa dibawah spesifikasi yang disepakati;","l":624,"h":340},{"m":"d.","t":"Ditemukan adanya kesalahan prosedur yang berpotensi menimbulkan kerugian keuangan Perusahaan dan/ atau berpotensi menimbulkan masalah hukum;","l":624,"h":340},{ h":480},{"m":"a.","t":"Pengadaan Jasa Konstruksi termasuk renovasi.","l":624,"h":340},{"m":"b.","t":"Pengadaan Jasa Akuntan Publik, konsultan dan design.","l":624,"h":340},{"m":"c.","t":"Pengadaan Jasa lain yang tidak dapat ditetapkan harga satuannya.","l":624,"h":340},{"m":"4.4.3","t":"Perjanjian dengan Harga Lumsum dilakukan dengan ketentuan sebagai berikut:","l":480,"h":480},{"m":"a.","t":"Jumlah harga pasti dan tetap serta tidak dimungkinkan penyesuaian harga.","l":624,"h":340},{"m":"b.","t":"Semua resiko sepenuhnya ditanggung oleh Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"c.","t":"Pembayaran didasarkan pada tahapan hasil pekerjaan yang dilaksanakan oleh penyedia sesuai dengan Perjanjian.","l":624,"h":340},{"m":"d.","t":"Dimungkinkan adanya pekerjaan tambah atau kurang dari perkiraan semula.","l":624,"h":340},{"c":"[BAB 4 angka 4.4.0]"},{"t":"PERJANJIAN DENGAN BLANKET ORDER"},{"m":"4.5.1","t":"Perjanjian dengan Blanket Order adalah Perjanjian Pengadaan Barang dan/atau Jasa yang didasarkan pada harga satuan dengan pengiriman barang/pelaksanaan pekerjaan disesuaikan dengan kebutuhan.","l":480,"h":480},{"m":"4.5.2","t":"Pengadaan Barang dan/atau Jasa yang dapat dilakukan dengan Perjanjian dengan Blanket Order antara lain:","l":480,"h":480},{"m":"a.","t":"Pengadaan barang Umum;","l":624,"h":340},{"m":"b.","t":"Pengadaan seragam operasional Perusahaan;","l":624,"h":340},{"m":"c.","t":"Pengadaan lavatory deodorant; dan/atau","l":624,"h":340},{"m":"d.","t":"Pengadaan suku cadang Peralatan Ground Support Equipment (GSE)/kendaraan, oli dan BBM.","l":624,"h":340},{"m":"4.5.3","t":"Perjanjian dengan Blanket Order dilakukan dengan ketentuan sebagai berikut:","l":480,"h":480},{"m":"a.","t":"Harga satuan pasti dan tetap untuk setiap Satuan Barang dan/atau Jasa dengan Spesifikasi Teknis tertentu.","l":624,"h":340},{"m":"b.","t":"Volume atau kuantitas Barang dan/atau Jasa masih bersifat perkiraan pada saat Perjanjian ditandatangani.","l":624,"h":340},{"m":"c.","t":"Penyelesaian pekerjaan/pengiriman barang sesuai permintaan.","l":624,"h":340},{"m":"d.","t":"Pembayarannya didasarkan pada hasil pengiriman barang atau volume pekerjaan yang benar-benar telah dilaksanakan sesuai permintaan.","l":624,"h":340},{"m":"e.","t":"Dimungkinkan adanya pekerjaan tambah atau kurang dari perkiraan semula.","l":624,"h":340},{"c":"[BAB 4 angka 4.5.0]"}],[{"t":"JENIS KONTRAK"},{"m":"1.","t":"Kontrak Pengadaan Barang dan/atau Jasa digolongkan berdasarkan:","l":340,"h":340},{"m":"a.","t":"Kontrak lump sum;","l":624,"h":340},{"m":"b.","t":"Kontrak harga satuan;","l":624,"h":340},{"m":"c.","t":"Kontrak gabungan;","l":624,"h":340},{"m":"d.","t":"Kontrak persentase;","l":624,"h":340},{"m":"e.","t":"Kontrak terima jadi (turnkey); dan","l":624,"h":340},{"m":"f.","t":"Kontrak payung.","l":624,"h":340},{"m":"2.","t":"Penjelasan Jenis Kontrak","l":340,"h":340},{"m":"a.","t":"Kontrak Lump Sum, yaitu kontrak Pengadaan Barang dan/atau Jasa atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Jumlah harga pasti dan tetap, sehingga tidak dimungkinkan penyesuaian harga;","l":908,"h":340},{"m":"ii.","t":"Semua resiko sepenuhnya ditanggung oleh penyedia Barang dan/atau Jasa;","l":908,"h":340},{"m":"iii.","t":"Pembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai dengan isi kontrak;","l":1003,"h":435},{"m":"iv.","t":"Sifat pekerjaan berorientasi pada keluaran (output based);","l":908,"h":340},{"m":"v.","t":"Total harga penawaran bersifat mengikat;","l":908,"h":340},{"m":"b.","t":"Kontrak Harga Satuan (Fix Unit Price Contract), yaitu kontrak Pengadaan Barang dan/atau Jasa atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Harga satuan yang pasti dan tetap untuk setiap satuan/unsur pekerjaan dengan spesifikasi teknis tertentu;","l":908,"h":340},{"m":"ii.","t":"Volume atau kuantitas pekerjaan masih bersifat perkiraan sementara pada saat kontrak ditandatangani;","l":908,"h":340},{"m":"iii.","t":"Pembayarannya didasarkan pada hasil pengukuran bersama atas volume pekerjaan yang benar-benar telah dilaksanakan oleh penyedia Barang dan/atau Jasa;","l":1003,"h":435},{"m":"iv.","t":"Pekerjaan tambah/kurang berdasarkan hasil pengukuran bersama atas pekerjaan yang diperlukan.","l":908,"h":340},{"m":"c.","t":"Kontrak gabungan (Fix Lump Sum Contract) adalah kontrak gabungan lump sum dengan harga satuan dalam 1 (satu) pekerjaan yang dijanjikan;","l":624,"h":340},{"m":"d.","t":"Kontrak persentase adalah kontrak di bidang jasa konstruksi atau pekerjaan pemborongan tertentu dimana penyedia yang bersangkutan menerima imbalan jasa berdasarkan perentase tertentu dari nilai pekerjaan fisik konstruksi/pemborongan tersebut, dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Penyedia jasa konsultasi/jasa lainnya menerima imbalan berdasarkan persentase dari nilai pekerjaan tertentu;","l":908,"h":340},{"m":"ii.","t":"Pembayaran didasarkan pada tahapan produk/keluaran yang dihasilkan sesuai isi kontrak.","l":908,"h":340},{"m":"e.","t":"Kontrak Terima Jadi (Turnkey Contract) Adalah kontrak Pengadaan Barang dan/atau Jasa pemborongan atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Jumlah harga pasti dan tetap sampai seluruh pekerjaan selesai dilaksanakan;","l":908,"h":340},{"m":"ii.","t":"Pembayaran dilakukan berdasarkan hasil penilaian bersama yang menunjukkan bahwa pekerjaan telah dilaksanakan sesuai dengan kriteria kinerja yang ditetapkan.","l":908,"h":340},{"m":"f.","t":"Kontrak payung (framework contract) adalah jenis kontrak untuk pekerjaan yang sulit ditentukan jangka waktu penyelesaian pekerjaannya atau bersifat call of order, bersifat jangka panjang dan dimanfaatkan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Jangka waktu maksimal 3 (tiga) tahun, dengan bentuk harga satuan dan volume yang sesuai dengan spesifikasi yang telah ditentukan sejak awal, dan dapat diperpanjang satu kali dengan jangka waktu maksimal;","l":908,"h":340},{"m":"ii.","t":"Pembebanan tagihan oleh penyedia dilakukan per Pengadaan/penyelesaian pekerjaan.","l":908,"h":340},{"m":"iii.","t":"Diadakan untuk menjamin harga Barang dan/atau Jasa yang lebih efisien, ketersediaan Barang dan/atau Jasa terjamin dan sifatnya dibutuhkan secara berulang dengan volume atau kuantitas atau jangka waktu pekerjaan yang belum dapat ditentukan pada saat kontrak ditandatangani;","l":1003,"h":435},{"m":"iv.","t":"Pembayaran dilakukan berdasarkan pada hasil penilaian/pengukuran bersama terhadap volume/kuantitas pekerjaan yang telah dilaksanakan oleh penyedia Barang dan/atau Jasa secara nyata.","l":908,"h":340},{"c":"[BAB VIII.C]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"3.","t":"Jenis surat perjanjian/ kontrak pengadaan barang dan/ atau jasa/ jasa konstruksi/ jasa lainnya, berdasarkan cara pembayarannya terdiri atas:","l":340,"h":340},{"m":"a.","t":"Lumpsum;","l":624,"h":340},{"m":"b.","t":"Harga satuan;","l":624,"h":340},{"m":"c.","t":"Gabungan lumpsum dan harga satuan;","l":624,"h":340},{"m":"d.","t":"Terima jadi (turnkey);","l":624,"h":340},{"m":"e.","t":"Kontrak payung.","l":624,"h":340},{"m":"4.","t":"Jenis surat perjanjian/ kontrak pengadaan jasa konsultansi, berdasarkan cara pembayarannya terdiri atas;","l":340,"h":340},{"m":"a.","t":"Lumpsum;","l":624,"h":340},{"m":"b.","t":"Waktu penugasan;","l":624,"h":340},{"m":"c.","t":"Kontrak payung.","l":624,"h":340},{"m":"5.","t":"Surat perjanjian/ Kontrak Lumpsum","l":340,"h":340},{"t":"Sistem kontrak lumpsum merupakan sistem kontrak atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu sebagaimana disepakati sebelumnya, dengan ketentuan sebagai berikut:","l":340},{"m":"a.","t":"Jumlah harga pasti dan tetap serta tidak dimungkinkan eskalasi/ penyesuaian harga;","l":624,"h":340},{"m":"b.","t":"Risiko sepenuhnya ditanggung oleh Penyedia Barang dan/ atau Jasa;","l":624,"h":340},{"m":"c.","t":"Pembayaran didasarkan pada tahapan atau hasil atau progress pelaksanaan atau prestasi kerja;","l":624,"h":340},{"m":"d.","t":"Sifat pekerjaan berorientasi kepada keluaran (output based);","l":624,"h":340},{"m":"e.","t":"Total harga bersifat pengikat.","l":624,"h":340},{"m":"7.","t":"Jenis Surat perjanjian/ Kontrak Harga Satuan dan Kontrak Payung","l":340,"h":340},{"t":"Jenis kontrak harga satuan merupakan sistem kontrak atas penyelesaian seluruh pekerjaan dalam batas waktu tertentu berdasarkan harga satuan yang pasti dan tetap, dengan ketentuan sebagai berikut:","l":340},{"m":"a.","t":"Harga satuan pasti dan tetap untuk setiap satuan atau unsur pekerjaan dengan spesifikasi teknis tertentu;","l":624,"h":340},{"m":"b.","t":"Volume atau kuantitas pekerjaannya masih bersifat perkiraan pada saat kontrak ditandatangani;","l":624,"h":340},{"m":"c.","t":"Pembayaran didasarkan pada hasil pengukuran bersama atas volume pekerjaan yang benar-benar telah dilaksanakan oleh Penyedia Barang dan/ atau Jasa;","l":624,"h":340},{"m":"d.","t":"Dimungkinkan adanya pekerjaan tambah/ kurang berdasarkan hasil pengukuran bersama atas pekerjaan yang diperlukan;","l":624,"h":340},{"m":"e.","t":"Surat perjanjian/ Kontrak harga satuan dapat digunakan sebagai dasar kontrak payung dengan tambahan pengaturan;","l":624,"h":340},{"m":"1.","t":"Surat perjanjian/ Kontrak ditujukan demi terjaminnya pasokan barang atau jasa yang sifatnya senantiasa dibutuhkan secara berulang;","l":908,"h":340},{"m":"2.","t":"Dilaksanakan untuk jangka waktu minimal 1 (satu) tahun;","l":908,"h":340},{"m":"3.","t":"Apabila memberikan manfaat yang lebih bagi Perusahaan dapat dilakukan dengan jangka waktu sampai dengan 3 (tiga) tahun;","l":908,"h":340},{"m":"4.","t":"Penyerahan/ delivery disesuaikan dengan kebutuhan;","l":908,"h":340},{"m":"5.","t":"Surat perjanjian/ Kontrak payung dimungkinkan untuk dilakukan peninjauan atau review harga per 1 (satu) tahun.","l":908,"h":340},{"m":"8.","t":"Surat perjanjian/ Kontrak Gabungan Lumpsum dan Harga Satuan","l":340,"h":340},{"t":"Sistem surat perjanjian/ kontrak gabungan antara lumpsum dan harga satuan adalah surat perjanjian/ kontrak yang merupakan gabungan lumpsum dan harga satuan dalam 1 (satu) pekerjaan.","l":340},{"m":"9.","t":"Surat perjanjian/ Kontrak Turnkey","l":340,"h":340},{"t":"Sistem surat perjanjian/ kontrak turnkey merupakan sistem kontrak terima jadi, bersifat pemborongan atau penyelesaian seluruh pekerjaan dalam batas waktu tertentu, jumlah harga pasti dan tetap sampai seluruh pekerjaan utama dan pekerjaan penunjang nya dapat berfungsi dengan baik sesuai dengan kriteria kinerja (output performance) yang dipersyaratkan.","l":340},{"m":"10.","t":"Jenis Surat perjanjian/ Kontrak Lain","l":340,"h":340},{"t":"Dalam hal dibutuhkan atau dipersyaratkan oleh Penyedia Barang dan/ atau Jasa (terbatas pada pemegang Hak Atas Kekayaan Intelektual (HAKI), Original Equipment Manufacturer (OEM) atau penyedia satu-satunya/ spesifik) maka dapat dibuat surat perjanjian/ kontrak dengan jenis atas sistem selain sistem yang dikenal dalam pedoman ini sepanjang klausul-klausul surat perjanjian/ kontrak dapat disepakati oleh Perusahaan.","l":340},{"c":"[Pasal 45 ayat (3)-(5), (7)-(10)]"}]]}]},{"heading":"D. PERUBAHAN (ADDENDUM) KONTRAK ATAU PO","rows":[{"topik":"PERUBAHAN (ADDENDUM) KONTRAK ATAU PO","cells":[[{"t":"PERUBAHAN (ADDENDUM) KONTRAK ATAU PO"},{"m":"1.","t":"Addendum adalah perubahan atas Kontrak atau PO yang ditandatangani kedua belah pihak berdasarkan Berita Acara Addendum dengan tujuan menambahkan, mengurangi atau menghilangkan suatu pernyataan atau ketentuan untuk disepakati dan disetujui oleh Unit Bisnis atau Unit Teknis dengan Penyedia.","l":340,"h":340},{"m":"2.","t":"Dalam hal terdapat perbedaan antara kondisi kebutuhan pelaksanaan pekerjaan dengan ketentuan yang tercantum dalam Kontrak/PO, Unit Bisnis atau Unit Teknis dengan Penyedia dapat melakukan perubahan Kontrak/PO yang meliputi:","l":340,"h":340},{"m":"a.","t":"Menambah atau mengurangi volume pekerjaan;","l":624,"h":340},{"m":"b.","t":"Menambah dan/atau mengurangi lingkup pekerjaan;","l":624,"h":340},{"m":"c.","t":"Mengubah spesifikasi pekerjaan sesuai dengan kebutuhan;","l":624,"h":340},{"m":"d.","t":"Mengubah jangka waktu pelaksanaan pekerjaan; dan/atau","l":624,"h":340},{"m":"e.","t":"Mengubah metode atau tata cara pembayaran.","l":624,"h":340},{"m":"3.","t":"Pekerjaan tambah/kurang diajukan dan dilaksanakan selambat-lambatnya sebelum masa kontrak berakhir.","l":340,"h":340},{"m":"4.","t":"Dalam hal dilakukan pekerjaan tambah/kurang, yang menjadi dasar penentuan harga pekerjaan tambah/kurang adalah harga pada kontrak, kecuali dalam hal harga timpang di atas 110% (seratus sepuluh persen) dari HPS. Dalam hal terdapat harga timpang, maka harga satuan timpang hanya berlaku untuk volume sesuai dengan daftar kuantitas dan harga. Jika terjadi penambahan volume, harga satuan yang berlaku sesuai dengan harga dalam HPS.","l":340,"h":340},{"m":"5.","t":"Tata cara pelaksanaan perubahan Kontrak/PO adalah sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Unit Bisnis atau Unit Teknis melakukan evaluasi teknis perubahan pekerjaan yang dituangkan dalam dokumen justifikasi;","l":624,"h":340},{"m":"b.","t":"Unit Bisnis atau Unit Teknis memberikan perintah tertulis kepada penyedia untuk melaksanakan perubahan Kontrak/PO atau penyedia mengusulkan perubahan Kontrak/PO;","l":624,"h":340},{"m":"c.","t":"Berita Acara Addendum dibuat oleh Unit Bisnis atau Unit Teknis dan disepakati bersama-sama dengan penyedia;","l":624,"h":340},{"m":"d.","t":"Dalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam PO, maka berita acara hasil klarifikasi dan negosiasi ditandatangani Unit Bisnis atau Unit Teknis dengan Penyedia (untuk perjanjian dalam bentuk Purchase Order/PO);","l":624,"h":340},{"m":"e.","t":"Dalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam kontrak, maka berita acara hasil klarifikasi dan negosiasi ditandatangani oleh Unit Bisnis atau Unit Teknis, Unit Yang Membidangi Fungsi PBJ dan Penyedia (untuk perjanjian dalam bentuk Kontrak);","l":624,"h":340},{"m":"f.","t":"Dalam Hal pekerjaan tambah kurang menyebabkan terdapatnya penambahan biaya pekerjaan, maka Unit Bisnis atau Unit Teknis wajib melakukan konfirmasi ulang ketersediaan anggaran kepada unit yang membidangi anggaran perusahaan.","l":624,"h":340},{"m":"6.","t":"Perubahan yang menyangkut harga/biaya pekerjaan baik penambahan atau pengurangan nilai Kontrak/PO, dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Penambahan nilai Kontrak/PO yang paling banyak sebesar 10% (sepuluh persen) dari total nilai Kontrak/PO awal;","l":624,"h":340},{"m":"b.","t":"Apabila penambahan nilai Kontrak/PO melebihi 10% (sepuluh persen) dari nilai Kontrak awal:","l":624,"h":340},{"m":"1)","t":"sepanjang dalam hal sisa anggaran pekerjaan masih tersedia, addendum dapat dilakukan setelah memperoleh persetujuan sesuai batas kewenangan yang berlaku;","l":908,"h":340},{"m":"2)","t":"apabila anggaran tidak tersedia, addendum wajib mendapatkan persetujuan dari Unit Yang Membidangi Fungsi Anggaran Perusahaan dan persetujuan sesuai batas kewenangan yang berlaku.","l":908,"h":340},{"m":"c.","t":"Apabila penambahan nilai Kontrak/PO melebihi 10% (sepuluh persen) dari nilai Kontrak awal dan sisa anggaran proyek tidak tersedia maka addendum dapat dilakukan sepanjang mendapatkan persetujuan dari Unit Yang Membidangi Fungsi Anggaran Perusahaan.","l":624,"h":340},{"c":"[BAB V.D]"}],[{"m":"1.","t":"Perubahan pekerjaan dapat dilakukan apabila:","l":340,"h":340},{"m":"a.","t":"Didukung dengan justifikasi/ alasan yang dapat dipertanggungjawabkan berdasarkan kondisi lapangan.","l":624,"h":340},{"m":"b.","t":"Masih sesuai dengan ketentuan/ praktek yang berlaku umum dan wajar (best practice).","l":624,"h":340},{"m":"c.","t":"Tidak merugikan kepentingan perusahaan.","l":624,"h":340},{"m":"d.","t":"Telah memperoleh persetujuan dari Vice President (VP) Unit Teknis terkait.","l":624,"h":340},{"m":"2.","t":"Perubahan pekerjaan yang meliputi penambahan atau pengurangan volume, jenis, metode atau tata cara pembayaran, spesifikasi pekerjaan sesuai kebutuhan atau jangka waktu pelaksanaan pekerjaan.","l":340,"h":340},{"m":"3.","t":"Perubahan pekerjaan dapat dinyatakan dalam bentuk addendum yang ditandatangani sesuai dengan batas kewenangan yang telah diatur dalam lampiran Peraturan Direksi ini.","l":340,"h":340},{"m":"4.","t":"Perubahan pekerjaan yang dinyatakan dalam bentuk addendum dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pekerjaan yang menggunakan kontrak payung;","l":624,"h":340},{"m":"b.","t":"Perubahan yang menyangkut jangka waktu pelaksanaan pekerjaan, volume pekerjaan, jenis pekerjaan, tata cara pembayaran, dan/ atau spesifikasi yang tidak mengakibatkan perubahan harga/ biaya pekerjaan;","l":624,"h":340},{"m":"c.","t":"Perubahan yang menyangkut harga/ biaya pekerjaan","l":624,"h":340},{"m":"5.","t":"Dalam hal terdapat perubahan ruang lingkup pekerjaan yang mengakibatkan penambahan/ pengurangan biaya atas Kontrak yang telah ditandatangani, maka berlaku ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"untuk perubahan biaya sampai dengan 20% (dua puluh persen) dari nilai Kontrak, maka dapat langsung dilakukan addendum Kontrak atas penambahan ruang lingkup pekerjaan tersebut setelah memperoleh persetujuan VP Unit Teknis terkait sesuai akumulasi nilai pengadaan.","l":624,"h":340},{"m":"b.","t":"untuk perubahan biaya di atas 20% (dua puluh persen) dari nilai Kontrak dapat dilakukan dengan membuat justifikasi yang dapat dipertanggungjawabkan dan memperoleh persetujuan Direksi Unit Teknis terkait.","l":624,"h":340},{"c":"[Pasal 36]"}],[{"t":"PEKERJAAN TAMBAH/KURANG"},{"m":"4.13.1","t":"Pekerjaan tambah/kurang dimungkinkan ketika Perjanjian/pelaksanaan pekerjaan masih berlangsung atau telah dikeluarkan Surat Perintah Kerja (SPK).","l":570,"h":570},{"m":"4.13.2","t":"Termasuk pekerjaan tambah/kurang antara lain tetapi tidak terbatas pada:","l":570,"h":570},{"m":"a.","t":"Volume Pekerjaan.","l":624,"h":340},{"m":"b.","t":"Jumlah Unit barang.","l":624,"h":340},{"m":"c.","t":"Jumlah SDM.","l":624,"h":340},{"m":"d.","t":"Jenis Barang dan/atau Jasa.","l":624,"h":340},{"m":"4.13.3","t":"Dalam hal terjadi kebutuhan untuk melakukan tambah, dilakukan proses sebagai berikut:","l":570,"h":570},{"m":"a.","t":"Unit Pengguna (User) mengajukan usulan tambah kepada Kepala Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"b.","t":"Unit Spesifikasi Teknis (UST) mengajukan usulan Persetujuan Penggunaan Anggaran (PPA) membuat Surat Permintaan Pengadaan (SPP) pekerjaan tambah.","l":624,"h":340},{"m":"c.","t":"Surat Permintaan Pengadaan (SPP) yang sudah disetujui Kepala Unit Spesifikasi Teknis (UST)/ Direktur Unit Spesifikasi Teknis (UST)/ Direktur Utama diserahkan kepada Unit Kerja Pengadaan untuk pelaksanaan tambah/kurang.","l":624,"h":340},{"m":"4.13.4","t":"Proses tambah kurang dilaksanakan oleh Unit Kerja Pengadaan.","l":570,"h":570},{"m":"4.13.5","t":"Khusus untuk jasa konstruksi, pekerjaan tambah dapat dilakukan untuk nilai maksimal 15% (lima belas persen) dari nilai pekerjaan yang sedang dilaksanakan.","l":570,"h":570},{"c":"[BAB 4 angka 4.13.0]"},{"t":"PERUBAHAN PERJANJIAN"},{"m":"4.14.1","t":"Perubahan Perjanjian dapat dilakukan atas persetujuan Pejabat Berwenang, yang meliputi hal-hal dan tidak terbatas pada:","l":570,"h":570},{"m":"a.","t":"Penyesuaian harga;","l":624,"h":340},{"m":"b.","t":"Menambah atau mengurangi volume pekerjaan yang tercantum dalam Perjanjian;","l":624,"h":340},{"m":"c.","t":"Menambah atau mengurangi jenis pekerjaan;","l":624,"h":340},{"m":"d.","t":"Mengubah Spesifikasi Teknis pekerjaan sesuai kebutuhan lapangan;","l":624,"h":340},{"m":"4.14.2","t":"Penyedia Barang dan/atau Jasa tidak dapat mengalihkan pelaksanaan pekerjaan yang sudah ditetapkan dalam Perjanjian kepada pihak lain tanpa persetujuan tertulis dari Pejabat Berwenang.","l":570,"h":570},{"m":"4.14.3","t":"Perubahan Perjanjian dapat dilakukan sepanjang disepakati oleh kedua belah pihak.","l":570,"h":570},{"m":"4.14.4","t":"Proses perubahan Perjanjian dilaksanakan oleh Unit Kerja Pengadaan.","l":570,"h":570},{"c":"[BAB 4 angka 4.14.0]"},{"t":"TATA CARA PERUBAHAN PERJANJIAN"},{"m":"4.15.1","t":"Pengajuan perubahan atau perpanjangan Perjanjian (addendum) dilakukan sepanjang Perjanjian induk masih berlaku.","l":570,"h":570},{"m":"4.15.2","t":"Pengajuan perubahan/perpanjangan Perjanjian dapat dilakukan atas usulan Unit Pengguna (User)/Unit Spesifikasi Teknis (UST) atau Penyedia Barang dan/atau Jasa.","l":570,"h":570},{"m":"4.15.3","t":"Pemberitahuan berakhirnya Perjanjian dan/atau usulan pengadaan baru kepada Pejabat Berwenang dilakukan selambat-lambatnya sebagai berikut:","l":570,"h":570},{"m":"a.","t":"60 (enam puluh) hari kalender sebelum jangka waktu Perjanjian berakhir, apabila Perjanjian diusulkan untuk dilakukan perpanjangan.","l":624,"h":340},{"m":"b.","t":"90 (sembilan puluh) hari kalender sebelum jangka waktu Perjanjian berakhir apabila dilakukan proses Pengadaan baru.","l":624,"h":340},{"m":"c.","t":"12 (dua belas) bulan kalender sebelum jangka waktu Perjanjian berakhir khusus untuk Perjanjian sewa apron bus/executive mini bus dan kendaraan operasional apron apabila akan dilakukan proses Pengadaan baru dengan unit kendaraan baru.","l":624,"h":340},{"m":"4.15.4","t":"Untuk usulan pengadaan baru atau perpanjangan Perjanjian sebagaimana dimaksud pada butir 4.15.3, diajukan dengan melengkapi dokumen proses pengadaan berupa Spesifikasi Teknis, Engineering Estimate (EE), Persetujuan Pemakaian Anggaran (PPA) dan Surat Permintaan Pengadaan (SPP), serta dokumen pendukung lainnya yang dianggap perlu.","l":570,"h":570},{"m":"4.15.5","t":"Dalam perpanjangan Perjanjian dimungkinkan adanya penyesuaian harga.","l":570,"h":570},{"m":"4.15.6","t":"Perubahan/perpanjangan Perjanjian dilaksanakan sebagai berikut:","l":570,"h":570},{"m":"a.","t":"Pihak yang menghendaki perubahan Perjanjian mengajukan permohonan secara tertulis kepada Unit Kerja Pengadaan disertai dengan alasan-alasan yang dapat dipertanggungjawabkan dan dapat diterima.","l":624,"h":340},{"m":"b.","t":"Permohonan tersebut dievaluasi oleh Unit Kerja Pengadaan bersama-sama dengan Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"c.","t":"Hasil evaluasi tersebut ditandatangani bersama-sama oleh Kepala Unit Kerja Pengadaan dan Kepala Unit Spefisikasi Teknis (UST).","l":624,"h":340},{"m":"d.","t":"Unit Kerja Pengadaan bersama-sama dengan Unit Spesifikasi Teknis (UST) terkait dapat melakukan Negosiasi atau klarifikasi kepada Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"e.","t":"Hasil Negosiasi ditandatangani bersama-sama oleh Kepala Unit Kerja Pengadaan dan Kepala Unit Spesifikasi Teknis (UST) serta pihak Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"f.","t":"Usulan perubahan Perjanjian yang dilengkapi dengan hasil evaluasi dan Negosiasi tersebut diajukan secara tertulis kepada Pejabat Berwenang untuk mendapatkan persetujuan.","l":624,"h":340},{"m":"g.","t":"Setelah mendapat persetujuan Pejabat Berwenang, Unit Kerja Pengadaan mengirimkan dan/atau menyerahkan dokumen proses perubahan Perjanjian kepada unit yang membidangi fungsi hukum untuk pembuatan addendum Perjanjian.","l":624,"h":340},{"m":"h.","t":"Untuk Perjanjian Pengadaan Barang dan/atau Jasa yang nilainya di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) atau di atas kewenangan Kantor Cabang, persetujuan perubahan diberikan oleh Direktur Unit Spesifikasi Teknis (UST) atau Direktur Utama sesuai kewenangannya.","l":624,"h":340},{"m":"4.15.7","t":"Perubahan/Perpanjangan Perjanjian dapat diproses setelah terpenuhinya seluruh kelengkapan dokumen, dengan urutan proses sebagai berikut:","l":570,"h":570},{"m":"a.","t":"Dokumen justifikasi dan evaluasi Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"b.","t":"Berita Acara Kesepakatan dengan Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"c.","t":"Surat permohohan perubahan/perpanjangan Perjanjian.","l":624,"h":340},{"m":"d.","t":"Surat persetujuan dari Pejabat Berwenang","l":624,"h":340},{"m":"4.15.8","t":"Apabila usulan perpanjangan Perjanjian diajukan kurang dari 60 hari kalender, maka usulan tersebut tidak dapat diproses, namun dilakukan proses Pengadaan baru melalui mekanisme Pembelian Berulang (Repeat Order/RO) yang hanya dapat dilakukan maksimal 2 (dua) kali.","l":570,"h":570},{"m":"4.15.9","t":"Apabila usulan Pengadaan baru diajukan kurang dari 90 hari kalender, atau proses Pengadaan sedang berlangsung namun Perjanjian existing sudah habis masa berlakunya, maka terhadap Perjanjian existing dapat dilakukan perpanjangan untuk masa transisi.","l":570,"h":570},{"m":"4.15.10","t":"Khusus untuk masa transisi sementara menunggu proses Pengadaan Barang dan/atau Jasa yang sedang dilaksanakan, maka perpanjangan Perjanjian atau Perjanjian baru dengan Penyedia Barang dan/atau Jasa dapat dilakukan maksimal untuk jangka waktu 6 (ENAM) BULAN.","l":660,"h":660},{"c":"[BAB 4 angka 4.15.0]"}],[{"t":"PERUBAHAN (ADDENDUM) KONTRAK ATAU SPK ATAU PO"},{"m":"1.","t":"Addendum adalah perubahan atas kontrak atau SPK atau PO yang ditandatangani kedua belah pihak berdasarkan berita acara perubahan dengan tujuan menambahkan, mengurangi atau menghilangkan suatu pernyataan atau ketentuan untuk disepakati dan disetujui oleh pejabat yang berwenang pada semua pihak terkait;","l":340,"h":340},{"m":"2.","t":"Adendum dilakukan karena adanya pekerjaan tambah/kurang atau karena adanya perubahan:","l":340,"h":340},{"m":"a.","t":"Harga; dan/atau","l":624,"h":340},{"m":"b.","t":"Spesifikasi; dan/atau","l":624,"h":340},{"m":"c.","t":"Jadwal pelaksanaan; dan/atau","l":624,"h":340},{"m":"d.","t":"Ruang lingkup; dan/atau","l":624,"h":340},{"m":"e.","t":"Volume; dan/atau","l":624,"h":340},{"m":"f.","t":"Jenis kegiatan pekerjaan; dan/atau","l":624,"h":340},{"m":"g.","t":"Syarat-syarat pekerjaan; dan/atau","l":624,"h":340},{"m":"h.","t":"Lainnya.","l":624,"h":340},{"m":"3.","t":"Yang dimaksud dengan pekerjaan tambah/kurang adalah suatu pekerjaan yang terjadi karena kondisi lapangan dan pelaksanaan pekerjaan yang tidak diperhitungkan akan terjadi dan tidak dapat dihindarkan dalam rangka penyelesaian pekerjaan Pengadaan Barang dan/atau Jasa, sehingga mengakibatkan bertambah/berkurangnya volume/jenis pekerjaan/waktu pelaksanaan pekerjaan yang tercantum dalam Perjanjian Pengadaan semula;","l":340,"h":340},{"m":"4.","t":"Apabila berdasarkan penelitian yang dilakukan memang benar mengakibatkan bertambah/berkurangnya volume/jenis pekerjaan/waktu pelaksanaan pekerjaan, maka penyedia Barang dan/atau Jasa yang bersangkutan melaksanakan pekerjaan tambah/kurang tersebut setelah menerima surat perintah pekerjaan tambah/kurang dari pejabat yang berwenang dan dituangkan dalam Addendum;","l":340,"h":340},{"m":"5.","t":"Pekerjaan tambah/kurang diajukan dan dilaksanakan selambat-lambatnya sebelum masa kontrak berakhir, dengan ketentuan:","l":340,"h":340},{"m":"a.","t":"Dalam hal dilakukan pekerjaan tambah/kurang yang menjadi dasar penentuan harga pekerjaan tambah/kurang adalah harga pada kontrak, kecuali dalam hal harga timpang di atas 110% (seratus sepuluh persen) dari HPS maka harga satuan timpang hanya berlaku untuk volume sesuai dengan daftar kuantitas dan harga. Jika terjadi penambahan volume, harga satuan yang berlaku sesuai dengan harga dalam HPS;","l":624,"h":340},{"m":"b.","t":"Dalam hal dilakukan negosiasi teknis dan harga terhadap item pekerjaan tambah yang belum tertuang dalam kontrak, maka berita acara ditanda tangani oleh Penanggung Jawab Unit Pembuat Spesifikasi Teknis dan Pejabat Unit Pengguna.","l":624,"h":340},{"m":"6.","t":"Addendum tersebut sekurang-kurangnya harus memuat antara lain:","l":340,"h":340},{"m":"a.","t":"Uraian pekerjaan tambah/kurang yang bersangkutan;","l":624,"h":340},{"m":"b.","t":"Perkiraan biaya pekerjaan tambah/kurang yang bersangkutan;","l":624,"h":340},{"m":"c.","t":"Penjadwalan ulang waktu pelaksanaan pekerjaan tersebut;","l":624,"h":340},{"m":"d.","t":"Persetujuan penyedia Barang dan/atau Jasa yang bersangkutan untuk melaksanakan pekerjaan tambah/kurang.","l":624,"h":340},{"m":"7.","t":"Tambahan biaya akibat addendum tidak boleh melebihi nilai anggaran pekerjaan yang tercantum di dalam RKAP.","l":340,"h":340},{"c":"[BAB VIII.D]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Perubahan pekerjaan dapat dilakukan apabila:","l":340,"h":340},{"m":"a.","t":"Didukung dengan justifikasi/ alasan yang dapat dipertanggungjawabkan berdasarkan kondisi lapangan.","l":624,"h":340},{"m":"b.","t":"Masih sesuai dengan ketentuan/ praktek yang berlaku umum dan wajar (best practice).","l":624,"h":340},{"m":"c.","t":"Tidak merugikan kepentingan Perusahaan.","l":624,"h":340},{"m":"d.","t":"Telah memperoleh persetujuan dari Pejabat Tertinggi atau 1 (satu) tingkat di bawah Direksi Unit Teknis terkait.","l":624,"h":340},{"m":"2.","t":"Perubahan pekerjaan yang meliputi penambahan atau pengurangan volume, jenis, metode atau tata cara pembayaran, spesifikasi pekerjaan sesuai kebutuhan atau jangka waktu pelaksanaan pekerjaan.","l":340,"h":340},{"m":"3.","t":"Perubahan pekerjaan dapat dinyatakan dalam bentuk addendum yang ditandatangani sesuai dengan batas kewenangan yang telah diatur dalam lampiran Peraturan Direksi ini.","l":340,"h":340},{"m":"4.","t":"Perubahan pekerjaan yang dinyatakan dalam bentuk addendum dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pekerjaan yang menggunakan kontrak payung;","l":624,"h":340},{"m":"b.","t":"Perubahan yang menyangkut jangka waktu pelaksanaan pekerjaan, volume pekerjaan, jenis pekerjaan, tata cara pembayaran, dan/ atau spesifikasi yang tidak mengakibatkan perubahan harga/ biaya pekerjaan;","l":624,"h":340},{"m":"c.","t":"Perubahan yang menyangkut harga/ biaya pekerjaan","l":624,"h":340},{"m":"5.","t":"Dalam hal terdapat perubahan ruang lingkup pekerjaan yang mengakibatkan penambahan/ pengurangan biaya atas Surat Perjanjian/ Kontrak yang telah ditandatangani, maka berlaku ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"untuk perubahan biaya sampai dengan 20% (dua puluh persen) dari nilai pengadaan barang dan/ atau jasa, maka dapat langsung dilakukan addendum Surat Perjanjian/ Kontrak atas penambahan ruang lingkup pekerjaan tersebut setelah memperoleh persetujuan Pejabat Tertinggi atau 1 (satu) tingkat di bawah Direksi Unit Teknis terkait sesuai akumulasi nilai pengadaan.","l":624,"h":340},{"m":"b.","t":"untuk perubahan biaya di atas 20% (dua puluh persen) dari nilai Surat Perjanjian/ Kontrak dapat dilakukan dengan membuat justifikasi yang dapat dipertanggungjawabkan dan memperoleh persetujuan Direksi Unit Teknis terkait.","l":624,"h":340},{"c":"[Pasal 47]"}]]}]},{"heading":"E. PENUNDAAN KONTRAK/PO","rows":[{"topik":"PENUNDAAN KONTRAK/PO","cells":[[{"t":"PENUNDAAN KONTRAK/PO"},{"m":"1.","t":"Dalam hal terdapat indikasi penyimpangan dan/atau kecurangan dalam pelaksanaan Kontrak/PO yang berpotensi menimbulkan kerugian bagi Perusahaan, Direksi mengambil langkah strategis untuk mengatasi indikasi tersebut, termasuk dapat memerintahkan penundaan pelaksanaan Kontrak/PO.","l":340,"h":340},{"m":"2.","t":"Indikasi sebagaimana dimaksud pada poin 1 antara lain:","l":340,"h":340},{"m":"a.","t":"Adanya indikasi manipulasi harga baik penggelembungan (markup) maupun mengurangi (mark down);","l":624,"h":340},{"m":"b.","t":"Adanya indikasi proyek fiktif;","l":624,"h":340},{"m":"c.","t":"Adanya indikasi pemalsuan identitas bisnis dan dokumen yang disampaikan pada saat proses PBJ;","l":624,"h":340},{"m":"d.","t":"Adanya indikasi barang dan/atau jasa dibawah spesifikasi/kualitas yang disepakati.","l":624,"h":340},{"m":"e.","t":"Adanya indikasi lain yang dinilai dapat merugikan Perusahaan.","l":624,"h":340},{"m":"3.","t":"Unit Bisnis atau Unit Teknis dapat melakukan penundaan pelaksanaan Kontrak/PO berdasarkan temuan, laporan atau permintaan yang disampaikan oleh Direksi/Dewan Komisaris/Auditor Eksternal/Pihak Pihak lainnya yang mengetahui hal-hal sebagaimana dimaksud pada poin 1.","l":340,"h":340},{"m":"4.","t":"Perusahaan tidak bertanggungjawab atas kerugian yang timbul dari penundaan pelaksanaan Kontrak/PO.","l":340,"h":340},{"m":"5.","t":"Apabila Indikasi sebagaimana pada poin 1 terbukti, maka Perusahaan berhak untuk memutuskan pelaksanaan Kontrak/PO secara sepihak dengan penyedia.","l":340,"h":340},{"m":"6.","t":"Apabila indikasi sebagaimana tersebut pada poin 1 telah dilakukan evaluasi dan tidak terbukti, maka pelaksanaan Kontrak/PO dapat dilanjutkan.","l":340,"h":340},{"c":"[BAB V.E]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENUNDAAN TRANSAKSI BISNIS"},{"m":"2.24.1.","t":"Dalam hal terjadi penyimpangan dan/atau kecurangan dalam transaksi bisnis yang mengakibatkan kerugian bagi Perusahaan, Direksi harus mengambil langkah strategis untuk mengatasi penyimpangan, kecurangan dan/atau kerugian Perusahaan yang berupa:","l":630,"h":630},{"m":"a.","t":"Adanya indikasi manipulasi harga baik penggelembungan (mark up) maupun mengurangi (mark down);","l":624,"h":340},{"m":"b.","t":"Adanya indikasi proyek pengadaan fiktif;","l":624,"h":340},{"m":"c.","t":"Adanya indikasi pemalsuan identitas mitra bisnis;","l":624,"h":340},{"m":"d.","t":"Adanya indikasi barang dan/atau jasa di bawah spesifikasi/kualitas yang disepakati.","l":624,"h":340},{"m":"2.24.2.","t":"Apabila penyimpangan, kecurangan dan/atau kerugian Perusahaan tidak dapat diatasi, maka Perusahaan melakukan penundaan pelaksanaan perjanjian dengan mitra yang berkaitan dengan transaksi bisnis tersebut.","l":630,"h":630},{"m":"2.24.3.","t":"Penundaan pelaksanaan perjanjian dilakukan oleh Direktur Utama atau Anggota Direksi atau Pejabat yang ditunjuk oleh Direktur Utama apabila indikasi penyimpangan dan/atau kecu
