ta yang telah dinyatakan memenuhi persyaratan administrasi dan teknis.","l":908},{"m":"b.","t":"Ketentuan mengenai mekanisme pembukaan Dokumen Penawaran harus disampaikan kepada Peserta atau dituangkan dalam Rencana Kerja dan Syarat (RKS).","l":624,"h":340},{"m":"c.","t":"Untuk Pelelangan dengan sistem satu tahap satu sampul, proses Pembukaan Dokumen Penawaran (administrasi, teknis dan harga) dilakukan secara tertutup oleh Panitia Pengadaan.","l":624,"h":340},{"m":"d.","t":"Untuk Pelelangan dengan sistem satu tahap satu sampul, Panitia Pengadaan mengundang seluruh Peserta untuk menyampaikan hasil penilaian adminitrasi, teknis dan harga secara terbuka.","l":624,"h":340},{"m":"e.","t":"Pelelangan dengan sistem satu tahap satu sampul, hasil pembukaan Dokumen Penawaran dituangkan dalam Berita Acara yang ditandatangani oleh Panitia Pengadaan dan seluruh Peserta yang hadir.","l":624,"h":340},{"m":"f.","t":"Untuk Pelelangan dengan sistem satu tahap dua sampul, proses pembukaan Dokumen Penawaran sampul satu (administrasi dan teknis) dilakukan secara tertutup oleh Panitia Pengadaan, sedangkan proses pembukaan Dokumen Penawaran sampul dua (harga) dilakukan secara terbuka dihadapan Peserta Pelelangan.","l":624,"h":340},{"m":"g.","t":"Untuk Pelelangan dengan sistem satu tahap dua sampul, Panitia Pengadaan mengundang seluruh Peserta untuk menyampaikan hasil penilaian sampul satu (administrasi dan teknis) dan melakukan pembukaan penawaran harga sebagaimana sampul dua (harga) terhadap Peserta yang dinyatakan lulus evaluasi administrasi dan teknis secara terbuka.","l":624,"h":340},{"m":"h.","t":"Hasil pembukaan Dokumen Penawaran dituangkan dalam Berita Acara yang ditandatangani oleh anggota Panitia Pengadaan dan pembukaan sampul dua (harga) ditandatangani oleh anggota Panitia Pengadaan dan dan seluruh Peserta yang hadir.","l":624,"h":340},{"m":"i.","t":"Penunjukan wakil Peserta untuk menandatangani Berita Acara harus disepakati oleh seluruh Peserta yang hadir.","l":624,"h":340},{"m":"j.","t":"Apabila terjadi penundaan acara penyerahan maupun pembukaan Dokumen Penawaran, maka harus diberitahukan secara tertulis kepada seluruh Peserta yang memasukkan penawaran.","l":624,"h":340},{"m":"3.4.9.","t":"Evaluasi/Penilaian Dokumen Penawaran Pelelangan","l":540,"h":540},{"m":"a.","t":"Batas waktu pelaksanaan evaluasi/penilaian Dokumen Penawaran:","l":624,"h":340},{"m":"1.","t":"Evaluasi terhadap dokumen Pelelangan (administrasi, teknis dan harga) dilakukan selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan sampul, apabila Pelelangan dilaksanakan dengan metode satu tahap satu sampul.","l":908,"h":340},{"m":"2.","t":"Evaluasi terhadap dokumen Pelelangan sampul satu (administrasi dan teknis) dilakukan selambat-lambatnya 3 (tiga) hari kerja setelah pemasukan sampul dan evaluasi terhadap sampul dua (harga) dilakukan selambat-lambatnya 3 (tiga) hari kerja setelah evaluasi sampul satu (administrasi dan teknis) selesai, apabila Pelelangan dilaksanakan dengan metode satu tahap dua sampul.","l":908,"h":340},{"m":"b.","t":"Evaluasi/penilaian dokumen Penawaran dapat dilakukan sesuai dengan sistem pemasukan yang ditetapkan dalam Pelelangan, yaitu sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Sistem Gugur","l":908,"h":340},{"m":"a)","t":"Sistem gugur dilakukan untuk Pengadaan Barang dan/atau Jasa yang menggunakan metode penyampaian satu tahap dua sampul.","l":1192,"h":340},{"m":"b)","t":"Dalam proses Pelelangan dengan menggunakan sistem gugur tidak diwajibkan Negosiasi, sehingga Peserta dengan penawaran harga terendah yang wajar dapat diusulkan sebagai pemenang.","l":1192,"h":340},{"m":"c)","t":"Apabila akan dilakukan Negosiasi, maka Negosiasi dilakukan kepada Peserta dengan harga terendah wajar yang telah dinyatakan memenuhi syarat teknis, hasil Negosiasi tidak boleh melebihi pagu anggaran.","l":1192,"h":340},{"m":"d)","t":"Hasil Negosiasi dituangkan dalam Berita Acara Negosiasi yang ditandatangani oleh Panitia Pengadaan dan wakil dari Penyedia Barang dan/atau Jasa.","l":1192,"h":340},{"m":"2.","t":"Sistem Nilai","l":908,"h":340},{"m":"a)","t":"Sistem nilai dilakukan untuk Pengadaan Barang dan/atau Jasa yang menggunakan metode penyampaian satu tahap satu sampul.","l":1192,"h":340},{"m":"b)","t":"Evaluasi/Penilaian Dokumen Penawaran dengan sistem nilai, penilaian terhadap syarat teknis dan harga dilakukan secara kumulatif dan Peserta yang meraih nilai tertinggi yang akan dipilih sebagai pemenang, sehingga dalam sistem ini penilaian terhadap harga memiliki pengaruh dalam penilaian secara keseluruhan.","l":1192,"h":340},{"m":"c)","t":"Dalam proses Pelelangan dengan menggunakan sistem nilai diwajibkan untuk dilakukan Negosiasi.","l":1192,"h":340},{"m":"d)","t":"Negosiasi dilakukan kepada Peserta yang memperoleh nilai tertinggi.","l":1192,"h":340},{"m":"e)","t":"Hasil Negosiasi tidak boleh melebihi pagu anggaran dan hasil Negosiasi dituangkan dalam Berita Acara yang ditandatangani oleh Panitia Pengadaan dan wakil dari Penyedia Barang dan/atau Jasa.","l":1192,"h":340},{"m":"f)","t":"Sistem nilai dilakukan dengan ketentuan sebagai berikut:","l":1192,"h":340},{"m":"1)","t":"besaran bobot teknis minimal 60% (enam puluh persen) dari total bobot keseluruhan dan besaran bobot harga ditentukan maksimal 30% (tiga puluh persen), sedangkan syarat administrasi maksimal 10% (sepuluh persen).","l":1476,"h":340},{"m":"2)","t":"unsur yang dinilai harus yang bersifat kuantitatif atau yang dapat dikuantitatifkan.","l":1476,"h":340},{"m":"3)","t":"dilakukan evaluasi terhadap persyaratan teknis dengan terlebih dahulu menetapkan batas kelulusan (passing grade).","l":1476,"h":340},{"m":"4)","t":"Peserta yang tidak memenuhi syarat teknis dan/atau harga yang ditawarkan tidak wajar tidak akan dinilai.","l":1476,"h":340},{"m":"5)","t":"tata cara dan kriteria penilaian harus dicantumkan dengan jelas dan rinci dalam Dokumen Pengadaan (RKS).","l":1476,"h":340},{"m":"c.","t":"Evaluasi/Penilaian Dokumen Penawaran dengan sistem satu tahap dua sampul dilakukan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Evaluasi administrasi dan teknis atau evaluasi terhadap persyaratan administrasi dan teknis dengan terlebih dahulu menetapkan batas kelulusan (passing grade).","l":908,"h":340},{"m":"2.","t":"Kepada Peserta yang memenuhi syarat administrasi dan teknis dilanjutkan pada evaluasi/penilaian harga atau sampul dua (harga).","l":908,"h":340},{"m":"3.","t":"Panitia melakukan evaluasi Harga dilihat dari kewajarannya dengan mengacu pada Harga Perkiraan Sendiri (HPS).","l":908,"h":340},{"m":"4.","t":"Harga yang terendah dan dinilai wajar diusulkan untuk ditetapkan sebagai pemenang.","l":908,"h":340},{"m":"d.","t":"Evaluasi administrasi dilakukan terhadap kelengkapan dan kebenaran dokumen yang dipersyaratkan di dalam Rencana Kerja dan Syarat (RKS).","l":624,"h":340},{"m":"e.","t":"Evaluasi teknis dilakukan terhadap unsur-unsur antara lain:","l":624,"h":340},{"m":"1.","t":"Pengadaan Barang:","l":908,"h":340},{"m":"a)","t":"Identitas/spesifikasi dan kualitas barang.","l":1192,"h":340},{"m":"b)","t":"Jadwal waktu penyerahan/pengiriman barang.","l":1192,"h":340},{"m":"c)","t":"Pelayanan purna jual.","l":1192,"h":340},{"m":"2.","t":"Pengadaan Jasa:","l":908,"h":340},{"m":"a)","t":"Jadwal waktu pelaksanaan pekerjaan.","l":1192,"h":340},{"m":"b)","t":"Jenis, kapasitas, komposisi dan jumlah peralatan yang disediakan.","l":1192,"h":340},{"m":"c)","t":"Personel inti yang digunakan dalam pelaksanaan pekerjaan.","l":1192,"h":340},{"m":"f.","t":"Apabila di dalam evaluasi administrasi dan teknis terdapat hal-hal yang dianggap kurang dan atau tidak jelas/meragukan, untuk meyakinkan kebenaran dokumen yang disampaikan, Pelaksana Pengadaan dapat melakukan klarifikasi dan konfirmasi kepada Peserta Pemilihan Langsung, termasuk mengadakan pemeriksaan barang di pabrik dan lokasi pelaksanaan pekerjaan.","l":624,"h":340},{"m":"g.","t":"Klarifikasi sebagaimana dimaksud pada huruf f dilaksanakan selambat-lambatnya:","l":624,"h":340},{"m":"1.","t":"2 (dua) hari kerja setelah evaluasi dokumen pelelangan, apabila pemilihan Langsung dilakukan dengan metode satu tahap satu sampul.","l":908,"h":340},{"m":"2.","t":"2 (dua) hari kerja setelah evaluasi dokumen pelelangan, apabila pemilihan Langsung dilakukan dengan metode satu tahap dua sampul.","l":908,"h":340},{"m":"h.","t":"Hasil evaluasi teknis dan klarifikasi yang dilakukan tidak boleh menambah, merubah, atau mengurangi isi dari surat penawaran Peserta dan kemudian dituangkan dalam Berita Acara Evaluasi Teknis dan Klarifikasi.","l":624,"h":340},{"m":"i.","t":"Berita Acara ditandatangani oleh Panitia Pengadaan dan pihak Peserta Pelelangan.","l":624,"h":340},{"m":"j.","t":"Evaluasi/Penilaian harga dilakukan untuk hal-hal antara lain:","l":624,"h":340},{"m":"1.","t":"Untuk Barang dan/atau Jasa dengan spesifikasi yang kompleks yang membutuhkan rincian harga.","l":908,"h":340},{"m":"2.","t":"Harga jauh di atas /dibawah (di atas 20%) dari Harga Perkiraan Sendiri (HPS) yang telah ditetapkan.","l":908,"h":340},{"m":"3.4.11.","t":"Hasil Pelelangan","l":630,"h":630},{"m":"a.","t":"Setelah Panitia Pengadaan menyelesaikan seluruh tahapan proses Pelelangan dan setelah kesepakatan harga dengan Peserta tercapai, maka Panitia Pengadaan menyusun Berita Acara Hasil Pelelangan (BAHP).","l":624,"h":340},{"m":"b.","t":"Materi yang dituangkan dalam Berita Acara Hasil Pelelangan (BAHP) sekurang-kurangnya terdiri dari keterangan-keterangan sebagai berikut :","l":624,"h":340},{"m":"1.","t":"Jumlah Peserta yang diundang, mendaftar Pelelangan dan mengikuti penjelasan umum (aanwijzing).","l":908,"h":340},{"m":"2.","t":"Hasil pemasukan surat penawaran.","l":908,"h":340},{"m":"3.","t":"Hasil evaluasi administrasi dan penilaian teknis.","l":908,"h":340},{"m":"4.","t":"Hasil pembukaan surat penawaran harga.","l":908,"h":340},{"m":"5.","t":"Hasil Negosiasi.","l":908,"h":340},{"m":"6.","t":"Usulan penetapan calon pemenang.","l":908,"h":340},{"m":"c.","t":"Hasil Pelelangan diusulkan kepada Pejabat Berwenang untuk disetujui dan ditetapkan pemenangnya.","l":624,"h":340},{"m":"3.4.12.","t":"Penetapan Pemenang Pelelangan","l":630,"h":630},{"m":"a.","t":"Usulan calon pemenang Pelelangan dilakukan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Peserta dengan harga penawaran terendah pada sistem gugur.","l":908,"h":340},{"m":"2.","t":"Peserta dengan nilai tertinggi pada sistem nilai.","l":908,"h":340},{"m":"3.","t":"Terdapat 2 (dua) atau harga penawaran terendah yang sama, maka Panitia Pengadaan dapat memilih Peserta yang memiliki nilai evaluasi teknis tertinggi.","l":908,"h":340},{"m":"b.","t":"Usulan penetapan calon pemenang Pelelangan dilaksanakan selambat-lambatnya:","l":624,"h":340},{"m":"1.","t":"3 (tiga) hari kerja sejak evaluasi administrasi, teknis dan harga atau klairifikasi/Negosiasi, apabila Pelelangan dilakukan dengan metode satu tahap satu sampul.","l":908,"h":340},{"m":"2.","t":"3 (tiga) hari kerja sejak pembukaan sampul dua (harga)/evaluasi harga, apabila Pelelangan dilakukan dengan metode satu tahap dua sampul.","l":908,"h":340},{"m":"c.","t":"Setelah proses Pelelangan selesai, Panitia Pengadaan mengajukan usulan penetapan calon pemenang Pelelangan kepada Pejabat Berwenang sesuai dengan kewenangannya, dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"2.","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Utama bersama Direktur Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"d.","t":"Usulan penetapan calon pemenang Pelelangan sekurang-kurangnya memuat informasi sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Nama perusahaan Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"2.","t":"Alamat perusahaan.","l":908,"h":340},{"m":"3.","t":"Nama Barang dan/atau Jasa.","l":908,"h":340},{"m":"4.","t":"Jumlah Barang dan/atau Jasa.","l":908,"h":340},{"m":"5.","t":"Harga satuan dan total harga Barang dan/atau Jasa.","l":908,"h":340},{"m":"6.","t":"Jangka waktu pelaksanaan pekerjaan.","l":908,"h":340},{"m":"7.","t":"Lokasi pelaksanaan pekerjaan.","l":908,"h":340},{"m":"e.","t":"Penetapan pemenang Pelelangan mengikat secara sah apabila:","l":624,"h":340},{"m":"1.","t":"Dalam jangka waktu masa sanggah yang telah ditentukan tidak ada sanggahan dari Peserta Pelelangan.","l":908,"h":340},{"m":"2.","t":"Sanggahan yang diterima ternyata tidak terbukti dan atau tidak benar.","l":908,"h":340},{"m":"f.","t":"Dalam proses penetapan pemenang Pelelangan diberikan masa sanggah.","l":624,"h":340},{"m":"g.","t":"Bagi Peserta yang ditetapkan sebagai pemenang Pelelangan kemudian mengundurkan dengan alasan apapun, maka terhadap Peserta yang bersangkutan diberikan sanksi sesuai ketentuan yang berlaku dan jaminan penawaran Peserta tersebut menjadi milik Perusahaan dan dapat dicairkan Perusahaan.","l":624,"h":340},{"m":"3.4.13.","t":"Pengumuman Pemenang Pelelangan","l":630,"h":630},{"m":"a.","t":"Setelah usulan pemenang disetujui dan ditetapkan, pemenang Pelelangan diumumkan dan diberitahukan oleh Panitia Pengadaan kepada para Peserta Pelelangan selambat-lambatnya 2 (dua) hari kerja dari tanggal penetapan pemenang oleh Pejabat Berwenang.","l":624,"h":340},{"m":"b.","t":"Apabila pemenang Pelelangan sudah diumumkan dan sudah melewati masa sanggah, maka surat jaminan penawaran dapat diambil oleh Peserta yang tidak berhasil menjadi pemenang dengan menunjukkan surat tanda terima penyerahan jaminan penawaran yang asli, sedangkan Peserta yang dinyatakan sebagai pemenang Pelelangan dapat mengambil surat jaminan penawaran dengan menyerahkan surat jaminan pelaksanaan.","l":624,"h":340},{"m":"c.","t":"Panitia Pengadaan kemudian menyiapkan Surat Perintah Kerja (SPK) kepada pemenang sebagai dasar pelaksanaan pekerjaan.","l":624,"h":340},{"m":"d.","t":"Surat Perintah Kerja (SPK) sekurang-kurangnya memuat informasi sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Nama Penyedia Barang dan/atau Jasa;","l":908,"h":340},{"m":"2.","t":"Alamat Penyedia Barang dan/atau Jasa;","l":908,"h":340},{"m":"3.","t":"Nama pekerjaan yang akan dilaksanakan;","l":908,"h":340},{"m":"4.","t":"Harga Barang dan/atau Jasa;","l":908,"h":340},{"m":"5.","t":"Spesifikasi Teknis/uraian pekerjaan;","l":908,"h":340},{"m":"6.","t":"Cara Pembayaran;","l":908,"h":340},{"m":"7.","t":"Waktu Pengiriman/pelaksanaan pekerjaan; dan","l":908,"h":340},{"m":"8.","t":"Lokasi Pengiriman/pelaksanaan pekerjaan.","l":908,"h":340},{"m":"e.","t":"Surat Perintah Kerja (SPK) sebagaimana dimaksud pada huruf c ditandatangani oleh Pejabat Berwenang dan Pelaksana Pekerjaan.","l":624,"h":340},{"m":"f.","t":"Setelah menyampaikan Surat Perintah Kerja (SPK), Panitia Pengadaan menyerahkan seluruh dokumen Pelelangan kepada unit yang membidangi Perjanjian.","l":624,"h":340},{"m":"3.4.16.","t":"Pelaksanaan Pelelangan di Kantor Cabang","l":630,"h":630},{"m":"a.","t":"Kantor Cabang dapat melaksanakan Pengadaan dengan Nilai Pengadaan di atas kewenangannya setelah mendapat Pelimpahan Wewenang dari Pejabat Berwenang dan Direktur yang membidangi Pengadaan.","l":624,"h":340},{"m":"b.","t":"Untuk melaksanakan Pengadaan di atas kewenangannya, Pejabat Berwenang Kantor Cabangmengajukan usulan ke Pejabat Berwenang dan Direktur yang membidangi Pengadaan dengan disertai alasan-alasan dan pertimbangan-pertimbangannya.","l":624,"h":340},{"m":"c.","t":"Usulan tersebut dilakukan secara tertulis dan ditandatangani oleh Pejabat Berwenang Kantor Cabang.","l":624,"h":340},{"m":"d.","t":"Usulan yang telah disampaikan tersebut dilakukan evaluasi oleh Unit Kerja Pengadaan di Kantor Pusat dan selanjutnya Kepala Unit Kerja Pengadaan di Kantor Pusat menyampaikan pendapatnya kepada Pejabat Berwenang dan/atau Direktur yang membidangi pengadaan.","l":624,"h":340},{"m":"e.","t":"Dalam hal Pelimpahan Wewenang tersebut disetujui, maka Pejabat Berwenang dan/atau Direktur yang membidangi Pengadaan menandatangani surat persetujuan Pelimpahan Wewenang, namun apabila Pelimpahan Wewenang tidak disetujui, maka pelaksanaan Pelelangan tetap dilaksanakan oleh Kantor Pusat.","l":624,"h":340},{"m":"f.","t":"Setelah mendapat persetujuan Pelimpahan Wewenang dari Kantor Pusat, Pejabat Berwenang Kantor Cabang membentuk Panitia Pengadaan Kantor Cabang.","l":624,"h":340},{"m":"g.","t":"Panitia Pengadaan melaksanakan proses Pengadaan sesuai ketentuan yang berlaku.","l":624,"h":340},{"m":"h.","t":"Setelah proses Pengadaan selesai, Ketua Panitia Pengadaan Kantor Cabang membuat laporan hasil Pengadaan kepada Pejabat Berwenang Kantor Cabang.","l":624,"h":340},{"m":"i.","t":"Usulan penetapan pemenang/Pelaksana Pengadaan yang disampaikan oleh Pejabat Berwenang Kantor Cabang terlebih dahulu diverifikasi oleh Kepala Unit Kerja Pengadaan di Kantor Pusat.","l":624,"h":340},{"m":"j.","t":"Pejabat Berwenang Kantor Cabang mengajukan usulan penetapan pemenang/Pelaksana Pengadaan kepada Direktur sesuai kewenangannya melalui surat usulan dengan melampirkan sekurang-kurang dokumen sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Surat Permintaan Pengadaan (SPP);","l":908,"h":340},{"m":"2.","t":"Surat Pelimpahan Wewenang;","l":908,"h":340},{"m":"3.","t":"Rencana Kerja dan Syarat (RKS);","l":908,"h":340},{"m":"4.","t":"Harga Perkiraan Sendiri (HPS);","l":908,"h":340},{"m":"5.","t":"Berita Acara (Penjelasan, pemasukan, klarifikasi/Negosiasi dan hasil Pengadaan Barang dan/atau Jasa);","l":908,"h":340},{"m":"6.","t":"Dokumen administrasi calon pemenang; dan","l":908,"h":340},{"m":"7.","t":"Surat Penawaran harga semua Peserta.","l":908,"h":340},{"m":"k.","t":"Surat Usulan yang tidak dilengkapi dengan dokumen dimaksud tidak akan diproses dan Kepala Unit Kerja Pengadaan di Kantor Pusat mengembalikan surat usulan tersebut untuk dilengkapi.","l":624,"h":340},{"m":"l.","t":"Setelah dokumen lengkap, Kepala Unit Kerja Pengadaan di Kantor Pusat melakukan evaluasi atas dokumen yang disampaikan oleh Kantor Cabang.","l":624,"h":340},{"m":"m.","t":"Berdasarkan hasil evaluasi, Kepala Unit Kerja Pengadaan di Kantor Pusat mengajukan pendapatnya kepada Direktur sesuai kewenangannya.","l":624,"h":340},{"m":"n.","t":"Setelah mendengar pendapat dari Kepala Unit Kerja Pengadaan di Kantor Pusat, Direktur sesuai kewenangannya memberikan jawaban secara tertulis kepada Kantor Cabang.","l":624,"h":340},{"m":"o.","t":"Jawaban tersebut dapat berupa persetujuan penetapan pemenang atau penolakan penetaan pemenang.","l":624,"h":340},{"m":"p.","t":"Apabila disetujui dan dikeluarkan Surat Penetapan Pemenang, berdasarkan surat dimaksud, Pejabat Berwenang Kantor Cabang memerintahkan Panitia Pengadaan Kantor Cabang untuk membuat pemberitahuan/pengumuman pemenang kepada seluruh Peserta.","l":624,"h":340},{"m":"q.","t":"Keberatan/Sanggahan dari Peserta diajukan kepada Pejabat Berwenang Kantor Cabang.","l":624,"h":340},{"m":"r.","t":"Alasan-alasan dan mekanisme proses sanggahan sebagaimana dimaksud pada butir 3.4.14 Manual Pengadaan Barang dan/atau Jasa ini.","l":624,"h":340},{"m":"s.","t":"Mekanisme penetapan pemenang dan Pelelangan ulang tetap merujuk pada ketentuan ketentuan 3.4.12 dan 3.4.15 Manual Pengadaan Barang/ Jasa ini.","l":624,"h":340},{"m":"t.","t":"Setelah Pejabat Berwenang menandatangani surat persetujuan penetapan pemenang Pelelangan, Kepala Unit Kerja Pengadaan menerbitkan Surat Perintah Kerja (SPK) untuk ditandatangani Pejabat Berwenang.","l":624,"h":340},{"m":"u.","t":"Untuk Pelelangan yang prosesnya dilimpahkan ke Kantor Cabang berdasarkan Surat Penetapan Pemenang dari Pejabat Berwenang, Surat Perintah Kerja (SPK) ditandatangani oleh Pejabat Berwenang Kantor Cabang.","l":624,"h":340},{"m":"3.4.17.","t":"Dokumen Pelelangan","l":630,"h":630},{"m":"a.","t":"Dokumen Pelelangan terdiri dari:","l":624,"h":340},{"m":"1.","t":"Surat Permintaan Pengadaan (SPP);","l":908,"h":340},{"m":"2.","t":"Harga Perkiraan Sendiri (HPS);","l":908,"h":340},{"m":"3.","t":"Rencana Kerja dan Syarat (RKS) berikut perubahannya;","l":908,"h":340},{"m":"4.","t":"Undangan/Pengumuman Pelelangan;","l":908,"h":340},{"m":"5.","t":"Form-form yang diperlukan (misal: daftar hadir, dll);","l":908,"h":340},{"m":"6.","t":"Seluruh Berita Acara tahapan Pelelangan beserta lampirannya, antara lain tidak terbatas sebagai berikut:","l":908,"h":340},{"m":"a)","t":"Berita Acara Penjelasan;","l":1192,"h":340},{"m":"b)","t":"Berita Acara Pemasukan Surat Penawaran Harga;","l":1192,"h":340},{"m":"c)","t":"Berita Acara Evaluasi Administrasi dan Teknis;","l":1192,"h":340},{"m":"d)","t":"Berita Acara Klarifikasi;","l":1192,"h":340},{"m":"e)","t":"Berita Acara Pembukaan Harga;","l":1192,"h":340},{"m":"f)","t":"Berita Acara Negosiasi (dengan memperhatikan ketentuan butir 3.4.9 huruf b angka 1 poin b); dan","l":1192,"h":340},{"m":"g)","t":"Berita Acara Hasil Pelelangan.","l":1192,"h":340},{"m":"7.","t":"Berkas administrasi Peserta Pelelangan.","l":908,"h":340},{"m":"8.","t":"Surat penawaran harga Peserta Pelelangan.","l":908,"h":340},{"m":"9.","t":"Hal-hal lain yang berkaitan dengan Pelelangan dan perlu di dokumentasikan.","l":908,"h":340},{"m":"b.","t":"Seluruh dokumen Pelelangan sebagaimana dimakusd pada huruf a dijadikan 1 (satu) dan disimpan oleh Unit Kerja Pengadaan.","l":624,"h":340},{"c":"[BAB 3 angka 3.4.1-3.4.4, 3.4.6, 3.4.8-3.4.9, 3.4.11-3.4.13, 3.4.16-3.4.17]"}],[{"t":"TENDER/SELEKSI UMUM"},{"m":"1.","t":"Tender Umum, yaitu Pengadaan yang diumumkan secara luas melalui media massa guna memberi kesempatan kepada Penyedia Barang yang memenuhi kualifikasi untuk mengikuti Tender;","l":340,"h":340},{"m":"2.","t":"Seleksi Umum, yaitu Pengadaan yang diumumkan secara luas melalui media massa guna memberi kesempatan kepada Penyedia Jasa yang memenuhi kualifikasi untuk mengikuti Tender;","l":340,"h":340},{"m":"3.","t":"Pengadaan Barang dan/atau Jasa dengan prosedur tender/seleksi umum dengan mengumumkan secara luas melalui website perusahaan dan/atau media massa (cetak/elektronik) guna memberi kesempatan kepada Penyedia Barang dan/atau Jasa yang memenuhi kualifikasi untuk mengikuti tender/seleksi;","l":340,"h":340},{"m":"4.","t":"Tender/seleksi umum dilaksanakan oleh Unit Pengadaan dengan melibatkan Unit Spesifikasi Teknis dan Unit Pengguna;","l":340,"h":340},{"m":"5.","t":"Pemenang Tender/Seleksi Umum dipilih atas dasar hasil evaluasi dan tidak diwajibkan untuk melakukan negosiasi harga dengan calon pemenang;","l":340,"h":340},{"m":"6.","t":"Metode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode Tender/Seleksi Umum adalah secara non tunai;","l":340,"h":340},{"m":"7.","t":"Tender/Seleksi Umum dinyatakan gagal oleh Unit Pengadaan, apabila memenuhi salah satu kondisi sebagai berikut :","l":340,"h":340},{"m":"a.","t":"jumlah Penyedia Barang dan/atau Jasa yang memasukkan penawaran kurang dari 3 (tiga) peserta,","l":624,"h":340},{"m":"b.","t":"tidak ada penawaran yang memenuhi persyaratan administrasi dan teknis; atau","l":624,"h":340},{"m":"c.","t":"harga penawaran terendah melebihi HPS.","l":624,"h":340},{"m":"8.","t":"Tender/Seleksi Umum dinyatakan gagal oleh Unit Pengguna atau Direksi, apabila memenuhi salah satu kondisi sebagai berikut:","l":340,"h":340},{"m":"a.","t":"sanggahan dari Penyedia Barang dan/atau Jasa ternyata benar; atau","l":624,"h":340},{"m":"b.","t":"pelaksanaan Tender/seleksi Umum tidak sesuai atau menyimpang dari dokumen Pengadaan Barang dan/atau Jasa yang telah ditetapkan; atau","l":624,"h":340},{"m":"c.","t":"ditemukan adanya ketidakpatutan dalam proses pelaksanaan dan Pengadaan barang /jasa oleh Unit Pengadaan dan penyedia/peserta.","l":624,"h":340},{"m":"d.","t":"Ketidakpatutan sebagaimana dimaksud pada huruf c harus dapat dibuktikan dengan melampirkan bukti-bukti terkait disertai dengan pertimbangan- pertimbangan yang relevan.","l":624,"h":340},{"m":"9.","t":"Apabila Tender/seleksi Umum dinyatakan gagal, maka Unit Pengadaan segera melakukan Tender/Seleksi Umum ulang;","l":340,"h":340},{"m":"10.","t":"Apabila dalam Tender/seleksi Umum ulang ini jumlah yang memasukkan penawaran masih kurang dari 3 (tiga) peserta, maka dilakukan Tender/Seleksi terbatas atau Penunjukan Langsung sesuai dengan prosedur yang berlaku.","l":340,"h":340},{"c":"[BAB V.F]"},{"t":"JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"},{"m":"1.","t":"Jadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode Tender/Seleksi Umum meliputi:","l":340,"h":340},{"m":"a.","t":"Pengumuman dilaksanakan sekurang-kurangnya dilakukan 1 (satu) kali pengumuman melalui media massa dan/atau website;","l":624,"h":340},{"m":"b.","t":"Pendaftaran dan pengambilan dokumen Tender/Seleksi Umum dilakukan selambat-lambatnya 3 (tiga) hari setelah dikeluarkannya pengumuman Tender/Seleksi Umum;","l":624,"h":340},{"m":"c.","t":"Penjelasan (aanwijzing) dilaksanakan selambat-lambatnya 3 (tiga) hari setelah batas akhir pengambilan dokumen tender/seleksi dan proses pelaksanaannya dituangkan dalam Berita Acara yang ditanda tangani oleh Unit Pengadaan dan calon peserta Tender/Seleksi Umum;","l":624,"h":340},{"m":"d.","t":"Penyampaian penawaran dilaksanakan selambat-lambatnya 3 (tiga) hari setelah penjelasan (aanwijzing);","l":624,"h":340},{"m":"e.","t":"Pembukaan dokumen penawaran dilaksanakan maksimal 3 (tiga) hari setelah penutupan pemasukan dokumen penawaran. Pelaksanaan pembukaan dokumen penawaran dituangkan dalam Berita Acara Pembukaan Penawaran. Berita Acara Pembukaan Penawaran ditanda tangani oleh Unit Pengadaan;","l":624,"h":340},{"m":"f.","t":"Evaluasi dokumen dan evaluasi penawaran, dilaksanakan pada hari pembukaan dokumen penawaran dan proses pelaksanaannya dituangkan dalam Berita Acara Evaluasi yang ditanda tangani oleh unit Pengadaan dan pelaksana evaluasi;","l":624,"h":340},{"m":"g.","t":"Pengumuman calon pemenang Tender/Seleksi Umum hasil evaluasi selambat-lambatnya 2 (dua) hari setelah selesainya evaluasi Tender/Seleksi Umum oleh unit Pengadaan;","l":624,"h":340},{"m":"h.","t":"Masa sanggah diberikan sesuai ketentuan terhitung sejak pengumuman Calon pemenang Tender/Seleksi Umum;","l":624,"h":340},{"m":"i.","t":"Unit Pengadaan mengajukan permohonan penerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa kepada Pejabat Pemohon sesuai Batas Kewenangan selambat-lambatnya 3 (tiga) hari setelah berakhirnya masa sanggah;","l":624,"h":340},{"m":"j.","t":"Penerbitan surat keputusan penetapan Penyedia Barang dan/atau Jasa dilakukan oleh Pejabat Pemohon sesuai Batas Kewenangan selambat- lambatnya 2 (dua) hari;","l":624,"h":340},{"m":"k.","t":"Penerbitan surat Perjanjian Pengadaan dilakukan selambat-lambatnya 3 (tiga) hari setelah diterbitkannya surat keputusan penetapan Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"c":"[BAB VII.B angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"E. PENUNJUKAN LANGSUNG","rows":[{"topik":"PENUNJUKAN LANGSUNG","cells":[[{"t":"PENUNJUKAN LANGSUNG"},{"m":"1.","t":"Pelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi harga.","l":340,"h":340},{"m":"2.","t":"Penunjukan langsung sebagaimana poin 1 dapat dilakukan apabila memenuhi minimal paling sedikit salah satu persyaratan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Barang dan/atau Jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);","l":624,"h":340},{"m":"b.","t":"Hanya terdapat satu Penyedia yang dapat melaksanakan pekerjaan sesuai kebutuhan pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;","l":624,"h":340},{"m":"c.","t":"Barang dan/atau Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), di mana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia;","l":624,"h":340},{"m":"d.","t":"Apabila pelaksanaan PBJ dengan menggunakan cara Tender/Seleksi Umum atau Tender/Seleksi Terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;","l":624,"h":340},{"m":"e.","t":"Barang dan/atau Jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan (warranty) dari Original Equipment Manufacture;","l":624,"h":340},{"m":"f.","t":"Penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;","l":624,"h":340},{"m":"g.","t":"Barang dan/atau Jasa yang merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan menguntungkan dengan tidak mengorbankan kualitas Barang dan/atau Jasa;","l":624,"h":340},{"m":"h.","t":"Penanganan darurat akibat bencana alam, baik yang bersifat lokal maupun nasional (force majeure);","l":624,"h":340},{"m":"i.","t":"Barang dan/atau Jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":624,"h":340},{"m":"j.","t":"Penyedia adalah BUMN, Anak Perusahaan atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan;","l":624,"h":340},{"m":"k.","t":"PBJ dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris; dan/atau","l":624,"h":340},{"m":"l.","t":"Jasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda.","l":624,"h":340},{"m":"3.","t":"Penunjukan langsung sebagaimana dimaksud di atas dilakukan dengan ketentuan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan dan dimungkinkan dalam peraturan sektoral.","l":340,"h":340},{"m":"4.","t":"Negosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari PBJ.","l":340,"h":340},{"m":"5.","t":"Tata cara PBJ melalui Metode Penunjukan Langsung akan diatur dalam Peraturan tersendiri.","l":340,"h":340},{"c":"[BAB IV.E]"}],[{"m":"1.","t":"Pengadaan barang dan/ atau jasa melalui penunjukan langsung dilakukan dengan menunjuk langsung 1 (satu) penyedia barang dan/ atau jasa;","l":340,"h":340},{"m":"2.","t":"Penunjukan langsung sebagaimana dimaksud pada ayat (2) dapat dilakukan apabila memenuhi minimal salah satu dari persyaratan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Penunjukan langsung keadaan darurat / kahar, dengan kriteria sebagai berikut :","l":624,"h":340},{"t":"- Bencana alam, non alam dan bencana sosial;","l":624},{"t":"- Pelaksanaan operasi pencarian dan pertolongan;","l":624},{"t":"- Kerusakan sarana/ prasarana yang dapat mengganggu kegiatan pelayanan publik;","l":624},{"t":"- Pemberian bantuan kemanusian;","l":624},{"t":"- Penanganan untuk keamanan, keselamatan masyarakat, dan aset strategis perusahaan.","l":624},{"m":"b.","t":"Penyedia telah memiliki perjanjian keagenan/ distributor/ kerjasama dengan Perusahaan;","l":624,"h":340},{"m":"c.","t":"Penyedia merupakan principal, distributor dan/ atau agen yang telah memberikan surat dukungan kepada Perusahaan dalam mengikuti sebuah tender;","l":624,"h":340},{"m":"d.","t":"Barang dan/ atau jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);","l":624,"h":340},{"m":"e.","t":"Barang dan jasa yang bersifat knowledge intensive dimana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia Barang dan Jasa;","l":624,"h":340},{"m":"f.","t":"Bila pelaksanaan pengadaan barang dan/ atau jasa dengan menggunakan cara tender/ seleksi umum atau tender terbatas/ seleksi terbatas telah 2 (dua) kali dilakukan dan tidak mendapatkan penyedia barang dan jasa yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/ seleksi;","l":624,"h":340},{"m":"g.","t":"Barang dan/ atau jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan tertulis dari Original Equipment Manufacture (OEM) atau jasa konsultansi yang ditunjuk oleh pemegang Hak Atas Kekayaan Intelektual (HAKI), pemilik lisensi/ paten atau Original Equipment Manufacturer (OEM);","l":624,"h":340},{"m":"h.","t":"Barang dan Jasa atau jasa konsultansi yang berkelanjutan yang secara teknis merupakan satu kesatuan yang sifatnya rangkaian dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":624,"h":340},{"m":"i.","t":"Barang dan/ atau jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":624,"h":340},{"m":"j.","t":"BUMN, anak Perusahaan atau Perusahaan terafiliasi Badan Usaha Milik Negara (BUMN) sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan, serta merupakan produk atau layanan sesuai dengan bidang usaha dari penyedia barang dan/ atau jasa bersangkutan;","l":624,"h":340},{"m":"k.","t":"Konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda;","l":624,"h":340},{"m":"l.","t":"Jasa konsultan hukum dalam hal mengantisipasi terjadinya tuntutan atau jika terjadi tuntutan hukum kepada Perusahaan, Direksi, Komisaris dan Karyawan dalam melaksanakan tugasnya bagi perusahaan selama perbuatan tersebut tidak bertentangan dengan ketentuan internal maupun ketentuan hukum yang berlaku dan legal opinion untuk proses bisnis sehari-hari;","l":624,"h":340},{"m":"m.","t":"Jasa atau jasa konsultansi yang diperlukan untuk memberikan nasihat secara keahlian kepada Direksi.","l":624,"h":340},{"c":"[Pasal 20]"}],[{"t":"PENUNJUKAN LANGSUNG"},{"m":"3.2.1.","t":"Ketentuan Umum Penunjukan Langsung","l":540,"h":540},{"m":"a.","t":"Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung dilakukan dengan menunjuk langsung 1 (satu) Penyedia Barang dan/atau Jasa atau melalui beauty contest.","l":624,"h":340},{"m":"b.","t":"Penunjukan Langsung dapat dilakukan apabila memenuhi paling sedikit salah satu dari persyaratan berikut:","l":624,"h":340},{"m":"1.","t":"Barang dan/atau Jasa tersebut dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);","l":908,"h":340},{"m":"2.","t":"Hanya terdapat satu Penyedia Barang dan/atau Jasa yang dapat melaksanakan pekerjaan sesuai yang dipersyaratkan oleh Unit Spesifikasi Teknis (UST) atau sesuai dengan ketentuan peraturan perundang undangan;","l":908,"h":340},{"m":"3.","t":"Barang dan/atau Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), dimana untuk menggunakan dan memelihara Barang dan Jasa dimaksud membutuhkan kelangsungan pengetahuan dari Penyedia Barang dan/atau Jasa;","l":908,"h":340},{"m":"4.","t":"Barang dan/atau Jasa tersebut dimiliki oleh pemegang hak atas kekayaan intelektual atau yang memiliki jaminan (warranty) atas produsen peralatan asli (original equipment manufacture);","l":908,"h":340},{"m":"5.","t":"Dalam rangka penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis Perusahaan;","l":908,"h":340},{"m":"6.","t":"Barang dan/atau Jasa tersebut merupakan lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":908,"h":340},{"m":"7.","t":"Untuk penanganan darurat akibat bencana alam (force majeure), baik yang bersifat lokal maupun nasional;","l":908,"h":340},{"m":"8.","t":"Jasa konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda;","l":908,"h":340},{"m":"9.","t":"Pengadaan Barang dan/atau Jasa dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris;","l":908,"h":340},{"m":"10.","t":"Barang dan/atau Jasa tersebut merupakan Pembelian Berulang (Repeat Order/RO), sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang dan/atau Jasa;","l":908,"h":340},{"m":"11.","t":"Penyedia merupakan BUMN, Anak Perusahaan BUMN atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga dan tujuannya dapat dipertanggungjawabkan, dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan; dan/atau","l":908,"h":340},{"m":"12.","t":"Apabila pelaksanaan Pengadaan Barang dan/atau Jasa dengan menggunakan cara Pemilihan Langsung atau Pelelangan telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia Barang dan/atau Jasa yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti proses pemilihan.","l":908,"h":340},{"m":"c.","t":"Penunjukan Langsung sebagaimana dimaksud pada huruf a di atas dilakukan dengan syarat dan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Untuk Barang dan/atau Jasa sebagaimana dimaksud pada huruf b angka 1 s.d. 7 merupakan Barang dan/atau Jasa yang dibutuhkan dalam kondisi tertentu dan dapat dilakukan berdasarkan keterangan yang diketahui oleh Pejabat Berwenang sesuai Spesifikasi Teknis tentang kebenaran hal/ kondisi dimaksud.","l":908,"h":340},{"m":"2.","t":"Untuk Barang dan/atau Jasa sebagaimana dimaksud pada huruf b angka 8 s.d. 10 dilakukan berdasarkan hasil seleksi atau perbandingan (beauty contest) yang meliputi aspek administrasi, teknis dan perkiraan harga, yang dilakukan oleh Unit Spesifikasi Teknis (UST) dan mendapat persetujuan Pejabat Berwenang sesuai kewenangannya.","l":908,"h":340},{"m":"3.","t":"Untuk barang/ jasa sebagaimana dimaksud pada huruf b angka 11 dilakukan berdasarkan hasil analisis yang menunjukkan manfaat paling optimal dan lebih menguntungkan bagi Perusahaan yang dituangkan dalam Justifikasi yang ditandatangani oleh Kepala Unit Spesifikasi Teknis (UST) dan persetujuan Pejabat Berwenang.","l":908,"h":340},{"m":"4.","t":"Untuk kondisi sebagaimana dimaksud pada huruf b angka 12 dilakukan berdasarkan laporan hasil Pemilihan Langsung Ulang atau Pelelangan ulang yang gagal.","l":908,"h":340},{"m":"d.","t":"Pelaksana Pengadaan yang berwenang melakukan Penunjukan Langsung adalah sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Kantor Pusat","l":908,"h":340},{"m":"a)","t":"Nilai Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Unit Pelaksana Pengadaan.","l":1192,"h":340},{"m":"b)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Panitia Pengadaan.","l":1192,"h":340},{"m":"2.","t":"Kantor Cabang","l":908,"h":340},{"m":"a)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. batas kewenangannya masing-masing dilakukan oleh Unit Pelaksana Pengadaan Kantor Cabang.","l":1192,"h":340},{"m":"b)","t":"Nilai Pengadaan di atas batas kewenangannya sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Pelaksana Pengadaan Kantor Pusat.","l":1192,"h":340},{"m":"c)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Panitia Pengadaan Kantor Pusat.","l":1192,"h":340},{"m":"d)","t":"Nilai Pengadaan di atas batas kewenangan Kantor Cabang setelah dilimpahkan oleh Kantor Pusat dilaksanakan oleh Panitia Pengadaan Kantor Cabang.","l":1192,"h":340},{"m":"e.","t":"Penunjukan Langsung sebagaimana dimaksud pada huruf b angka 1 s.d. 11 dilaksanakan berdasarkan hasil evaluasi yang tertuang dalam justifikasi Penunjukan Langsung yang memuat aspek-aspek sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Latar belakang:","l":908,"h":340},{"t" nyerahkan dokumen usulan persetujuan Penunjukan Langsung kepada Direktur Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"d)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) sampai dengan Rp50.000.000.000,- (lima puluh miliar rupiah):","l":1192,"h":340},{"m":"1)","t":"Diusulkan oleh Kepala Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"2)","t":"Unit Spesifikasi Teknis (UST) membuat justifikasi Penunjukan Langsung.","l":1476,"h":340},{"m":"3)","t":"Justifikasi tersebut di sampaikan ke Unit Kerja Pengadaan untuk diverifikasi.","l":1476,"h":340},{"m":"4)","t":"Unit Kerja Pengadaan menyerahkan dokumen usulan persetujuan Penunjukan Langsung kepada Panitia Pengadaan untuk diajukan persetujuan ke Direktur Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"e)","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah):","l":1192,"h":340},{"m":"1)","t":"Diusulkan oleh Kepala Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"2)","t":"Unit Spesifikasi Teknis (UST) membuat justifikasi Penunjukan Langsung.","l":1476,"h":340},{"m":"3)","t":"Justifikasi tersebut di sampaikan ke Unit Kerja Pengadaan untuk diverifikasi.","l":1476,"h":340},{"m":"4)","t":"Unit Kerja Pengadaan menyerahkan dokumen usulan persetujuan Penunjukan Langsung kepada Panitia Pengadaan untuk diajukan persetujuan ke Direktur Unit Spesifikasi Teknis (UST) dan Direktur Utama.","l":1476,"h":340},{"m":"f)","t":"Setelah mendapatkan persetujuan dari Pejabat Berwenang atas usulan Penujukan Langsung, Pelaksana Pengadaan melaksanakan proses Penunjukan Langsung sesuai kewenangannya.","l":1192,"h":340},{"m":"2.","t":"Kantor Cabang","l":908,"h":340},{"m":"a)","t":"Nilai Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah) sampai dengan kewenangan Kantor Cabang:","l":1192,"h":340},{"m":"1)","t":"Kantor Cabang membuat justifikasi Penunjukan Langsung dan diajukan secara tertulis kepada Unit Spesifikasi Teknis (UST) Kantor Pusat dengan menjelaskan kondisi sebagaimana dimaksud benar - benar terjadi.","l":1476,"h":340},{"m":"2)","t":"Unit Spesifikasi Teknis (UST) Kantor Pusat melakukan evaluasi atas usulan dimaksud dan apabila kondisi diyakini kebenarannya, Kepala Unit Spesifikasi Teknis (UST) Kantor Pusat memberikan tandatangan pada form keterangan tentang kondisi tersebut.","l":1476,"h":340},{"m":"3)","t":"Justifikasi tersebut di sampaikan ke Unit Kerja Pengadaan Kantor Pusat untuk diajukan usulan persetujuan Penunjukan Langsung ke Direktur Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"4)","t":"Setelah mendapatkan persetujuan dari Direktur Unit Spesifikasi Teknis (UST) atas usulan Penujukan Langsung, Kantor Cabang melaksanakan proses Penunjukan Langsung sesuai kewenangannya.","l":1476,"h":340},{"m":"b)","t":"Nilai Pengadaan di atas kewenangan Kantor Cabang sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah):","l":1192,"h":340},{"m":"1)","t":"Kantor Cabang membuat justifikasi Penunjukan Langsung dan diajukan secara tertulis kepada Unit Spesifikasi Teknis (UST) Kantor Pusat dengan menjelaskan kondisi sebagaimana dimaksud benar-benar terjadi.","l":1476,"h":340},{"m":"2)","t":"Unit Spesifikasi Teknis (UST) Kantor Pusat melakukan evaluasi atas usulan dimaksud dan apabila kondisi diyakini kebenarannya, Kepala Unit Spesifikasi Teknis (UST) Kantor Pusat memberikan tandatangan pada form keterangan tentang kondisi tersebut.","l":1476,"h":340},{"m":"3)","t":"Justifikasi tersebut disampaikan ke Unit Kerja Pengadaan Kantor Pusat untuk diajukan usulan persetujuan Penunjukan Langsung ke Direktur Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"4)","t":"Setelah mendapatkan persetujuan dari Direktur Unit Spesifikasi Teknis (UST) atas usulan persetujuan Penujukan Langsung, Unit Kerja Pengadaan Kantor Pusat melaksanakan proses Penunjukan Langsung sesuai kewenangannya.","l":1476,"h":340},{"m":"c)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) sampai dengan .000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"c)","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST) dan Direktur Utama.","l":1192,"h":340},{"m":"2.","t":"Kantor Cabang","l":908,"h":340},{"m":"a)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. batas kewenangannya masing-masing dilakukan oleh Pejabat Berwenang Kantor Cabang.","l":1192,"h":340},{"m":"b)","t":"Nilai Pengadaan di atas kewenangan Kantor Cabang s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Kerja Pengadaan.","l":1192,"h":340},{"m":"c)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"d)","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST) dan Direktur Utama.","l":1192,"h":340},{"m":"b.","t":"Untuk proses Penunjukan Langsung yang dilaksanakan di kantor Cabang HUB/Cabang CGO dengan Nilai Pengadaan sampai dengan batas kewenangan Kantor Cabang HUB/Cabang CGO, usulan persetujuan hasil Negosiasi disampaikan secara tertulis kepada Pejabat Berwenang Kantor Cabang HUB/Cabang CGO.","l":624,"h":340},{"m":"c.","t":"Untuk proses Penunjukan Langsung yang dilaksanakan di Kantor Cabang, dengan Nilai Pengadaan di atas batas kewenangannya, usulan persetujuan hasil Negosiasi disampaikan secara tertulis Pejabat Berwenang Kantor Cabang kepada Direktur Unit Spesifikasi Teknis (UST)/Direktur Utama.","l":624,"h":340},{"m":"d.","t":"Usulan persetujuan hasil Negosiasi Penunjukan Langsung kepada Pejabat Berwenang, sekurang-kurangnya harus disertai dengan dokumen-dokumen sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Salinan Surat Permintaan Pengadaan (SPP);","l":908,"h":340},{"m":"2.","t":"Salinan Surat Persetujuan Penunjukan Langsung;","l":908,"h":340},{"m":"3.","t":"Salinan Spesifikasi Teknis;","l":908,"h":340},{"m":"4.","t":"Salinan Harga Perkiraan Sendiri (HPS);","l":908,"h":340},{"m":"5.","t":"Salinan Berita Acara (penjelasan umum (aanwijzing), klarifikasi/Negosiasi dan hasil Penunjukan Langsung);","l":908,"h":340},{"m":"6.","t":"Salinan dokumen administrasi Penyedia Barang dan/atau Jasa yang ditunjuk; dan","l":908,"h":340},{"m":"7.","t":"Salinan Surat Penawaran dari Penyedia Barang dan/atau Jasa yang ditunjuk.","l":908,"h":340},{"m":"e.","t":"Seluruh dokumen sebagaimana dimakusd pada huruf d dijadikan 1 (satu) dan disimpan oleh Unit Kerja Pengadaan.","l":624,"h":340},{"m":"f.","t":"Setelah Pejabat Berwenang menandatangani Form Penetapan Pelaksana Pengadaan sebagai persetujuan hasil Negosiasi, Kepala Unit Kerja Pengadaan menerbitkan Surat Perintah Kerja (SPK) untuk ditandatangani oleh Pejabat Berwenang selambat-lambatnya 2 (dua) hari kerja sejak Pejabat Berwenang menandatangani Form Penetapan Pelaksana Pengadaan.","l":624,"h":340},{"m":"g.","t":"Khusus untuk proses Pengadaan Barang dan/atau Jasa dalam kondisi tertentu sebagaimana dimaksud pada butir 3.2.1. huruf b angka 1, proses administrasi dapat berjalan paralel dengan proses Pengadaan.","l":624,"h":340},{"m":"h.","t":"Tata cara Penunjukan Langsung dapat dilakukan secara elektronik (email/e-letter/website/conference call melalui aplikasi yang ditetapkan oleh Unit IT).","l":624,"h":340},{"c":"[BAB 3 angka 3.2.1-3.2.3, 3.2.5]"}],[{"t":"PENUNJUKAN LANGSUNG"},{"m":"1.","t":"Pelaksanaan Penunjukan Langsung dilakukan dengan mengundang 1 (satu) Pelaku Usaha yang dipilih, dengan disertai negosiasi harga;","l":340,"h":340},{"m":"2.","t":"Penunjukan langsung juga dapat dilakukan melalui beauty contest dengan memperbandingkan minimal 2 (dua) penyedia Barang dan/atau Jasa. Beauty contest dilakukan oleh Unit Pengguna dengan melakukan penilaian sesuai kebutuhan Unit Pengguna untuk menentukan penyedia Barang dan/atau Jasa yang akan ditunjuk, selanjutnya menyerahkan nama penyedia Barang dan/atau Jasa yang akan ditunjuk dari hasil beauty contest beserta dokumen usulan Pengadaan kepada Pengadaan untuk dilakukan proses selanjutnya;","l":340,"h":340},{"m":"3.","t":"Penunjukan langsung sebagaimana point 1 dan 2 dapat dilakukan apabila memenuhi minimal paling sedikit salah satu persyaratan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Barang dan/atau Jasa yang dibutuhkan bagi kinerja utama perusahaan dan tidak dapat ditunda keberadaannya (business critical asset), termasuk:","l":624,"h":340},{"m":"b.","t":"Hanya terdapat satu Penyedia Barang dan/atau Jasa yang dapat melaksanakan pekerjaan sesuai kebutuhan pengguna (user requirement) atau sesuai dengan ketentuan peraturan perundangan yang berlaku;","l":624,"h":340},{"m":"c.","t":"Barang dan/atau Jasa tersebut memerlukan keberlangsungan pengetahuan (knowledge intensive), di mana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia Barang dan/atau Jasa;","l":624,"h":340},{"m":"d.","t":"Apabila pelaksanaan Pengadaan Barang dan/atau Jasa dengan menggunakan cara Tender/Seleksi Umum atau Tender/Seleksi Terbatas telah 2 (dua) kali dilakukan, namun tidak mendapatkan Penyedia Barang dan/atau Jasa yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti tender/seleksi;","l":624,"h":340},{"m":"e.","t":"Barang dan/atau Jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan (warranty) dari Original Equipment Manufacture;","l":624,"h":340},{"m":"f.","t":"Penanganan darurat untuk keamanan, keselamatan masyarakat, dan aset strategis perusahaan;","l":624,"h":340},{"m":"g.","t":"Barang dan/atau Jasa yang merupakan pembelian berulang (repeat order) sepanjang harga yang ditawarkan menguntungkan dengan tidak mengorbankan kualitas Barang dan/atau Jasa;","l":624,"h":340},{"m":"h.","t":"Penanganan darurat akibat bencana alam, baik yang bersifat lokal maupun nasional (force majeure);","l":624,"h":340},{"m":"i.","t":"Barang dan/atau Jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":624,"h":340},{"m":"j.","t":"Penyedia Barang dan/atau Jasa adalah BUMN, Anak Perusahaan atau Perusahaan Terafiliasi BUMN sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan dan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan;","l":624,"h":340},{"m":"k.","t":"Pengadaan Barang dan/atau Jasa dalam jumlah dan nilai tertentu yang ditetapkan Direksi dengan terlebih dahulu mendapatkan persetujuan Dewan Komisaris; dan/atau","l":624,"h":340},{"m":"l.","t":"Pengadan Barang dan/atau Jasa yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda dalam rangka upaya meningkatkan pendapatan atau memastikan keberlangsungan bisnis.","l":624,"h":340},{"m":"4.","t":"Penunjukan langsung sebagaimana dimaksud di atas dilakukan dengan ketentuan Barang dan/atau Jasa yang dibutuhkan merupakan produk atau layanan sesuai dengan bidang usaha dari penyedia Barang dan/atau Jasa bersangkutan dan dimungkinkan dalam peraturan sektoral;","l":340,"h":340},{"m":"5.","t":"Negosiasi harga wajib dilakukan dengan penyedia yang ditunjuk untuk mendapatkan nilai terbaik dari Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"6.","t":"Metode pembayaran untuk Pengadaan Barang dan/atau Jasa dengan metode penunjukan langsung adalah secara non tunai.","l":340,"h":340},{"c":"[BAB V.D]"},{"t":"JADWAL DAN PROSEDUR PEMILIHAN PENYEDIA BARANG DAN/ATAU JASA"},{"m":"3.","t":"Jadwal dan prosedur pemilihan Penyedia Barang dan/atau Jasa dengan metode penunjukan langsung meliputi:","l":340,"h"
