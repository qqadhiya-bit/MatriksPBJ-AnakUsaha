rangan dilakukan oleh Anggota Direksi dan/atau Pejabat di bawah Direksi.","l":630,"h":630},{"c":"[BAB 2 angka 2.24.0]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Dalam hal terjadi penyimpangan dan/ atau kecurangan dalam transaksi bisnis yang dapat menimbulkan risiko bagi Perusahaan, Direksi dapat mengambil langkah strategis untuk mengatasi penyimpangan dan, dalam hal tidak dapat diatasi, Direksi dapat melakukan penundaan pelaksanaan perikatan hukum apabila, kecurangan dan/ atau kerugian Perusahaan yang berupa:","l":340,"h":340},{"m":"a.","t":"Dugaan manipulasi harga;","l":624,"h":340},{"m":"b.","t":"Dugaan proyek fiktif;","l":624,"h":340},{"m":"c.","t":"Dugaan pemalsuan identitas dan/ atau dokumen;","l":624,"h":340},{"m":"d.","t":"Dugaan barang dan/ atau jasa di bawah spresifikasi atau kualitas yang disepakati.","l":624,"h":340},{"m":"2.","t":"Penundaan pelaksanaan perikatan hukum dilakukan oleh Direktur Utama apabila dugaan penyimpangan dan/ atau kecurangan dilakukan oleh Anggota Direksi dan dilakukan oleh Direktur apabila dugaan penyimpangan dan/ atau kecurangan dilakukan oleh Pejabat 1 (satu) tingkat di bawah Direksi.","l":340,"h":340},{"c":"[Pasal 50]"}]]}]}]},{"heading":"BAB VI - PENERIMAAN BARANG DAN/ATAU JASA","subsections":[{"heading":"A. KRITERIA PENERIMAAN BARANG DAN/ATAU JASA","rows":[{"topik":"KRITERIA PENERIMAAN BARANG DAN/ATAU JASA","cells":[[{"t":"KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"1.","t":"Serah terima Barang dan/atau Jasa dilakukan dengan Berita Acara Serah Terima (BAST) Barang dan/atau Jasa dengan kondisi sesuai yang termuat di dalam Perjanjian Pengadaan oleh Penyedia kepada Unit Bisnis atau Unit Teknis, dengan didahului oleh pemeriksaan atas Barang dan/atau Jasa.","l":340,"h":340},{"m":"2.","t":"Apabila ketentuan dalam Perjanjian Pengadaan tidak terpenuhi maka penerimaan Barang dan/atau Jasa tidak dapat dilaksanakan.","l":340,"h":340},{"m":"3.","t":"Ketentuan mengenai syarat-syarat penerimaan Barang dan/atau Jasa dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya.","l":340,"h":340},{"c":"[BAB VI.A]"}],[{"m":"1.","t":"Serah terima barang dan/ atau jasa dilaksanakan oleh fungsi logistik, Kantor Pusat dan Kantor Cabang/ Unit Pelaksana, dan/ atau Unit Teknis terkait.","l":340,"h":340},{"m":"2.","t":"Serah terima jasa konsultan dapat dilakukan secara langsung dari penyedia ke Unit Teknis dalam bentuk laporan tertulis.","l":340,"h":340},{"m":"3.","t":"Serah terima barang dan/ atau jasa dituangkan dalam Berita Acara Serah Terima (BAST).","l":340,"h":340},{"m":"4.","t":"Serah terima pengadaan barang dan/ atau jasa, dapat diserahkan dalam satu (1) tahap atau beberapa tahap dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pekerjaan yang diserahkan dengan 1 (satu) tahap adalah pekerjaan yang tidak memiliki masa pemeliharaan setelah prestasi fisik mencapai 100% (seratus persen);","l":624,"h":340},{"m":"b.","t":"Pekerjaan yang diserahkan dengan 2 (dua) tahap adalah pekerjaan yang memiliki masa pemeliharaan setelah prestasi fisik mencapai 100% (seratus persen) dan masa pemeliharaan telah berakhir;","l":624,"h":340},{"m":"c.","t":"Pekerjaan yang diserahkan dengan beberapa tahap adalah pekerjaan yang pembayarannya berdasarkan kemajuan fisik pekerjaan.","l":624,"h":340},{"m":"5.","t":"Untuk pengadaan barang, penyedia wajib menyerahkan sertifikat garansi atau dokumen tertulis perihal garansi barang yang berlaku sesuai kesepakatan para pihak dalam dokumen perjanjian.","l":340,"h":340},{"c":"[Pasal 33]"}],[{"t":"PIHAK-PIHAK DALAM SERAH TERIMA BARANG DAN/ATAU JASA"},{"t":"Para Pihak dalam serah terima Barang dan/atau Jasa terdiri dari:"},{"m":"a.","t":"Unit Spesifikasi Teknis (UST); dan","l":340,"h":340},{"m":"b.","t":"Penyedia Barang dan/atau Jasa.","l":340,"h":340},{"c":"[BAB 6 angka 6.1.0]"},{"t":"SERAHTERIMA BARANG DAN/ATAU JASA"},{"m":"6.2.1.","t":"Kecuali Pengadaan Barang dan/atau Jasa melalui Pengadaan langsung tanpa permintaan surat penawaran harga, terhadap setiap proses Pengadaan Barang dan/atau Jasa yang sudah diselesaikan dilakukan penerimaan Barang dan/atau Jasa dan dituangkan dalam Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) Setelah pekerjaan selesai sesuai dengan ketentuan yang tertuang dalam ikatan kerja/Perjanjian, Penyedia Barang dan/atau Jasa menyampaikan pemberitahuan secara tertulis kepada Kepala Unit Spesifikasi Teknis (UST) untuk penyerahan barang/hasil pekerjaan.","l":540,"h":540},{"m":"6.2.2.","t":"Untuk pekerjaan jasa yang dikerjakan secara rutin dengan penagihan dilakukan secara bulanan, Berita Acara Penerimaan Jasa/Penyelesaian Pekerjaan dibuat secara bulanan.","l":540,"h":540},{"m":"6.2.3.","t":"Ketentuan mengenai syarat-syarat pemeriksaan dan penerimaan Barang dan/atau Jasa dicantumkan dalam Ikatan Kerja atau dokumen pendukungnya.","l":540,"h":540},{"c":"[BAB 6 angka 6.2.1-6.2.3]"}],[{"t":"KRITERIA PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"1.","t":"Serah terima Barang dan/atau Jasa dilakukan dengan Berita Acara Serah Terima Barang dan/atau Jasa dengan kondisi sesuai yang termuat di dalam KPBJ/SPK/PO oleh Penyedia Barang dan/atau Jasa kepada Unit Pengguna dengan didahului oleh pemeriksaan atas Barang dan/atau Jasa;","l":340,"h":340},{"m":"2.","t":"Apabila ketentuan dalam KPBJ/SPK/PO tidak terpenuhi maka penerimaan Barang dan/atau Jasa tidak dapat dilaksanakan;","l":340,"h":340},{"m":"3.","t":"Ketentuan mengenai syarat-syarat penerimaan Barang dan/atau Jasa dicantumkan dalam Perjanjian Pengadaan dan dokumen pendukungnya;","l":340,"h":340},{"m":"4.","t":"Untuk Pengadaan Barang dan/atau Jasa yang menjadi kewenangan Kantor Pusat yang berlokasi di Kantor Cabang, maka penerimaan Barang dan/atau Jasa dapat dilakukan oleh pejabat unit kerja Kantor Cabang yang ditunjuk oleh Unit Pengguna.","l":340,"h":340},{"c":"[BAB IX.A]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Serah terima barang dan/ atau jasa dilaksanakan oleh Unit Kerja yang membidangi fungsi logistic dan Unit Teknis terkait, baik di Kantor Pusat dan/ atau Kantor Cabang/ Regional.","l":340,"h":340},{"m":"2.","t":"Serah terima jasa konsultan dapat dilakukan secara langsung dari Penyedia ke Unit Teknis dalam bentuk laporan tertulis.","l":340,"h":340},{"m":"3.","t":"Serah terima barang dan/ atau jasa dituangkan dalam Berita Acara.","l":340,"h":340},{"m":"4.","t":"Serah terima pengadaan barang dan/ atau jasa, dapat diserahkan dalam satu (1) tahap atau beberapa tahap dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pekerjaan yang diserahkan dengan 1 (satu) tahap adalah pekerjaan yang tidak memiliki masa pemeliharaan setelah prestasi fisik mencapai 100% (seratus persen);","l":624,"h":340},{"m":"b.","t":"Pekerjaan yang diserahkan dengan 2 (dua) tahap adalah pekerjaan yang memiliki masa pemeliharaan setelah prestasi fisik mencapai 100% (seratus persen) dan masa pemeliharaan telah berakhir;","l":624,"h":340},{"m":"c.","t":"Pekerjaan yang diserahkan dengan beberapa tahap adalah pekerjaan yang pembayarannya berdasarkan kemajuan fisik pekerjaan.","l":624,"h":340},{"m":"5.","t":"Untuk pengadaan barang, Penyedia Barang wajib menyerahkan sertifikat garansi atau dokumen tertulis perihal garansi barang yang berlaku sesuai kesepakatan dalam Bukti Perjanjian.","l":340,"h":340},{"c":"[Pasal 44]"}]]}]},{"heading":"B. PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA","rows":[{"topik":"PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA","cells":[[{"t":"PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"1.","t":"Sebelum diserahkan, Barang dan/atau Jasa harus dilakukan pemeriksaan terlebih dahulu oleh Unit Bisnis atau Unit Teknis yang meliputi:","l":340,"h":340},{"m":"a.","t":"Pemeriksaan kelengkapan administrasi Barang dan/atau Jasa;","l":624,"h":340},{"m":"b.","t":"Pemeriksaan kuantitas dan kualitas Barang dan/atau Jasa;","l":624,"h":340},{"m":"c.","t":"Pemeriksaan/penelitian keseuaian spesifikasi teknis.","l":624,"h":340},{"m":"2.","t":"Hasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan Pekerjaan (“BAPP”) dan menjadi dasar Unit Bisnis atau Unit Teknis untuk melaksanakan serah terima Barang dan/atau Jasa dengan Penyedia.","l":340,"h":340},{"c":"[BAB VI.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"SERAHTERIMA BARANG DAN/ATAU JASA"},{"m":"6.2.4.","t":"Untuk menilai dan meneliti mutu atau kualitas atas barang, atau prestasi atas pekerjaan/jasa, pemeriksaan dilakukan oleh pejabat Unit Spesifikasi Teknis (UST).","l":540,"h":540},{"c":"[BAB 6 angka 6.2.4]"}],[{"t":"PERSIAPAN PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"1.","t":"Sebelum diserahkan, Barang dan/atau Jasa harus dilakukan Pemeriksaan terlebih dahulu. Pemeriksaan meliputi:","l":340,"h":340},{"m":"a.","t":"Pemeriksaan kelengkapan administrasi Barang dan/atau Jasa dilakukan oleh Pejabat/Unit Pengguna dan apabila diperlukan dapat melibatkan Unit Pengadaan;","l":624,"h":340},{"m":"b.","t":"Pemeriksaan kuantitas dan kualitas Barang dan/atau Jasa dilakukan oleh Unit Pengguna;","l":624,"h":340},{"m":"c.","t":"Pemeriksaan/penelitian spesifikasi teknis dilakukan oleh Unit Pembuat Spesifikasi Teknis dan/atau oleh Pengawas Pekerjaan untuk pekerjaan konstruksi.","l":624,"h":340},{"m":"2.","t":"Untuk Pengadaan Barang dan/atau Jasa yang menjadi kewenangan Kantor Pusat yang berlokasi di Kantor Cabang, maka pemeriksaan Barang dan/atau Jasa dapat dilakukan oleh pejabat unit kerja Kantor Cabang yang ditunjuk oleh Unit Pengguna.","l":340,"h":340},{"m":"3.","t":"Pemeriksa meneliti dan memeriksa Barang dan/atau Jasa yang akan diserahkan oleh penyedia Barang dan/atau Jasa sesuai dengan Perjanjian Pengadaan dan dokumen/lampiran pendukung;","l":340,"h":340},{"m":"4.","t":"Hasil pemeriksaan dituangkan dalam Berita Acara Pemeriksaan dan menjadi dasar Unit Pengguna untuk melaksanakan serah terima Barang dan/atau Jasa dengan penyedia Barang dan/atau Jasa.","l":340,"h":340},{"m":"5.","t":"Dalam kondisi dimana pemeriksaan pekerjaan di Kantor Cabang perlu diperiksa oleh Unit Pengadaan Kantor Pusat, maka pemeriksaan dilakukan secara bersama-sama dengan Unit Pengguna.","l":340,"h":340},{"c":"[BAB IX.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"C. PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA","rows":[{"topik":"Pelaksanaan Penerimaan Barang dan/atau Jasa","cells":[[{"t":"PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"1.","t":"Unit Bisnis atau Unit Teknis bersama dengan Penyedia sesuai ketentuan dalam Perjanjian Pengadaan dan dokumen Berita Acara Pemeriksaan Pekerjaan (BAPP) melaksanakan serah terima barang dan/atau jasa dengan menggunakan Berita Acara Serah Terima (“BAST”) yang ditandatangani oleh Unit Bisnis atau Unit Teknis dengan Penyedia.","l":340,"h":340},{"m":"2.","t":"Dalam kondisi dimana Barang dan/atau Jasa yang diserahkan tidak dapat diterima, maka:","l":340,"h":340},{"m":"a.","t":"Unit Bisnis atau Unit Teknis menyampaikan pemberitahuan tertulis (Laporan Ketidaksesuaian Barang dan/atau Jasa) kepada Penyedia untuk mengganti/memperbaiki Barang dan/atau Jasa tersebut sesuai dengan Perjanjian Pengadaan;","l":624,"h":340},{"m":"b.","t":"Selanjutnya dilaksanakan penyerahan ulang sebagai dasar penetapan tanggal penyerahan.","l":624,"h":340},{"m":"4.","t":"Khusus untuk Barang dan/atau Jasa berupa hasil Pengadaan Barang dan/atau Jasa investasi yang dinyatakan sudah diterima berdasarkan Berita Acara, wajib dikoordinasikan untuk dicatatkan oleh Unit Yang Membidangi Fungsi Aset Perusahaan dan kemudian dilaporkan kepada Unit Yang Membidangi Fungsi Akuntansi untuk pembukuan nilai aset dan penghitungan penyusutannya.","l":340,"h":340},{"c":"[BAB VI.C angka 1-2, 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"SERAHTERIMA BARANG DAN/ATAU JASA"},{"m":"6.2.5.","t":"Mekanisme Serah Terima Barang","l":540,"h":540},{"m":"a.","t":"Serah Terima Barang dilakukan oleh pejabat Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"b.","t":"Dalam hal barang telah dinyatakan dapat diterima, maka dibuat Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J).","l":624,"h":340},{"m":"a.","t":"Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) ditandatangani oleh pejabat Unit Spesifikasi Teknis (UST) dan wakil dari Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"c.","t":"Khusus untuk proses pemeriksaan atas barang kebutuhan Kantor Cabang yang Pengadaannya dilaksanakan oleh Panitia Pengadaan Kantor Pusat, pemeriksaan dan serah terima barang di Kantor Cabang dapat dilakukan pejabat Unit Spesifikasi Teknis (UST) Kantor Cabang.","l":624,"h":340},{"m":"d.","t":"Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) sebagaimana dimaksud pada huruf d di atas ditandatangani oleh Pejabat Unit Spesifikasi Teknis Kantor Cabang dan Wakil Penyedia Barang serta diketahui oleh Executive General Manager (EGM)/General Manager (GM).","l":624,"h":340},{"m":"e.","t":"Dalam hal terdapat kekurangan pada barang dan dinyatakan tidak dapat diterima, maka barang dikembalikan kepada Penyedia Barang dan memerintahkan Penyedia Barang untuk memperbaiki/mengganti barang sebagaimana telah disyaratkan.","l":624,"h":340},{"m":"f.","t":"Untuk Barang yang langsung dipakai, setelah dilakukan pemeriksaan dan penerimaan oleh Unit Spesifikasi Teknis (UST), Barang dimaksud diserahkan oleh Unit Spesifikasi Teknis (UST) ke Unit Pengguna (User).","l":624,"h":340},{"m":"g.","t":"Khusus untuk Barang/sparepart yang tidak langsung dipakai setelah dilakukan pemeriksaan dan penerimaan oleh Unit Spesifikasi Teknis (UST), Barang dimaksud diserahkan oleh Unit Spesifikasi Teknis (UST) ke Pejabat Gudang/Persediaan.","l":624,"h":340},{"m":"6.2.6.","t":"Mekanisme Serah Terima Pekerjaan/Jasa","l":540,"h":540},{"m":"a.","t":"Serah Terima Pekerjaan/Jasa dilakukan oleh pejabat Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"b.","t":"Dalam hal Pekerjaan/Jasa telah dinyatakan dapat diterima, maka dibuat Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J).","l":624,"h":340},{"m":"c.","t":"Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) ditandatangani oleh Pejabat Unit Spesifikasi Teknis (UST) dan wakil dari Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"d.","t":"Khusus untuk jasa Penyewaan Barang/Ruangan/Gedung/Kendaraan, yang ditetapkan secara Bulanan, pemeriksaan dan serah terima pertama kalinya dilakukan oleh Pejabat Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"e.","t":"Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) selanjutnya dapat ditandatangani oleh Unit Pengguna (User).","l":624,"h":340},{"m":"f.","t":"Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J) sebagaimana dimaksud pada huruf d di atas di Kantor Cabang ditandatangani oleh Pejabat Unit Spesifikasi Teknis (UST) Kantor Cabang dan Wakil Penyedia Barang serta diketahui oleh Pejabat Berwenang Kantor Cabang.","l":624,"h":340},{"m":"g.","t":"Dalam hal terdapat kekurangan pada barang dan dinyatakan tidak dapat diterima, maka barang dikembalikan kepada Penyedia Barang dan memerintahkan penyedia barang untuk memperbaiki/mengganti barang sebagaimana telah disyaratkan.","l":624,"h":340},{"m":"6.2.7.","t":"Tanggal penerimaan barang atau pekerjaan/jasa berdasarkan tanggal diterimanya secara fisik barang atau terselesaikannya pekerjaan/jasa. tanggal penerimaan merupakan dasar perhitungan pengenaan denda, apabila terjadi keterlambatan penyerahan.","l":540,"h":540},{"m":"6.2.8.","t":"Pendistribusian Berita Acara Penerimaan Barang dan/atau Jasa (BAPB/J) dilakukan sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Barang investasi","l":624,"h":340},{"m":"1.","t":"Unit Kerja Pengadaan.","l":908,"h":340},{"m":"2.","t":"Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"3.","t":"Unit Akuntansi.","l":908,"h":340},{"m":"4.","t":"Unit yang membidangi pengelolaan aset.","l":908,"h":340},{"m":"b.","t":"Barang eksploitasi dan jasa","l":624,"h":340},{"m":"1.","t":"Unit Kerja Pengadaan.","l":908,"h":340},{"m":"2.","t":"Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"3.","t":"Unit Akuntansi.","l":908,"h":340},{"m":"4.","t":"Unit yang membidangi persediaan.","l":908,"h":340},{"m":"6.2.9.","t":"Setelah Barang dan/atau Jasa dinyatakan telah diterima, pejabat Unit Spesifikasi Teknis (UST) menyerahkan Barang dan/atau Jasa hasil pekerjaan kepada Unit Pengguna (User) dengan Berita Acara Serah Terima Barang dan/atau Jasa (BASTB/J).","l":540,"h":540},{"c":"[BAB 6 angka 6.2.5-6.2.9]"}],[{"t":"PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"1.","t":"Unit Pengguna bersama dengan Penyedia Barang dan/atau Jasa sesuai ketentuan dalam Perjanjian Pengadaan dan dokumen Berita Acara Pemeriksaan (BAP) melaksanakan serah terima barang dengan menggunakan Berita Acara yang ditanda tangani oleh Unit Pengguna dengan Penyedia Barang dan/atau Jasa;","l":340,"h":340},{"m":"2.","t":"Dalam kondisi dimana Barang dan/atau Jasa yang diserahkan tidak dapat diterima:","l":340,"h":340},{"m":"a.","t":"Unit Pengguna menyampaikan pemberitahuan tertulis (Laporan Ketidaksesuaian Barang dan/atau Jasa) kepada Penyedia Barang dan/atau Jasa untuk mengganti/memperbaiki Barang dan/atau Jasa tersebut sesuai dengan Perjanjian Pengadaan;","l":624,"h":340},{"m":"b.","t":"selanjutnya dilaksanakan penyerahan ulang sebagai dasar penetapan tanggal penyerahan.","l":624,"h":340},{"m":"3.","t":"Dokumen tersebut pada ayat (2) a dan b di atas, ditandatangani oleh Unit Pengguna selambat-lambatnya 3 (tiga) hari setelah serah terima Barang dan/atau Jasa tidak berhasil dilakukan.","l":340,"h":340},{"m":"5.","t":"Khusus untuk Barang dan/atau Jasa berupa hasil Pengadaan Barang dan/atau Jasa investasi berbentuk tanah dan/atau pembangunan sarana dan/atau prasarana yang dinyatakan sudah diterima berdasarkan Berita Acara, wajib dikoordinasikan untuk dicatatkan oleh Unit yang membidangi aset perusahaan dan kemudian dilaporkan ke Unit Akuntansi untuk pembukuan nilai aset dan penghitungan penyusutannya.","l":340,"h":340},{"c":"[BAB IX.C angka 1-3, 5]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Denda Keterlambatan","cells":[[{"t":"PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"3.","t":"Dalam hal terjadi keterlambatan penyerahan Barang dan/atau Jasa, yang dijadikan dasar perhitungan denda adalah tanggal berakhirnya Kontrak atau sesuai dengan kesepakatan dalam pekerjaan yang diserahkan secara parsial.","l":340,"h":340},{"c":"[BAB VI.C angka 3]"}],[{"m":"1.","t":"Denda merupakan sanksi finansial yang dikenakan kepada penyedia barang dan/ atau jasa.","l":340,"h":340},{"m":"2.","t":"Besarnya denda kepada penyedia barang dan/ atau jasa atas keterlambatan penyelesaian pekerjaan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"1/ 1000 (Satu permil) dari sisa harga bagian pengadaan barang dan/ atau jasa yang belum dikerjakan, apabila bagian barang atau pekerjaan yang sudah dilaksanakan dapat berfungsi; atau","l":624,"h":340},{"m":"b.","t":"1/ 1000 (Satu permil) dari harga pengadaan barang dan/ atau jasa, apabila bagian barang atau pekerjaan yang sudah dilaksanakan belum berfungsi atau barang datang terlambat.","l":624,"h":340},{"m":"3.","t":"Pengenaan denda untuk pekerjaan khusus atau pekerjaan yang akibat keterlambatannya menimbulkan dampak kerugian operasional dan finansial yang signifikan bagi Perusahaan dapat diatur dengan aturan tersendiri dan dinyatakan dalam dokumen Kerangka Acuan Kerja dan dituangkan di dalam Kontrak.","l":340,"h":340},{"m":"4.","t":"Departemen Vendor Management (VM) dapat memberikan blacklist pada penyedia barang dan/ atau jasa setelah mendapatkan nota dinas dan laporan evaluasi dari unit teknis yang telah disetujui oleh direktur terkait untuk dapat diserahkan Vice Procurement (VP) procurement agar dapat dievaluasi Vendor Management (VM) untuk mendapatkan persetujuan Vice President (VP) procurement dengan Direksi.","l":340,"h":340},{"m":"5.","t":"Tata cara blacklist akan diatur lebih lanjut di dalam Standard Operating Procedure (SOP).","l":340,"h":340},{"c":"[Pasal 42]"}],[{"t":"DENDA"},{"m":"5.5.1.","t":"Denda diberikan kepada Penyedia Barang dan/atau Jasa yang karena kesalahannya terlambat dalam melaksanakan/menyelesaikan pekerjaan/melakukan pengiriman barang.","l":540,"h":540},{"m":"5.5.2.","t":"Denda untuk keterlambatan sebagaimana dimaksud pada butir 5.5.1 dikenakan minimal sebesar 2‰ (dua per-mil) perhari dari nilai total harga barang/pekerjaan di luar PPN dengan denda maksimum 5% (lima persen).","l":540,"h":540},{"m":"5.5.3.","t":"Apabila Barang dan/atau Jasa yang diperjanjikan terdiri dari beberapa jenis Barang dan/atau Jasa dengan delivery time/peyelesaian pekerjaan yang berbeda, denda dapat dihitung dari masing-masing jenis atau unit Barang dan/atau Jasa.","l":540,"h":540},{"m":"5.5.4.","t":"Denda berupa pemotongan sebesar nilai yang ditagihkan per-bulan akan dilakukan kepada Penyedia Jasa Penyedaiaan SDM dan/atau Paket Pekerjaan, apabila Penyedia Jasa tidak dapat memenuhi kewajiban atau tanggung jawabnya (wanprestasi) dalam pengelolaan SDM yang ditempatkan di Perusahaan dan telah diberikan teguran atau surat peringatan sebagaimana dimaksud pada butir 5.4.1 dan butir 5.4.2.","l":540,"h":540},{"m":"5.5.5.","t":"Terhadap Pengadaan yang tidak mensyaratkan Jaminan pelaksanaan, dapat diatur Denda sebesar 5% (lima persen) dari total Nilai Pengadaan yang dikenakan apabila selama jangka waktu Perjanjian, pihak Penyedia Barang dan/atau Jasa tidak mampu memenuhi kewajiban dalam Perjanjian yang berakibat pada Pemutusan Perjanjian dan atau menyatakan mundur dari Perjanjian.","l":540,"h":540},{"m":"5.5.6.","t":"Denda-denda lain terkait kesalahan Penyedia Barang dan/atau Jasa dalam melaksanakan pekerjaan dapat diatur tersendiri dan dituangkan dalam Rencana Kerja dan Syarat (RKS) pada saat proses pengadaan dan dalam Perjanjian.","l":540,"h":540},{"m":"5.5.7.","t":"Apabila denda telah melebihi ketentuan yang ditetapkan dalam Perjanjian atau apabila kondisi tersebut dapat merugikan perusahaan maka kepada Penyedia Barang dan/atau Jasa dapat dilakukan pemutusan Perjanjian.","l":540,"h":540},{"c":"[BAB 5 angka 5.5.0]"}],[{"t":"PELAKSANAAN PENERIMAAN BARANG DAN/ATAU JASA"},{"m":"4.","t":"Dalam hal terjadi keterlambatan penyerahan Barang dan/atau Jasa, yang dijadikan dasar perhitungan denda adalah tanggal yang menjadi jadwal penyerahan Barang dan/atau Jasa yang dinyatakan dapat diterima sampai tanggal penyerahan Barang dan/atau Jasa dengan status diterima;","l":340,"h":340},{"c":"[BAB IX.C angka 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Denda merupakan sanksi finansial yang dikenakan kepada Penyedia Barang dan/ atau Jasa.","l":340,"h":340},{"m":"2.","t":"Besarnya denda kepada Penyedia Barang dan/ atau Jasa atas keterlambatan penyelesaian pekerjaan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"1 (Satu permil) dari sisa harga bagian pengadaan barang dan/ atau jasa yang belum dikerjakan, apabila bagian barang atau pekerjaan yang sudah dilaksanakan dapat berfungsi; atau","l":624,"h":340},{"m":"b.","t":"1(Satu permil) dari harga pengadaan barang dan/ atau jasa, apabila bagian barang atau pekerjaan yang sudah dilaksanakan belum berfungsi atau barang datang terlambat.","l":624,"h":340},{"m":"3.","t":"Pengenaan denda untuk pekerjaan khusus atau pekerjaan yang akibat keterlambatannya menimbulkan dampak kerugian operasional dan finansial yang signifikan bagi Perusahaan dapat diatur dengan aturan tersendiri dan dinyatakan dalam dokumen Kerangka Acuan Kerja dan dituangkan di dalam Surat Perjanjian/ Kontrak.","l":340,"h":340},{"m":"4.","t":"Unit Kerja yang membidangi fungsi pengadaan barang dan/ atau jasa dapat memberikan blacklist pada penyedia barang dan/ atau jasa setelah mendapatkan surat dinas dan laporan evaluasi dari Unit Teknis yang telah disetujui oleh Direktur terkait untuk dapat diserahkan Pejabat Tertinggi atau 1 (satu) tingkat di bawah Direksi yang membidangi fungsi pengadaan barang dan/ atau jasa agar dapat dievaluasi Unit Kerja yang membidangi fungsi pengadaan barang dan/ atau jasa untuk mendapatkan persetujuan Vice President (VP) procurement dengan Direksi.","l":340,"h":340},{"m":"5.","t":"Tata cara blacklist akan diatur lebih lanjut di dalam Standard Operating Procedure (SOP).","l":340,"h":340},{"c":"[Pasal 55]"}]]}]}]},{"heading":"BAB VII - PEMBAYARAN PENYEDIA","subsections":[{"heading":"A. KRITERIA DOKUMEN TAGIHAN PENYEDIA","rows":[{"topik":"Dasar Pembayaran","cells":[[{"t":"KRITERIA DOKUMEN TAGIHAN PENYEDIA"},{"m":"1.","t":"Pembayaran untuk PBJ dilakukan setelah Penyedia menyelesaikan pekerjaan pengadaan yang dibuktikan dengan Berita Acara Serah Terima (BAST) Barang dan/atau Jasa sesuai kesepakatan dalam Perjanjian Pengadaan.","l":340,"h":340},{"c":"[BAB VII.A angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"KRITERIA DOKUMEN TAGIHAN PENYEDIA BARANG DAN/ATAU JASA"},{"m":"1.","t":"Pembayaran untuk Pengadaan Barang dan/atau Jasa dilakukan setelah penyedia Barang dan/atau Jasa menyelesaikan pekerjaan Pengadaan yang dibuktikan dengan Berita Acara Serah Terima Barang dan/atau Jasa sesuai kesepakatan dalam Perjanjian Pengadaan;","l":340,"h":340},{"c":"[BAB X.A angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Pembayaran Bertahap (Termin)","cells":[[{"t":"KRITERIA DOKUMEN TAGIHAN PENYEDIA"},{"m":"2.","t":"Dalam sistem pembayaran dengan tahapan (termin), maka jumlah pembayaran kepada Penyedia tidak dibenarkan melebihi prestasi pekerjaan yang telah dicapai.","l":340,"h":340},{"c":"[BAB VII.A angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"KRITERIA DOKUMEN TAGIHAN PENYEDIA BARANG DAN/ATAU JASA"},{"m":"2.","t":"Dalam sistem pembayaran dengan tahapan (termin), maka jumlah pembayaran per termin kepada Penyedia Barang dan/atau Jasa tidak dibenarkan melebihi prestasi pekerjaan yang telah dicapai.","l":340,"h":340},{"c":"[BAB X.A angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"B. PERSIAPAN PEMBAYARAN KEPADA PENYEDIA","rows":[{"topik":"PERSIAPAN PEMBAYARAN KEPADA PENYEDIA","cells":[[{"t":"PERSIAPAN PEMBAYARAN KEPADA PENYEDIA"},{"m":"1.","t":"Berdasarkan surat permintaan pembayaran Barang dan/atau Jasa dari Penyedia, maka Unit Yang Membidangi Fungsi Akuntansi meneliti kelengkapan dan kebenaran dokumen pendukung penagihan, yang terdiri dari antara lain:","l":340,"h":340},{"m":"a.","t":"Berita Acara Serah Terima Barang dan/atau Jasa per progress pekerjaan (untuk pembayaran sesuai termin);","l":624,"h":340},{"m":"b.","t":"Berita Acara Serah Terima Barang dan/atau Jasa terakhir sebagai bukti penyelesaian pekerjaan (untuk pelunasan);","l":624,"h":340},{"m":"c.","t":"Copy Perjanjian Pengadaan beserta addendum (jika ada);","l":624,"h":340},{"m":"d.","t":"Invoice;","l":624,"h":340},{"m":"e.","t":"Kuitansi bermeterai;","l":624,"h":340},{"m":"f.","t":"Faktur Pajak ber-barcode (sudah di upload di Direktorat Jenderal Pajak) atau yang setara (untuk Perusahaan asing);","l":624,"h":340},{"m":"g.","t":"Khusus untuk Pengadaan barang yang dibeli langsung dari luar negeri, harus dilengkapi dengan bukti pembayaran pajak-pajak impor;","l":624,"h":340},{"m":"h.","t":"Khusus untuk pekerjaan kontruksi menggunakan laporan progress pekerjaan yang telah diperiksa oleh Unit Bisnis atau Unit Teknis dan/atau pengawas pekerjaan.","l":624,"h":340},{"m":"2.","t":"Dalam hal dokumen telah dinyatakan lengkap dan benar, maka Unit Yang Membidangi Fungsi Pembayaran melakukan pembayaran sesuai dengan ketentuan yang berlaku.","l":340,"h":340},{"c":"[BAB VII.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PERSIAPAN PEMBAYARAN KEPADA PENYEDIA BARANG DAN/ATAU JASA"},{"m":"1.","t":"Berdasarkan surat permintaan pembayaran Barang dan/atau Jasa dari penyedia Barang dan/atau Jasa, maka Unit yang membidangi Akuntansi meneliti kelengkapan dokumen pendukung penagihan, yang terdiri dari antara lain:","l":340,"h":340},{"m":"a.","t":"Berita Acara Serah Terima Barang dan/atau Jasa per progress pekerjaan (untuk pembayaran sesuai termin);","l":624,"h":340},{"m":"b.","t":"Berita Acara Serah Terima Barang dan/atau Jasa terakhir sebagai bukti penyelesaian pekerjaan (untuk pelunasan);","l":624,"h":340},{"m":"c.","t":"Copy Perjanjian Pengadaan;","l":624,"h":340},{"m":"d.","t":"Invoice;","l":624,"h":340},{"m":"e.","t":"Kuitansi bermaterai;","l":624,"h":340},{"m":"f.","t":"Faktur Pajak ber-barcode (sudah di upload di Direktorat Jendral Pajak) atau yang setara (untuk perusahaan asing);","l":624,"h":340},{"m":"g.","t":"Khusus untuk Pengadaan barang yang dibeli langsung dari luar negeri, harus dilengkapi dengan bukti pembayaran pajak-pajak impor.","l":624,"h":340},{"m":"2.","t":"Untuk sistem pembayaran dengan tahapan (termin), Unit Pengguna dapat mengajukan pembayaran melalui sistem keuangan yang digunakan dan diakui oleh Perusahaan.","l":340,"h":340},{"m":"3.","t":"Dalam hal dokumen telah dinyatakan lengkap dan benar, maka Unit Finance melakukan pembayaran sesuai dengan Ketentuan yang berlaku.","l":340,"h":340},{"c":"[BAB X.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]}]},{"heading":"BAB VIII - EVALUASI KINERJA PENYEDIA","subsections":[{"heading":"A. PROSES EVALUASI","rows":[{"topik":"Faktor Evaluasi Kinerja Penyedia","cells":[[{"t":"PROSES EVALUASI"},{"m":"1.","t":"Kinerja Penyedia dievaluasi terhadap faktor-faktor berikut:","l":340,"h":340},{"m":"a.","t":"Memberikan kualitas pekerjaan/barang yang baik dan sesuai dengan spesifikasi;","l":624,"h":340},{"m":"b.","t":"Pengiriman barang atau penyelesaian pekerjaan sesuai dengan dokumen Kontrak/PO;","l":624,"h":340},{"m":"c.","t":"Pengiriman barang/penyelesaian pekerjaan sesuai atau lebih awal dari jadwal yang telah ditentukan;","l":624,"h":340},{"m":"d.","t":"Memberikan bantuan teknis termasuk after sales support;","l":624,"h":340},{"m":"e.","t":"Kesegeraan mengganti barang yang rusak;","l":624,"h":340},{"m":"f.","t":"Mempunyai pengetahuan atas barang dan industri;","l":624,"h":340},{"m":"g.","t":"Mengatasi keluhan pelanggan dengan baik;","l":624,"h":340},{"m":"h.","t":"Tidak ada kesalahan dalam dokumen penagihan;","l":624,"h":340},{"m":"i.","t":"Kepatuhan terhadap peraturan pemerintah dalam segi perpajakan.","l":624,"h":340},{"c":"[BAB VIII.A angka 1]"}],[{"m":"2.","t":"Setiap penyedia barang dan/ atau jasa akan dilakukan penilaian pada penyedia barang dan/ atau jasa berdasarkan kriteria kualitas, pengiriman, pelayanan, kesesuaian teknis dan harga, dan pengelolaan dan kemampuan keuangan.","l":340,"h":340},{"m":"a.","t":"Kualitas","l":624,"h":340},{"t":"Untuk mengukur kualitas barang/ jasa baik saat diterima, tidak ada kesalahan barang atau kinerja jasa yang rendah dan menyediakan penggantian segera dari produk yang ditolak atau cacat.","l":624},{"m":"b.","t":"Pengiriman","l":624,"h":340},{"t":"Untuk mengukur pengiriman tepat waktu, menawarkan jadwal pengiriman yang fleksibel bila diperlukan dan memberikan penerimaan dan pelaporan pengiriman yang tepat dan akurat.","l":624},{"m":"c.","t":"Pelayanan","l":624,"h":340},{"t":"Untuk mengukur memberikan bantuan teknis yang cepat dan akurat, menjaga ketersediaan barang dan menangani keluhan secara efisien dan benar.","l":624},{"m":"d.","t":"Kesesuaian teknis dan harga","l":624,"h":340},{"t":"Untuk mengukur kepatuhan semua persyaratan kontrak, menawarkan opsi biaya terendah dan menawarkan biaya barang yang kompetitif.","l":624},{"m":"e.","t":"Pengelolaan dan kemampuan keuangan","l":624,"h":340},{"t":"Untuk mengukur pengiriman invoice tepat waktu dan kelengkapan, memiliki kekuatan finansial yang baik dan jangka waktu pembayaran flexible minimal 60 (enam puluh) hari kalender.","l":624},{"m":"f.","t":"Etika dan integritas","l":624,"h":340},{"t":"Untuk mengukur kepatuhan terhadap kaidah-kaidah, norma, peraturan dan perundang-undangan untuk menjamin terciptanya profesionalitas dan konsistensi dalam pemenuhan kewajiban sebagai penyedia barang dan/ atau jasa.","l":624},{"c":"[Pasal 41 ayat (2)]"}],[{"t":"TUJUAN EVALUASI PENYEDIA BARANG DAN/ATAU JASA"},{"m":"7.1.1.","t":"Evaluasi Penyedia Barang dan/atau Jasa dilakukan untuk memverifikasi Penyedia Barang dan/atau Jasa sehingga Pengadaan Barang dan/atau Jasa dapat memenuhi kriteria dan spesifikasi yang diinginkan oleh Perusahaan.","l":540,"h":540},{"m":"7.1.2.","t":"Hasil penilaian Penyedia Barang dan/atau Jasa akan dijadikan dasar pertimbangan untuk melakukan penunjukan dan penunjukan kembali Penyedia Barang dan/atau Jasa yang sejenis untuk tenggang waktu tertentu.","l":540,"h":540},{"c":"[BAB 7 angka 7.1.0]"},{"t":"PELAKSANA EVALUASI PENYEDIA BARANG DAN/ATAU JASA"},{"m":"7.2.1.","t":"Evaluasi Penyedia Barang dan/atau Jasa dilakukan/dibuat oleh Unit Pengguna (User) setelah mendapat masukan dari Unit Spesifikasi Teknis (UST).","l":540,"h":540},{"m":"7.2.2.","t":"Hasil Evaluasi Penyedia Barang dan/atau Jasa di Kantor Pusat ditandatangani oleh Kepala Unit Pengguna (User), Kepala Unit Spesifikasi Teknis (UST) dan Kepala Unit Kerja Pengadaan.","l":540,"h":540},{"m":"7.2.3.","t":"Hasil Evaluasi Penyedia Barang dan/atau Jasa di Kantor Cabang ditandatangani oleh Kepala Unit Pelaksana Pengadaan Kantor Cabang, Kepala Unit Spesifikasi Teknis (UST) Kantor Cabang dan Pejabat Berwenang Kantor Cabang.","l":540,"h":540},{"m":"7.2.4.","t":"Evaluasi Penyedia Barang dan/atau Jasa sebagaimana dimaksud pada butir 7.2.1 dituangkan dalam form Evaluasi Penyedia Barang dan/atau Jasa yang disiapkan oleh Unit Kerja Pengadaan.","l":540,"h":540},{"c":"[BAB 7 angka 7.2.0]"},{"t":"KRITERIA PENILAIAN PENYEDIA BARANG DAN/ATAU JASA"},{"t":"7.6.1. Adapun kriteria-kriteria penilaian Penyedia Barang dan/atau Jasa antara lain sebagai berikut:"},{"tbl":{"rows":[[{"t":"KRITERIA PENILAIAN PENYEDIA BARANG DAN/ATAU JASA","cs":5}],[{"t":"NILAI","rs":2},{"t":"D"},{"t":"C"},{"t":"B"},{"t":"A"}],[{"t":"<60"},{"t":"60 - 75"},{"t":">75 - 85"},{"t":">85 - 100"}],[{"t":"Mutu Barang dan/atau Jasa"},{"t":"Spesifikasi tidak sesuai dengan permintaan dan mempengaruhi mutu jasa akhir"},{"t":"Spesifikasi kurang sesuai tetapi masih dapat digunakan dan tidak mempengaruhi mutu jasa akhir"},{"t":"Spesifikasi sesuai dengan permintaan untuk menghasilkan jasa akhir yang diharapkan"},{"t":"Spesifikasi melebihi permintaan untuk menghasilkan jasa akhir lebih dari yang diharapkan"}],[{"t":"Harga"},{"t":"Harga tidak memenuhi anggaran dan tidak dapat dinegosiasikan"},{"t":"Harga tidak konstan tetapi masih dapat dinegosiasikan dan masih dalam batas anggaran"},{"t":"Harga memenuhi anggaran dan selalu konstan"},{"t":"Harga dibawah anggaran yang ada dan selalu konstan."}],[{"t":"Waktu Pengiriman/ Pelaksanaan Pekerjaan","rs":2},{"t":"Keterlambatan pengiriman sering terjadi"},{"t":"Keterlambatan pengiriman jarang terjadi (< 5%)"},{"t":"Selalu menepati waktu pengiriman yang diminta"},{"t":"Waktu pengiriman lebih cepat dari yang diminta"}],[{"t":"Waktu yang dijanjikan tidak memenuh permintaan"},{"t":"Waktu yang dijanjikan sesuai dengan permintaan tapi ada keraguan"},{"t":"Waktu yang dijanjikan sesuai dengan permintaan"},{"t":"Waktu yang dijanjikan lebih cepat dari permintaan"}],[{"t":"Kinerja Penyedia Barang dan/atau Jasa"},{"t":"Diberi sanksi atas kesalahan/ kelalaian merugikan Perusahaan cukup material"},{"t":"Diberi sanksi atas kesalahan/ kelalaian merugikan Perusahaan tidak material"},{"t":"diberi sanksi atas kesalahan/ kelalaian tidak merugikan Perusahaan"},{"t":"Tidak pernah diberikan sanksi"}],[{"t":"Komunikasi dan Koordinasi"},{"t":"Tidak memberikan respon"},{"t":"Lambat dalam memberikan respon"},{"t":"Cepat dalam memberikan respon"},{"t":"Aktif dan Inisiatif dalam memberikan respon"}],[{"t":"Aspek K3L"},{"t":"Tidak memenuhi Peraturan K3L"},{"t":"Memenuhi Peraturan K3L terkait"},{"t":"Menenuhi semua Peraturan K3L"},{"t":"Menerapkan Sistem K3L"}],[{"t":"Kepatuhan terhadap Perjanjian"},{"t":"Tidak sesuai dengan ketentuan yang diperjanjikan"},{"t":"sesuai dengan ketentuan yang diperjanjikan tetapi terdapat catatan"},{"t":"sesuai dengan ketentuan yang diperjanjikan"},{"t":"sesuai dengan ketentuan yang diperjanjikan dan dilaksanakan dengan sangat baik"}]],"hdr":1}},{"t":"7.6.2. Ketentuan mengenai kriteria penilaian Penyedia Barang dan/atau Jasa untuk pengadaan penyediaan SDM dan/atau Paket Pekerjaan dilakukan sesuai ketentuan Manual Human Capital yang berlaku."},{"c":"[BAB 7 angka 7.6.0]"}],[{"t":"PROSES EVALUASI"},{"m":"1.","t":"Kinerja penyedia Barang dan/atau Jasa dievaluasi terhadap faktor-faktor berikut:","l":340,"h":340},{"m":"a.","t":"Memberikan kualitas pekerjaan/barang yang baik dan sesuai dengan spesifikasi;","l":624,"h":340},{"m":"b.","t":"Pengiriman barang atau penyelesaian pekerjaan sesuai dengan dokumen PO/Kontrak/SPK;","l":624,"h":340},{"m":"c.","t":"Pengiriman barang/penyelesaian pekerjaan sesuai atau lebih awal dari jadwal yang telah ditentukan;","l":624,"h":340},{"m":"d.","t":"Memberikan bantuan teknis termasuk after sales support;","l":624,"h":340},{"m":"e.","t":"Kesegeraan mengganti barang yang rusak;","l":624,"h":340},{"m":"f.","t":"Mempunyai pengetahuan atas barang dan industri;","l":624,"h":340},{"m":"g.","t":"Mengatasi keluhan pelanggan dengan baik;","l":624,"h":340},{"m":"h.","t":"Tidak ada kesalahan dalam dokumen penagihan;","l":624,"h":340},{"m":"i.","t":"Kepatuhan terhadap peraturan pemerintah dalam segi perpajakan;","l":624,"h":340},{"m":"j.","t":"Lainnya.","l":624,"h":340},{"c":"[BAB XI.A angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"2.","t":"Setiap Penyedia Barang dan/ atau Jasa akan dilakukan penilaian pada penyedia barang dan/ atau jasa berdasarkan kriteria kualitas, pengiriman, pelayanan, kesesuaian teknis dan harga, dan pengelolaan dan kemampuan keuangan.","l":340,"h":340},{"m":"a.","t":"Kualitas Untuk mengukur kualitas barang dan/ atau jasa baik saat diterima, tidak ada kesalahan barang atau kinerja jasa yang rendah dan menyediakan penggantian segera dari produk yang ditolak atau cacat.","l":624,"h":340},{"m":"b.","t":"Pengiriman Untuk mengukur pengiriman tepat waktu, menawarkan jadwal pengiriman yang fleksibel bila diperlukan dan memberikan penerimaan dan pelaporan pengiriman yang tepat dan akurat.","l":624,"h":340},{"m":"c.","t":"Pelayanan Untuk mengukur memberikan bantuan teknis yang cepat dan akurat, menjaga ketersediaan barang dan menangani keluhan secara efisien dan benar.","l":624,"h":340},{"m":"d.","t":"Kesesuaian teknis dan harga","l":624,"h":340},{"t":"Untuk mengukur kepatuhan semua persyaratan kontrak, menawarkan opsi biaya terendah dan menawarkan biaya barang yang kompetitif.","l":624},{"m":"e.","t":"Pengelolaan dan kemampuan keuangan","l":624,"h":340},{"t":"Untuk mengukur pengiriman invoice tepat waktu dan kelengkapan, memiliki kekuatan finansial yang baik dan jangka waktu pembayaran flexible minimal 60 (enam puluh) hari kalender.","l":624},{"m":"f.","t":"Etika dan integritas","l":624,"h":340},{"t":"Untuk mengukur kepatuhan terhadap kaidah-kaidah, norma, peraturan perundang-undangan untuk menjamin terciptanya profesionalitas dan konsistensi dalam pemenuhan kewajiban sebagai penyedia barang dan/ atau jasa.","l":624},{"c":"[Pasal 54 ayat (2)]"}]]},{"topik":"Sistem Perhitungan Evaluasi","cells":[[{"t":"PROSES EVALUASI"},{"m":"2.","t":"Sistem Perhitungan Evaluasi:","l":340,"h":340},{"m":"a.","t":"Sistem perhitungan evaluasi adalah berdasarkan sistem poin yang dikumpulkan berdasarkan hasil penilaian terhadap Penyedia selama proses PBJ dan pelaksanaan pekerjaan di lingkungan Perusahaan berdasarkan form evaluasi;","l":624,"h":340},{"m":"b.","t":"Hasil evaluasi berlaku sampai dengan berakhirnya tahun anggaran atau sampai dengan berakhirnya status Penyedia sesuai pengelompokan hasil evaluasi;","l":624,"h":340},{"m":"c.","t":"Evaluasi dilakukan oleh Unit Bisnis atau Unit Teknis dan dapat melibatkan Unit Yang Membidangi Fungsi PBJ sesuai dengan form evaluasi yang sudah disiapkan.","l":624,"h":340},{"c":"[BAB VIII.A angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"CARA EVALUASI PENYEDIA BARANG DAN/ATAU JASA"},{"m":"7.3.1.","t":"Evaluasi Penyedia Barang dan/atau Jasa dilakukan dengan ketentuan sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Kepada Penyedia Barang dan/atau Jasa yang melaksanakan pekerjaan Pengadaan Barang dan/atau Jasa yang dinyatakan selesai berdasarkan Berita Acara Penerimaan Barang dan/atau Jasa (BAPB/J) atau periode Perjanjian kurang dari 6 (enam) bulan, maka penilaian dilakukan setelah:","l":624,"h":340},{"m":"1)","t":"Barang diterima;","l":908,"h":340},{"m":"2)","t":"Pekerjaan jasa selesai dilaksanakan; atau","l":908,"h":340},{"m":"3)","t":"Masa Perjanjian selesai.","l":908,"h":340},{"m":"b.","t":"Kepada Penyedia Barang dan/atau Jasa yang melaksanakan pekerjaan Pengadaan Barang dan/atau Jasa yang diikat dengan Perjanjian untuk periode/jangka waktu 6 (enam) bulan atau lebih, maka evaluasi dilakukan setiap 6 (enam) bulan dan hasil penilaian dihitung rata-rata dari setiap periode penilaian tersebut.","l":624,"h":340},{"m":"7.3.2.","t":"Evaluasi dilakukan terhadap Penyedia Barang dan/atau Jasa yang tercatat dalam Daftar Penyedia Barang dan/atau Jasadengan melihat catatan-catatan pembelian dan penerimaan Barang dan/atau Jasadari Penyedia Barang dan/atau Jasa yang ada.","l":540,"h":540},{"m":"7.3.3.","t":"Penilaian terhadap Penyedia Barang dan/atau Jasa dilakukan terhadap kriteria sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Mutu Barang dan/atau Jasa","l":624,"h":340},{"t":"Barang dan/atau Jasa yang diterima sesuai dengan spesifikasi, berdasarkan hasil pemeriksaan yang dilakukan oleh pihak yang ditunjuk ataupunbukti lain.","l":624},{"m":"b.","t":"Harga","l":624,"h":340},{"t":"Harga yang diajukan Penyedia Barang dan/atau Jasa masih dalam batas kewajaran dan dapat disetujui oleh perusahaan.","l":624},{"m":"c.","t":"Waktu Pengiriman/Pelaksanaan Pekerjaan","l":624,"h":340},{"t":"Waktu pengiriman atau pelaksanaan pekerjaan sesuai dengan jadwal yang ditetapkan.","l":624},{"m":"d.","t":"Kinerja Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"t":"Pelayanan Penyedia Barang dan/atau Jasa dalam melaksanakan pekerjaan termasuk pelayanan pada masa purna jual.","l":624},{"m":"e.","t":"Komunikasi dan Koordinasi","l":624,"h":340},{"t":"Mengukur cepat atau lambatnya komunikasi dan koordinasi yang dilakukan oleh Penyedia Barang dan/atau Jasa kepada Perusahaan.","l":624},{"m":"f.","t":"Pemenuhan Aspek Keselamatan, Kesehatan Kerja dan Lingkungan (K3L)","l":624,"h":340},{"t":"Khusus Pengadaan Jasa diwajibkan adanya penilaian terhadap Kepatuhan Penyedia Jasa dalam memenuhi ketentuan Keselamatan, Kesehatan Kerja dan Lingkungan sesuai dengan sifat dan spesifikasi Jasa.","l":624},{"m":"g.","t":"Kepatuhan terhadap ketentuan dalam Perjanjian dan ketentuan perundang-undangan yang berlaku.","l":624,"h":340},{"t":"Khusus Pengadaan Barang dan/atau Jasa yang menggunakan Perjanjian diwajibkan adanya penilaian terhadap kepatuhan terhadap ketentuan yang diatur dalam perjanjian barang dan/atau jasa dengan sifat dan spesifikasi barang dan/atau jasa.","l":624},{"m":"7.3.5.","t":"Evaluasi dilakukan dengan memberikan penilaian terhadap criteria tersebut di atas dengan nilai SANGAT BAIK (A) atau BAIK (B) atau CUKUP (C) atau KURANG (D) dan kemudian menjumlahkan nilai dari masing-masing penilaian.","l":540,"h":540},{"m":"7.3.6.","t":"Penyedia Barang dan/atau Jasa dinyatakan lulus evaluasi/memenuhi syarat jika hasil penilaiannya atau penilaian rata-rata tidak memiliki nilai KURANG untuk semua kriteria yang ada.","l":540,"h":540},{"m":"7.3.7.","t":"Penilaian akan dicatatkan pada lembar Hasil Evaluasi Penyedia Barang dan/atau Jasa yang mencantumkan data-data Penyedia Barang dan/atau Jasa dan hasil penilaian/penilaian rata-rata serta kesimpulan yang diambil.","l":540,"h":540},{"m":"7.3.8.","t":"Penyedia Barang dan/atau Jasa yang dapat memenuhi hasil penilaian A dan B dapat digunakan kembali untuk periode berikutnya dan dimasukkan dalam daftar Penyedia Barang dan/atau Jasa.","l":540,"h":540},{"m":"7.3.9.","t":"Sedangkan Penyedia Barang dan/atau Jasa yang tidak dapat memenuhi persyaratan (nilai C dan D) tersebut tidak dapat dipergunakan untuk periode berikutnya.","l":540,"h":540},{"c":"[BAB 7 angka 7.3.0]"}],[{"t":"PROSES EVALUASI"},{"m":"2.","t":"Sistem Perhitungan Evaluasi:","l":340,"h":340},{"m":"a.","t":"Sistem perhitungan evaluasi adalah berdasarkan sistem Poin yang dikumpulkan berdasarkan hasil penilaian terhadap Penyedia Barang dan/atau Jasa selama proses Pengadaan Barang dan/atau Jasa dan pelaksanaan pekerjaan di lingkungan Perusahaan berdasarkan form evaluasi;","l":624,"h":340},{"m":"b.","t":"Hasil evaluasi berlaku sampai dengan berakhirnya tahun anggaran atau sampai dengan berakhirnya status Penyedia Barang dan/atau Jasa sesuai pengelompokan Hasil Evaluasi;","l":624,"h":340},{"m":"c.","t":"Evaluasi dilakukan oleh Unit Pengguna dan dapat melibatkan Unit Pengadaan sesuai dengan form evaluasi yang sudah disiapkan.","l":624,"h":340},{"c":"[BAB XI.A angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"B. HASIL EVALUASI","rows":[{"topik":"Pengelompokan Hasil Evaluasi","cells":[[{"t":"HASIL EVALUASI"},{"m":"1.","t":"Pengelompokan Hasil Evaluasi:","l":340,"h":340},{"m":"a.","t":"HIJAU adalah kelompok Penyedia dengan predikat Kriteria Baik/nilai 76-100. Kelompok ini menjadi prioritas dalam kegiatan PBJ di lingkungan Perusahaan pada tahun anggaran berikutnya;","l":624,"h":340},{"m":"b.","t":"KUNING adalah kelompok Penyedia dengan predikat Kriteria Cukup/nilai 51-75. Kelompok ini tetap diperbolehkan untuk dipertimbangkan untuk mengikuti kegiatan PBJ di lingkungan Perusahaan tetapi tidak menjadi prioritas dalam kegiatan PBJ di lingkungan Perusahaan pada tahun anggaran berikutnya;","l":624,"h":340},{"m":"c.","t":"MERAH adalah kelompok Penyedia dengan predikat Kriteria Buruk/nilai 26-50. Kelompok Penyedia ini tidak diperbolehkan mengikuti kegiatan PBJ selanjutnya selama 1 (satu) Tahun anggaran berikutnya, sejak sanksi dimasukkan ke dalam sistem (berlaku untuk Penyedia, pemilik, dan pengurusnya);","l":624,"h":340},{"m":"d.","t":"HITAM adalah kelompok Penyedia dengan predikat Kriteria Sangat Buruk/nilai di bawah 26PBJ. Kelompok Penyedia ini tidak dapat mengikuti kegiatan PBJ di lingkungan Perusahaan selama 2 (dua) Tahun anggaran berikutnya (berlaku untuk Penyedia, pemilik, dan pengurusnya);","l":624,"h":340},{"m":"e.","t":"Penyedia yang masuk dalam daftar HITAM dapat dimasukan juga dalam daftar dan rekam jejak (track record) di Kementerian BUMN / PT Integrasi Aviasi Solusi Group.","l":624,"h":340},{"c":"[BAB VIII.B angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"HASIL EVALUASI"},{"m":"1.","t":"Pengelompokan Hasil Evaluasi:","l":340,"h":340},{"m":"a.","t":"HIJAU adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Baik/nilai 76-100. Kelompok ini menjadi prioritas dalam kegiatan Pengadaan barang dan/atau jasa di lingkungan Perusahaan pada tahun anggaran berikutnya;","l":624,"h":340},{"m":"b.","t":"KUNING adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Cukup/nilai 51-75. Kelompok ini tetap diperbolehkan untuk dipertimbangkan untuk mengikuti kegiatan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan tetapi tidak menjadi prioritas dalam kegiatan Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan pada tahun anggaran berikutnya;","l":624,"h":340},{"m":"c.","t":"MERAH adalah adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Buruk/nilai 26-50. Kelompok Penyedia Barang dan/atau Jasa ini tidak diperbolehkan mengikuti kegiatan Pengadaan Barang dan/atau Jasa selanjutnya selama 1 (satu) tahun anggaran berikutnya, sejak sanksi dimasukkan ke dalam sistem (berlaku untuk Penyedia Barang dan/atau Jasa, pemilik dan pengurusnya);","l":624,"h":340},{"m":"d.","t":"HITAM adalah kelompok Penyedia Barang dan/atau Jasa dengan predikat Kriteria Sangat Buruk/nilai di bawah 26 (tidak dapat mengikuti kegiatan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan selama. Kelompok Penyedia Barang dan/atau Jasa ini tidak dapat mengikuti kegiatan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan selama 2 (dua) tahun berikutnya (berlaku untuk Penyedia Barang dan/atau Jasa, pemilik dan pengurusnya);","l":624,"h":340},{"m":"e.","t":"Penyedia Barang dan/atau Jasa yang masuk dalam daftar HITAM dapat dimasukan juga dalam daftar dan rekam jejak (track record) di Kementerian BUMN.","l":624,"h":340},{"c":"[BAB XI.B angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Pengaturan Kelompok Merah dan Hitam","cells":[[{"t":"HASIL EVALUASI"},{"m":"2.","t":"Pengaturan Terhadap Kelompok Merah dan Hitam:","l":340,"h":340},{"m":"a.","t":"Penyedia yang masuk Kelompok Merah secara otomatis masuk ke Kelompok Hitam:","l":624,"h":340},{"m":"1)","t":"Apabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan harus diselesaikan;","l":908,"h":340},{"m":"2)","t":"Akan dibatalkan keikutsertaannya dalam proses PBJ yang sedang berlangsung;","l":908,"h":340},{"m":"3)","t":"Akan dibatalkan penunjukannya apabila terpilih sebagai pelaksana pengadaan;","l":908,"h":340},{"m":"4)","t":"Akan langsung masuk Kelompok Hitam jika 2 (dua) Tahun berturut-turut masuk Kelompok Merah.","l":908,"h":340},{"m":"b.","t":"Pengaturan terhadap Penyedia yang terkena sanksi Kelompok Hitam:","l":624,"h":340},{"m":"1)","t":"Apabila Perjanjian Pengadaan sudah ditandatangani dan/atau pekerjaan sedang berjalan maka pekerjaan dapat diselesaikan atau dapat diberhentikan dengan pertimbangan khusus dari Perusahaan;","l":908,"h":340},{"m":"2)","t":"Akan dibatalkan keikutsertaannya dalam proses PBJ yang sedang berlangsung sepanjang Perjanjian Pengadaan belum ditandatangani;","l":908,"h":340},{"m":"3)","t":"Akan dibatalkan penunjukannya apabila terpilih sebagai pelaksana pengadaan.","l":908,"h":340},{"c":"[BAB VIII.B angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENGELOLAAN DAFTAR HITAM (BLACKLIST) PERUSAHAAN"},{"m":"7.3.2.","t":"Tujuan Memasukkan ke Daftar Hitam (Blacklist) Perusahaan","l":540,"h":540},{"m":"a.","t":"Memasukkan Penyedia Barang dan/atau Jasa ke Daftar Hitam (Blacklist) dilakukan untuk memberikan pembinaan kepada Penyedia Barang dan/atau Jasa sehingga Pengadaan Barang dan/atau Jasa dapat memenuhi kriteria dan spesifikasi yang diinginkan oleh Perusahaan.","l":624,"h":340},{"m":"b.","t":"Masuknya Penyedia Barang dan/atau Jasa ke Daftar Hitam (Blacklist) Perusahaan akan dijadikan dasar pertimbangan untuk tidak melakukan penunjukan atau penunjukan kembali atau mengundang Penyedia Barang dan/atau Jasa dalam proses Pengadaan Barang dan/atau Jasa di Perusahaan yang sejenis untuk tenggang waktu tertentu.","l":624,"h":340},{"m":"7.3.3.","t":"Pelaksana Pengelola Daftar Hitam (Blacklist) Perusahaan","l":540,"h":540},{"m":"a.","t":"Daftar Hitam (Blacklist) Perusahaan dibuat oleh Unit Kerja Pengadaan baik di Kantor Pusat maupun di Kantor Cabang, berdasarkan masukan dan evaluasi Penyedia Barang dan/atau Jasa dari Unit Pengguna (User)/Unit Spesifikasi Teknis (UST)/Pelaksana Pengadaan.","l":624,"h":340},{"m":"b.","t":"Daftar Hitam (Blacklist) yang dibuat oleh Unit Kerja Pengadaan Kantor Pusat untuk Penyedia Barang dan/atau Jasa yang terdaftar di Kantor Pusat setelah mendapat persetujuan dari Direktur yang membidangi pengadaan.","l":624,"h":340},{"m":"c.","t":"Daftar Hitam (Blacklist) yang dibuat oleh Unit Kerja Pengadaan Kantor Cabang terbatas hanya untuk Penyedia Barang dan/atau Jasa yang terdaftar di Kantor Cabang setempat, setelah mendapat persetujuan dari Pejabat Berwenang Kantor Cabang.","l":624,"h":340},{"m":"7.3.4.","t":"Tata Cara memasukkan ke Daftar Hitam (Blacklist) Perusahaan","l":540,"h":540},{"m":"a.","t":"Unit Pengguna (User)/Unit Spesifikasi Teknis (UST)/Pelaksana Pengadaan yang menemukan indikasi pelanggaran yang dilakukan oleh Penyedia Barang dan/atau Jasa atau calon Penyedia Barang dan/atau Jasa mencatat dan melaporkan indikasi tersebut ke Unit Kerja Pengadaan sesuai lokasi di m":"i.","t":"Pemberian beasiswa beserta fasilitas pendukung lainnya;","l":624,"h":340},{"m":"j.","t":"Keperluan kegiatan pelatihan/training, workshop, seminar dan kegiatan pendidikan lainnya;","l":624,"h":340},{"m":"k.","t":"Pemberian bantuan Pengadaan Barang dan/atau Jasa khusus untuk non konstruksi yang ditugaskan oleh instansi pemerintah dalam rangka kegiatan Corporate Social Responcibility (CSR) atau Tanggung Jawab Sosial dan Lingkungan (TJSL);","l":624,"h":340},{"m":"l.","t":"Pengadaan Barang dan/atau Jasa di Bandara yang penyedia Barang/Jasa telah ditentukan oleh otoritas/pengelola Bandara;","l":624,"h":340},{"m":"m.","t":"Pengadaan Barang dan/atau Jasa yang dilakukan melalui e-catalogue/e-commerce yang direkomendasikan Kementrian BUMN; atau","l":624,"h":340},{"m":"n.","t":"Pengadaan Barang dan/atau Jasa di Kantor Pusat dengan Nilai Pengadaan kurang dari Rp10.000.000,- (sepuluh juta rupiah) untuk kebutuhan Perusahaan.","l":624,"h":340},{"m":"8.1.2.","t":"Pengadaan Barang dan/atau Jasa sebagaimana dimaksud pada butir 8.1.1. dilakukan secara langsung oleh Unit Spesifikasi Teknis (UST) berdasarkan permintaan dari Unit Pengguna (User) kepada Unit Keuangan dengan mekanisme sesuai dengan yang diatur dalam Manual Unit Keuangan.","l":540,"h":540},{"c":"[BAB 8 angka 8.8.0]"}],[{"t":"PENGECUALIAN"},{"m":"1.","t":"Pengadaan Barang dan/atau Jasa yang dikecualikan dari ketentuan dalam keputusan Direksi ini adalah:","l":340,"h":340},{"m":"a.","t":"Pengadaan Barang dan/atau Jasa yang dilaksanakan berdasarkan tarif yang dipublikasi secara luas kepada masyarakat, meliputi tarif listrik, telepon/komunikasi, air bersih, Bahan Bakar Gas (BBG) atau Bahan Bakar Minyak (BBM) melalui agen/supplier resmi;","l":624,"h":340},{"m":"b.","t":"Pengadaan Barang dan/atau Jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya seperti dan tidak terbatas pada Pengadaan tanah;","l":624,"h":340},{"m":"c.","t":"Pengadaan Barang dan/atau Jasa lainnya seperti pembelian permakanan, hotel, tiket, dan akomodasi dan sewa rumah/gedung;","l":624,"h":340},{"m":"d.","t":"Pengadaan Barang dan/atau Jasa penjamin emisi (underwriter), wali amanat (trustee), lembaga pemeringkat (rating agency) dan custodian.","l":624,"h":340},{"m":"2.","t":"Pengadaan Barang dan/atau Jasa sebagaimana dimaksud pada ayat (1) dilakukan secara langsung oleh Unit Pengguna berdasarkan Keputusan Direksi tersendiri.","l":340,"h":340},{"c":"[BAB XII.C]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Pengadaan barang dan/ atau jasa yang dikecualikan dari ketentuan dalam Peraturan Direksi ini adalah:"},{"m":"1.","t":"Pengadaan barang dan/ atau jasa yang dilaksanakan berdasarkan tarif yang dipublikasikan secara luas kepada masyarakat, namun tidak hanya terbatas pada tarif listrik, telepon/ komunikasi, air bersih, Bahan Bakar Gas (BBG) atau Bahan Bakar Minyak (BBM) melalui agen/ supplier resmi.","l":340,"h":340},{"m":"2.","t":"Pengadaan barang dan/ atau jasa yang diatur dengan ketentuan peraturan perundang-undangan lainnya seperti dan tidak terbatas pada pengadaan tanah.","l":340,"h":340},{"m":"3.","t":"Pengadaan barang dan/ atau jasa sebagaimana disebutkan dalam ayat (1) dan ayat (2) dilaksanakan oleh Unit Teknis untuk kegiatan non komersial atau tidak bertujuan mencari keuntungan.","l":340,"h":340},{"c":"[Pasal 63]"}]]},{"topik":"PBJ Jasa Akuntan Publik","cells":[[{"t":"PENGECUALIAN"},{"m":"2.","t":"Khusus pelaksanaan PBJ terkait Jasa Akuntan Publik untuk audit laporan keuangan dan/atau KPI tahunan perusahaan yang ditunjuk oleh RUPS dari calon yang diajukan oleh Dewan Komisaris, dapat dilaksanakan dengan metode penunjukan langsung serta pembuatan dokumen pemilihan dan ikatan kerja dapat menyesuaikan dengan kebutuhan pelaksanaan pekerjaan.","l":340,"h":340},{"c":"[BAB IX.C angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]}]}]}</script>
<script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const DATA = JSON.parse(document.getElementById('matrix-data').textContent);
const COLS = DATA.cols;
const BABS = DATA.babs;
function splitHeading(h){
  const m = h.match(/^(.*?)\s(?:—|-){1,2}\s(.*)$/); if(m) return {code:m[1].trim(), title:m[2].trim()};
  const m2 = h.match(/^([A-Z]{1,2}\.)\s+(.*)$/); if(m2) return {code:m2[1], title:m2[2]};
  return {code:'', title:h.trim()};
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[“”"']/g,'').replace(/\s+/g,' '); }
function parseQuery(q){
  const terms=[]; const re=/"([^"]+)"|(\S+)/g; let m;
  while((m=re.exec(q))){ const t=norm((m[1]||m[2]).trim()).replace(/^[.,;:()\[\]]+|[.,;:()\[\]]+$/g,''); if(t && (m[1]||t.length>=2||/\d/.test(t))) terms.push(t); }
  return terms;
}
function highlight(text,terms){
  const e = esc(text); if(!terms||!terms.length) return e;
  try{ const parts=[...terms].sort((a,b)=>b.length-a.length).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+')); return e.replace(new RegExp('('+parts.join('|')+')','ig'),'<mark>$1</mark>'); }catch(err){ return e; }
}
const PX = 0.066;
function isCaps(t){ return t.length<160 && /[A-Z]/.test(t) && !/[a-z]/.test(t); }
function dattr(it){ return `${it.l?` data-l="${it.l}"`:''}${it.h?` data-h="${it.h}"`:''}${it.f?` data-f="${it.f}"`:''}`; }
function renderCell(items,q,edit){
  if(!items.length) return edit ? '<p class="plain-line"></p>' : '<p class="none">—</p>';
  return items.map((it,idx)=>{
    if(it.tbl && edit) return `<div class="keep-tbl" contenteditable="false" data-keep="${idx}">${renderCell([it],[],false).replace(/<button class="tbl-expand"[^>]*>.*?<\/button>/,'')}<div class="keep-note">Tabel tidak diedit di sini</div></div>`;
    if(it.tbl){
      const T = it.tbl, hdr = T.hdr;
      const cellHtml = (c, tag) => `<${tag}${c.cs?` colspan="${c.cs}"`:''}${c.rs?` rowspan="${c.rs}"`:''}>${c.t.split('\n').map(x=>highlight(x,q)).join('<br>')}</${tag}>`;
      const head = T.rows.slice(0,hdr).map(r=>`<tr>${r.map(c=>cellHtml(c,'th')).join('')}</tr>`).join('');
      const body = T.rows.slice(hdr).map(r=>`<tr>${r.map(c=>cellHtml(c,'td')).join('')}</tr>`).join('');
      const first = T.rows[hdr] || T.rows[0] || [];
      const noCol = hdr && /^no\.?$/i.test(((T.rows[0][0]||{}).t||'').trim());
      const ncol = Math.max(...T.rows.map(r=>r.reduce((a,c)=>a+(c.cs||1),0)));
      return `${ncol>3?'<button class="tbl-expand" title="Buka tabel dalam ukuran penuh">⤢ Lihat tabel penuh</button>':''}<div class="in-tbl-wrap"><table class="in-tbl${hdr?'':' plain'}${noCol?' has-no':''}">${head?`<thead>${head}</thead>`:''}<tbody>${body}</tbody></table></div>`;
    }
    if(it.c) return `<p class="cite-line">${highlight(it.c,q)}</p>`;
    const L = (it.l||0), H = (it.h||0);
    if(it.m!==undefined){
      const mw = Math.max(H*PX, 16);
      return `<p class="li"${dattr(it)} style="margin-left:${Math.max(L-H,0)*PX}px; --mw:${mw}px"><span class="mk">${highlight(it.m,q)}</span><span class="tx">${highlight(it.t,q)}</span></p>`;
    }
    const style = L ? ` style="margin-left:${(L-H)*PX}px${H?`; padding-left:${H*PX}px; text-indent:-${H*PX}px`:''}"` : '';
    const t = it.t.replace(/\t/g,' ');
    if(/^tidak (diatur|didefinisikan)\.?$/i.test(t.trim())) return `<p class="none"${dattr(it)}>${highlight(t,q)}</p>`;
    if(isCaps(t) && !L) return `<p class="caps"${dattr(it)}>${highlight(t,q)}</p>`;
    return `<p class="plain-line"${dattr(it)}${style}>${highlight(t,q)}</p>`;
  }).join('');
}
const itemsText = items => items.map(i=> i.tbl ? i.tbl.rows.flat().map(c=>c.t).join(' ') : ((i.m||'')+' '+(i.t||i.c||''))).join(' ');

BABS.forEach((b,bi)=>{
  b._h = splitHeading(b.heading); b._count = 0;
  b._hasNamedSub = b.subsections.some(s=>s.heading);
  b.subsections.forEach(s=>{ s._h = s.heading ? splitHeading(s.heading) : {code:'',title:''}; b._count += s.rows.length;
    s.rows.forEach(r=>{ r._hay = norm(r.topik+' '+r.cells.map(itemsText).join(' ')); }); });
});
const TOTAL = BABS.reduce((a,b)=>a+b._count,0);

let colState = COLS.map(()=>true);
let openState = BABS.map((_,i)=> i===0);
let navOpenState = BABS.map((_,i)=> i===0);
let query = '';
let scrollX = 0;

document.getElementById('regs').innerHTML = COLS.map((c,i)=>`<span><span class="dot c${i}"></span>${esc(c)}</span>`).join('');
document.getElementById('stats').innerHTML = `
  <div class="stat"><div class="n">${BABS.length}</div><div class="l">Bab</div></div>
  <div class="stat"><div class="n">${BABS.reduce((a,b)=>a+b.subsections.length,0)}</div><div class="l">Sub-bab</div></div>
  <div class="stat"><div class="n">${TOTAL}</div><div class="l">Topik</div></div>`;

const colToggles = document.getElementById('colToggles');
COLS.forEach((c,i)=>{ const el=document.createElement('label'); el.className='chip-toggle on'; el.innerHTML=`<input type="checkbox" checked data-col="${i}"><span class="dot c${i}"></span>${esc(c)}`; colToggles.appendChild(el); });
colToggles.addEventListener('change', e=>{ if(e.target.dataset.col!==undefined){ colState[+e.target.dataset.col]=e.target.checked; e.target.closest('.chip-toggle').classList.toggle('on',e.target.checked); render(); } });

const COLW = 300;

function resetSearch(){ query=''; searchInput.value=''; clearBtn.style.display='none'; document.getElementById('kbdHint').style.display='block'; }
function goToBab(bi){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('bab-'+bi); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }
function goToSub(bi,si){ resetSearch(); openState[bi]=true; navOpenState[bi]=true; render(); setTimeout(()=>{ const el=document.getElementById('sub-'+bi+'-'+si); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); }

const navList = document.getElementById('navList');
function renderSidebar(){
  navList.innerHTML = BABS.map((b,bi)=>`<div class="nav-group ${navOpenState[bi]?'open':''}">
    <button class="nav-item" data-bab="${bi}"><span class="left"><span class="code">${esc(b._h.code)}</span><span class="ttl">${esc(b._h.title)}</span></span>
    <span class="left" style="flex:none;"><span class="cnt">${b.subsections.length}</span><svg class="chev-mini" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="9 6 15 12 9 18"/></svg></span></button>
    <div class="nav-subs">${b.subsections.map((s,si)=>`<button class="nav-sub" data-bab="${bi}" data-sub="${si}"><span class="code">${esc(s._h.code)}</span>${esc(s._h.title)}</button>`).join('')}</div></div>`).join('');
}

mobileSelect.innerHTML = '<option value="">Lompat ke bab…</option>' + BABS.map((b,bi)=>`<optgroup label="${esc(b._h.code+' — '+b._h.title)}">${b.subsections.map((s,si)=>`<option value="${bi}-${si}">${esc(s._h.code+' '+s._h.title)}</option>`).join('')}</optgroup>`).join('');

/* ---- geser ke samping (sinkron) ---- */
const colbarScroll = document.getElementById('colbarScroll');
const colbarInner = document.getElementById('colbarInner');
let syncing = false;
function scrollers(){ return [...document.querySelectorAll('.h-scroll')]; }
function syncAll(x, except){
  syncing = true; scrollX = x;
  scrollers().forEach(s=>{ if(s!==except) s.scrollLeft = x; });
  colbarScroll.scrollLeft = x;
  requestAnimationFrame(()=>{ syncing=false; });
  updateArrows();
}
colbarScroll.addEventListener('scroll', ()=>{ if(syncing) return; scrollX = colbarScroll.scrollLeft; scrollers().forEach(s=> s.scrollLeft = scrollX); updateArrows(); });
document.getElementById('main').addEventListener('wheel', e=>{
  const tw = e.target.closest && e.target.closest('.in-tbl-wrap');
  if(tw && tw.scrollWidth > tw.clientWidth + 2) return;
  let dx = 0;
  if(e.shiftKey) dx = e.deltaX || e.deltaY;
  else if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) dx = e.deltaX;
  if(!dx) return;
  e.preventDefault();
  colbarScroll.scrollLeft = Math.max(0, Math.min(maxX(), colbarScroll.scrollLeft + dx));
}, {passive:false});
let touchX = null;
document.getElementById('main').addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; }, {passive:true});
document.getElementById('main').addEventListener('touchmove', e=>{ if(touchX===null || (e.target.closest && e.target.closest('.in-tbl-wrap'))) return; const x=e.touches[0].clientX; colbarScroll.scrollLeft += (touchX - x); touchX = x; }, {passive:true});
function colWidth(){ return COLW; }
function maxX(){ return Math.max(0, colbarScroll.scrollWidth - colbarScroll.clientWidth); }
function step(dir){
  const w = colWidth();
  let x = Math.round((scrollX + dir*w)/w)*w;
  x = Math.max(0, Math.min(maxX(), x));
  colbarScroll.scrollTo({left:x, behavior:'smooth'});
}
const prevBtn = document.getElementById('prevCol'), nextBtn = document.getElementById('nextCol');
prevBtn.addEventListener('click', ()=>step(-1)); nextBtn.addEventListener('click', ()=>step(1));
const colbar = document.querySelector('.colbar');
function alignBar(){
  const s = scrollers()[0]; if(!s){ colbarScroll.style.width = ''; return; }
  const sr = s.getBoundingClientRect(), br = colbar.getBoundingClientRect();
  colbarScroll.style.marginLeft = Math.max(0, sr.left - br.left) + 'px';
  colbarScroll.style.width = s.clientWidth + 'px';
  prevBtn.style.left = (Math.max(0, sr.left - br.left) - 12) + 'px';
  nextBtn.style.right = 'auto'; nextBtn.style.left = (Math.max(0, sr.left - br.left) + s.clientWidth - 18) + 'px';
}
function updateArrows(){
  alignBar();
  const m = maxX(); prevBtn.disabled = scrollX <= 2; nextBtn.disabled = scrollX >= m-2;
  const vis = COLS.map((c,i)=>i).filter(i=>colState[i]);
  const w = colWidth(); const s = scrollers()[0];
  const first = Math.round(scrollX/w), n = s ? Math.max(1, Math.floor((s.clientWidth+4)/w)) : vis.length;
  const pos = document.getElementById('colPos');
  if(pos) pos.textContent = vis.length ? `Kolom ${Math.min(first+1,vis.length)}–${Math.min(first+n,vis.length)} dari ${vis.length} terlihat. ` : '';
}
window.addEventListener('resize', ()=>{ syncAll(Math.min(scrollX, maxX())); });
document.addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if(e.key==='ArrowRight' && e.altKey){ e.preventDefault(); step(1); }
  if(e.key==='ArrowLeft' && e.altKey){ e.preventDefault(); step(-1); }
});

const main = document.getElementById('main');
const resultsNote = document.getElementById('resultsNote');
function render(){
  if(current) commitEdit();
  const q = parseQuery(query); const filtering = q.length>0;
  const vis = COLS.map((c,i)=>i).filter(i=>colState[i]);
  colbarInner.innerHTML = vis.map(i=>`<div class="c${i}"><span class="dot c${i}"></span>${esc(COLS[i])}</div>`).join('');
  let total=0, html='';
  BABS.forEach((b,bi)=>{
    let babHtml='', babCount=0;
    b.subsections.forEach((s,si)=>{
      let rowsHtml='', n=0;
      s.rows.forEach((r,ri)=>{
        if(filtering && !q.every(t=> r._hay.includes(t))) return;
        n++;
        const same = norm(r.topik).replace(/[^a-z0-9]/g,'') === norm(s._h.title).replace(/[^a-z0-9]/g,'');
        rowsHtml += `<div class="topic-card" id="row-${bi}-${si}-${ri}"><div class="topic-title${same&&!r.edited?' same':''}"><span class="tt-text">${highlight(r.topik,q)}</span>${penBtn('topik',`${bi}-${si}-${ri}`)}</div>
          <div class="h-scroll"><div class="cols6">${r.cells.map((c,ci)=>`<div class="col c${ci} ${colState[ci]?'':'hidden-col'}"><span class="col-label c${ci}">${esc(COLS[ci])}</span>${penBtn('cell',`${bi}-${si}-${ri}-${ci}`)}<div class="col-text">${renderCell(c,q)}</div></div>`).join('')}</div></div></div>`;
      });
      if(n){ babHtml += `<div class="subsection" id="sub-${bi}-${si}"><div class="subsection-head"><span class="code">${esc(s._h.code)}</span><h3>${esc(s._h.title)}</h3>${s.rows.length>1?`<span class="cnt">${n} topik</span>`:''}</div>${rowsHtml}</div>`; babCount+=n; }
    });
    if(filtering && !babCount) return;
    const isOpen = filtering ? true : openState[bi];
    html += `<section class="bagian ${isOpen?'open':''}" id="bab-${bi}"><button class="bagian-head" data-bi="${bi}"><span class="left"><span class="code">${esc(b._h.code)}</span><h2>${esc(b._h.title)}</h2></span>
      <span class="meta"><span class="badge-count">${b.subsections.length} sub-bab</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg></span></button>
      <div class="bagian-body">${isOpen?babHtml:''}</div></section>`;
    total += babCount;
  });
  if(filtering && !total) html = `<div class="empty-state"><div class="big">Tidak ada hasil</div>Coba kata kunci lain.</div>`;
  main.innerHTML = html;
  resultsNote.textContent = filtering ? `${total} topik cocok untuk semua kata: ${q.map(t=>'"'+t+'"').join(' + ')}` : '';
  main.querySelectorAll('.bagian-head').forEach(btn=>btn.addEventListener('click',()=>{ const bi=+btn.dataset.bi; if(!filtering){ openState[bi]=!openState[bi]; navOpenState[bi]=openState[bi]; render(); } else btn.closest('.bagian').classList.toggle('open'); }));
  renderSidebar();
  requestAnimationFrame(()=> syncAll(Math.min(scrollX, maxX())));
}
const searchInput=document.getElementById('search'), clearBtn=document.getElementById('clearBtn'); let tmr;
searchInput.addEventListener('input', e=>{ clearTimeout(tmr); const v=e.target.value; clearBtn.style.display=v?'block':'none'; document.getElementById('kbdHint').style.display=v?'none':'block'; tmr=setTimeout(()=>{ query=v; render(); },160); });
clearBtn.addEventListener('click', ()=>{ resetSearch(); searchInput.focus(); render(); });

/* ===== Edit teks + simpan otomatis ===== */
const PEN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function penBtn(kind, loc){ return `<button class="pen" title="Edit teks" data-edit="${kind}" data-loc="${loc}">${PEN}</button>`; }
const saveBtn = document.getElementById('saveFile');
const STORE = 'matriks6-edit:' + location.pathname;
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
function getRow(loc){ const [bi,si,ri,ci]=loc.split('-').map(Number); return {r:BABS[bi].subsections[si].rows[ri], ci}; }
// nilai dasar (isi file) untuk tiap bagian yang bisa diedit
const BASE = {};
BABS.forEach((b,bi)=>b.subsections.forEach((s,si)=>s.rows.forEach((r,ri)=>{
  BASE[`t:${bi}-${si}-${ri}`] = hashStr(r.topik);
  r.cells.forEach((c,ci)=> BASE[`c:${bi}-${si}-${ri}-${ci}`] = hashStr(JSON.stringify(c)));
})));
let patches = {};
try{ patches = JSON.parse(localStorage.getItem(STORE) || '{}'); }catch(e){ patches = {}; }
let pendingFile = 0;
(function applyPatches(){
  for(const [k,p] of Object.entries(patches)){
    if(BASE[k] !== p.o){ delete patches[k]; continue; }   // file sudah berubah: abaikan editan lama
    const loc = k.slice(2), {r,ci} = getRow(loc);
    if(k[0]==='t') r.topik = p.v; else r.cells[ci] = p.v;
    r.edited = true; r._hay = norm(r.topik+' '+r.cells.map(itemsText).join(' ')); pendingFile++;
  }
  persist();
})();
function persist(){ try{ if(Object.keys(patches).length) localStorage.setItem(STORE, JSON.stringify(patches)); else localStorage.removeItem(STORE); }catch(e){} updateSaveDot(); }

let current = null;
const mainEl = document.getElementById('main');
mainEl.addEventListener('click', e=>{
  const p = e.target.closest('.pen'); if(!p) return;
  e.stopPropagation(); if(current){ commitEdit(); }
  startEdit(p);
});
function startEdit(p){
  const kind = p.dataset.edit, loc = p.dataset.loc, {r,ci} = getRow(loc);
  let el;
  if(kind==='cell'){ el = p.parentElement.querySelector('.col-text'); el.innerHTML = renderCell(r.cells[ci]||[], [], true); }
  else { el = p.parentElement.querySelector('.tt-text'); el.textContent = r.topik; p.parentElement.classList.remove('same'); }
  el.contentEditable = 'true'; el.spellcheck = false; el.classList.add('editing');
  const bar = document.createElement('div'); bar.className = 'edit-bar';
  bar.innerHTML = '<span class="hint">Ctrl+Enter selesai · Esc batal</span><button class="cancel">Batal</button><button class="ok">Selesai</button>';
  (kind==='cell' ? el : p.parentElement).after(bar);
  bar.querySelector('.ok').addEventListener('click', ev=>{ ev.stopPropagation(); commitEdit(); render(); });
  bar.querySelector('.cancel').addEventListener('click', ev=>{ ev.stopPropagation(); current=null; render(); });
  current = {kind, loc, r, ci, el, bar};
  el.focus();
}
const MARK_RE = /^(\(?[0-9]{1,3}\)|\(?[a-z]{1,4}\)|[0-9]{1,3}(\.[0-9]{1,3})*\.|[a-z]{1,4}\.|[ivx]{1,5}\.|-|•)\s+/i;
function parseCell(el, orig){
  const out = [];
  const pushText = (n, text) => {
    text = text.replace(/\s+/g,' ').trim(); if(!text) return;
    const ds = n.dataset || {}; const it = {};
    if(/^\[.*\]$/.test(text)){ out.push({c:text}); return; }
    const mk = n.querySelector && n.querySelector('.mk');
    if(mk){
      const m = mk.textContent.replace(/\s+/g,' ').trim();
      const tx = n.querySelector('.tx'); let t = (tx ? tx.textContent : n.textContent.slice(mk.textContent.length)).replace(/\s+/g,' ').trim();
      if(m){ it.m = m; it.t = t; } else it.t = t;
    } else if(ds.h && MARK_RE.test(text)){ const mm = text.match(MARK_RE); it.m = mm[0].trim(); it.t = text.slice(mm[0].length).trim(); }
    else it.t = text;
    if(ds.l) it.l = +ds.l; if(ds.h) it.h = +ds.h; if(ds.f) it.f = +ds.f;
    if(it.m===undefined){ const o = {t:it.t}; if(it.l) o.l=it.l; if(it.h) o.h=it.h; if(it.f) o.f=it.f; out.push(o); }
    else { const o = {m:it.m, t:it.t}; if(it.l) o.l=it.l; if(it.h) o.h=it.h; out.push(o); }
  };
  el.childNodes.forEach(n=>{
    if(n.nodeType===3){ pushText({}, n.textContent); return; }
    if(n.nodeType!==1) return;
    if(n.dataset.keep!==undefined){ out.push(orig[+n.dataset.keep]); return; }
    if(n.classList.contains('cite-line')){ const t=n.textContent.replace(/\s+/g,' ').trim(); if(t) out.push({c:t}); return; }
    pushText(n, n.textContent);
  });
  return out;
}
function normItems(items){ return items.map(i=>{ if(i.tbl) return i; if(i.c) return {c:i.c.replace(/\s+/g,' ').trim()};
  const o={}; if(i.m!==undefined) o.m=i.m.replace(/\s+/g,' ').trim(); o.t=(i.t||'').replace(/\s+/g,' ').trim(); if(i.l) o.l=i.l; if(i.h) o.h=i.h; if(i.f && i.m===undefined) o.f=i.f; return o; }).filter(i=> i.tbl || i.c || i.t || i.m); }
function commitEdit(){
  if(!current) return;
  const {kind, loc, r, ci, el, bar} = current; current = null;
  let changed = false, key;
  if(kind==='cell'){
    const v = parseCell(el, r.cells[ci]||[]);
    if(JSON.stringify(normItems(v)) !== JSON.stringify(normItems(r.cells[ci]||[]))){ r.cells[ci] = v; changed = true; key = 'c:'+loc; }
  } else {
    const v = el.textContent.replace(/\s+/g,' ').trim();
    if(v && v !== r.topik){ r.topik = v; changed = true; key = 't:'+loc.split('-').slice(0,3).join('-'); }
  }
  if(bar) bar.remove();
  if(changed){
    r.edited = true; r._hay = norm(r.topik+' '+r.cells.map(itemsText).join(' '));
    patches[key] = {o: BASE[key], v: kind==='cell' ? r.cells[ci] : r.topik};
    pendingFile++; persist();
    toastMsg('Perubahan tersimpan otomatis di browser ini.');
  }
}
mainEl.addEventListener('paste', e=>{ if(!e.target.closest('.editing')) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text/plain')); });
mainEl.addEventListener('keydown', e=>{
  if(!current) return;
  if(e.key==='Escape'){ e.preventDefault(); current=null; render(); }
  else if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); commitEdit(); render(); }
  else if(e.key==='Enter' && current.kind==='topik'){ e.preventDefault(); }
});

/* simpan permanen ke file (tombol kecil) */
let fileHandle = null;
function updateSaveDot(){ saveBtn.classList.toggle('has', pendingFile>0); saveBtn.title = pendingFile>0 ? `Simpan ${pendingFile} perubahan ke file HTML (Ctrl+S)` : 'Simpan ke file HTML (Ctrl+S)'; }
function cleanJSON(){ return JSON.stringify(DATA, (k,v)=> k.startsWith('_') ? undefined : v).replace(/<\//g,'<\\/'); }
function buildHtml(){ const open='<script id="matrix-data" type="application/json">'; const a=PRISTINE.indexOf(open)+open.length, b=PRISTINE.indexOf('<\/script>', a); return PRISTINE.slice(0,a)+cleanJSON()+PRISTINE.slice(b); }
function fileName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()) || 'Matriks_Perbandingan_PBJ_6_Aturan.html'; }catch(e){ return 'Matriks_Perbandingan_PBJ_6_Aturan.html'; } }
const toastEl = document.getElementById('toast');
function toastMsg(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),2600); }
async function saveFile(){
  if(current){ commitEdit(); render(); }
  const html = buildHtml();
  const done = msg => { pendingFile = 0; patches = {}; persist(); toastMsg(msg); };
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle) fileHandle = await window.showSaveFilePicker({suggestedName:fileName(), types:[{description:'Halaman HTML', accept:{'text/html':['.html']}}]});
      const w = await fileHandle.createWritable(); await w.write(html); await w.close();
      done('Tersimpan ke file.'); return;
    }catch(err){ if(err && err.name==='AbortError') return; }
  }
  const blob = new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileName(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  done('File terunduh. Ganti file lama dengan file ini.');
}
saveBtn.addEventListener('click', saveFile);
document.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveFile(); } });
updateSaveDot();
render();
