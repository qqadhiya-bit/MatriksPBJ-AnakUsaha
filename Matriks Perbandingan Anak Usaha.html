i dengan strategi dan Rencana Kerja Anggaran Perusahaan (RKAP).","l":624,"h":340},{"c":"[Pasal 10 ayat (4)]"}]]}]},{"heading":"G. UNIT TEKNIS","rows":[{"topik":"UNIT TEKNIS","cells":[[{"t":"UNIT TEKNIS"},{"m":"1.","t":"Unit Teknis wajib merencanakan PBJ dengan memperhitungkan waktu proses PBJ sehingga kebutuhan operasional tidak terganggu.","l":340,"h":340},{"m":"2.","t":"Unit Teknis wajib memahami dan melaksanakan ketentuan dalam Pedoman PBJ sebagaimana diatur dalam Pedoman ini.","l":340,"h":340},{"m":"3.","t":"Unit Teknis dapat melaksanakan proses PBJ sebagaimana diatur dalam Pedoman ini.","l":340,"h":340},{"m":"4.","t":"Unit Teknis memiliki tanggung jawab sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Menyetujui dan menandatangani dokumen teknis PBJ;","l":624,"h":340},{"m":"b.","t":"Melakukan konfirmasi kepada Unit Pengelola Anggaran Perusahaan untuk memastikan ketersediaan anggaran;","l":624,"h":340},{"m":"c.","t":"Menandatangani Perjanjian Pengadaan/Addendum Perjanjian Pengadaan sesuai dengan kewenangan (jika ada);","l":624,"h":340},{"m":"d.","t":"Melakukan evaluasi dan penilaian terhadap Dokumen Penawaran Teknis;","l":624,"h":340},{"m":"e.","t":"Memberikan Penjelasan dan/atau Menjawab pertanyaan pada saat aanwijzing kepada Penyedia;","l":624,"h":340},{"m":"f.","t":"Menandatangani Berita Acara Serah Terima Barang dan/atau Jasa untuk Pengadaan sesuai tabel kewenangan Pedoman ini;","l":624,"h":340},{"m":"g.","t":"Menetapkan Pelaksanaan Serah Terima Barang dan/atau Jasa (jika diperlukan);","l":624,"h":340},{"m":"h.","t":"Melakukan pemeriksaan hasil pekerjaan dan evaluasi penyedia PBJ sesuai dengan ketentuan yang tercantum dalam Perjanjian Pengadaan.","l":624,"h":340},{"c":"[BAB II.G]"}],[{"m":"2.","t":"Pejabat satu tingkat dibawah Direktur Teknis terkait memiliki tugas dan kewenangan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Melakukan verifikasi dan menyetujui usulan perencanaan pengadaan berupa Kerangka Acuan Kerja, spesifikasi teknis, Harga Perkiraan Sendiri (HPS), Rencana Anggaran Biaya (RAB) dan jenis kerjasama dengan mitra barang dan/ atau jasa;","l":624,"h":340},{"m":"b.","t":"Memberikan persetujuan usulan pengadaan dalam Purchase Request (PR) dan menyampaikan kepada Divisi Procurement;","l":624,"h":340},{"m":"c.","t":"Memberikan usulan merek yang disertai dengan spesifikasi teknis jelas dan dasar yang dapat dipertanggungjawabkan;","l":624,"h":340},{"m":"d.","t":"Memberikan persetujuan atas usulan anggaran yang telah diverifikasi untuk pengadaan barang dan/ atau jasa kebutuhan yang diajukan oleh Kantor Cabang/ Unit Pelaksana;","l":624,"h":340},{"m":"e.","t":"Memastikan implementasi prosedur dan kebijakan pengadaan sesuai dengan strategi dan rencana jangka panjang Perusahaan;","l":624,"h":340},{"m":"f.","t":"Mengawasi penerapan prinsip kepatuhan dalam Good Corporate Governance (GCG) dalam proses bisnis pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"g.","t":"Mengawasi pelaksanaan anggaran pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"h.","t":"Menandatangani Bukti Perjanjian pengadaan barang dan/ atau jasa sesuai dengan kewenangan dalam lampiran Peraturan Direksi ini.","l":624,"h":340},{"m":"3.","t":"Manajer Unit Teknis :","l":340,"h":340},{"m":"a.","t":"Menyusun usulan perencanaan pengadaan berupa Kerangka Acuan Kerja/ Term Of References (KAK/ TOR), spesifikasi teknis, Harga Perkiraan Sendiri (HPS), dan/ atau jenis kerjasama dengan penyedia barang dan/ atau jasa;","l":624,"h":340},{"m":"b.","t":"Menyusun usulan pengadaan dalam Purchase Request (PR) dan menyampaikan kepada divisi procurement;","l":624,"h":340},{"m":"c.","t":"Melakukan verifikasi usulan anggaran pengadaan barang dan/ atau jasa atas kebutuhan yang diajukan oleh Kantor Cabang/ Unit Pelaksana;","l":624,"h":340},{"m":"d.","t":"Menjawab pertanyaan dan memberikan penjelasan dari sisi teknis dan/ atau operasional kepada penyedia barang dan/ atau jasa pada saat dilakukan proses aanwijzing;","l":624,"h":340},{"m":"e.","t":"Melakukan verifikasi dan menyusun Berita Acara Serah Terima (BAST) dan/ atau laporan prestasi fisik bersama-sama dengan penyedia barang dan/ atau jasa;","l":624,"h":340},{"m":"f.","t":"Memberikan penilaian kinerja terhadap penyedia barang dan/ atau jasa.","l":624,"h":340},{"m":"5.","t":"Unit Teknis Kantor Cabang/ Unit Pelaksana","l":340,"h":340},{"m":"a.","t":"Menyusun dan mengajukan persetujuan atas usulan anggaran pengadaan barang dan/ atau jasa atas kebutuhan rutin pekerjaan;","l":624,"h":340},{"m":"b.","t":"Melakukan monitoring pelaksanaan pekerjaan;","l":624,"h":340},{"m":"c.","t":"Membuat dan menandatangani Berita Acara Pemeriksaan Pekerjaan (BAPP).","l":624,"h":340},{"c":"[Pasal 8 ayat (2)-(3), (5)]"}],[{"t":"UNIT PENGGUNA (USER)"},{"t":"Unit Pengguna (User) bertanggung jawab atas hal-hal sebagai berikut:"},{"m":"a.","t":"Menetapkan Rencana Umum Pengadaan sesuai kebutuhan masing-masing.","l":340,"h":340},{"m":"b.","t":"Menyusun program kegiatan investasi dan eksploitasi dengan berpedoman pada Rencana Kerja dan Anggaran Perusahaan (RKAP), termasuk pengendalian pelaksanaannya sesuai teknis yang telah ditetapkan.","l":340,"h":340},{"m":"c.","t":"Mengusulkan rencana anggaran.","l":340,"h":340},{"m":"d.","t":"Melakukan pengecekan ketersediaan Barang dan/atau Jasa.","l":340,"h":340},{"m":"e.","t":"Menyampaikan kebutuhan Barang dan/atau Jasa dan mengajukan permintaan Pengadaan kebutuhan Unit Pengguna (User) sesuai dengan anggarannya kepada Unit Spesifikasi Teknis (UST) .","l":340,"h":340},{"m":"f.","t":"Mengusulkan perubahan spesifikasi barang/pekerjaan kepada Unit Spesifikasi Teknis (UST).","l":340,"h":340},{"m":"g.","t":"Menerima Barang dan/atau Jasa dari Pelaksana Pekerjaan/provider.","l":340,"h":340},{"m":"h.","t":"Melakukan pengawasan terhadap pelaksanaan Pekerjaan, memperhatikan, mengecek dan menerima jaminan-jaminan dari Pelaksana Pekerjaan.","l":340,"h":340},{"m":"i.","t":"Melaporkan kemajuan pelaksanaan pekerjaan kepada Pejabat Berwenang.","l":340,"h":340},{"m":"j.","t":"Memberikan masukan kepada Unit Spesifikasi Teknis (UST) terkait pelaksanaan evaluasi dan dalam rangka membuat daftar serta rekam jejak (track record) Penyedia Barang dan/atau Jasa termasuk pengurus perusahaan Penyedia Barang dan/atau Jasa serta penerima kuasanya, atau barang/material, atau hasil pekerjaannya, dengan memperhatikan antara lain waktu penyelesaian pekerjaan/delivery time, kualitas barang dan/atau hasil pekerjaan.","l":340,"h":340},{"c":"[BAB 2 angka 2.2.0]"},{"t":"UNIT SPESIFIKASI TEKNIS (UST)"},{"t":"Unit Spesifikasi Teknis (UST) bertindak sesuai dengan tugas dan fungsi Pejabat Penanggung Jawab Anggaran (PPJA) sebagaimana diatur pada Manual Keuangan yang berlaku berikut perubahannya, dengan tanggung jawab sebagai berikut:"},{"m":"a.","t":"Menyusun dan menetapkan Spesifikasi Teknis dan menghitung Engineering Estimate (EE).","l":340,"h":340},{"m":"b.","t":"Mengajukan usulan persetujuan penggunaan anggaran sesuai ketentuan sisdur anggaran yang berlaku berdasarkan Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah disahkan.","l":340,"h":340},{"m":"c.","t":"Menyiapkan Surat Permintaan Pengadaan (SPP) Barang dan/atau Jasa.","l":340,"h":340},{"m":"d.","t":"Mengusulkan tim atau tenaga ahli teknis/konsultan untuk membantu pelaksanaan tugas Pelaksana Pengadaan.","l":340,"h":340},{"m":"e.","t":"Melakukan pemeriksaan teknis (acceptance test) dan menerima Barang dan/atau Jasa hasil Pengadaan sebelum diserahkan ke Unit Pengguna (User).","l":340,"h":340},{"m":"f.","t":"Melakukan pengendalian dan pengawasan pelaksanaan Pekerjaan.","l":340,"h":340},{"m":"g.","t":"Dalam hal tertentu dimungkinkan Spesifikasi Teknis menyebutkan merek/model/tipe tertentu, antara lain:","l":340,"h":340},{"m":"1.","t":"Pengadaan suku cadang atau komponen yang berkaitan langsung dengan alat produksi utama yang sudah ada.","l":624,"h":340},{"m":"2.","t":"Dalam rangka standardisasi peralatan atau keseragaman komponen dalam Satu sistem.","l":624,"h":340},{"m":"3.","t":"Pengadaan barang tertentu berdasarkan kebutuhan Perusahaan yang didukung oleh alasan yang jelas dan dapat dipertanggungjawabkan secara teknis, operasional dan keuangan.","l":624,"h":340},{"m":"4.","t":"Pengadaan barang tertentu yang tersedia di pasaran bebas dan memiliki harga standar yang jelas dan diketahui umum, seperti dan tidak terbatas pada: kendaraan bermotor, personal komputer, radio komunikasi, alat rekam, sepatu kerja, Alat Tulis Kantor (ATK), hotel, lembaga pendidikan dan rumah sakit.","l":624,"h":340},{"m":"h.","t":"Penetapan merek/model/type sebagaimana dimaksud pada huruf g angka 1, 2 dan 3 dilakukan berdasarkan analisis teknis yang jelas, dapat dipertanggungjawabkan dan disetujui oleh Direktur Unit Spesifikasi Teknis (UST).","l":340,"h":340},{"m":"i.","t":"Penetapan merek/model/type sebagaimana dimaksud pada huruf g angka 4 dilakukan berdasarkan analisis teknis yang jelas dan dapat dipertanggungjawabkan. Untuk lingkup Kantor Pusat oleh Kepala Unit Spesifikasi Teknis (UST), lingkup Kantor Cabang HUB oleh Executive General Manager (EGM) dan lingkup Kantor Cabang SPOKE oleh General Manager (GM).","l":340,"h":340},{"m":"j.","t":"Spesifikasi Teknis untuk Pengadaan Jasa diwajibkan mempersyaratkan keahlian/keterampilan/kompetensi dibidangnya.","l":340,"h":340},{"m":"k.","t":"Untuk Pengadaan pekerjaan terintegrasi, Unit Spesifikasi Teknis (UST) dapat menyusun Spesifikasi Teknis dengan menggabungkan pekerjaan perencanaan, pelaksanaan dan pengawasan sekaligus.","l":340,"h":340},{"m":"l.","t":"Kantor Cabang yang akan melaksanakan Pengadaan Barang dan/atau Jasa dengan standard dalam Spesifikasi Teknis yang ditetapkan oleh Unit Spesifikasi Teknis (UST) Kantor Pusat, maka Kantor Cabang harus berkoordinasi dengan Unit Spesifikasi Teknis (UST) dalam menetapkan Spesifikasi Teknis Barang dan/atau Jasa yang akan diadakan.","l":340,"h":340},{"m":"m.","t":"Untuk kegiatan Pengadaan Barang dan/atau Jasa yang melibatkan beberapa Unit Spesifikasi Teknis (UST), maka Unit Spesifikasi Teknis (UST) yang dominan dalam nilai pekerjaan ditunjuk oleh Pejabat Berwenang untuk bertindak selaku koordinator Unit Spesifikasi Teknis (UST).","l":340,"h":340},{"m":"n.","t":"Untuk kegiatan Pengadaan Barang dan/atau Jasa yang melibatkan lebih dari 1 (satu) Kantor Cabang untuk lebih dari 1 (satu) pekerjaan Pengadaan,maka yang bertindak selaku Unit Spesifikasi Teknis (UST) adalah Unit Kerja di Kantor Pusat sesuai bidang tugasnya atau ditunjuk oleh Pejabat Berwenang untuk bertindak selaku kordinator Unit Spesifikasi Teknis (UST).","l":340,"h":340},{"m":"o.","t":"Melakukan evaluasi dan membuat daftar serta rekam jejak (track record) Penyedia Barang dan/atau Jasa termasuk pengurus perusahaan Penyedia Barang dan/atau Jasa serta penerima kuasanya, atau barang/material, atau hasil pekerjaannya, dengan memperhatikan antara lain waktu penyelesaian pekerjaan/delivery time, kualitas barang dan/atau hasil pekerjaan.","l":340,"h":340},{"c":"[BAB 2 angka 2.3.0]"}],[{"t":"UNIT PENGGUNA"},{"m":"1.","t":"Pengguna Barang dan/atau Jasa di lingkungan Perusahaan adalah Unit Pengguna yang merupakan unit-unit kerja yang mengajukan Permohonan Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"2.","t":"Unit Pengguna wajib merencanakan Pengadaan Barang dan/atau Jasa dengan memperhitungkan waktu proses Pengadaan Barang dan/atau Jasa sehingga kebutuhan operasional tidak terganggu;","l":340,"h":340},{"m":"3.","t":"Unit Pengguna wajib memahami dan melaksanakan ketentuan dalam Kebijakan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan sebagaimana diatur dalam Peraturan ini;","l":340,"h":340},{"m":"4.","t":"Tugas pokok Unit Pengguna sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Menyiapkan Dokumen Rencana Pengadaan Barang dan atau Jasa yang meliputi Formulir Purchase Request (PR), Pagu Anggaran berdasarkan Rencana Kerja dan Anggaran (RKAP) yang telah ditetapkan;","l":624,"h":340},{"m":"b.","t":"Mengajukan Kontrol Anggaran kepada Unit Keuangan atas Pagu Anggaran yang ditetapkan sebagai An n Lingkungan:","l":1192,"h":340},{"m":"•","t":"Dampak Positif dan Negatif terhadap masyarakat dan lingkungan","l":1476,"h":340},{"m":"•","t":"Strategi Mitigasi","l":1476,"h":340},{"m":"7.","t":"Kesimpulan dan Rekomendasi:","l":1192,"h":340},{"m":"•","t":"Kesimpulan (apakah bisnis layak untuk dijalankan)","l":1476,"h":340},{"m":"•","t":"Rekomendasi","l":1476,"h":340},{"m":"e.","t":"Dalam pengadaan barang dan/ atau jasa, Unit Teknis perlu memperhatikan Rencana Kerja dan Anggaran Perusahaan yang telah ditetapkan oleh Rapat Umum Pemegang Saham.","l":624,"h":340},{"m":"f.","t":"Dalam hal pengendalian anggaran dan pemantauan kinerja Perusahaan, Direktur Utama dapat memberikan persetujuan atas pengadaan barang dan/ atau jasa atas pekerjaan di luar Rencana Kerja dan Anggaran Perusahaan dengan ketentuan memenuhi dokumen-dokumen, sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Bukti Perjanjian antara Pemberi Kerja dengan Perusahaan yang telah ditandatangani secara sah sesuai kewenangan;","l":908,"h":340},{"m":"ii.","t":"Rencana Anggaran Biaya yang telah ditandatangani secara sah sesuai kewenangan;","l":908,"h":340},{"m":"iii.","t":"Analisa bisnis terkait perhitungan laba dan rugi.","l":1003,"h":435},{"m":"g.","t":"Dalam hal peningkatan kualitas layanan dan nilai jual kepada Calon Pemberi Kerja, Direktur Utama atau Direktur Teknis terkait sesuai batas kewenangan dapat memberikan persetujuan atas pengadaan barang dan/ atau jasa atas pekerjaan yang proses bisnis atau kegiatan komersialnya masih berjalan dengan ketentuan memenuhi dokumen-dokumen, sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Justifikasi tertulis yang dapat dipertanggungjawabkan;","l":908,"h":340},{"m":"ii.","t":"Kerangka Acuan Kerja (KAK);","l":908,"h":340},{"m":"iii.","t":"Persetujuan atas anggaran;","l":1003,"h":435},{"m":"iv.","t":"Rencana Anggaran Biaya.","l":908,"h":340},{"c":"[Pasal 13]"}]]}]},{"heading":"B. PENGAJUAN PERMOHONAN PBJ","rows":[{"topik":"PENGAJUAN PERMOHONAN PBJ","cells":[[{"t":"PENGAJUAN PERMOHONAN PBJ"},{"m":"1.","t":"Permohonan PBJ meliputi Kegiatan Bisnis dan Kegiatan Kantor Pusat.","l":340,"h":340},{"m":"2.","t":"Permohonan pengadaan Kegiatan Bisnis wajib diajukan oleh Unit Bisnis dan/atau Unit Teknis kepada Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis dengan melampirkan dokumen teknis Project dan Non-Project.","l":340,"h":340},{"m":"3.","t":"Permohonan pengadaan Kegiatan Kantor Pusat wajib diajukan oleh Unit Teknis kepada Unit Yang Membidangi Fungsi PBJ Kegiatan Kantor Pusat dengan melampirkan dokumen teknis PBJ Kegiatan Kantor Pusat.","l":340,"h":340},{"m":"4.","t":"Dalam hal Unit Bisnis atau Unit Teknis bertindak sebagai Unit Yang Membidangi Fungsi PBJ, maka Permohonan Pengadaan tidak diperlukan.","l":340,"h":340},{"m":"5.","t":"Pelaksanaan permohonan dilakukan secara elektronik dengan menggunakan sistem dan tata cara yang berlaku di Perusahaan.","l":340,"h":340},{"c":"[BAB III.B]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PERENCANAAN DAN PERSIAPAN PENGADAAN BARANG DAN/ATAU JASA"},{"m":"2.19.2.","t":"Persiapan Pengadaan Barang dan/atau Jasa","l":630,"h":630},{"m":"a.","t":"Unit Pengguna (User) memastikan ketersediaan Barang dan/atau Jasa yang diperlukan.","l":624,"h":340},{"m":"b.","t":"Setelah mendapat kepastian Barang dan/atau Jasa yang diperlukan tidak tersedia atau tersedia tetapi tidak mencukupi, Unit Pengguna (User) menyampaikan permintaan pengadaan kepada Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"c.","t":"Berdasarkan permintaan pengadaan dari Unit Pengguna (User), Unit Spesifikasi Teknis (UST) menyusun Spesifikasi Teknis dan Engineering Estimate (EE) atas Barang dan/atau Jasa yang akan diadakan, mengajukan usulan Persetujuan Pemakaian Anggaran (PPA).","l":624,"h":340},{"m":"d.","t":"Khusus untuk Pengadaan:","l":624,"h":340},{"m":"1.","t":"Barang investasi dengan Nilai Pengadaan di atas Rp500.000.000,- (lima ratus juta rupiah); atau","l":908,"h":340},{"m":"2.","t":"Barang dan/atau Jasa lainnya dengan Nilai Pengadaan di atas Rp10.000.000.000,- (sepuluh miliar rupiah) dan/atau dengan jangka waktu Perjanjian lebih dari 5 (lima) tahun.","l":908,"h":340},{"t":"pada saat pengajuan Surat Permintaan Pengadaan (SPP) WAJIB dilengkapi dengan HASIL STUDI KELAYAKAN (FEASIBILITY STUDY/FS) yang dibuat oleh Unit Spesifikasi Teknis (UST) bersama sama dengan Unit Pengguna (User) dan sudah disetujui oleh Direktur Unit Spesifikasi Teknis (UST).","l":624},{"m":"e.","t":"Barang dan/atau Jasa yang memerlukan standardisasi oleh Kantor Pusat, dalam proses penyusunan Spesifikasi Teknis dan Engineering Estimate (EE), untuk proses Pengadaan di Kantor Cabang, maka Unit Spesifikasi Teknis (UST) Kantor Cabang berkoordinasi dengan Unit Spesifikasi Teknis (UST) di Kantor Pusat sesuai dengan Barang dan/atau Jasa yang akan diadakan.","l":624,"h":340},{"m":"f.","t":"Setelah menetapkan Spesifikasi Teknis dan Engineering Estimate (EE) dan mendapat persetujuan penggunaan anggaran, Kepala Unit Spesifikasi Teknis (UST) menandatangani Surat Permintaan Pengadaan (SPP).","l":624,"h":340},{"m":"g.","t":"Untuk Pengadaan Barang dan/atau Jasa yang tidak memerlukan Persetujuan Pemakaian Anggaran (PPA), Surat Permintaan Pengadaan (SPP) ditandatangani oleh Kepala Unit Spesifikasi Teknis (UST) dan Kepala Unit yang membidangi anggaran untuk dilakukan kontrol anggaran.","l":624,"h":340},{"m":"h.","t":"Nilai Pengadaan yang tercantum di Surat Permintaan Pengadaan (SPP) adalah nilai total Pengadaan selama jangka waktu kontrak yang dikehendaki.","l":624,"h":340},{"m":"i.","t":"Untuk Surat Permintaan Pengadaan (SPP) yang tidak memerlukan Persetujuan Pemakaian Anggaran (PPA) terlebih dahulu, apabila dalam kontrol anggaran, anggaran tidak tersedia atau tidak mencukupi, penanggung jawab kontrol anggaran mengembalikan Surat Permintaan Pengadaan (SPP) dimaksud kepada Unit Spesifikasi Teknis (UST).","l":624,"h":340},{"m":"2.19.3.","t":"Engineering Estimate (EE)","l":630,"h":630},{"m":"a.","t":"Penyusun Engineering Estimate (EE) adalah Unit Spesifikasi Teknis (UST) di Kantor Pusat dan Kantor Cabang.","l":624,"h":340},{"m":"b.","t":"Komponen Penyusunan Engineering Estimate (EE):","l":624,"h":340},{"m":"1.","t":"Informasi biaya satuan yang dipublikasikan secara resmi oleh asosiasi terkait, badan/Institusi Pemerintah dan sumber data lain yang dapat dipertanggungjawabkan.","l":908,"h":340},{"m":"2.","t":"Daftar biaya/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/distributor tunggal/asosiasi terkait/badan/institusi pemerintah.","l":908,"h":340},{"m":"3.","t":"Harga historis dengan mempertimbangkan faktor perubahan biaya.","l":908,"h":340},{"m":"4.","t":"Inflasi tahun sebelumnya, suku bunga berjalan dan/atau kurs tengah Bank Indonesia.","l":908,"h":340},{"m":"5.","t":"Harga pasar.","l":908,"h":340},{"m":"6.","t":"Hasil perbandingan dengan kontrak sejenis.","l":908,"h":340},{"m":"7.","t":"Informasi lain yang dapat dipertanggungjawabkan.","l":908,"h":340},{"m":"c.","t":"Fungsi Engineering Estimate (EE):","l":624,"h":340},{"m":"1.","t":"Sebagai dasar pengajuan anggaran;","l":908,"h":340},{"m":"2.","t":"Sebagai dasar pembuatan Harga Perkiraan Sendiri (HPS).","l":908,"h":340},{"m":"2.19.4.","t":"Engineering Estimate (EE) untuk Pengadaan investasi wajib disetujui oleh Kepala Unit Spesifikasi Teknis (UST)/Direktur Unit Spesifikasi Teknis (UST) sesuai dengan kewenangannya. Untuk Nilai Pengadaan di atas Rp500.000.000,- (lima ratus juta rupiah) Engineering Estimate (EE) dicantumkan pada Studi Kelayakan (Feasibility Study/FS).","l":630,"h":630},{"m":"2.19.5.","t":"Unit Kontrol Anggaran adalah Unit Kerja yang membidangi anggaran yang mempunyai tugas:","l":630,"h":630},{"m":"a.","t":"Mengadministrasikan usulan persetujuan penggunaan anggaran;","l":624,"h":340},{"m":"b.","t":"Mengadministrasikan pelaksanaan Rencana Kerja dan Anggaran Perusahaan (RKAP);","l":624,"h":340},{"m":"c.","t":"Mengendalikan, mencatat dan melaporkan realisasi Rencana Kerja dan Anggaran Perusahaan (RKAP).","l":624,"h":340},{"m":"2.19.6.","t":"Penanggung Jawab Kontrol Anggaran:","l":630,"h":630},{"m":"a.","t":"Kantor Pusat: Kepala Unit Kerja yang membidangi anggaran sesuai kewenangannya.","l":624,"h":340},{"m":"b.","t":"Kantor Cabang : Kepala Sub Unit/Petugas yang membidangi anggaran.","l":624,"h":340},{"m":"2.19.7.","t":"Setelah Penanggung Jawab Kontrol Anggaran menandatangani Persetujuan Pemakaian Anggaran (PPA) dan/atau Surat Permintaan Pengadaan (SPP), Petugas Unit Spesifikasi Teknis (UST) menyampaikan Surat Permintaan Pengadaan (SPP) kepada Kepala Unit Spesifikasi Teknis (UST) untuk ditandatangani sebagai persetujuan atas pengajuan Pengadaan.","l":630,"h":630},{"m":"2.19.8.","t":"Persetujuan Surat Permintaan Pengadaan (SPP) disesuaikan dengan Nilai Pengadaan sebagai berikut :","l":630,"h":630},{"m":"a.","t":"Kantor Pusat :","l":624,"h":340},{"m":"1.","t":"Nilai Pengadaan Rp.10.000.000,- (sepuluh juta rupiah) sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) disetujui oleh Kepala Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"2.","t":"Nilai Pengadaan Rp1.500.000.000 (satu miliar lima ratus juta rupiah) sampai dengan Rp.50.000.000.000 (lima puluh miliar rupiah) disetujui oleh Direktur Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"3.","t":"Nilai Pengadaan di atas Rp.50.000.000.000,- (lima puluh miliar rupiah) disetujui oleh Direktur Utama dan Direktur Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"b.","t":"Kantor Cabang:","l":624,"h":340},{"m":"1.","t":"Nilai Pengadaan Rp.10.000.000,- (sepuluh juta rupiah) sampai dengan nilai kewenangan Kantor Cabang disetujui oleh Pejabat Berwenang Kantor Cabang.","l":908,"h":340},{"m":"2.","t":"Nilai Pengadaan di atas kewenangan Kantor Cabang sampai dengan Rp. 1.500.000.000,- (satu miliar lima ratus juta rupiah) disetujui oleh Kepala Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"3.","t":"Nilai Pengadaan Rp1.500.000.000 (satu miliar lima ratus juta rupiah) sampai dengan Rp.50.000.000.000 (lima puluh miliar rupiah) disetujui oleh Direktur Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"4.","t":"Nilai Pengadaan di atas Rp.50.000.000.000,- (lima puluh miliar rupiah) disetujui oleh Direktur Utama dan Direktur Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"2.19.9.","t":"Unit Spesifikasi Teknis (UST) menyampaikan Surat Permintaan Pengadaan (SPP) yang telah ditandatangani oleh Pejabat Berwenang kepada Unit Kerja Pengadaan untuk proses Pengadaan Barang dan/atau Jasa.","l":630,"h":630},{"m":"2.19.10.","t":"Unit Kerja Pengadaan menyampaikan Surat Permintaan Pengadaan (SPP) yang sudah ditandatangani oleh Pejabat Berwenang lengkap dengan Spesifikasi Teknis dan Engineering Estimate (EE) kepada Pelaksana Pengadaan sesuai kewenangannnya.","l":720,"h":720},{"m":"2.19.11.","t":"Pelaksana Pengadaan tidak boleh memecah Surat Permintaan Pengadaan (SPP) menjadi beberapa paket dengan maksud mengarahkan pelaksanaan Pengadaan ke dalam proses Pengadaan tertentu.","l":720,"h":720},{"m":"2.19.12.","t":"Surat Permintaan Pengadaan (SPP) diberlakukan untuk Pengadaan Barang dan/atau Jasa dengan Nilai Pengadaan mulai dari Rp10.000.000,- (sepuluh juta rupiah).","l":720,"h":720},{"m":"2.19.13.","t":"Dalam hal Pengadaan Barang dan/atau Jasa untuk kebutuhan Kantor Cabang yang nilainya di atas kewenangan Kantor Cabang, maka dalam proses persiapannya dilaksanakan sebagai berikut:","l":720,"h":720},{"m":"a.","t":"Kantor Cabang melakukan koordinasi dgn Unit Spesifikasi Teknis (UST) Kantor Pusat untuk menetapkan spesifikasi barang/uraian pekerjaan termasuk jumlah kebutuhannya dan Engineering Estimate (EE).","l":624,"h":340},{"m":"b.","t":"Setelah mendapat kepastian mengenai spesifikasi barang/uraian pekerjaan termasuk jumlah kebutuhannya dan Engineering Estimate (EE). Pejabat Unit Spesifikasi Teknis di Kantor Cabang mengajukan usulan persetujuan penggunaan anggaran dan disampaikan ke Pejabat Kontrol Anggaran Kantor Pusat.","l":624,"h":340},{"m":"c.","t":"Setelah menerima persetujuan penggunaan anggaran, Kantor Cabang menyiapkan Surat Permintaan Pengadaan (SPP) lengkap dengan perkiraan biaya yang dibutuhkan serta Spesifikasi Teknis/uraian pekerjaan yang akan diadakan.","l":624,"h":340},{"m":"d.","t":"Setelah Surat Permintaan Pengadaan (SPP) disiapkan dan lengkap sebagaimana dimaksud di atas, Pejabat Unit Spesifikasi Teknis Kantor Cabang membubuhkan paraf pada kolom tandatangan sebelum ditandatangani oleh Pejabat Berwenang Kantor Cabang/(kolom 1).","l":624,"h":340},{"m":"e.","t":"Setelah Surat Permintaan Pengadaan (SPP) ditandatangani Pejabat Berwenang Kantor Cabang (kolom 1), Pejabat Berwenang Kantor Cabang menyampaikan Surat Permintaan Pengadaan (SPP) beserta kelengkapannya ke Unit Spesifikasi Teknis Kantor Pusat untuk proses persetujuan Surat Permintaan Pengadaan (SPP) oleh Kepala Unit Spesifikasi Teknis (UST)/ Direktur Unit Spesifikasi Teknis (UST)/ Direktur Utama dengan dilampiri Form Persetujuan Anggaran yang sudah ditandatangani lengkap sesuai Sistem dan Prosedur Anggaran yang berlaku, Engineering Estimate (EE) dan Spesifikasi Teknis.","l":624,"h":340},{"m":"f.","t":"Surat Permintaan Pengadaan (SPP) yang sudah disetujui oleh Kepala Unit Spesifikasi Teknis (UST)/ Direktur Unit Spesifikasi Teknis (UST)/ Direktur Utama sesuai kewenangannya akan disampaikan kepada Pelaksana Pengadaan di Kantor Pusat maupun di Kantor Cabang untuk proses Pengadaannya.","l":624,"h":340},{"m":"2.19.14.","t":"Alur Proses Persiapan Pengadaan","l":720,"h":720},{"c":"[BAB 2 angka 2.19.2-2.19.14]"}],[{"t":"PENGAJUAN PERMOHONAN PENGADAAN"},{"m":"1.","t":"Selain Pengadaan Langsung (baik manual maupun melalui E-Purchasing dan E-Marketplace), permohonan Pengadaan wajib diajukan oleh Unit Pengguna kepada Unit Pengadaan;","l":340,"h":340},{"m":"2.","t":"Pelaksanaan permohonan dilakukan secara elektronik dengan menggunakan sistem dan tata cara yang berlaku di Perusahaan;","l":340,"h":340},{"m":"3.","t":"Permohonan Pengadaan diajukan oleh Unit Pengguna dengan melampirkan dokumen pendukung sebagaimana diatur di dalam Pedoman ini;","l":340,"h":340},{"m":"4.","t":"Di dalam permohonan Pengadaan barang, KAK/TOR hanya boleh menyebutkan spesifikasi teknis barang yang diinginkan tanpa menyebutkan merek barang untuk menjaga prinsip keadilan dan kewajaran, kecuali apabila penyedia adalah agen tunggal.","l":340,"h":340},{"c":"[BAB IV.A]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"C. DOKUMEN TEKNIS PBJ","rows":[{"topik":"DOKUMEN TEKNIS PBJ","cells":[[{"t":"DOKUMEN TEKNIS PBJ"},{"t":"Dokumen Teknis dalam PBJ terdiri dari :"},{"m":"1.","t":"Dokumen Teknis Kegiatan Bisnis untuk aktivitas Project adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Perjanjian dengan pemberi pekerjaan yang telah ditandatangani Para Pihak;","l":624,"h":340},{"m":"b.","t":"Feasibility Study atau Job Sheet Margin;","l":624,"h":340},{"m":"c.","t":"Dokumen Rencana Anggaran Biaya (RAB) atau Harga Perkiraan Sendiri (HPS);","l":624,"h":340},{"m":"d.","t":"KAK/TOR/RKST;","l":624,"h":340},{"m":"e.","t":"Daftar Kuantitas atau Bill of Quantity (BoQ);","l":624,"h":340},{"m":"f.","t":"Dokumen Persetujuan Anggaran.","l":624,"h":340},{"m":"2.","t":"Dokumen Teknis Kegiatan Bisnis untuk aktivitas Non-Project adalah sebagai berikut:","l":340,"h":340},{"m":"a.","t":"KAK/TOR/RKST;","l":624,"h":340},{"m":"b.","t":"Dokumen Rencana Anggaran Biaya (RAB) atau Harga Perkiraan Sendiri (HPS);","l":624,"h":340},{"m":"c.","t":"Lembar Data Pengadaan (LDP);","l":624,"h":340},{"m":"d.","t":"Justifikasi;","l":624,"h":340},{"m":"e.","t":"Analisa Harga Satuan (AHS)","l":624,"h":340},{"m":"f.","t":"Daftar Kuantitas atau Bill of Quantity (BoQ);","l":624,"h":340},{"m":"g.","t":"Dokumen Persetujuan Anggaran;","l":624,"h":340},{"m":"h.","t":"Kriteria Penilaian Teknis (untuk metode Tender/Seleksi Terbatas atau Tender/Seleksi Umum);","l":624,"h":340},{"m":"i.","t":"Kriteria penilaian presentasi (apabila diperlukan);","l":624,"h":340},{"m":"j.","t":"Gambar dan data lain (apabila l":1192,"h":340},{"m":"e)","t":"Penjelasan umum (aanwijzing) Pelelangan;","l":1192,"h":340},{"m":"f)","t":"Syarat dan cara pembayaran;","l":1192,"h":340},{"m":"g)","t":"Pemasukan Dokumen Penawaran;","l":1192,"h":340},{"m":"h)","t":"Sistem penilaian;","l":1192,"h":340},{"m":"i)","t":"Jaminan Penawaran;","l":1192,"h":340},{"m":"j)","t":"Jaminan pelaksanaan pekerjaan;","l":1192,"h":340},{"m":"k)","t":"Pengumuman pemenang;","l":1192,"h":340},{"m":"l)","t":"Sanggahan;","l":1192,"h":340},{"m":"m)","t":"Penetapan pemenang; dan","l":1192,"h":340},{"m":"n)","t":"Sanksi-sanksi.","l":1192,"h":340},{"m":"2)","t":"Syarat Administrasi meliputi:","l":908,"h":340},{"m":"a)","t":"Syarat-syarat Peserta; dan","l":1192,"h":340},{"m":"b)","t":"Kelengkapan Dokumen Penawaran.","l":1192,"h":340},{"m":"3)","t":"Syarat Teknis meliputi:","l":908,"h":340},{"m":"a)","t":"Spesifikasi Teknis Barang dan/atau Jasa;","l":1192,"h":340},{"m":"b)","t":"Jangka waktu pengiriman barang/pelaksanaan pekerjaan;","l":1192,"h":340},{"m":"c)","t":"Jaminan-jaminan;","l":1192,"h":340},{"m":"d)","t":"Gambar-gambar/brosur; dan","l":1192,"h":340},{"m":"e)","t":"Pengalaman.","l":1192,"h":340},{"m":"b.","t":"Rencana Kerja dan Syarat (RKS) Pelelangan ditandatangani oleh Panitia Pengadaan.","l":624,"h":340},{"m":"2.22.6.","t":"Dalam melakukan penyusunan atau penyesuaian Rencana Kerja dan Syarat (RKS), Pelaksana Pengadaan wajib memperhatikan karakteristik Barang dan/atau Jasa yang akan diadakan.","l":630,"h":630},{"c":"[BAB 2 angka 2.22.0]"}],[{"t":"KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"},{"m":"1.","t":"Dalam Pengadaan inbound dengan nilai Pagu Anggaran di atas Rp.20.000.000,- (dua puluh juta rupiah) dengan proses Pengadaan Langsung, Tender/Seleksi Umum atau Tender/Seleksi Terbatas atau Penunjukan Langsung, Unit Pengguna (dapat dibantu Unit Pembuat Spesifikasi Teknis) wajib membuat KAK/TOR dengan kriteria dan/atau persyaratan yang adil dan wajar sesuai dengan kebutuhan perusahaan dan tidak mengarah untuk memenangkan pihak tertentu;","l":340,"h":340},{"m":"2.","t":"Sebelum melaksanakan Pengadaan, Unit Pengguna selaku Pemohon (dapat dibantu Unit Pembuat Spesifikasi Teknis) wajib menyusun, mempersiapkan dan menandatangani KAK/TOR dengan tujuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Menjelaskan tujuan dan lingkup Pengadaan barang dan/atau jasa;","l":624,"h":340},{"m":"b.","t":"Sebagai acuan dan informasi bagi penyedia Barang dan/atau Jasa yang diundang mengikuti Pengadaan dalam rangka menyiapkan kelengkapan administrasi, usulan teknis, dan usulan biaya;","l":624,"h":340},{"m":"c.","t":"Sebagai acuan dalam evaluasi usulan, klarifikasi dan negosiasi dengan calon penyedia Barang dan/atau Jasa terpilih, dasar pembuatan kontrak dan acuan evaluasi hasil kerja penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"3.","t":"KAK/TOR sekurang-kurangnya memuat hal-hal sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Uraian pendahuluan berupa gambaran secara garis besar mengenai Pengadaan yang akan dilaksanakan, antara lain:","l":624,"h":340},{"m":"i.","t":"Latar belakang;","l":908,"h":340},{"m":"ii.","t":"Maksud dan tujuan;","l":908,"h":340},{"m":"iii.","t":"Asal sumber pendanaan;","l":1003,"h":435},{"m":"iv.","t":"Nama Unit Pengguna;","l":908,"h":340},{"m":"v.","t":"Tingkat Komponen Dalam Negeri (TKDN).","l":908,"h":340},{"m":"b.","t":"Data penunjang berupa data yang berkaitan dengan pelaksanaan Pengadaan, antara lain:","l":624,"h":340},{"m":"i.","t":"Data dasar;","l":908,"h":340},{"m":"ii.","t":"Standar dan spesifikasi teknis;","l":908,"h":340},{"m":"iii.","t":"Studi-studi terdahulu yang pernah dilaksanakan;","l":1003,"h":435},{"m":"iv.","t":"Peraturan perundang-undangan yang harus digunakan.","l":908,"h":340},{"m":"c.","t":"Ruang lingkup Pengadaan yang memberikan gambaran mengenai tujuan yang ingin dicapai;","l":624,"h":340},{"m":"d.","t":"Peralatan dan material yang disediakan oleh Unit Pengguna serta peralatan dan material yang harus disediakan oleh penyedia Barang dan/atau Jasa;","l":624,"h":340},{"m":"e.","t":"Lingkup kewenangan yang dilimpahkan kepada penyedia Barang dan/atau Jasa;","l":624,"h":340},{"m":"f.","t":"Perkiraan jangka waktu penyelesaian pekerjaan atau pelaksanaan pekerjaan (hari kerja/hari kalender atau tanggal yang diajukan/disepakati);","l":624,"h":340},{"m":"g.","t":"Kualifikasi dan jumlah tenaga ahli yang harus disediakan oleh penyedia Barang dan/atau Jasa;","l":624,"h":340},{"m":"h.","t":"Perkiraan keseluruhan tenaga ahli/tenaga pendukung yang diperlukan (jumlah person-month) dan jadwal setiap tahapan pelaksanaan pekerjaan;","l":624,"h":340},{"m":"i.","t":"Jenis dan jumlah laporan yang disyaratkan (antara lain laporan pendahuluan, laporan bulanan, dan laporan akhir);","l":624,"h":340},{"m":"j.","t":"Analisa risiko terkait pencapaian tujuan pelaksanaan KAK;","l":624,"h":340},{"m":"k.","t":"Tata Cara Pembayaran.","l":624,"h":340},{"m":"4.","t":"Untuk Pengadaan yang menggunakan metode Tender/Seleksi Umum atau metode lain yang dipandang perlu, KAK/TOR wajib disampaikan kepada Penyedia Barang dan/atau Jasa melalui rapat penjelasan (aanwijzing) secara terbuka. Di dalam aanwijzing disampaikan semua informasi terkait materi KAK/spesifikasi teknis, dan dimungkinkan untuk adanya penyempurnaan KAK berdasarkan hasil aanwijzing;","l":340,"h":340},{"c":"[BAB IV.C angka 1-4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Spesifikasi Teknis/ Kerangka Acuan Kerja (KAK)"},{"t":"Unit Teknis wajib membuat kriteria dan/ atau persyaratan yang adil dan wajar sesuai dengan kebutuhan Perusahaan dan tidak mengarah untuk memenangkan pihak tertentu."},{"m":"1.","t":"Spesifikasi teknis/ Kerangka Acuan Kerja (KAK) dibuat oleh unit teknis dapat mengacu pada:","l":340,"h":340},{"m":"a.","t":"Standar Nasional Indonesia (SNI)/ internasional atau standar pabrikan tertentu;","l":624,"h":340},{"m":"b.","t":"Dimungkinkan penyebutan merek, tipe atau jenis barang mengacu pada pasal 10 ayat 2.c ;","l":624,"h":340},{"m":"c.","t":"Brosur Penyedia Barang dan/ atau Jasa atau gambar jelas;","l":624,"h":340},{"m":"d.","t":"Spesifikasi berdasarkan fungsi atau kinerja;","l":624,"h":340},{"m":"e.","t":"Sumber informasi lain yang relevan dan dapat dipertanggungjawabkan;","l":624,"h":340},{"m":"f.","t":"Data historis apabila pengadaan barang dan/ atau jasa atas merek yang terdahulu (existing) yang masih terpasang.","l":624,"h":340},{"m":"2.","t":"Spesifikasi teknis untuk pengadaan barang dan/ atau jasa untuk proyek mengikuti kebutuhan dari pemberi kerja yang disampaikan secara tertulis dalam bentuk compliance list atau material approval.","l":340,"h":340},{"m":"3.","t":"Struktur Kerangka Acuan Kerja (KAK) sekurang-kurangnya berisi :","l":340,"h":340},{"m":"a.","t":"Pendahuluan : latar belakang","l":624,"h":340},{"m":"b.","t":"Lingkup pekerjaan : gambaran umum","l":624,"h":340},{"m":"c.","t":"Tenaga ahli (jasa konsultansi)","l":624,"h":340},{"m":"d.","t":"Nilai pekerjaan dan anggaran","l":624,"h":340},{"m":"e.","t":"Pemilihan jenis kontrak, jangka waktu pelaksanaan, metode pengiriman & pembayaran","l":624,"h":340},{"m":"f.","t":"Pengesahan","l":624,"h":340},{"m":"g.","t":"Lampiran : lampiran teknis dan Harga Perkiraan Sendiri","l":624,"h":340},{"c":"[Pasal 14]"},{"t":"Dalam proses pengadaan barang dan/ atau jasa yang memerlukan Kerangka Acuan Kerja (KAK) atau Term of Reference (TOR) atau dokumen pengadaan/ pelelangan pengadaan barang dan/ atau jasa, wajib dibuat kriteria dan/ atau persyaratan yang adil dan wajar sesuai dengan kebutuhan Perusahaan dan tidak mengarahkan untuk memenangkan pihak tertentu."},{"c":"[Pasal 65]"}]]},{"topik":"Aanwijzing","cells":[[{"t":"KERANGKA ACUAN KERJA (KAK)/TERM OF REFERENCE (TOR)/RENCANA KERJA SYARAT TEKNIS (RKST)"},{"m":"5.","t":"Untuk PBJ Kegiatan Bisnis, Aanwijzing wajib dihadiri oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis, Unit Teknis (untuk aktivitas non-project) atau Unit Bisnis (untuk aktivitas project) dan Peserta.","l":340,"h":340},{"m":"6.","t":"Untuk PBJ Kegiatan Kantor Pusat, Aanwijzing wajib dihadiri oleh Unit Yang Membidangi Fungsi PBJ Kegiatan Kantor Pusat, Unit Teknis dan Peserta.","l":340,"h":340},{"m":"7.","t":"Hasil aanwijzing dituangkan dalam Berita Acara yang ditandatangani oleh seluruh Peserta yang hadir, Unit Bisnis dan/atau Unit Teknis, dan Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat.","l":340,"h":340},{"c":"[BAB III.D angka 5-7]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PEMILIHAN LANGSUNG"},{"m":"3.3.5.","t":"Penjelasan Umum (Aanwijzing) Dalam Pemilihan Langsung","l":540,"h":540},{"m":"a.","t":"Setelah jumlah Peserta yang mendaftar memenuhi minimal atau lebih dari jumlah yang dipersyaratkan, maka proses Pemilihan Langsung dilanjutkan dengan memberikan penjelasan umum (aanwijzing) mengenai Rencana Kerja dan Syarat (RKS) Pemilihan Langsung.","l":624,"h":340},{"m":"b.","t":"Peserta yang hadir pada penjelasan umum (aanwijzing) minimal 2 (dua) Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"c.","t":"Penjelasan umum (aanwijzing) dilaksanakan selambat-lambatnya 3 (tiga) hari kerja setelah penutupan pendaftaran.","l":624,"h":340},{"m":"d.","t":"Penjelasan umum (aanwijzing) sebagaimana dimaksud pada huruf a diperlukan agar calon Penyedia Barang dan/atau Jasa dapat memahami dengan benar syarat dan spesifikasi Barang dan/atau Jasa yang akan diadakan.","l":624,"h":340},{"m":"e.","t":"Apabila dalam tahap penjelasan umum (aanwijzing) Peserta yang hadir kurang dari 2 (dua) Penyedia Barang dan/atau Jasa, maka Pelaksana Pengadaan menyampaikan kepada Peserta bahwa proses Pemilihan Langsung gagal dan dibuatkan Berita Acara.","l":624,"h":340},{"m":"f.","t":"Dalam penjelasan (aanwijzing), Pelaksana Pengadaan dapat menyampaikan nilai pagu anggaran secara umum.","l":624,"h":340},{"m":"g.","t":"Pelaksana Pengadaan tidak diperbolehkan menyampaikan nilai pagu anggaran secara detail/rinci.","l":624,"h":340},{"m":"h.","t":"Pelaksana Pengadaan harus memberikan penjelasan tentang pekerjaan secara rinci, lengkap dan jelas kepada seluruh Peserta Pemilihan Langsung, serta Pelaksana Pengadaan wajib menjawab seluruh pertanyaan yang diajukan oleh Peserta dengan lengkap, jelas dan tegas.","l":624,"h":340},{"m":"i.","t":"Pada saat penjelasan umum (aanwijzing) Pemilihan Langsung, Pelaksana Pengadaan dapat memberitahukan nilai total pagu anggaran.","l":624,"h":340},{"m":"j.","t":"Apabila dipandang perlu, Pelaksana Pengadaan dapat memberikan penjelasan lanjutan/tambahan termasuk melakukan peninjauan lapangan.","l":624,"h":340},{"m":"k.","t":"Peserta Pemilihan Langsung wajib untuk menunjukan dokumen asli guna klarifikasi apabila dipandang perlu dan diminta oleh Pelaksana Pengadaan.","l":624,"h":340},{"m":"l.","t":"Hasil penjelasan umum (aanwijzing) termasuk perubahan-perubahannya dituangkan di dalam Berita Acara Penjelasan yang ditandatangani oleh Pelaksana Pengadaan dan sekurang-kurangnya dari 2 (dua) Peserta yang disepakati oleh seluruh Peserta yang hadir.","l":624,"h":340},{"m":"m.","t":"Bagi Peserta yang terlambat hadir/tidak hadir dalam acara penjelasan umum (aanwijzing) masih diperkenankan untuk mengikuti proses penjelasan umum (aanwijzing) dengan ketentuan Peserta yang terlambat hadir/tidak hadir dianggap telah memahami semua penjelasan yang diberikan, dengan tetap mengacu pada ketentuan sebagaimana dimaksud pada huruf e.","l":624,"h":340},{"m":"n.","t":"Apabila pada saat penjelasan umum (aanwijzing) pagu anggaran disampaikan secara terbuka, maka penawaran harga yang nilainya di atas pagu anggaran dinyatakan gugur.","l":624,"h":340},{"m":"o.","t":"Apabila seluruh penawaran yang masuk harganya di atas pagu anggaran, maka proses Pemilihan Langsung dinyatakan gagal, maka Pelaksana Pengadaan melakukan Pemilihan Langsung ulang.","l":624,"h":340},{"m":"p.","t":"Apabila pada saat penjelasan umum (aanwijzing) tidak disampaikan secara terbuka mengenai pagu anggaran, namun seluruh penawaran yang masuk harganya di atas pagu anggaran, maka Pelaksana Pengadaan wajib melakukan Negosiasi, proses Negosiasi dilakukan sesuai dengan ketentuan sebagaimana dimaksud pada butir 3.3.9.","l":624,"h":340},{"c":"[BAB 3 angka 3.3.5]"},{"t":"PELELANGAN"},{"m":"3.4.5.","t":"Penjelasan Umum (Aanwijzing) Pelelangan","l":540,"h":540},{"m":"a.","t":"Setelah jumlah Peserta yang mendaftar memenuhi minimal atau lebih dari jumlah yang dipersyaratkan, maka proses Pelelangan dilanjutkan dengan memberikan penjelasan umum (aanwijzing) mengenai Rencana Kerja dan Syarat (RKS) Pelelangan.","l":624,"h":340},{"m":"b.","t":"Peserta yang hadir pada penjelasan umum (aanwijzing) minimal 3 (tiga) perusahaan.","l":624,"h":340},{"m":"c.","t":"Penjelasan umum (aanwijzing) dilaksanakan selambat lambatnya 3 (tiga) hari kerja setelah penutupan pendaftaran.","l":624,"h":340},{"m":"d.","t":"Penjelasan umum (aanwijzing) sebagaimana dimaksud pada huruf a diperlukan agar calon Penyedia Barang dan/atau Jasa dapat memahami dengan benar syarat dan spesifikasi Barang dan/atau Jasa yang akan diadakan.","l":624,"h":340},{"m":"e.","t":"Apabila dalam tahap penjelasan umum (aanwijzing), Peserta yang hadir kurang dari 3 (tiga) perusahaan, maka Panitia Pengadaan menyampaikan kepada Peserta bahwa proses Pelelangan gagal dan dibuatkan Berita Acara.","l":624,"h":340},{"m":"f.","t":"Dalam penjelasan umum (aanwijzing), Panitia Pengadaan dapat menyampaikan nilai pagu anggaran secara umum.","l":624,"h":340},{"m":"g.","t":"Panitia Pengadaan Pengadaan tidak diperbolehkan menyampaikan nilai pagu anggaran secara detail/rinci.","l":624,"h":340},{"m":"h.","t":"Panitia Pengadaan harus memberikan penjelasan tentang pekerjaan secara rinci, lengkap dan jelas kepada seluruh Peserta Pelelangan, serta Panitia Pengadaan wajib menjawab seluruh pertanyaan yang diajukan oleh Peserta dengan lengkap, jelas dan tegas.","l":624,"h":340},{"m":"i.","t":"Pada saat penjelasan umum (aanwijzing) Pelelangan, Panitia Pengadaan dapat memberitahukan nilai total pagu anggaran.","l":624,"h":340},{"m":"j.","t":"Apabila dipandang perlu, Panitia Pengadaan dapat memberikan penjelasan lanjutan/tambahan termasuk melakukan peninjauan lapangan.","l":624,"h":340},{"m":"k.","t":"Peserta Pelelangan wajib untuk menunjukan dokumen asli guna klarifikasi apabila dipandang perlu dan diminta oleh Panitia Pengadaan.","l":624,"h":340},{"m":"q.","t":"Hasil penjelasan umum (aanwijzing) termasuk perubahan-perubahannya dituangkan di dalam Berita Acara Penjelasan yang ditandatangani oleh anggota Panitia Pengadaan dan sekurang-kurangnya dari 3 (tiga) Peserta yang disepakati oleh seluruh Peserta yang hadir.","l":624,"h":340},{"m":"r.","t":"Bagi Peserta yang terlambat hadir/tidak hadir dalam acara penjelasan umum (aanwijzing) masih diperkenankan untuk mengikuti proses penjelasan umum (aanwijzing) dengan ketentuan Peserta yang terlambat hadir/tidak hadir dianggap telah memahami semua penjelasan yang diberikan, dengan tetap mengacu pada ketentuan sebagaimana dimaksud pada huruf e.","l":624,"h":340},{"m":"l.","t":"Apabila pada saat penjelasan umum (aanwijzing) pagu anggaran disampaikan secara terbuka, maka penawaran harga yang nilainya di atas pagu anggaran dinyatakan gugur.","l":624,"h":340},{"m":"m.","t":"Apabila seluruh penawaran yang masuk harganya di atas pagu anggaran, maka proses Pelelangan dinyatakan gagal, maka Pelaksana Pengadaan melakukan Pelelangan ulang.","l":624,"h":340},{"m":"n.","t":"Apabila pada saat penjelasan umum (aanwijzing) tidak disampaikan secara terbuka mengenai pagu anggaran, namun seluruh penawaran yang masuk harganya di atas pagu anggaran, maka Panitia Pengadaan wajib melakukan Negosiasi, proses Negosiasi dilakukan sesuai dengan ketentuan sebagaimana dimaksud pada butir 3.4.10.","l":624,"h":340},{"c":"[BAB 3 angka 3.4.5]"}],[{"t":"KERANGKA ACUAN KERJA (KAK) / TERM OF REFERENCE (TOR)"},{"m":"5.","t":"Aanwijzing wajib dihadiri oleh Unit Pengadaan, Unit Pengguna, Unit Spesifikasi Teknis dan Calon-calon Penyedia;","l":340,"h":340},{"m":"6.","t":"Hasil aanwijzing dituangkan dalam Berita Acara yang ditanda tangani oleh seluruh penyedia yang hadir sebagai peserta aanwijzing, Unit Pengguna dan Unit Pengadaan.","l":340,"h":340},{"c":"[BAB IV.C angka 5-6]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"E. HARGA PERKIRAAN SENDIRI (HPS)/RENCANA ANGGARAN BIAYA (RAB)","rows":[{"topik":"HARGA PERKIRAAN SENDIRI (HPS)/RENCANA ANGGARAN BIAYA (RAB)","cells":[[{"t":"HARGA PERKIRAAN SENDIRI (HPS)/RENCANA ANGGARAN BIAYA (RAB)"},{"m":"1.","t":"Berdasarkan KAK/TOR/RKST, Unit Bisnis atau Unit Teknis membuat dan menandatangani usulan HPS/RAB dengan mencantumkan sumber data harga (asosiasi atau daftar harga Penyedia Perusahaan atau sumber lainnya) dan/atau melakukan uji pasar, untuk dijadikan sebagai lampiran dari KAK/TOR/RKST .","l":340,"h":340},{"m":"2.","t":"Usulan HPS/RAB tersebut disusun secara sistematis dengan mengacu pada sumber referensi harga yang bisa dipertanggungjawabkan antara lain harga resmi (price quotation/proforma invoice) yang dikeluarkan oleh Penyedia, termasuk agen tunggal/pabrikan yang akan ditunjuk.","l":340,"h":340},{"m":"3.","t":"Uji pasar dan sumber data yang dapat dipercaya dapat diambil dari asosiasi atau dari sumber lainnya.","l":340,"h":340},{"m":"4.","t":"HPS/RAB digunakan sebagai alat untuk menilai kewajaran harga penawaran termasuk rinciannya dan sebagai dasar untuk menetapkan besaran tambahan nilai jaminan pelaksanaan bagi penawaran yang dinilai terlalu rendah.","l":340,"h":340},{"m":"5.","t":"HPS/RAB tidak dapat dijadikan dasar untuk menggugurkan penawaran.","l":340,"h":340},{"m":"6.","t":"Perubahan HPS/RAB tidak dibenarkan setelah pembukaan penawaran harga.","l":340,"h":340},{"m":"7.","t":"Dalam hal Pengadaan barang impor yang tidak dimungkinkan dibayar dengan mata uang rupiah, atau keadaan tertentu lainnya, HPS/RAB dapat dibuat dengan mata uang asing.","l":340,"h":340},{"m":"8.","t":"Bila terjadi kasus perubahan kurs mata uang asing yang signifikan sebelum penyampaian Surat Penawaran Harga, hal tersebut disampaikan kepada Unit Bisnis atau Unit Teknis untuk pengambilan keputusan sesuai dengan batas kewenangan.","l":340,"h":340},{"m":"9.","t":"Penyusunan HPS/RAB untuk Pengadaan Barang dan/atau Jasa harus mempertimbangkan hal-hal berikut ini:","l":340,"h":340},{"m":"a.","t":"Analisis harga satuan barang/pekerjaan yang bersangkutan;","l":624,"h":340},{"m":"b.","t":"Harga pasar setempat pada waktu penyusunan HPS/RAB;","l":624,"h":340},{"m":"c.","t":"Harga kontrak untuk barang/pekerjaan sejenis setempat yang pernah dilaksanakan (harga historis);","l":624,"h":340},{"m":"d.","t":"Harga/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/agen tunggal atau lembaga independen;","l":624,"h":340},{"m":"e.","t":"Informasi biaya satuan yang dipublikasikan secara resmi oleh Pemerintah/Badan Pusat Statistik, asosiasi terkait dan media cetak lainnya yang datanya dapat dipertanggungjawabkan;","l":624,"h":340},{"m":"f.","t":"Risiko kenaikan/penurunan harga.","l":624,"h":340},{"m":"10.","t":"HPS/RAB tidak boleh memperhitungkan biaya tidak terduga, biaya lain-lain yang tidak jelas peruntukannya dan PPh Penyedia.","l":340,"h":340},{"m":"11.","t":"Penyusunan HPS/RAB untuk Pengadaan jasa konsultansi harus mempertimbangkan hal-hal berikut:","l":340,"h":340},{"m":"a.","t":"HPS/RAB disusun secara sistematis dan bukan satu-satunya acuan penilaian terhadap penawaran Penyedia jasa;","l":624,"h":340},{"m":"b.","t":"HPS/RAB dibuat pada saat akan melaksanakan Pengadaan yang terdiri dari 2 (dua) komponen pokok, yaitu:","l":624,"h":340},{"m":"1)","t":"Biaya langsung personil (remuneration);","l":908,"h":340},{"m":"2)","t":"Biaya langsung non personil (direct reimbursable cost) yang meliputi antara lain biaya untuk sewa kantor, biaya perjalanan, biaya pengiriman dokumen, biaya pengurusan surat ijin, biaya komunikasi, tunjangan perumahan dan biaya lainnya (merupakan biaya yang terkait dengan pekerjaan).","l":908,"h":340},{"m":"c.","t":"Dalam penyusunan HPS/RAB, persentase biaya langsung non personil tidak boleh lebih besar dari persentase biaya langsung personil.","l":624,"h":340},{"m":"12.","t":"Perubahan HPS/RAB akibat perhitungan volume bersama, maka Unit Bisnis atau Unit Teknis menyampaikan kembali perubahan HPS/RAB kepada Unit Yang Membidangi Fungsi PBJ dan apabila perubahan HPS/RAB melampaui biaya anggaran, maka Unit Yang Membidangi Fungsi PBJ menunda pemasukan penawaran sampai revisi anggaran tersebut disetujui.","l":340,"h":340},{"c":"[BAB III.E]"}],[{"m":"1.","t":"Harga Perkiraan Sendiri (HPS) adalah dokumen estimasi/ perkiraan harga yang disiapkan oleh masing masing unit dan disahkan oleh Pejabat satu tingkat dibawah Direktur.","l":340,"h":340},{"m":"2.","t":"HPS dikalkulasikan berdasarkan keahlian dan berdasarkan data yang dapat dipertanggungjawabkan.","l":340,"h":340},{"m":"3.","t":"HPS dapat dibuat dan disusun dengan dibantu oleh konsultan.","l":340,"h":340},{"m":"4.","t":"HPS menggunakan mata uang Rupiah dan dapat menggunakan mata uang asing yang harus dilakukan konversi ke dalam mata uang Rupiah dengan mengikuti kurs tengah Bank Indonesia pada saat penyusunan HPS.","l":340,"h":340},{"m":"5.","t":"HPS beserta rinciannya disusun oleh Unit Teknis dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"HPS dibuat berdasarkan harga rata-rata di pasaran beserta semua biaya yang timbul akibat proses pengadaan barang dan/ atau jasa tersebut yang diajukan oleh unit teknis kepada Departemen Purchasing;","l":624,"h":340},{"m":"b.","t":"HPS digunakan sebagai :","l":624,"h":340},{"m":"1.","t":"alat untuk menilai kewajaran penawaran harga;","l":908,"h":340},{"m":"2.","t":"dasar untuk negosiasi harga;","l":908,"h":340},{"m":"3.","t":"dasar penentuan nilai jaminan pelaksanaan untuk nilai pekerjaan yang nilainya lebih rendah dari 80% (delapan puluh persen) dari HPS.","l":908,"h":340},{"m":"c.","t":"HPS disusun dengan memperhatikan acuan sebagai berikut :","l":624,"h":340},{"m":"1.","t":"Harga barang;","l":908,"h":340},{"m":"2.","t":"Biaya pengiriman;","l":908,"h":340},{"m":"3.","t":"Biaya instalasi;","l":908,"h":340},{"m":"4.","t":"Bea masuk;","l":908,"h":340},{"m":"5.","t":"Overhead dan keuntungan;","l":908,"h":340},{"m":"6.","t":"Perubahan inflasi dan/ atau nilai tukar mata uang;","l":908,"h":340},{"m":"7.","t":"Pajak-pajak;","l":908,"h":340},{"m":"8.","t":"Data/ informasi yang dapat dipertanggungjawabkan.","l":908,"h":340},{"m":"d.","t":"Unsur-unsur HPS untuk pengadaan jasa","l":624,"h":340},{"m":"1.","t":"Biaya langsung personil;","l":908,"h":340},{"m":"2.","t":"Biaya langsung non personil;","l":908,"h":340},{"m":"3.","t":"Biaya tidak langsung personil;","l":908,"h":340},{"m":"4.","t":"Biaya sewa peralatan/ sarana;","l":908,"h":340},{"m":"5.","t":"Biaya mobilisasi dan demobilisasi;","l":908,"h":340},{"m":"6.","t":"Biaya asuransi personil dan peralatan;","l":908,"h":340},{"m":"7.","t":"Biaya pelatihan;","l":908,"h":340},{"m":"8.","t":"Perizinan;","l":908,"h":340},{"m":"9.","t":"Pajak dan bea;","l":908,"h":340},{"m":"10.","t":"Keuntungan dan Overhead.","l":908,"h":340},{"m":"e.","t":"Unsur-unsur HPS untuk pengadaan borongan (barang dan jasa) adalah kombinasi unsur-unsur pengadaan barang dan pengadaan jasa.","l":624,"h":340},{"m":"f.","t":"Sebagai acuan untuk meneliti kewajaran harga penawaran, fungsi pengadaan menggunakan HPS dengan batas bawah tidak rendah dari 80% (delapan puluh persen) dari HPS dan batas atas tidak lebih tinggi dari 100% (seratus persen) dari HPS.","l":624,"h":340},{"m":"g.","t":"Apabila ditemui harga penawaran yang tidak wajar, fungsi pengadaan melakukan klarifikasi kepada Penyedia terkait;","l":624,"h":340},{"m":"h.","t":"Tindak lanjut dari hasil klarifikasi adalah sebagai berikut :","l":624,"h":340},{"m":"1.","t":"apabila hasil klarifikasi dapat dipertanggungjawabkan, maka penawaran harga dinyatakan wajar yang dinyatakan dalam berita acara;","l":908,"h":340},{"m":"2.","t":"apabila hasil klarifikasi tidak dapat dipertanggungjawabkan, maka penawaran harga dinyatakan sebagai harga tidak wajar dan dinyatakan gugur serta dinyatakan dalam berita acara hasil klarifikasi;","l":908,"h":340},{"m":"3.","t":"HPS bukan merupakan dasar penentuan kerugian Perusahaan;","l":908,"h":340},{"m":"i.","t":"Rincian HPS bersifat tertutup, namun total HPS dapat dibuka pada saat penjelasan Dokumen Pengadaan dan disampaikan kepada penyedia, dan nilai rincian HPS digunakan sebagai acuan saat negosiasi harga;","l":624,"h":340},{"c":"[Pasal 12]"}],[{"t":"HARGA PERKIRAAN SENDIRI (HPS)"},{"m":"2.20.1.","t":"Harga Perkiraan Sendiri (HPS) disusun setelah tersusunnya Spesifikasi Teknis dan Engineering Estimate (EE) Pengadaan Barang dan/atau Jasa.","l":630,"h":630},{"m":"2.20.2.","t":"Total nilai Harga Perkiraan Sendiri (HPS) tidak boleh melebihi total nilai yang tercantum dalam Surat Permintaan Pengadaan (SPP) dan Harga Perkiraan Sendiri (HPS) tidak dapat disahkan apabila nilainya secara total melebihi pagu anggaran yang tercantum dalam Surat Permintaan Pengadaan (SPP).","l":630,"h":630},{"m":"2.20.3.","t":"Harga Perkiraan Sendiri (HPS) digunakan sebagai:","l":630,"h":630},{"m":"a.","t":"Acuan sebelum melakukan Pengadaan Barang dan/atau Jasa untuk menilai kewajaran harga penawaran termasuk rinciannya.","l":624,"h":340},{"m":"b.","t":"Dasar dalam menetapkan batas tertinggi penawaran yang sah apabila nilai Harga Perkiraan Sendiri (HPS) diumumkan pada saat penjelasan umum (aanwijzing).","l":624,"h":340},{"m":"c.","t":"Bahan Negosiasi.","l":624,"h":340},{"m":"d.","t":"Dasar dalam menetapkan besaran jaminan penawaran pada proses Pelelangan (1-3% dari Harga Perkiraan Sendiri (HPS)).","l":624,"h":340},{"m":"2.20.4.","t":"Harga Perkiraan Sendiri (HPS) disusun oleh Pelaksana Pengadaan dan disahkan oleh Pejabat berwenang.","l":630,"h":630},{"m":"2.20.5.","t":"Harga Perkiraan Sendiri (HPS) yang telah mendapatkan pengesahan oleh Pejabat Berwenang disampaikan kepada Pelaksana Pengadaan.","l":630,"h":630},{"m":"2.20.6.","t":"Harga Perkiraan Sendiri (HPS) tidak menyebabkan harga penawaran dengan nilai di atas Harga Perkiraan Sendiri (HPS) tersebut menjadi gugur.","l":630,"h":630},{"m":"2.20.7.","t":"Harga Perkiraan Sendiri (HPS) tidak dibenarkan diinformasikan kepada Peserta Pengadaan Barang dan/atau Jasa sebelum pemasukan penawaran harga.","l":630,"h":630},{"m":"2.20.8.","t":"Harga Perkiraan Sendiri (HPS) dinyatakan sah untuk digunakan dalam proses Pengadaan setelah ditandatangani oleh Pejabat Berwenang","l":630,"h":630},{"m":"2.20.9.","t":"Penyusunan Harga Perkiraan Sendiri (HPS) didasarkan pada harga yang diperoleh dengan mempertimbangkan salah satu atau beberapa informasi yang meliputi:","l":630,"h":630},{"m":"a.","t":"Engineering Estimate (EE);","l":624,"h":340},{"m":"b.","t":"Informasi biaya satuan yang dipublikasikan secara resmi oleh asosiasi terkait, badan/institusi pemerintah dan sumber data lain yang dapat dipertanggungjawabkan;","l":624,"h":340},{"m":"c.","t":"Daftar biaya/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/distributor tunggal;","l":624,"h":340},{"m":"d.","t":"Harga historis dengan mempertimbangkan faktor perubahan biaya;","l":624,"h":340},{"m":"e.","t":"Inflasi tahun sebelumnya, suku bunga berjalan dan/atau kurs tengah Bank Indonesia;","l":624,"h":340},{"m":"f.","t":"Harga pasar;","l":624,"h":340},{"m":"g.","t":"Hasil perbandingan dengan kontrak sejenis; dan/atau","l":624,"h":340},{"m":"h.","t":"Informasi lain yang dapat dipertanggungjawabkan.","l":624,"h":340},{"c":"[BAB 2 angka 2.20.0]"},{"t":"PENGESAHAN HARGA PERKIRAAN SENDIRI (HPS)"},{"m":"2.21.1.","t":"Harga Perkiraan Sendiri (HPS) dinyatakan sah untuk digunakan dalam proses Pengadaan setelah ditandatangani Pejabat Berwenang.","l":630,"h":630},{"m":"2.21.2.","t":"Form Harga Perkiraan Sendiri (HPS) ditandatangani secara bersama-sama oleh Pejabat Penandatangan Harga Perkiraan Sendiri (HPS) sebagai berikut:","l":630,"h":630},{"m":"a.","t":"Kantor Pusat:","l":624,"h":340},{"m":"1.","t":"Nilai Pengadaan mulai dari Rp10.000.000,- (sepuluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah):","l":908,"h":340},{"m":"a)","t":"Kepala Unit Pelaksana Pengadaan Kantor Pusat.","l":1192,"h":340},{"m":"b)","t":"Kepala Unit Kerja Pengadaan.","l":1192,"h":340},{"m":"c)","t":"Kepala Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"2.","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp. 50.000.000.000,- (lima puluh miliar rupiah)","l":908,"h":340},{"m":"a)","t":"Ketua dan Sekretaris Panitia Pengadaan.","l":1192,"h":340},{"m":"b)","t":"Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"3.","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah)","l":908,"h":340},{"m":"a)","t":"Ketua dan Sekretaris Panitia Pengadaan.","l":1192,"h":340},{"m":"b)","t":"Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"c)","t":"Direktur Utama.","l":1192,"h":340},{"m":"b.","t":"Kantor Cabang:","l":624,"h":340},{"m":"1.","t":"Nilai s.d. batas kewenangan Kantor Cabang.","l":908,"h":340},{"m":"a)","t":"Kepala Unit Pelaksana Pengadaan Kantor Cabang.","l":1192,"h":340},{"m":"b)","t":"Pejabat Berwenang.","l":1192,"h":340},{"m":"2.","t":"Nilai Pengadaan di atas kewenangan Kantor Cabang s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah).","l":908,"h":340},{"m":"a)","t":"Kepala Unit Pelaksana Pengadaan Kantor Pusat. (Ketua Panitia Pengadaan Kantor Cabang apabila dilimpahkan).","l":1192,"h":340},{"m":"b)","t":"Kepala Unit Kerja Pengadaan (Pejabat Berwenang Kantor Cabang apabila dilimpahkan).","l":1192,"h":340},{"m":"c)","t":"Kepala Unit Spesifikasi Teknis (UST) (Kepala Unit Spesifikasi Teknis (UST) Kantor Cabang apabila dilimpahkan).","l":1192,"h":340},{"m":"3.","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah).","l":908,"h":340},{"m":"a)","t":"Ketua dan Sekretaris Panitia Pengadaan Kantor Pusat (Ketua dan Sekretaris Panitia Pengadaan Kantor Cabang apabila dilimpahkan).","l":1192,"h":340},{"m":"b)","t":"Pejabat Berwenang Kantor Cabang.","l":1192,"h":340},{"m":"c)","t":"Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"4.","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah)","l":908,"h":340},{"m":"a)","t":"Ketua dan Sekretaris Panitia Pengadaan Kantor Pusat. (Ketua dan Sekretaris Panitia Pengadaan Kantor Cabang apabila dilimpahkan).","l":1192,"h":340},{"m":"b)","t":"Pejabat Berwenang Kantor Cabang.","l":1192,"h":340},{"m":"c)","t":"Direktur Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"d)","t":"Direktur Utama.","l":1192,"h":340},{"m":"2.21.3.","t":"Pengesahan Harga Perkiraan Sendiri (HPS) sebagaimana dimaksud pada butir 2.22.1 untuk Pengadaan Barang dan/atau Jasa yang menggunakan metode Penunjukan Langsung atau Pembelian Berulang (Repeat Order/RO), Harga Perkiraan Sendiri (HPS) disahkan setelah mendapat persetujuan dari :","l":630,"h":630},{"m":"a.","t":"Direktur Unit Spesifikasi Teknis (UST) apabila menggunakan metode Penunjukan Langsung; atau","l":624,"h":340},{"m":"b.","t":"Pejabat Berwenang apabila menggunakan metode Pembelian Berulang (Repeat Order/RO).","l":624,"h":340},{"c":"[BAB 2 angka 2.21.0]"}],[{"t":"HARGA PERKIRAAN SENDIRI (HPS) / OWNER ESTIMATE (OE)"},{"m":"1.","t":"Berdasarkan KAK/TOR, Unit Pembuat Spesifikasi Teknis menyusun dan membuat dan menandatangani usulan HPS dengan mencantumkan sumber data harga (asosiasi atau daftar harga penyedia Barang dan/atau Jasa Perusahaan atau sumber lainnya) dan/atau melakukan uji pasar, untuk dijadikan sebagai lampiran dari KAK/TOR;","l":340,"h":340},{"m":"2.","t":"Usulan HPS tersebut disusun secara sistematis dengan mengacu pada sumber referensi harga yang bisa dipertanggungjawabkan antara lain harga resmi (price quotation/proforma invoice) yang dikeluarkan oleh penyedia Barang dan/atau Jasa, termasuk agen tunggal/pabrikan yang akan ditunjuk;","l":340,"h":340},{"m":"3.","t":"Uji pasar dan sumber data yang dapat dipercaya, dapat diambil dari asosiasi atau dari sumber lainnya;","l":340,"h":340},{"m":"4.","t":"HPS digunakan sebagai alat untuk menilai kewajaran harga penawaran termasuk rinciannya dan sebagai dasar untuk menetapkan besaran tambahan nilai jaminan pelaksanaan bagi penawaran yang dinilai terlalu rendah;","l":340,"h":340},{"m":"5.","t":"HPS tidak dapat dijadikan dasar untuk menggugurkan penawaran;","l":340,"h":340},{"m":"6.","t":"Perubahan HPS tidak dibenarkan setelah pembukaan penawaran harga;","l":340,"h":340},{"m":"7.","t":"Dalam hal Pengadaan barang impor yang tidak dimungkinkan dibayar dengan mata uang rupiah, atau keadaan tertentu lainnya, HPS dapat dibuat dengan mata uang asing, dengan ketentuan nilainya tidak melebihi anggaran;","l":340,"h":340},{"m":"8.","t":"Bila terjadi kasus perubahan kurs mata uang asing yang signifikan sebelum penyampaian Surat Penawaran Harga, hal tersebut disampaikan kepada Pejabat berwenang untuk pengambilan keputusan sesuai dengan batas kewenangan;","l":340,"h":340},{"m":"9.","t":"Penyusunan HPS untuk Pengadaan Barang dan/atau Jasa harus mempertimbangkan hal-hal berikut ini:","l":340,"h":340},{"m":"a.","t":"Analisis harga satuan barang/pekerjaan yang bersangkutan;","l":624,"h":340},{"m":"b.","t":"Harga pasar setempat pada waktu penyusunan HPS;","l":624,"h":340},{"m":"c.","t":"Harga kontrak untuk barang/pekerjaan sejenis setempat yang pernah dilaksanakan (harga historis);","l":624,"h":340},{"m":"d.","t":"Harga/tarif Barang dan/atau Jasa yang dikeluarkan oleh pabrikan/agen tunggal atau lembaga independen;","l":624,"h":340},{"m":"e.","t":"Informasi biaya satuan yang dipublikasikan secara resmi oleh Pemerintah/Badan Pusat Statistik, asosiasi terkait dan media cetak lainnya yang datanya dapat dipertanggungjawabkan;","l":624,"h":340},{"m":"f.","t":"Risiko kenaikan/penurunan harga.","l":624,"h":340},{"m":"10.","t":"HPS telah memperhitungkan Keuntungan yang wajar bagi penyedia Barang dan/atau Jasa;","l":340,"h":340},{"m":"11.","t":"HPS tidak boleh memperhitungkan biaya tidak terduga, biaya lain-lain yang tidak jelas peruntukannya dan PPh penyedia Barang dan/atau Jasa;","l":340,"h":340},{"m":"12.","t":"Biaya-biaya yang volume dan penggunaannya belum jelas tidak diperhitungkan sebagai biaya pasti, tetapi dimasukkan dalam biaya cadangan (provisional sum), dengan besaran sejumlah tertentu atau maksimum sebesar nilai anggaran yang disediakan. Penagihannya berdasarkan realisasi sesungguhnya, namun tidak boleh melampaui biaya cadangan. Penggunaannya harus benar-benar terkait dengan pekerjaan induknya, yang dinyatakan dalam berita acara;","l":340,"h":340},{"m":"13.","t":"Penyusunan HPS untuk Pengadaan jasa konsultansi harus mempertimbangkan hal-hal berikut:","l":340,"h":340},{"m":"a.","t":"HPS disusun secara sistematis dan bukan satu-satunya acuan penilaian terhadap penawaran penyedia jasa;","l":624,"h":340},{"m":"b.","t":"HPS dibuat pada saat akan melaksanakan Pengadaan yang terdiri dari 2 (dua) komponen pokok, yaitu:","l":624,"h":340},{"m":"i.","t":"Biaya langsung personil (remuneration);","l":908,"h":340},{"m":"ii.","t":"Biaya langsung non personil (direct reimbursable cost) yang meliputi antara lain biaya untuk sewa kantor, biaya perjalanan, biaya pengiriman dokumen, biaya pengurusan surat ijin, biaya komunikasi, tunjangan perumahan dan biaya lainnya.","l":908,"h":340},{"m":"c.","t":"Dalam penyusunan HPS, persentase biaya langsung non personil tidak boleh lebih besar dari persentase biaya langsung personil;","l":624,"h":340},{"m":"d.","t":"Perhitungan HPS harus dilakukan dengan cermat. Agar hasil perhitungan HPS tersebut dalam dipertanggungjawabkan, maka diusahakan sebanyak- banyaknya menggunakan data dasar sebagai berikut:","l":624,"h":340},{"m":"i.","t":"Harga pasar setempat menjelang dilaksanakannya Pengadaan;","l":908,"h":340},{"m":"ii.","t":"Informasi biaya satuan yang dipublikasikan secara resmi oleh Badan Pusat Statistik, asosiasi terkait dan media cetak lainnya yang datanya dapat dipertanggungjawabkan;","l":908,"h":340},{"m":"iii.","t":"Biaya kontrak terdahulu yang sedang berjalan dengan mempertimbangkan faktor kenaikan biaya yang terjadi (kalau ada);","l":1003,"h":435},{"m":"iv.","t":"KAK/TOR dan HPS digunakan sebagai acuan dalam evaluasi penawaran, klarifikasi, dan atau negosiasi dengan calon konsultan terpilih. Dimungkinkan adanya perbedaan hasil negosiasi terhadap KAK dan HPS seperti kualifikasi, jumlah penggunaan tenaga ahli (person-month), satuan biaya personil sepanjang tidak mengubah sasaran, tujuan dan keluaran/output yang dihasilkan dan tidak melampaui anggaran tersedia, yang dipertanggungjawabkan secara keahlian (professional).","l":908,"h":340},{"m":"14.","t":"Perubahan HPS akibat perhitungan volume bersama, maka Unit Pengguna menyampaikan kembali perubahan HPS kepada pejabat/Unit Pengadaan dan apabila perubahan HPS melampaui biaya anggaran, maka pejabat/Unit Pengadaan menunda pemasukan penawaran sampai revisi anggaran tersebut disetujui.","l":340,"h":340},{"c":"[BAB IV.D]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Harga Perkiraan Sendiri (HPS) adalah dokumen estimasi/ perkiraan harga yang disiapkan oleh masing masing unit dan disahkan oleh Pejabat satu tingkat dibawah Direksi.","l":340,"h":340},{"m":"2.","t":"Harga Perkiraan Sendiri (HPS) dikalkulasikan berdasarkan keahlian dan berdasarkan data yang dapat dipertanggungjawabkan.","l":340,"h":340},{"m":"3.","t":"Harga Perkiraan Sendiri (HPS) dapat dibuat dan disusun dengan dibantu oleh konsultan/ ahli menyesuaikan kebutuhan Perusahaan.","l":340,"h":340},{"m":"4.","t":"Harga Perkiraan Sendiri (HPS) menggunakan mata uang Rupiah dan dapat menggunakan mata uang asing yang harus dilakukan konversi ke dalam mata uang Rupiah dengan mengikuti kurs tengah Bank Indonesia pada saat penyusunan Harga Perkiraan Sendiri (HPS).","l":340,"h":340},{"m":"5.","t":"Harga Perkiraan Sendiri (HPS) beserta rinciannya disusun oleh Unit Teknis dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Harga Perkiraan Sendiri (HPS) dibuat berdasarkan harga rata-rata di pasaran beserta semua biaya yang timbul akibat proses pengadaan barang dan/ atau jasa tersebut yang diajukan oleh Unit Teknis kepada Pelaksana Pengadaan Barang dan/ atau Jasa;","l":624,"h":340},{"m":"b.","t":"Harga Perkiraan Sendiri (HPS) digunakan sebagai :","l":624,"h":340},{"m":"i.","t":"Alat untuk menilai kewajaran penawaran harga;","l":908,"h":340},{"m":"ii.","t":"Dasar untuk negosiasi harga;","l":908,"h":340},{"m":"iii.","t":"Dasar penentuan nilai jaminan pelaksanaan untuk nilai pekerjaan yang nilainya lebih rendah dari 80% (delapan puluh persen) dari Harga Perkiraan Sendiri (HPS).","l":1003,"h":435},{"m":"c.","t":"Harga Perkiraan Sendiri (HPS) disusun dengan memperhatikan acuan sebagai berikut :","l":624,"h":340},{"m":"i.","t":"Harga barang;","l":908,"h":340},{"m":"ii.","t":"Biaya pengiriman;","l":908,"h":340},{"m":"iii.","t":"Biaya instalasi;","l":1003,"h":435},{"m":"iv.","t":"Bea masuk;","l":908,"h":340},{"m":"v.","t":"Overhead dan keuntungan;","l":908,"h":340},{"m":"vi.","t":"Perubahan inflasi dan/ atau nilai tukar mata uang;","l":908,"h":340},{"m":"vii.","t":"Pajak-pajak;","l":1003,"h":435},{"m":"viii.","t":"Data/ informasi yang dapat dipertanggungjawabkan.","l":1098,"h":530},{"m":"d.","t":"Unsur-unsur Harga Perkiraan Sendiri (HPS) untuk pengadaan barang dan/ atau jasa, yaitu:","l":624,"h":340},{"m":"i.","t":"Biaya langsung personil;","l":908,"h":340},{"m":"ii.","t":"Biaya langsung non personil;","l":908,"h":340},{"m":"iii.","t":"Biaya tidak langsung personil;","l":1003,"h":435},{"m":"iv.","t":"Biaya sewa peralatan/ sarana;","l":908,"h":340},{"m":"v.","t":"Biaya mobilisasi dan demobilisasi;","l":908,"h":340},{"m":"vi.","t":"Biaya asuransi personil dan peralatan;","l":908,"h":340},{"m":"vii.","t":"Biaya pelatihan;","l":1003,"h":435},{"m":"viii.","t":"Perizinan;","l":1098,"h":530},{"m":"ix.","t":"Pajak dan bea;","l":908,"h":340},{"m":"x.","t":"Keuntungan dan overhead.","l":908,"h":340},{"m":"e.","t":"Unsur-unsur Harga Perkiraan Sendiri (HPS) untuk pengadaan borongan (barang dan jasa) adalah kombinasi unsur-unsur pengadaan barang dan pengadaan jasa.","l":624,"h":340},{"m":"f.","t":"Sebagai acuan untuk meneliti kewajaran harga penawaran, fungsi pengadaaan menggunakan Harga Perkiraan Sendiri (HPS) dengan batas bawah tidak rendah dari 80% (delapan puluh persen) dari HPS dan batas atas tidak lebih tinggi dari 100% (seratus persen) dari Harga Perkiraan Sendiri (HPS).","l":624,"h":340},{"m":"g.","t":"Apabila ditemui harga penawaran yang tidak wajar, fungsi pengadaan melakukan klarifikasi kepada Penyedia Barang dan/ atau Jasa terkait;","l":624,"h":340},{"m":"h.","t":"Tindak lanjut dari hasil klarifikasi adalah sebagai berikut :","l":624,"h":340},{"m":"1.","t":"Apabila hasil klarifikasi dapat dipertanggungjawabkan, maka penawaran harga dinyatakan wajar yang dinyatakan dalam Berita Acara;","l":908,"h":340},{"m":"2.","t":"Apabila hasil klarifikasi tidak dapat dipertanggungjawabkan, maka penawaran harga dinyatakan sebagai harga tidak wajar dan dinyatakan gugur serta dinyatakan dalam berita acara hasil klarifikasi;","l":908,"h":340},{"m":"3.","t":"Harga Perkiraan Sendiri (HPS) bukan merupakan dasar penentuan kerugian Perusahaan;","l":908,"h":340},{"m":"i.","t":"Rincian Harga Perkiraan Sendiri (HPS) bersifat tertutup, namun total Harga Perkiraan Sendiri (HPS) dapat dibuka pada saat penjelasan Dokumen Pengadaan dan disampaikan kepada Penyedia Barang dan/ atau Jasa, dan nilai rincian Harga Perkiraan Sendiri (HPS) digunakan sebagai acuan saat negosiasi harga;","l":624,"h":340},{"c":"[Pasal 15]"}]]}]},{"heading":"F. PEMAKETAN PBJ","rows":[{"topik":"PEMAKETAN PBJ","cells":[[{"t":"PEMAKETAN PBJ"},{"m":"1.","t":"Pembuatan Paket (Pemaketan) PBJ dilakukan dengan berorientasi pada:","l":340,"h":340},{"m":"a.","t":"Keluaran atau hasil;","l":624,"h":340},{"m":"b.","t":"Volume Barang dan/atau Jasa;","l":624,"h":340},{"m":"c.","t":"Ketersediaan Barang dan/atau Jasa;","l":624,"h":340},{"m":"d.","t":"Kemampuan Penyedia; dan/atau","l":624,"h":340},{"m":"e.","t":"Ketersediaan anggaran.","l":624,"h":340},{"m":"2.","t":"Pemaketan dilarang dilakukan untuk memecah nilai pengadaan secara tidak sah guna menghindari metode pemilihan tertentu atau kewenangan persetujuan.","l":340,"h":340},{"c":"[BAB III.F]"}],[{"m":"1.","t":"Pemaketan adalah mengelompokkan pekerjaan yang sejenis untuk keberhasilan dalam mencapai hasil/ output pekerjaan berdasarkan prinsip-prinsip pengadaan antara lain prinsip efektif dan efisien;","l":340,"h":340},{"m":"2.","t":"Pemaketan berdasarkan jenis pengadaannya, yaitu :","l":340,"h":340},{"m":"a.","t":"Barang;","l":624,"h":340},{"m":"b.","t":"Pekerjaan konstruksi;","l":624,"h":340},{"m":"c.","t":"Jasa konsultansi;","l":624,"h":340},{"m":"d.","t":"Jasa lainnya.","l":624,"h":340},{"m":"3.","t":"Pemaketan berdasarkan ruang lingkup kompetensi penyedia (dikelompokkan kepada bidang/ sub bidang penyedia).","l":340,"h":340},{"m":"4.","t":"Untuk paket pengadaan yang memenuhi syarat khusus dan tertentu sebagaimana disebut dalam prosedur metode pengadaan maka dilakukan dengan metode penunjukan langsung atau e-procurement.","l":340,"h":340},{"m":"5.","t":"Pemaketan pengadaan barang dan/ atau jasa dilakukan dengan berorientasi pada:","l":340,"h":340},{"m":"a.","t":"Keluaran atau hasil yang mengacu pada kinerja dan kebutuhan pada Direktorat/ Divisi/ Unit kerja;","l":624,"h":340},{"m":"b.","t":"Volume barang dan/ jasa berdasarkan kebutuhan dan ketersediaan barang dan/ atau jasa di Direktorat/ Divisi/ Unit kerja serta kemampuan dari pelaku usaha;","l":624,"h":340},{"m":"c.","t":"Ketersediaan barang dan/ atau jasa di pasar;","l":624,"h":340},{"m":"d.","t":"Kemampuan pelaku usaha dalam memenuhi spesifikasi teknis atau KAK/ TOR yang dibutuhkan Direktorat/ Divisi/ Unit kerja; dan/ atau","l":624,"h":340},{"m":"e.","t":"Ketersediaan anggaran pada Direktorat/ Divisi/ Unit kerja.","l":624,"h":340},{"m":"6.","t":"Dalam melakukan pemaketan pengadaan barang dan/ atau jasa, dilarang:","l":340,"h":340},{"m":"a.","t":"Menyatukan atau memusatkan beberapa paket pengadaan yang tersebar di beberapa lokasi/ daerah yang memiliki sifat pekerjaan sama dan tingkat efisiensi baik dari sisi waktu dan/ atau biaya seharusnya dilakukan di beberapa lokasi/ daerah masing-masing sesuai dengan hasil kajian/ telah dikecualikan untuk kontrak payung;","l":624,"h":340},{"m":"b.","t":"Menyatukan beberapa paket pengadaan yang menurut sifat dan jenis pekerjaannya harus dipisahkan untuk mendapatkan penyedia yang sesuai;","l":624,"h":340},{"m":"c.","t":"Menyatukan beberapa paket pengadaan yang besaran nilainya seharusnya dilakukan oleh usaha kecil; dan/ atau","l":624,"h":340},{"m":"d.","t":"Memecah pengadaan barang dan/ jasa menjadi beberapa paket dengan maksud menghindari tender/ seleksi.","l":624,"h":340},{"c":"[Pasal 13]"}],[{"t":"PEMAKETAN PENGADAAN BARANG DAN/ATAU JASA"},{"m":"2.23.1.","t":"Pemaketan Pengadaan Barang dan/atau Jasa dilakukan dengan berorientasi pada:","l":630,"h":630},{"m":"a.","t":"Efiseinsi Harga;","l":624,"h":340},{"m":"b.","t":"Percepatan waktu proses Pengadaan Barang dan/atau Jasa;","l":624,"h":340},{"m":"c.","t":"Keluaran atau hasil;","l":624,"h":340},{"m":"d.","t":"Volume Barang dan/atau Jasa;","l":624,"h":340},{"m":"e.","t":"Ketersediaan Barang dan/atau Jasa;","l":624,"h":340},{"m":"f.","t":"Penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil;","l":624,"h":340},{"m":"g.","t":"Kemampuan Penyedia Barang dan/atau Jasa; dan/atau","l":624,"h":340},{"m":"h.","t":"Ketersediaan anggaran.","l":624,"h":340},{"c":"[BAB 2 angka 2.23.0]"}],[{"t":"PEMAKETAN PENGADAAN BARANG DAN/ATAU JASA"},{"t":"Pembuatan Paket (Pemaketan) Pengadaan Barang dan/atau Jasa dilakukan dengan berorientasi pada:"},{"m":"1.","t":"Keluaran atau hasil;","l":340,"h":340},{"m":"2.","t":"Volume Barang dan/atau Jasa;","l":340,"h":340},{"m":"3.","t":"Ketersediaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"4.","t":"Kemampuan Penyedia Barang dan/atau Jasa; dan/atau","l":340,"h":340},{"m":"5.","t":"Ketersediaan anggaran.","l":340,"h":340},{"c":"[BAB VII.A]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Pemaketan adalah mengelompokkan pekerjaan yang sejenis untuk keberhasilan dalam mencapai hasil/ output pekerjaan berdasarkan prinsip-prinsip pengadaan antara lain prinsip efektif dan efisien;","l":340,"h":340},{"m":"2.","t":"Pemaketan berdasarkan jenis pengadaannya, yaitu :","l":340,"h":340},{"m":"a.","t":"Barang;","l":624,"h":340},{"m":"b.","t":"Pekerjaan konstruksi;","l":624,"h":340},{"m":"c.","t":"Jasa konsultansi;","l":624,"h":340},{"m":"d.","t":"Jasa lainnya.","l":624,"h":340},{"m":"3.","t":"Pemaketan berdasarkan ruang lingkup kompetensi Penyedia Barang dan/ atau Jasa (dikelompokkan kepada bidang/ sub bidang Penyedia Barang dan/ atau Jasa).","l":340,"h":340},{"m":"4.","t":"Untuk paket pengadaan yang memenuhi syarat khusus dan tertentu sebagaimana disebut dalam prosedur metode pengadaan maka dilakukan dengan metode penunjukan langsung.","l":340,"h":340},{"m":"5.","t":"Pemaketan pengadaan barang dan/ atau jasa dilakukan dengan berorientasi pada:","l":340,"h":340},{"m":"a.","t":"Keluaran atau hasil yang mengacu pada kinerja dan kebutuhan;","l":624,"h":340},{"m":"b.","t":"Volume barang dan/ atau jasa berdasarkan kebutuhan dan ketersediaan barang dan/ atau jasa, serta kemampuan dari pelaku usaha;","l":624,"h":340},{"m":"c.","t":"Ketersediaan barang dan/ atau jasa di pasar;","l":624,"h":340},{"m":"d.","t":"Kemampuan pelaku usaha dalam memenuhi spesifikasi teknis atau Kerangka Acuan Kerja (KAK) yang dibutuhkan; dan/ atau","l":624,"h":340},{"m":"e.","t":"Ketersediaan anggaran.","l":624,"h":340},{"m":"6.","t":"Khusus untuk Pengadaan Pekerjaan Konstruksi dan Jasa Lainnya, dapat memperhitungkan Sisa Kemampuan Paket (SKP) sebagai berikut:","l":340,"h":340},{"tbl":{"rows":[[{"t":"SKP"},{"t":":"},{"t":"KP-P"}],[{"t":"KP"},{"t":":"},{"t":"Nilai Kemampuan Paket, dengan ketentuan sebagai berikut:\na. untuk Usaha Kecil, nilai Kemampuan Paket (KP) ditentukan sebanyak 5 (lima) paket pekerjaan; dan\nb. untuk usaha non kecil, nilai Kemampuan Paket (KP) ditentukan sebanyak 6 (enam) atau 1,2 (satu koma dua) N."}],[{"t":"P"},{"t":":"},{"t":"Jumlah paket yang sedang dikerjakan"}],[{"t":"N"},{"t":":"},{"t":"Jumlah paket pekerjaan terbanyak yang dapat ditangani pada saat bersamaan selama kurun waktu 5 (lima) tahun terakhir"}]],"hdr":0}},{"m":"7.","t":"Dalam melakukan pemaketan pengadaan barang dan/ atau jasa, dilarang:","l":340,"h":340},{"m":"a.","t":"Menyatukan atau memusatkan beberapa paket pengadaan yang tersebar di beberapa lokasi/ daerah yang memiliki sifat pekerjaan sama dan tingkat efisiensi baik dari sisi waktu dan/ atau biaya seharusnya dilakukan di beberapa lokasi/ daerah masing-masing sesuai dengan hasil kajian/ telaah dikecualikan untuk kontrak payung;","l":624,"h":340},{"m":"b.","t":"Menyatukan beberapa paket pengadaan yang menurut sifat dan jenis pekerjaannya harus dipisahkan untuk mendapatkan penyedia yang sesuai;","l":624,"h":340},{"m":"c.","t":"Menyatukan beberapa paket pengadaan yang besaran nilainya seharusnya dilakukan oleh usaha kecil; dan/ atau","l":624,"h":340},{"m":"d.","t":"Memecah pengadaan barang dan/ atau jasa menjadi beberapa paket dengan maksud menghindari tender.","l":624,"h":340},{"c":"[Pasal 16]"}]]}]},{"heading":"G. JAMINAN","rows":[{"topik":"Fungsi, Penyerahan, dan Jenis Jaminan","cells":[[{"t":"JAMINAN"},{"m":"1.","t":"Jaminan dalam PBJ berfungsi untuk pengendalian dan mitigasi risiko atas kemungkinan kegagalan atau terhambatnya proses pelaksanaan PBJ, baik pada tahap pemilihan Penyedia maupun pelaksanaan Perjanjian/Kontrak. Jaminan PBJ diterbitkan dan akan dibayar oleh Penjamin apabila Penyedia tidak memenuhi kewajiban yang dipersyaratkan dalam Dokumen Teknis atau Perjanjian/Kontrak.","l":340,"h":340},{"m":"2.","t":"Penyedia yang mengikuti PBJ di Perusahaan diminta untuk menyerahkan jaminan-jaminan (apabila dipersyaratkan) yang tertuang dalam KAK/TOR/RKST dan/atau yang ditentukan lain apabila dipandang perlu oleh Unit Yang Membidangi Fungsi PBJ.","l":340,"h":340},{"m":"3.","t":"Jaminan pada PBJ sebagaimana dimaksud di atas terdiri dari:","l":340,"h":340},{"c":"[BAB III.G angka 1-2, angka 3]"}],[{"m":"1.","t":"Jaminan pengadaan barang dan/ atau jasa terdiri atas:","l":340,"h":340},{"m":"a.","t":"Jaminan uang muka;","l":624,"h":340},{"m":"b.","t":"Jaminan pelaksanaan;","l":624,"h":340},{"m":"c.","t":"Jaminan sanggah banding.","l":624,"h":340},{"m":"2.","t":"Jaminan sebagaimana dimaksud pada ayat (1) dapat berupa bank garansi atau surety bond.","l":340,"h":340},{"m":"3.","t":"Bentuk jaminan sebagaimana dimaksud pada ayat (1) bersifat :","l":340,"h":340},{"m":"a.","t":"tidak bersyarat;","l":624,"h":340},{"m":"b.","t":"mudah dicairkan;","l":624,"h":340},{"m":"c.","t":"harus dicairkan oleh penerbit jaminan paling lambat 14 (empat belas) hari kerja setelah surat perintah pencairan dari Unit Teknis terkait.","l":624,"h":340},{"m":"4.","t":"Pengadaan jasa konsultansi tidak diperlukan jaminan.","l":340,"h":340},{"m":"5.","t":"Jaminan dari bank umum, Perusahaan penjaminan, Perusahaan asuransi, lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi dapat digunakan untuk semua jenis Jaminan.","l":340,"h":340},{"m":"6.","t":"Perusahaan penjaminan, Perusahaan asuransi, dan lembaga keuangan khusus yang menjalankan usaha di bidang pembiayaan, penjaminan, dan asuransi sebagaimana dimaksud pada ayat (5) adalah Perusahaan penerbit jaminan yang memiliki izin usaha dan pencatatan produk surety bond di Otoritas Jasa Keuangan (OJK).","l":340,"h":340},{"m":"7.","t":"Bukti jaminan diterima dan diverifikasi oleh Unit Teknis terkait.","l":340,"h":340},{"c":"[Pasal 28]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"JAMINAN"},{"m":"1.","t":"Penyedia Barang dan/atau Jasa yang mengikuti Pengadaan Barang dan/atau Jasa di Perusahaan dengan nilai di atas Rp.500.000.000,- (lima ratus juta rupiah) diminta untuk menyera
