lakukan apabila memenuhi minimal salah 1 (satu) persyaratan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Penunjukan langsung kpeadaan darurat/ kahar, dengan kriteria sebagai berikut :","l":624,"h":340},{"m":"•","t":"Bencana alam, non alam dan bencana sosial;","l":908,"h":340},{"m":"•","t":"Pelaksanaan operasi pencarian dan pertolongan;","l":908,"h":340},{"m":"•","t":"Kerusakan sarana/ prasarana yang dapat mengganggu kegiatan pelayanan publik;","l":908,"h":340},{"m":"•","t":"Pemberian bantuan kemanusian;","l":908,"h":340},{"m":"•","t":"Penanganan untuk keamanan, keselamatan masyarakat, dan aset strategis perusahaan.","l":908,"h":340},{"m":"b.","t":"Penyedia Barang dan/ atau Jasa telah memiliki perjanjian keagenan/ distributor/ kerjasama dengan Perusahaan;","l":624,"h":340},{"m":"c.","t":"Penyedia Barang dan/ atau Jasa merupakan principal, distributor dan/ atau agen yang telah memberikan surat dukungan kepada Perusahaan dalam mengikuti sebuah tender;","l":624,"h":340},{"m":"d.","t":"Barang dan/ atau jasa yang dibutuhkan bagi kinerja utama Perusahaan dan tidak dapat ditunda keberadaannya (business critical asset);","l":624,"h":340},{"m":"e.","t":"Barang dan jasa yang bersifat knowledge intensive dimana untuk menggunakan dan memelihara produk tersebut membutuhkan kelangsungan pengetahuan dari Penyedia Barang dan/ atau Jasa;","l":624,"h":340},{"m":"f.","t":"Bila pelaksanaan pengadaan barang dan/ atau jasa dengan menggunakan cara pelelangan/ kontes telah 2 (dua) kali dilakukan dan tidak mendapatkan Penyedia Barang dan/ atau Jasa yang dibutuhkan atau tidak ada pihak yang memenuhi kriteria atau tidak ada pihak yang mengikuti pelelangan/ kontes;","l":624,"h":340},{"m":"g.","t":"Barang dan/ atau jasa yang dimiliki oleh pemegang hak atas kekayaan intelektual (HAKI) atau yang memiliki jaminan tertulis dari Original Equipment Manufacture (OEM) atau jasa konsultansi yang ditunjuk oleh pemegang Hak Atas Kekayaan Intelektual (HAKI), pemilik lisensi/ paten atau Original Equipment Manufacturer (OEM);","l":624,"h":340},{"m":"h.","t":"Barang dan Jasa atau jasa konsultansi yang berkelanjutan yang secara teknis merupakan satu kesatuan yang sifatnya rangkaian dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":624,"h":340},{"m":"i.","t":"Barang dan/ atau jasa lanjutan yang secara teknis merupakan satu kesatuan yang sifatnya tidak dapat dipecah-pecah dari pekerjaan yang sudah dilaksanakan sebelumnya;","l":624,"h":340},{"m":"j.","t":"BUMN, anak Perusahaan atau Perusahaan terafiliasi Badan Usaha Milik Negara (BUMN) sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan, serta merupakan produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/ atau Jasa bersangkutan;","l":624,"h":340},{"m":"k.","t":"Konsultan yang tidak direncanakan sebelumnya untuk menghadapi permasalahan tertentu yang sifat pelaksanaan pekerjaannya harus segera dan tidak dapat ditunda;","l":624,"h":340},{"m":"l.","t":"Jasa konsultan hukum dalam hal mengantisipasi terjadinya tuntutan atau jika terjadi tuntutan hukum kepada Perusahaan, Direksi, Komisaris dan Karyawan dalam melaksanakan tugasnya bagi perusahaan selama perbuatan tersebut tidak bertentangan dengan ketentuan internal maupun ketentuan hukum yang berlaku dan legal opinion untuk proses bisnis sehari-hari;","l":624,"h":340},{"m":"m.","t":"Jasa atau jasa konsultansi yang diperlukan untuk memberikan nasihat secara keahlian kepada Direksi.","l":624,"h":340},{"c":"[Pasal 24]"}]]}]},{"heading":"F. SANGGAHAN","rows":[{"topik":"SANGGAHAN","cells":[[{"t":"SANGGAHAN"},{"m":"1.","t":"Untuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam PBJ di lingkungan Perusahaan, maka sanggahan hanya dapat dilakukan dalam proses Tender/ Seleksi Umum dan Tender/Seleksi Terbatas.","l":340,"h":340},{"m":"2.","t":"Sanggahan dilakukan oleh Penyedia maksimal dalam jangka waktu 2 (dua) hari kerja setelah pengumuman pemenang, wajib disertai bukti yang kuat sebagai pendukungnya dan disertai Jaminan Sanggah.","l":340,"h":340},{"m":"3.","t":"Unit Yang Membidangi Fungsi PBJ menyampaikan keputusan atas sanggahan tersebut maksimal 7 (tujuh) hari kerja dari tanggal diterimanya pengajuan sanggahan dari Penyedia.","l":340,"h":340},{"m":"4.","t":"Unit Yang Membidangi Fungsi PBJ yang menangani dan memeriksa sanggahan dapat melibatkan pihak yang tidak terkait langsung dengan proses PBJ yang bersangkutan.","l":340,"h":340},{"m":"5.","t":"Unit Yang Membidangi Fungsi PBJ dapat mengatur persyaratan untuk melayani sanggahan sebesar nilai jaminan penawaran (bid bond) atau pencairan jaminan penawaran (bid bond), termasuk mensyaratkan adanya pembuktian dari pihak yang menyanggah.","l":340,"h":340},{"m":"6.","t":"Uang jaminan sanggahan tersebut dikembalikan kepada penyanggah apabila sanggahannya terbukti benar dan menjadi hak Perusahaan apabila sanggahannya terbukti tidak benar sesuai ketentuan yang berlaku dalam Pedoman ini.","l":340,"h":340},{"m":"7.","t":"Apabila sanggahan dinyatakan benar, Unit Yang Membidangi Fungsi PBJ mengusulkan pembatalan penetapan pemenang kepada Unit Teknis dan proses pemilihan dinyatakan gagal.","l":340,"h":340},{"m":"8.","t":"Pembatalan penetapan pemenang dilakukan oleh Unit Teknis berdasarkan kewenangan sebagaimana diatur dalam Peraturan ini, yang selanjutnya Unit Yang Membidangi Fungsi PBJ melakukan pengumuman proses pemilihan gagal.","l":340,"h":340},{"m":"9.","t":"Keputusan Unit Yang Membidangi Fungsi PBJ atas sanggahan bersifat final dan tidak dapat diganggu gugat.","l":340,"h":340},{"c":"[BAB IV.F]"}],[{"t":"Sanggahan"},{"m":"1.","t":"Untuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"2.","t":"Sanggahan dapat dilakukan dalam proses tender/ seleksi umum atau tender terbatas/ seleksi terbatas;","l":340,"h":340},{"m":"3.","t":"Sanggahan dilakukan oleh penyedia maksimal dalam jangka waktu 3 (tiga) hari kerja setelah pengumuman pemenang;","l":340,"h":340},{"m":"4.","t":"Perusahaan menyampaikan jawaban atas sanggahan tersebut secara tertulis maksimal 5 (lima) hari kerja sejak tanggal diterimanya sanggahan.","l":340,"h":340},{"m":"5.","t":"Penandatangan jawaban atas sanggahan secara tertulis dilaksanakan Vice President (VP) Procurement.","l":340,"h":340},{"c":"[Pasal 22]"},{"t":"Sanggah Banding"},{"t":"Sanggah banding merupakan protes dari penyanggah kepada Perusahaan pada pengadaan pekerjaan konstruksi yang tidak setuju atas jawaban sanggah."},{"m":"1.","t":"Penyanggah menyampaikan sanggah banding secara tertulis kepada unit teknis atau Direktur Teknis Terkait selambat-lambatnya 5 (lima) hari kerja setelah jawaban sanggah dimuat dalam aplikasi e-proc. Tembusan sanggah banding disampaikan kepada Internal Audit (IA) Perusahaan.","l":340,"h":340},{"m":"2.","t":"Penyanggah banding harus menyerahkan jaminan sanggah banding yang ditujukan kepada Unit Teknis atau Direktur Teknis terkait sebesar 1% (satu persen) dari nilai total HPS dengan masa berlaku 30 (tiga puluh) hari kalender sejak tanggal pengajuan sanggah banding. Untuk pekerjaan konstruksi terintegrasi, jaminan sanggah banding besarnya 1% (satu persen) dari nilai pagu anggaran.","l":340,"h":340},{"m":"3.","t":"Apabila sanggah banding dinyatakan benar/ diterima, Direktur Teknis terkait memerintahkan Divisi Procurement melakukan evaluasi ulang atau pemilihan penyedia ulang.","l":340,"h":340},{"c":"[Pasal 23]"}],[{"t":"PELELANGAN"},{"m":"3.4.14.","t":"Keberatan/Sanggahan Dalam Pelelangan","l":630,"h":630},{"m":"a.","t":"Peserta Pelelangan yang keberatan atas penetapan pemenang lelang, diberikan kesempatan untuk mengajukan sanggahan secara tertulis dalam waktu 3 (tiga) hari kerja setelah pengumuman pemenang diterima oleh Peserta Pelelangan.","l":624,"h":340},{"m":"b.","t":"Peserta yang mengajukan sanggahan wajib menyerahkan jaminan sanggah yang berlaku paling sedikit 15 (lima belas) hari kerja sejak pengajuan sanggahan dengan nilai yang ditentukan oleh Panitia Pengadaan.","l":624,"h":340},{"m":"c.","t":"Sanggahan disampaikan kepada Pejabat Berwenang disertai bukti-bukti terjadinya penyimpangan/ketidaksesuaian.","l":624,"h":340},{"m":"d.","t":"Sanggahan dapat diajukan oleh Peserta Pelelangan baik secara sendiri-sendiri maupun bersama-sama dengan Peserta Pelelangan lain apabila telah terjadi penyimpangan dari dokumen Pelelangan yang meliputi:","l":624,"h":340},{"m":"1.","t":"Panitia Pengadaan dan/atau pejabat yang berwenang terbukti menyalahgunakan wewenangnya;","l":908,"h":340},{"m":"2.","t":"pelaksanaan Pelelangan terbukti menyalahi ketentuan yang ditetapkan dalam dokumen Pelelangan dan/atau Rencana Kerja dan Syarat (RKS) teknis/administrasi;","l":908,"h":340},{"m":"3.","t":"Terbukti adanya praktik Kolusi, Korupsi dan Nepotisme (KKN) diantara Peserta lelang dan atau dengan anggota Panitia Pengadaan; dan/atau","l":908,"h":340},{"m":"4.","t":"Terbukti adanya rekayasa dari Panitia Pengadaan dan atau dari pihak-pihak tertentu yang mengakibatkan Pelelangan tidak adil, tidak transparan dan persaingan yang tidak sehat.","l":908,"h":340},{"m":"e.","t":"Pejabat Berwenang memberikan jawaban tertulis selambat-lambatnya dalam 5 (lima) hari kerja setelah sanggahan tersebut diterima oleh Pejabat Berwenang dimaksud.","l":624,"h":340},{"m":"f.","t":"Sebelum memberikan jawaban atas sanggahan Peserta Pelelangan, Pejabat Berwenang meminta penjelasan kepada Panitia Pengadaan dan Panitia Pengadaan wajib menjelaskan/membuktikan bahwa proses Pengadaan Barang dan/atau Jasa telah dilaksanakan sesuai dengan ketentuan yang berlaku di Perusahaan.","l":624,"h":340},{"m":"g.","t":"Apabila sanggahan Peserta Pelelangan benar dan terbukti, maka Pejabat Berwenang dapat membatalkan penetapan pemenang.","l":624,"h":340},{"m":"h.","t":"Dalam hal Pelelangan dibatalkan karena sanggahan Peserta terbukti, maka Panitia Pengadaan wajib melakukan Pelelangan ulang.","l":624,"h":340},{"m":"i.","t":"Apabila sanggahan Peserta Pelelangan tidak benar/tidak terbukti, penetapan pemenang mengikat secara sah dan tidak dapat diganggu gugat.","l":624,"h":340},{"m":"j.","t":"Apabila sanggahan Peserta Pelelangan tidak benar/tidak terbukti, maka Peserta yang bersangkutan tidak diperkenankan mengikuti proses Pengadaan Barang dan/atau Jasa berikutnya di lingkungan Perusahaan selama 2 (dua) tahun berturut-turut.","l":624,"h":340},{"m":"k.","t":"Panitia Pengadaan bertanggung jawab sepenuhnya atas seluruh proses Pelelangan dan wajib menyampaikan materi-materi yang berkaitan dengan sanggahan Peserta Pelelangan secara tertulis kepada Pejabat Berwenang.","l":624,"h":340},{"c":"[BAB 3 angka 3.4.14]"}],[{"t":"SANGGAHAN"},{"m":"1.","t":"Untuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan, maka Sanggahan hanya dapat dilakukan dalam proses Tender/ Seleksi Umum dan Tender/Seleksi Terbatas;","l":340,"h":340},{"m":"2.","t":"Sanggahan dilakukan oleh Penyedia Barang dan/atau Jasa maksimal dalam jangka waktu 2 (dua) hari kalender setelah pengumuman Calon pemenang, wajib disertai bukti yang kuat sebagai pendukungnya dan disertai Jaminan Sanggah;","l":340,"h":340},{"m":"3.","t":"Unit Pengadaan menyampaikan keputusan atas sanggahan tersebut maksimal 7 (tujuh) hari kalender dari tanggal diterimanya pengajuan sanggahan dari Penyedia;","l":340,"h":340},{"m":"4.","t":"Unit Pengadaan yang menangani dan memeriksa sanggahan dapat melibatkan pihak yang tidak terkait langsung dengan proses Pengadaan Barang dan/atau Jasa yang bersangkutan;","l":340,"h":340},{"m":"5.","t":"Unit Pengadaan dapat mengatur persyaratan untuk melayani sanggahan sebesar maksimum nilai jaminan penawaran (bid bond) atau pencairan jaminan penawaran (bid bond), termasuk mensyaratkan adanya pembuktian dari pihak yang menyanggah;","l":340,"h":340},{"m":"6.","t":"Uang jaminan sanggahan tersebut dikembalikan kepada penyanggah apabila sanggahannya terbukti benar secara hukum dan menjadi hak Perusahaan apabila sanggahannya terbukti benar secara hukum;","l":340,"h":340},{"m":"7.","t":"Keputusan Unit Pengadaan bersifat final dan tidak dapat diganggu gugat.","l":340,"h":340},{"c":"[BAB V.G]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Sanggahan"},{"m":"1.","t":"Untuk menjamin adanya transparansi dan perlakuan yang sama (equal treatment) dalam pengadaan barang dan/ atau jasa dapat mengajukan sanggahan secara tertulis apabila menemukan:","l":340,"h":340},{"m":"a.","t":"Penyimpangan terhadap ketentuan dan prosedur yang diatur dan yang telah ditetapkan dalam dokumen pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"b.","t":"Adanya rekayasa yang mengakibatkan terjadinya persaingan yang tidak sehat; dan/atau","l":624,"h":340},{"m":"c.","t":"Adanya penyalahgunaan wewenang oleh Panitia Pengadaan dan/atau Pejabat Yang Berwenang lainnya dalam proses pengadaan barang dan/ atau jasa.","l":624,"h":340},{"m":"2.","t":"Sanggahan dapat dilakukan dalam proses tender/ seleksi umum atau tender terbatas/ seleksi terbatas;","l":340,"h":340},{"m":"3.","t":"Sanggahan dilakukan oleh penyedia maksimal dalam jangka waktu 3 (tiga) hari kerja setelah pengumuman pemenang;","l":340,"h":340},{"m":"4.","t":"Pejabat Berwenang wajib memberikan jawaban tertulis atas semua sanggahan paling lambat 7 (tujuh) hari kerja setelah surat sanggahan diterima.","l":340,"h":340},{"m":"5.","t":"Calon Penyedia Barang/Jasa yang mengajukan Sanggahan wajib menyerahkan Jaminan Sanggahan yang berlaku 15 (lima belas) hari kerja sejak tanggal pengajuan Sanggahan, dan harus diserahkan kepada Perusahaan selambat-lambatnya pada saat penyampaian surat sanggahan.","l":340,"h":340},{"m":"6.","t":"Jaminan Sanggahan besarannya ditetapkan sama dengan jaminan penawaran.","l":340,"h":340},{"m":"7.","t":"Dalam hal Sanggahan dinyatakan benar, Jaminan Sanggahan dikembalikan kepada Calon Penyedia Barang dan/ atau Jasa yang menyanggah.","l":340,"h":340},{"m":"8.","t":"Dalam hal Sanggahan dinyatakan salah, Jaminan Sanggahan dicairkan dan sepenuhnya menjadi milik Perusahaan, kecuali Jawaban Sanggahan melampaui batas akhir menjawab Sanggahan.","l":340,"h":340},{"m":"9.","t":"Ketentuan tentang sanggahan ini berlaku bagi Calon Penyedia Barang dan/ atau Jasa apabila dipersyaratkan dalam Dokumen Pengadaan dan/ atau disampaikan pada saat penjelasan pekerjaan (aanwijzing).","l":340,"h":340},{"c":"[Pasal 32]"},{"t":"Sanggah Banding"},{"m":"1.","t":"Sanggah banding merupakan protes dari penyanggah kepada Perusahaan pada pengadaan pekerjaan konstruksi yang tidak setuju atas jawaban sanggah.","l":340,"h":340},{"m":"2.","t":"Penyanggah menyampaikan Sanggah Banding secara tertulis kepada Unit Teknis atau Direktur Teknis terkait selambat-lambatnya 7 (tujuh) hari kerja setelah Jawaban Sanggah disampaikan.","l":340,"h":340},{"m":"3.","t":"Tembusan Sanggah Banding disampaikan kepada Internal Audit (IA) Perusahaan.","l":340,"h":340},{"m":"4.","t":"Penyanggah banding harus menyerahkan jaminan sanggah banding yang ditujukan kepada Unit Teknis atau Direktur Teknis terkait sebesar 1% (satu persen) dari nilai total HPS dengan masa berlaku 30 (tiga puluh) hari kalender sejak tanggal pengajuan sanggah banding. Untuk pekerjaan konstruksi terintegrasi, jaminan sanggah banding besarnya 1% (satu persen) dari nilai pagu anggaran.","l":340,"h":340},{"m":"5.","t":"Apabila sanggah banding dinyatakan benar/ diterima, Unit Teknis terkait mengajukan permintaan kepada Unit Kerja yang membidangi fungsi pengadaan barang dan/ atau jasa untuk melakukan evaluasi ulang atau pemilihan Penyedia Barang dan/ atau Jasa ulang.","l":340,"h":340},{"c":"[Pasal 33]"}]]}]},{"heading":"G. PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG","rows":[{"topik":"Kriteria PBJ Jangka Panjang","cells":[[{"t":"PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"},{"m":"1.","t":"PBJ Jangka Panjang dilakukan antara lain untuk:","l":340,"h":340},{"m":"a.","t":"Pekerjaan yang penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) Tahun Anggaran;","l":624,"h":340},{"m":"b.","t":"Pekerjaan yang memberikan manfaat lebih apabila disepakati dalam perjanjian untuk jangka waktu lebih dari 1 (satu) Tahun Anggaran dan paling lama 3 (tiga) Tahun Anggaran;","l":624,"h":340},{"m":"c.","t":"Pekerjaan yang memerlukan investasi jangka panjang; atau","l":624,"h":340},{"m":"d.","t":"Pekerjaan rutin yang harus tersedia di awal tahun.","l":624,"h":340},{"c":"[BAB IV.G angka 1]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"},{"m":"1.11.1.","t":"Pengadaan Barang dan/atau Jasa jangka panjang dilakukan antara lain untuk pekerjaan yang:","l":630,"h":630},{"m":"a.","t":"Penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) tahun anggaran;","l":624,"h":340},{"m":"b.","t":"Memberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 3 (tiga) tahun anggaran;","l":624,"h":340},{"m":"c.","t":"Memberikan manfaat lebih apabila dikontrakkan untuk jangka waktu lebih dari 1 (satu) tahun anggaran dan paling lama 5 (lima) tahun anggaran, berdasarkan kriteria yang ditentukan oleh Direksi dengan persetujuan Dewan Komisaris;","l":624,"h":340},{"m":"d.","t":"Memerlukan investasi jangka panjang; atau","l":624,"h":340},{"m":"e.","t":"Bersifat rutin yang harus tersedia di awal tahun.","l":624,"h":340},{"m":"1.11.2.","t":"Untuk Pengadaan Barang dan/atau Jasa jangka panjang sebagaimana dimaksud pada butir 1.11.1, Direksi dapat membuat formula penyesuaian harga (price adjustment) tertentu baik untuk kenaikan maupun penurunan untuk mendapatkan harga wajar yang disesuaikan dengan antara lain:","l":630,"h":630},{"m":"a.","t":"Praktik yang berlaku umum (best practice);","l":624,"h":340},{"m":"b.","t":"Kondisi pasar; dan/atau","l":624,"h":340},{"m":"c.","t":"Fluktuasi harga bahan baku/bakar.","l":624,"h":340},{"c":"[BAB 1 angka 1.11.0]"}],[{"t":"PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"},{"m":"1.","t":"Pengadaan Barang dan/atau Jasa Jangka Panjang dilakukan antara lain untuk:","l":340,"h":340},{"m":"a.","t":"pekerjaan yang penyelesaiannya lebih dari 12 (dua belas) bulan atau lebih dari 1 (satu) Tahun Anggaran;","l":624,"h":340},{"m":"b.","t":"pekerjaan yang memberikan manfaat lebih apabila disepakati dalam perjanjian untuk jangka waktu lebih dari 1 (satu) Tahun Anggaran dan paling lama 3 (tiga) Tahun Anggaran;","l":624,"h":340},{"m":"c.","t":"pekerjaan yang memerlukan investasi jangka panjang; atau","l":624,"h":340},{"m":"d.","t":"pekerjaan rutin yang harus tersedia di awal tahun.","l":624,"h":340},{"m":"2.","t":"Untuk pengadaaan Barang dan/atau Jasa jangka panjang dilakukan pemilihan penyedia Barang dan/atau Jasa dengan metode tender/seleksi terbatas atau Pengadaan langsung atau penunjukan langsung;","l":340,"h":340},{"m":"3.","t":"Untuk pengadaaan Barang dan/atau Jasa jangka panjang digunakan kontrak payung dengan jangka waktu paling lama 3 (tiga) tahun, dan dapat diperpanjang paling lama untuk jangka waktu 3 (tiga) tahun;","l":340,"h":340},{"m":"5.","t":"Untuk Pengadaan yang prestasi Penyedianya melewati akhir tahun anggaran, pada akhir tahun anggaran Unit Pengguna melaporkan ke Unit Akuntansi sisa prestasi pekerjaan guna dicatat sebagai carryover tahun anggaran selanjutnya.","l":340,"h":340},{"c":"[BAB V.H angka 1-3, 5]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Penyesuaian Harga (Price Adjustment)","cells":[[{"t":"PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"},{"m":"2.","t":"Untuk PBJ jangka panjang sebagaimana dimaksud pada ayat (1), Direksi dapat membuat formula penyesuaian harga (price adjustment) tertentu baik untuk kenaikan maupun penurunan untuk mendapatkan harga wajar yang disesuaikan dengan antara lain:","l":340,"h":340},{"m":"a.","t":"Praktik yang berlaku umum (best practice);","l":624,"h":340},{"m":"b.","t":"Kondisi pasar; dan/atau","l":624,"h":340},{"m":"c.","t":"Fluktuasi harga bahan baku/bakar.","l":624,"h":340},{"c":"[BAB IV.G angka 2]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENYESUAIAN HARGA"},{"m":"4.10.1","t":"Penyesuaian harga dapat dilakukan berdasarkan hasil evaluasi atas usulan dari Penyedia Barang dan/atau Jasa.","l":570,"h":570},{"m":"4.10.2","t":"Penyesuaian harga satuan bagi komponen yang berasal dari luar negeri menggunakan indeks penyesuaian harga dari negara asal barang tersebut yang dibuktikan dengan surat keterangan dari prinsipal.","l":570,"h":570},{"m":"4.10.3","t":"Khusus untuk Pengadaan jasa yang dipengaruhi oleh biaya SDM maka penyesuaian harga dapat dilakukan berdasarkan kenaikan Upah Minimum Provinsi/Kabupaten/Kota.","l":570,"h":570},{"m":"4.10.4","t":"Proses penyesuaian harga dilaksanakan oleh Unit Kerja Pengadaan.","l":570,"h":570},{"m":"4.10.5","t":"Usulan penyesuaian harga dari Penyedia Barang dan/atau Jasa diajukan dan disetujui oleh Pejabat Berwenang.","l":570,"h":570},{"m":"4.10.6","t":"Usulan penyesuaian harga harus mendapat persetujuan dari Pejabat Berwenang.","l":570,"h":570},{"c":"[BAB 4 angka 4.10.0]"}],[{"t":"PENGADAAN BARANG DAN/ATAU JASA JANGKA PANJANG"},{"m":"4.","t":"Untuk pengadaaan sebagaimana dimaksud di atas, apabila diperlukan Unit Pengadaan dapat membuat formula penyesuaian harga tertentu (price adjustment) baik untuk kenaikan maupun penurunan yang disesuaikan dengan kondisi pasar dan best practice yang berlaku.","l":340,"h":340},{"c":"[BAB V.H angka 4]"},{"t":"KETENTUAN DAN ASPEK IKATAN KERJA"},{"m":"j.","t":"Kontrak harga satuan/kontrak yang jangka waktunya lebih dari 1 (satu) tahun/multi-years dapat memuat rumusan mengenai penyesuaian harga kontrak (price adjustment) sesuai dengan yang telah ditetapkan dalam dokumen Pemilihan;","l":340,"h":340},{"c":"[BAB VIII.A angka 2 huruf j]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Penyesuaian Harga dilakukan dengan ketentuan sebagai berikut:"},{"m":"1.","t":"Penyesuaian harga diberlakukan terhadap Kontrak Tahun Jamak (Multi Years Contract) dengan jenis Harga berdasarkan ketentuan dan persyaratan yang telah tercantum dalam dokumen pengadaan barang dan/ atau jasa dan perubahannya;","l":340,"h":340},{"m":"2.","t":"Penyesuaian harga berdasarkan faktor-faktor tertentu, sebagai berikut:","l":340,"h":340},{"m":"i.","t":"Fluktuasi Ekonomi dan Inflasi","l":624,"h":340},{"m":"ii.","t":"Perubahan Biaya Bahan Baku","l":624,"h":340},{"m":"iii.","t":"Kenaikan Tarif dan Biaya Tenaga Kerja","l":719,"h":435},{"m":"iv.","t":"Pajak","l":624,"h":340},{"m":"v.","t":"Kondisi ekonomi lainnya","l":624,"h":340},{"m":"vi.","t":"Perpanjangan masa pelaksanaan perkerjaan","l":624,"h":340},{"m":"vii.","t":"Ketentuan kontrak","l":719,"h":435},{"m":"viii.","t":"Indeks harga","l":814,"h":530},{"m":"ix.","t":"Koefisien komponen surat perjanjian/ kontrak","l":624,"h":340},{"c":"[Pasal 53]"}]]}]},{"heading":"H. PENGADAAN BERSAMA (JOINT PROCUREMENT)","rows":[{"topik":"PENGADAAN BERSAMA (JOINT PROCUREMENT)","cells":[[{"t":"PENGADAAN BERSAMA (JOINT PROCUREMENT)"},{"m":"1.","t":"Pengadaan Bersama (Joint Procurement) untuk pekerjaan-pekerjaan dengan kriteria sebagai berikut:","l":340,"h":340},{"m":"a.","t":"PBJ dapat dilaksanakan bersama Badan Hukum Indonesia/Badan Hukum Asing yang disepakati bersama karena kebutuhan terhadap barang dan/atau jasa;","l":624,"h":340},{"m":"b.","t":"Pengadaan Bersama sebagaimana dimaksud pada huruf a dilaksanakan berdasarkan kesepakatan bersama atau arahan tertulis Induk Holding atau arahan tertulis pengendali/pemegang saham Induk Holding yang selanjutnya dituangkan dalam perjanjian/kesepakatan bersama/dokumen tertulis lainnya dengan Badan Hukum Indonesia/Badan Hukum Asing yang memuat antara lain lingkup PBJ, cara pelaksanaan dan cara pembayaran serta penunjukan koordinator/pelaksana pengadaan.","l":624,"h":340},{"m":"2.","t":"Pengadaan Bersama (Joint Procurement) dilaksanakan dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Proses pelaksanaan Pengadaan Bersama dilakukan berdasarkan ketentuan peraturan PBJ yang berlaku di Perusahaan yang ditunjuk sebagai koordinator/pelaksana pengadaan;","l":624,"h":340},{"m":"b.","t":"Berdasarkan kesamaan kebutuhan atas barang dan/atau jasa tertentu/arahan tertulis Induk Holding atau arahan tertulis pengendali/pemegang saham Induk Holding, Para Pihak membuat rencana pengadaan bersama, dengan menyusun program kegiatan, jadwal pelaksanaan, pendanaan, dan koordinator kegiatan, yang diajukan kepada Direktur Terkait untuk mendapat persetujuan;","l":624,"h":340},{"m":"c.","t":"Setelah mendapat persetujuan Direktur Terkait, dibuat perjanjian atau kesepakatan bersama yang dituangkan dalam berita acara.","l":624,"h":340},{"c":"[BAB IV.H]"}],[{"t":"Proses pelaksanaan joint procurement dilakukan dengan ketentuan sebagai berikut :"},{"t":"Perusahaan/ entitas menunjuk salah satu Perusahaan/ entitas lainnya untuk bertindak sebagai pelaksana dalam melaksanakan proses pengadaan barang dan/ atau jasa. Semua pihak menyatakan tunduk terhadap ketentuan/ peraturan pengadaan barang dan/ atau jasa di Perusahaan/ entitas pelaksana pengadaan barang dan/ atau jasa yang dinyatakan dalam surat perjanjian."},{"c":"[Pasal 15]"}],[{"t":"KETENTUAN LAIN DALAM PELAKSANAAN PENGADAAN BARANG DAN/ATAU JASA"},{"m":"3.7.3.","t":"Pengadaan Melalui Joint Procurement","l":540,"h":540},{"m":"a.","t":"Pengadaan Barang dan/atau Jasa dapat dilakukan melalui Joint Procurement dengan Perusahaan Induk atas permintaan Perusahaan Induk atau dengan perusahaan lain dalam satu grup/asosiasi atas permintaan salah satu perusahaan dalam grup/asosiasi.","l":624,"h":340},{"m":"b.","t":"Semua Proses Joint Procurement dilaksanakan oleh Perusahaan Induk atau perusahaan dalam satu grup/asosiasi.","l":624,"h":340},{"m":"c.","t":"Dokumen Joint Procurement yang dilaksanakan di Perusahaan Induk atau perusahaan dalam satu grup/asosiasi merupakan Dokumen Pengadaan yang diakui oleh Perusahaan.","l":624,"h":340},{"m":"3.7.4.","t":"Pengadaan Melalui Joint Procurement antar Kantor Cabang","l":540,"h":540},{"m":"a.","t":"Pengadaan Barang dan/atau Jasa dapat dilakukan melalui Joint Procurement dengan cabang lain atas permintaan salah satu Kantor Cabang.","l":624,"h":340},{"m":"b.","t":"Semua proses Joint Procurement dilaksanakan oleh salah satu Kantor Cabang.","l":624,"h":340},{"t":"Dokumen Joint Procurement yang dilaksanakan di Kantor Cabang merupakan Dokumen Pengadaan yang diakui oleh Perusahaan.","l":624},{"c":"[BAB 3 angka 3.7.3-3.7.4]"}],[{"t":"PENGADAAN BERSAMA (JOINT PROCUREMENT)"},{"m":"1.","t":"Kriteria","l":340,"h":340},{"m":"a.","t":"Pengadaan Barang dan atau Jasa dapat dilakukan bersama Badan Hukum Indonesia yang disepakati bersama karena kebutuhan terhadap Barang dan atau Jasa;","l":624,"h":340},{"m":"b.","t":"Pengadaan Bersama dilaksanakan berdasarkan Perjanjian atau Kesepakatan Bersama langsung dengan Badan Hukum Indonesia yang disepakati bersama;","l":624,"h":340},{"m":"c.","t":"Kesepakatan untuk Pengadaan Bersama dituangkan dalam Perjanjian atau Kesepakatan Bersama yang memuat antara lain ruang lingkup pengadaan barang dan atau jasa, cara pelaksanaan dan cara pembayaran.","l":624,"h":340},{"m":"2.","t":"Pelaksanaan","l":340,"h":340},{"m":"a.","t":"Pengadaan Bersama dilaksanakan sesuai dengan Peraturan/Peraturan Bersama yang disepakati termasuk pembuatan ecatalog bersama;","l":624,"h":340},{"m":"b.","t":"Berdasarkan kesamaan kebutuhan atas barang dan atau jasa tertentu Para Pihak membuat rencana Pengadaan Bersama dengan menyusun program kegiatan, Jadwal Pelaksanaan, pendanaan dan koordinator kegiatan yang diajukan kepada Direksi untuk mendapat persetujuan;","l":624,"h":340},{"m":"c.","t":"Setelah mendapat persetujuan Direksi, dibuat perjanjian atau kesepakatan bersama;","l":624,"h":340},{"m":"d.","t":"Pengadaan Bersama diproses oleh Procurement atau Tim Khusus yang dibentuk oleh Direksi masing-masing pihak;","l":624,"h":340},{"m":"e.","t":"Prosedur Pengadaan Bersama ditetapka secara bersama-sama.","l":624,"h":340},{"c":"[BAB V.I]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Pengadaan Bersama (Joint Procurement) dapat dilaksanakan untuk memenuhi kebutuhan barang dan/ atau jasa untuk Perusahaan yang sama atau sejenis secara bersama-sama untuk meningkatkan efisiensi dan efektivitas melalui skala ekonomi dan negosiasi yang lebih kuat.","l":340,"h":340},{"m":"2.","t":"Pengadaan Bersama (Joint Procurement) dapat dilakukan dengan pihak-pihak (entitas):","l":340,"h":340},{"m":"•","t":"Perusahaan Induk;","l":624,"h":340},{"m":"•","t":"Instansi/ Lembaga Negara,","l":624,"h":340},{"m":"•","t":"Badan Usaha Milik Negara dan anak usahanya,","l":624,"h":340},{"t":"•","l":624,"h":340},{"m":"•","t":"Badan Usaha Milik Daerah dan anak usahanya,","l":624,"h":340},{"m":"•","t":"Pihak lain di luar Perusahaan yang memiliki perikatan hukum dalam hal melaksanakan Pengadaan Bersama (joint procurement)","l":624,"h":340},{"m":"3.","t":"Dalam proses pelaksanaan Pengadaan Bersama (joint procurement), entitas menunjuk salah satu entitas lainnya untuk bertindak sebagai pelaksana dalam melaksanakan proses pengadaan barang dan/ atau jasa. Semua pihak menyatakan tunduk terhadap ketentuan/ peraturan pengadaan barang dan/ atau jasa di Perusahaan/ entitas pelaksana pengadaan barang dan/ atau jasa yang dinyatakan dalam surat perjanjian/ kontrak.","l":340,"h":340},{"c":"[Pasal 25]"}]]}]},{"heading":"I. PENGADAAN TIDAK MENGIKAT","rows":[{"topik":"PENGADAAN TIDAK MENGIKAT","cells":[[{"t":"PENGADAAN TIDAK MENGIKAT"},{"m":"1.","t":"Pengadaan Tidak Mengikat untuk pekerjaan-pekerjaan dengan kriteria sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pengadaan tidak mengikat dapat dilaksanakan untuk semua program kerja baik Opex maupun Capex;","l":624,"h":340},{"m":"b.","t":"Anggaran belum tersedia karena RKAP masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris;","l":624,"h":340},{"m":"c.","t":"Proses pengajuan pengadaan tidak mengikat dilakukan setelah diajukannya usulan RKAP kepada Dewan Komisaris atau RUPS dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan;","l":624,"h":340},{"m":"d.","t":"Proses pengajuan pengadaan tidak mengikat diajukan oleh Unit Bisnis atau Unit Teknis kepada Unit Yang Membidangi Fungsi PBJ.","l":624,"h":340},{"m":"2.","t":"Pengadaan Tidak Mengikat dilaksanakan dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Permohonan pengadaan tidak mengikat mendapatkan konfirmasi dari unit kerja yang membidangi fungsi anggaran perusahaan bahwa program kerja yang diusulkan dalam proses pengadaan tidak mengikat telah tercatat pada usulan RKAP yang sudah diajukan untuk mendapat persetujuan anggaran pada tahun berikutnya.","l":624,"h":340},{"m":"b.","t":"Mencantumkan pengadaan tidak mengikat di dalam pengumuman Pengadaan/undangan kepada Penyedia.","l":624,"h":340},{"m":"c.","t":"Dokumen penawaran administrasi menambahkan persyaratan surat pernyataan bahwa Penyedia tidak akan mengajukan gugatan materiil maupun immateriil apabila Kontrak tidak dapat dilaksanakan.","l":624,"h":340},{"m":"d.","t":"Unit Bisnis atau Unit Teknis wajib mengajukan permohonan konfirmasi anggaran kepada Unit yang membidangi Fungsi Anggaran Perusahaan Apabila program RKAP termasuk revisi RKAP telah disetujui oleh RUPS.","l":624,"h":340},{"m":"e.","t":"Jaminan pelaksanaan diserahkan paling lambat sebelum Perjanjian ditandatangani.","l":624,"h":340},{"m":"f.","t":"Kontrak diterbitkan setelah RKAP termasuk revisi RKAP (apabila ada) mendapat persetujuan RUPS dengan nilai RKAP sesuai dengan nilai Kontrak yang telah disepakati oleh kedua belah pihak.","l":624,"h":340},{"m":"g.","t":"Apabila RKAP termasuk revisi RKAP telah mendapat persetujuan RUPS namun dengan pagu anggaran yang berbeda dengan pagu anggaran yang telah diumumkan pada saat penjelasan pekerjaan (aanwijzing), maka dapat dilakukan penjelasan pekerjaan (aanwijzing) kembali kepada peserta pengadaan/penunjukan langsung yang telah memasukkan dokumen penawaran pada proses pengadaan tidak mengikat.","l":624,"h":340},{"m":"h.","t":"Apabila program RKAP termasuk revisi RKAP tidak disetujui oleh RUPS maka pengadaan tidak mengikat dibatalkan oleh Direktur terkait.","l":624,"h":340},{"c":"[BAB IV.I]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENGADAAN TIDAK MENGIKAT"},{"m":"1.12.1.","t":"Kriteria","l":630,"h":630},{"m":"a.","t":"Pengadaan tidak mengikat dapat dilaksanakan untuk semua program kerja baik Opex maupun Capex.","l":624,"h":340},{"m":"b.","t":"Anggaran belum tersedia karena Rencana Kerja dan Anggaran Perusahaan (RKAP) masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris.","l":624,"h":340},{"m":"c.","t":"Proses Pengajuan pengadaan tidak mengikat dilakukan setelah diajukannya usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) atau revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) kepada Dewan Komisaris atau Rapat Umum Pemegang Saham (RUPS) dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan.","l":624,"h":340},{"m":"d.","t":"Proses pengajuan pengadaan tidak mengikat diajukan oleh Unit Spesifikasi Teknis (UST) kepada Unit Kerja Pengadaan.","l":624,"h":340},{"m":"1.12.2.","t":"Pelaksanaan","l":630,"h":630},{"m":"a.","t":"Permohonan pengadaan tidak mengikat mendapatkan konfirmasi dari unit kerja yang membidangi fungsi anggaran Perusahaan bahwa program kerja yang diusulkan dalam proses pengadaan tidak mengikat telah tercatat pada usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah diajukan untuk pengesahan anggaran pada tahun berikutnya.","l":624,"h":340},{"m":"b.","t":"Mencantumkan pengadaan tidak mengikat di dalam pengumuman Pengadaan/undangan kepada calon Penyedia Barang dan/atau Jasa.","l":624,"h":340},{"m":"c.","t":"Kontrak dilaksanakan setelah Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) dengan nilai Rencana Kerja dan Anggaran Perusahaan (RKAP) sesuai dengan nilai Perjanjian yang telah disepakati oleh kedua belah pihak.","l":624,"h":340},{"m":"d.","t":"Apabila Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) telah mendapat persetujuan Rapat Umum Pemegang Saham (RUPS) namun dengan pagu anggaran yang berbeda dengan pagu anggaran yang telah diumumkan pada saat penjelasan umum (aanwijzing), maka dapat dilakukan penjelasan umum (aanwijzing) kembali kepada peserta pengadaan/penunjukan langsung yang telah memasukkan dokumen penawaran pada proses pengadaan tidak mengikat.","l":624,"h":340},{"m":"e.","t":"Apabila program Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tidak disetujui oleh Rapat Umum Pemegang Saham (RUPS) maka pengadaan tidak mengikat dibatalkan oleh Direktur terkait.","l":624,"h":340},{"c":"[BAB 1 angka 1.12.0]"}],[{"t":"PENGADAAN TIDAK MENGIKAT"},{"m":"1.","t":"Kriteria","l":340,"h":340},{"m":"a.","t":"Pengadaan Tidak mengikat dapat dilaksanakan untuk semua program kerja baik Opex maupun Capex;","l":624,"h":340},{"m":"b.","t":"Anggaran belum tersedia karena Rencana Kerja dan Anggaran Perusahaan (RKAP) masih dalam proses pengesahan dan sudah diusulkan kepada Dewan Komisaris;","l":624,"h":340},{"m":"c.","t":"Proses pengajuan Pengadaan Tidak Mengikat dilakukan setelah diajukannya usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) atau Revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) kepada Dewan Komisaris atau Rapat Umum Pemegang Saham (RUPS) dan atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan;","l":624,"h":340},{"m":"d.","t":"Proses pengajuan Pengadaan Tidak Mengikat diajukan oleh Unit Pengguna (User) kepada Procurement.","l":624,"h":340},{"m":"2.","t":"Pelaksanaan","l":340,"h":340},{"m":"a.","t":"Permohonan Pengadaan Tidak Mengikat setelah mendapatkan konfirmasi dari Unit Kerja yang membidangi anggaran bahwa program kerja yang diusulkan dalam proses Pengadaan Tidak Mengikat telah tercatat pada usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) yang sudah diajukan untuk pengesahan anggaran pada tahun berikutnya;","l":624,"h":340},{"m":"b.","t":"Mencantumkan Pengadaan Tiidak Mengikat di dalam pengumuman atau undangan kepada Calon Penyedia;","l":624,"h":340},{"m":"c.","t":"Kontrak dilaksanakan setelah Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk Revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan dalam Rapat Umum Pemegang Saham (RUPS) denga nilai Rencana Kerja dan Anggaran Perusahaan (RKAP) sesuai dengan nilai kontrak yang telah disepakati oleh kedua belah pihak;","l":624,"h":340},{"m":"d.","t":"Apabila Rencana Kerja dan Anggaran Perusahaa (RKAP) termasuk Revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) mendapat persetujuan dalam Rapat Umum Pemegang Saham namun dengan Pagu Anggaran yang berbeda dengan Pagu Anggaran yang telah diumumkan pada saat penjelasan pekerjaan (aanwijzing), maka dapat dilakukan penjelasan pekerjaan (aanwijzing) kepada Calon Penyedia yang telah memasukan dokumen penawaran;","l":624,"h":340},{"m":"e.","t":"Apabila Rencana Kerja dan Anggaran Perusahaa (RKAP) termasuk Revisi Rencana Kerja dan Anggaran Perusahaan (RKAP) tidak disetujui oleh Rapat Umum Pemegang Saham (RUPS) maka Pengadaan Tidak Mengikat dibatalkan oleh Direktur Terkait.","l":624,"h":340},{"c":"[BAB V.J]"}],[{"m":"(1)","t":"Metode Pengadaan Barang dan/atau Jasa dapat diberlakukan pada saat kondisi apabila usulan Rencana Kerja dan Anggaran Perusahaan (RKAP) termasuk revisi (apabila ada) tahun yang akan datang belum mendapat persetujuan RUPS/Dewan Komisaris dan/atau kondisi lain yang menyebabkan pekerjaan belum dapat dilaksanakan;","l":340,"h":340},{"m":"(2)","t":"Proses Pengadaan pada ketentuan tidak mengikat ini hanya dilaksanakan sampai dengan proses pengumuman pemenang (pada metode Tender/Tender Terbatas) atau Berita Acara Klarifikasi & Negosiasi (pada metode Penunjukan Langsung/Pengadaan Langsung).","l":340,"h":340},{"c":"[Pasal 11]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"J. REPEAT ORDER","rows":[{"topik":"REPEAT ORDER","cells":[[{"t":"REPEAT ORDER"},{"t":"Repeat order dapat dilaksanakan kepada Penyedia dengan mempertimbangkan kebutuhan Perusahaan, dengan ketentuan sebagai berikut:"},{"m":"1.","t":"Proses pengadaan yang awalnya menggunakan metode Tender;","l":340,"h":340},{"m":"2.","t":"Evaluasi Penyedia oleh Unit Bisnis atau Unit Teknis dengan nilai baik;","l":340,"h":340},{"m":"3.","t":"Tidak ada perubahan ruang lingkup;","l":340,"h":340},{"m":"4.","t":"Harga satuan tidak lebih tinggi dari Kontrak sebelumnya kecuali diatur lain oleh peraturan perundang-undangan;","l":340,"h":340},{"m":"5.","t":"Dilaksanakan paling banyak 2 (dua) kali dalam tahun anggaran yang sama dan/atau dalam kurun waktu maksimal selama 3 (tiga) Tahun terhitung sejak pekerjaan sebelumnya;","l":340,"h":340},{"m":"6.","t":"Mendapatkan persetujuan tertulis dari Unit Bisnis atau Unit Teknis sesuai dengan kewenangannya;","l":340,"h":340},{"m":"7.","t":"Pengajuan proses dilakukan selambat-lambatnya 30 (tiga puluh) Hari Kalender sebelum berakhirnya Kontrak; dan","l":340,"h":340},{"m":"8.","t":"Dapat dilakukan negosiasi harga.","l":340,"h":340},{"c":"[BAB IV.J]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENUNJUKAN LANGSUNG"},{"m":"3.2.6.","t":"Penunjukan Langsung dengan Pembelian Berulang (Repeat Order/RO)","l":540,"h":540},{"m":"a.","t":"Ketentuan Umum Pembelian Berulang (Repeat Order/RO)","l":624,"h":340},{"m":"3.","t":"Penyedia Barang dan/atau Jasa yang dapat dilakukan Pembelian Berulang (Repeat Order/RO) adalah Penyedia Barang dan/atau Jasa yang pernah melaksanakan pekerjaan penyediaan barang dan/atau jasa yang sama di periode sebelum Pembelian Berulang (Repeat Order/RO) dikehendaki, baik di Kantor Pusat maupun di Kantor Cabang dengan kualitas kinerja yang pernah dilakukan dinilai baik, minimal B sesuai dengan penilaian Penyedia Barang dan/atau Jasa, sepanjang harga yang ditawarkan tidak merugikan dan tidak mengorbankan kualitas Barang atau/atau Jasa.","l":908,"h":340},{"m":"4.","t":"Khusus untuk Jasa Penyediaan SDM dan/atau Paket Pekerjaan, Pembelian Berulang (Repeat Order/RO) hanya dapat diberlakukan kepada Penyedia Jasa yang pernah melaksanakan Pekerjaan sebelumnya di Kantor Cabang/lokasi setempat.","l":908,"h":340},{"m":"5.","t":"Penyedia Barang dan/atau Jasa yang melaksanakan pekerjaan lebih dari 1 (satu) lokasi maka untuk dapat ditunjuk kembali (Pembelian Berulang (Repeat Order/RO)), harus memiliki nilai terhadap kualitas kinerja di seluruh lokasi kerja tersebut minimal B sesuai dengan penilaian Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"6.","t":"Pembelian Berulang (Repeat Order/RO) hanya dapat dilakukan maksimal 2 (dua) kali.","l":908,"h":340},{"m":"7.","t":"Pembelian Berulang (Repeat Order/RO) dilakukan atas persetujuan Pejabat Berwenang.","l":908,"h":340},{"m":"8.","t":"Usulan Pembelian Berulang (Repeat Order/RO) dapat diajukan bersamaan dengan pengajuan Surat Permintaan Pengadaan (SPP) atau setelah diterbitkan Surat Permintaan Pengadaan (SPP).","l":908,"h":340},{"m":"9.","t":"Pembelian Berulang (Repeat Order/RO) dapat dilakukan atas usulan Unit Spesifikasi Teknis (UST) atau Pelaksana Pengadaan.","l":908,"h":340},{"m":"10.","t":"Dalam hal Pembelian Berulang (Repeat Order/RO) diusulkan oleh Unit Spesifikasi Teknis (UST), Unit Spesifikasi Teknis (UST) mengajukan usulan tersebut bersamaan dengan pengajuan Surat Permintaan Pengadaan (SPP).","l":908,"h":340},{"m":"11.","t":"Surat Permintaan Pengadaan (SPP) sebagaimana dimaksud pada huruf g dilengkapi dengan Spesifikasi Teknis, perkiraan biaya dan hasil evaluasi terhadap kualitas Barang dan/atau Jasa yang pernah diadakan termasuk kualitas Penyedia Barang dan/atau Jasa yang dituangkan dalam Justifikasi Pembelian Berulang (Repeat Order/RO) dengan ketentuan :","l":908,"h":340},{"m":"a)","t":"Kantor Pusat : diusulkan oleh Kepala Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"b)","t":"Kantor Cabang : diusulkan oleh Unit Pengguna (User) dan disetujui oleh Kepala Unit Spesifikasi Teknis (UST).","l":1192,"h":340},{"m":"12.","t":"Apabila diperlukan, dalam menyusun Justiifikasi Pembelian Berulang (Repeat Order/RO), Unit Spesifikasi Teknis (UST) dapat melakukan kordinasi dengan Unit Pengguna (User) untuk meminta masukan mengenai kondisi dan kualitas Barang dan/atau Jasa termasuk dan kinerja Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"13.","t":"Justifikasi untuk Pembelian Berulang (Repeat Order/RO) sekurang-kurangnya memuat hal hal sebagai berikut:","l":908,"h":340},{"m":"a)","t":"Latar Belakang:","l":1192,"h":340},{"t":"Berisi uraian tentang alasan-alasan/pertimbangan dilakukannya Pembelian Berulang (Repeat Order/RO).","l":1192},{"m":"b)","t":"Aspek Legal:","l":1192,"h":340},{"t":"Berisi uraian tentang aturan yang menjadi dasar pelaksanaan Pembelian Berulang (Repeat Order/RO).","l":1192},{"m":"c)","t":"Aspek Operasional:","l":1192,"h":340},{"t":"Berisi uraian tentang kebutuhan operasional, analisis dan konsekuensi jika Barang dan/atau Jasa tersebut tidak terpenuhi tepat waktu","l":1192},{"m":"d)","t":"Aspek Administrasi:","l":1192,"h":340},{"t":"Berisi uraian tentang syarat-syarat administrasi yang telah terpenuhi sesuai dengan syarat dan ketentuan yang ditetapkan oleh Perusahaan","l":1192},{"m":"e)","t":"Aspek Teknis:","l":1192,"h":340},{"t":"Berisi uraian tentang hasil evaluasi atas kualitas Barang dan/atau Jasa sebelumnya dan evaluasi atas kinerja/kredibilitas penyedia barang sebelumnya","l":1192},{"m":"f)","t":"Aspek Harga:","l":1192,"h":340},{"t":"Berisi uraian tentang hasil evaluasi atas harga Barang dan/atau Jasa sebelumnya dan harga saat ini dan perbandingan dengan Penyedia Barang dan/atau Jasa lainnya.","l":1192},{"m":"14.","t":"Setelah menerima Surat Permintaan Pengadaan (SPP) dari Unit Spesifikasi Teknis (UST) yang sudah dilengkapi dengan usulan Pembelian Berulang (Repeat Order/RO) Pelaksana Pengadaan melakukan proses persetujuan atas Usulan Pembelian Berulang (Repeat Order/RO) ke Pejabat Berwenang.","l":908,"h":340},{"m":"15.","t":"Dalam hal Pembelian Berulang (Repeat Order/RO) diusulkan oleh Pelaksana Pengadaan, setelah menerima Surat Permintaan Pengadaan (SPP) Pelaksana Pengadaan bersama-sama dengan Unit Spesifikasi Teknis (UST) melakukan evaluasi terhadap kualitas Barang dan/atau Jasa yang pernah diadakan termasuk kualitas Penyedia Barang dan/atau Jasa yang dituangkan dalam Justifikasi Pembelian Berulang (Repeat Order/RO) dan ditandatangani oleh Pejabat Berwenang.","l":908,"h":340},{"m":"16.","t":"Apabila diperlukan, dalam melakukan evaluasi, Pelaksana Pengadaan dapat melakukan kordinasi dengan Unit Pengguna (User) untuk meminta masukan mengenai kondisi dan kualitas Barang dan/atau Jasa termasuk kinerja Penyedia Barang dan/atau Jasanya.","l":908,"h":340},{"m":"17.","t":"Berdasarkan Justifikasi tersebut, Pelaksana Pengadaan mengajukan usulan Pembelian Berulang (Repeat Order/RO) kepada Pejabat Berwenang untuk mendapatkan persetujuan.","l":908,"h":340},{"m":"18.","t":"Pelaksana Pengadaan yang berwenang melakukan Pembelian Berulang (Repeat Order/RO):","l":908,"h":340},{"m":"a)","t":"Kantor Pusat:","l":1192,"h":340},{"m":"1)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Unit Pelaksana Pengadaan.","l":1476,"h":340},{"m":"2)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Panitia Pengadaan.","l":1476,"h":340},{"m":"b)","t":"Kantor Cabang","l":1192,"h":340},{"m":"1)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. batas kewenangannya masing-masing dilakukan oleh Unit Pelaksana Pengadaan Kantor Cabang.","l":1476,"h":340},{"m":"2)","t":"Nilai Pengadaan di atas batas kewenangannya sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Unit Kerja Pengadaan Kantor Pusat.","l":1476,"h":340},{"m":"3)","t":"Nilai Pengadaan di atas Rp 1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Panitia Pengadaan Kantor Pusat.","l":1476,"h":340},{"m":"4)","t":"Nilai Pengadaan di atas batas kewenangan Kantor Cabang setelah dilimpahkan oleh Kantor Pusat dilaksanakan oleh Panitia Pengadaan Kantor Cabang.","l":1476,"h":340},{"m":"19.","t":"Seluruh dokumentasi Pembelian Berulang (Repeat Order/RO) menjadi tanggung jawab Pelaksana Pengadaan.","l":908,"h":340},{"m":"b.","t":"Tata Cara Pembelian Berulang (Repeat Order/RO)","l":624,"h":340},{"m":"1.","t":"Setelah menerima Surat Permintaan Pengadaan (SPP) dari Unit Spesifikasi Teknis (UST), Pelaksana Pengadaan mengajukan permohonan persetujuan Pembelian Berulang (Repeat Order/RO) kepada Pejabat Berwenang selambat-lambatnya 2 (dua) hari kerja sejak diterimanya Surat Permintaan Pengadaan (SPP).","l":908,"h":340},{"m":"2.","t":"Setelah mendapat persetujuan dari Pejabat Berwenang, Pelaksana Pengadaan menyiapkan Harga Perkiraan Sendiri (HPS) dan dokumen lainnya yang diperlukan, untuk selanjutnya membuat surat permintaan penawaran kepada Penyedia Barang dan/atau Jasa sebelumnya.","l":908,"h":340},{"m":"3.","t":"Surat permintaan penawaran Pembelian Berulang (Repeat Order/RO) ditandatangani oleh:","l":908,"h":340},{"m":"a)","t":"Kantor Pusat:","l":1192,"h":340},{"m":"1)","t":"Nilai Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Kerja Pengadaan.","l":1476,"h":340},{"m":"2)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Ketua Panitia Pengadaan.","l":1476,"h":340},{"m":"b)","t":"Kantor Cabang","l":1192,"h":340},{"m":"1)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. batas kewenangannya masing-masing dilakukan oleh Pejabat Berwenang Kantor Cabang.","l":1476,"h":340},{"m":"2)","t":"Nilai Pengadaan di atas batas kewenangannya sampai dengan Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Kerja Pengadaan Kantor Pusat.","l":1476,"h":340},{"m":"3)","t":"Nilai Pengadaan di atas Rp 1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Ketua Panitia Pengadaan Kantor Pusat.","l":1476,"h":340},{"m":"4)","t":"Nilai Pengadaan di atas batas kewenangan Kantor Cabang setelah dilimpahkan oleh Kantor Pusat dilakukan oleh Pejabat Berwenang Kantor Cabang.","l":1476,"h":340},{"m":"4.","t":"Surat permintaan penawaran harga disampaikan sekurang-kurangnya memuat:","l":908,"h":340},{"m":"a)","t":"Spesifikasi Barang dan/atau Jasa.","l":1192,"h":340},{"m":"b)","t":"Jumlah Barang dan/atau Jasa.","l":1192,"h":340},{"m":"c)","t":"Harga satuan dan harga total.","l":1192,"h":340},{"m":"d)","t":"Lokasi pekerjaan/pengiriman.","l":1192,"h":340},{"m":"e)","t":"Jangka waktu pelaksanaan pekerjaan/pengiriman.","l":1192,"h":340},{"m":"f)","t":"Apabila diperlukan, Pelaksana Pengadaan dapat memberikan penjelasan mengenai Spesifikasi Teknis Barang dan/atau Jasa yang akan diadakan.","l":1192,"h":340},{"m":"5.","t":"Setelah menerima penawaran harga, Pelaksana Pengadaan melakukan evaluasi/ klarifikasi terhadap spesifikasi barang dan harga yang ditawarkan.","l":908,"h":340},{"m":"c.","t":"Negosiasi Dalam Pembelian Berulang (Repeat Order/RO)","l":624,"h":340},{"m":"1.","t":"Setelah evaluasi/klarifikasi dianggap cukup, Pelaksana Pengadaan melakukan Negosiasi harga.","l":908,"h":340},{"m":"2.","t":"Negosiasi harga dilaksanakan selambat-lambatnya 2 (dua) hari kerja setelah dokumen surat penawaran harga diterima oleh Pelaksana Pengadaan.","l":908,"h":340},{"m":"3.","t":"Dalam melakukan Negosiasi harga, Pelaksana Pengadaan memperhatikan Harga Perkiraan Sendiri (HPS) dan/atau pagu anggaran yang tersedia.","l":908,"h":340},{"m":"4.","t":"Harga hasil Negosiasi tidak boleh melebihi pagu anggaran.","l":908,"h":340},{"m":"5.","t":"Apabila harga hasil Negosiasi masih di atas pagu anggaran yang tersedia, maka Pelaksana Pengadaan menyatakan Pembelian Berulang (Repeat Order/RO) Gagal.","l":908,"h":340},{"m":"6.","t":"Apabila terjadi Pembelian Berulang (Repeat Order/RO) Gagal karena hasil Negosiasi harga masih di atas pagu anggaran, maka untuk meneruskan proses, Unit Spesifikasi Teknis (UST) akan melakukan koreksi Surat Permintaan Pengadaan (SPP).","l":908,"h":340},{"m":"7.","t":"Setelah Unit Spesifikasi Teknis (UST) melakukan koreksi Surat Permintaan Pengadaan (SPP), Pelaksana Pengadaan melakukan Negosiasi Ulang kepada Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"8.","t":"Hasil Negosiasi dituangkan dalam berita acara yang ditandatangani oleh Pelaksana Pengadaan dan pihak Penyedia Barang dan/atau Jasa.","l":908,"h":340},{"m":"d.","t":"Hasil Pembelian Berulang (Repeat Order/RO)","l":624,"h":340},{"m":"1.","t":"Apabila hasil Negosiasi tidak melebihi pagu anggaran, Pelaksana Pengadaan mengajukan usulan persetujuan hasil Negosiasi secara tertulis kepada Pejabat Berwenang selambat-lambatnya 2 (dua) hari kerja sejak dokumen Berita Acara Klarifikasi dan Negosiasi diterima oleh Pelaksana Pengadaan.","l":908,"h":340},{"m":"2.","t":"Pejabat Berwenang dalam menetapkan/menyetujui Hasil Pembelian Berulang (Repeat Order/RO):","l":908,"h":340},{"m":"a)","t":"Kantor Pusat:","l":1192,"h":340},{"m":"1)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) dilakukan oleh Kepala Unit Pengadaan.","l":1476,"h":340},{"m":"2)","t":"Nilai Pengadaan di atas Rp1.500.000.000,- (satu miliar lima ratus juta rupiah) s.d. Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST).","l":1476,"h":340},{"m":"3)","t":"Nilai Pengadaan di atas Rp50.000.000.000,- (lima puluh miliar rupiah) dilakukan oleh Direktur Unit Spesifikasi Teknis (UST) dan Direktur Utama.","l":1476,"h":340},{"m":"b)","t":"Kantor Cabang","l":1192,"h":340},{"m":"1)","t":"Nilai Pengadaan di atas Rp50.000.000 (lima puluh juta rupiah) s.d. batas kewenangannya masing-masing dilakukan oleh Pejabat Berwenang Kantor Cabang.","l":1476,"h":340},{"m":"2)","t":"Nilai Pengadaan di dak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"K. PEMBATALAN PEMILIHAN PENYEDIA","rows":[{"topik":"PEMBATALAN PEMILIHAN PENYEDIA","cells":[[{"t":"PEMBATALAN PEMILIHAN PENYEDIA"},{"m":"1.","t":"Pemilihan Penyedia melalui metode Tender/Seleksi Terbatas, Tender/Seleksi Umum atau Penunjukan Langsung dapat dinyatakan batal apabila memenuhi salah satu kondisi sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Adanya pernyataan PBJ batal secara tertulis dari Unit Bisnis atau Unit Teknis terhadap indikasi penyimpangan dan/atau kecurangan;","l":624,"h":340},{"m":"b.","t":"Adanya pernyataan PBJ batal secara tertulis dari Unit Bisnis atau Unit Teknis dengan justifikasi teknis;","l":624,"h":340},{"m":"c.","t":"Terjadi perubahan KAK/TOR/RKST dan mengakibatkan perubahan kebutuhan Barang dan/atau Jasa;","l":624,"h":340},{"m":"d.","t":"Adanya penetapan pengadilan yang mengakibatkan batalnya proses pemilihan Penyedia;","l":624,"h":340},{"m":"e.","t":"Terbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) dan/atau penipuan;","l":624,"h":340},{"m":"f.","t":"Terjadi Keadaan Kahar (Force Majeure);","l":624,"h":340},{"m":"g.","t":"Program usulan RKAP atau revisi usulan tidak disetujui RUPS/Dewan Komisaris pada proses PBJ Tidak Mengikat (Tender/Seleksi Terbatas, Tender/Seleksi Umum dan Penunjukan Langsung);","l":624,"h":340},{"m":"h.","t":"Terjadi perubahan nilai HPS/RAB setelah total HPS/RAB diumumkan;","l":624,"h":340},{"m":"i.","t":"Terbukti adanya benturan kepentingan (conflict of interest).","l":624,"h":340},{"m":"2.","t":"Pengadaan Langsung dinyatakan batal apabila ada pernyataan secara tertulis dari Unit Bisnis atau Unit Teknis berdasarkan justifikasi teknis yang dapat dipertanggungjawabkan.","l":340,"h":340},{"m":"3.","t":"Pada Metode Penunjukan Langsung, Tender/Seleksi Terbatas dan Tender/Seleksi Umum, Unit Yang Membidangi Fungsi PBJ menyampaikan kepada peserta dalam proses pemilihan bahwa pelaksanaan PBJ dinyatakan batal.","l":340,"h":340},{"c":"[BAB IV.K]"}],[{"m":"1.","t":"Tender/ seleksi dinyatakan batal apabila memenuhi salah satu kondisi sebagai berikut:","l":340,"h":340},{"m":"a.","t":"ada pernyataan secara tertulis dari Vice President (VP) procurement atas indikasi penyimpangan dan/ atau terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) dan/ atau perbuatan melawan hukum dalam proses tender;","l":624,"h":340},{"m":"b.","t":"ada pernyataan secara tertulis dari Vice President (VP) unit teknis berdasarkan justifikasi teknis yang dapat dipertanggungjawabkan, selambat-lambatnya 1 (satu) hari sebelum pemasukan penawaran berakhir;","l":624,"h":340},{"m":"c.","t":"terjadi perubahan rencana kerja dan mengakibatkan perubahan kebutuhan barang dan/ atau jasa;","l":624,"h":340},{"m":"d.","t":"adanya penetapan pengadilan yang mengakibatkan batalnya tender/ seleksi;","l":624,"h":340},{"m":"e.","t":"terjadi keadaan kahar (force majeure);","l":624,"h":340},{"m":"f.","t":"terbukti adanya benturan kepentingan (conflict of interest);","l":624,"h":340},{"m":"2.","t":"Apabila Tender dinyatakan batal, maka Unit Teknis melakukan evaluasi terhadap dokumen teknis.","l":340,"h":340},{"c":"[Pasal 25]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Pelelangan/ Kontes dinyatakan batal apabila memenuhi salah satu kondisi sebagai berikut:","l":340,"h":340},{"m":"a.","t":"ada pernyataan secara tertulis dari Pejabat Tertinggi atau 1 (satu) tingkat di bawah Direksi yang membidangi fungsi Procurement atas indikasi penyimpangan dan/ atau terjadi tindak Kolusi, Korupsi, Nepotisme (KKN) dan/ atau perbuatan melawan hukum dalam proses tender;","l":624,"h":340},{"m":"b.","t":"ada pernyataan secara tertulis dari Pejabat Tertinggi atau 1 (satu) tingkat di bawah Direksi Unit Teknis berdasarkan justifikasi teknis yang dapat dipertanggungjawabkan;","l":624,"h":340},{"m":"c.","t":"terjadi perubahan rencana kerja dan mengakibatkan perubahan kebutuhan barang dan/ atau jasa;","l":624,"h":340},{"m":"d.","t":"adanya penetapan pengadilan yang mengakibatkan batalnya pelelangan/ kontes;","l":624,"h":340},{"m":"e.","t":"terjadi keadaan kahar (force majeure);","l":624,"h":340},{"m":"f.","t":"terbukti adanya benturan kepentingan (conflict of interest);","l":624,"h":340},{"m":"2.","t":"Apabila pelelangan/ kontes dinyatakan batal, maka Unit Teknis melakukan evaluasi terhadap dokumen teknis.","l":340,"h":340},{"c":"[Pasal 35]"}]]}]},{"heading":"L. PBJ GAGAL","rows":[{"topik":"PBJ GAGAL","cells":[[{"t":"PBJ GAGAL"},{"m":"1.","t":"PBJ dinyatakan gagal apabila memenuhi salah satu kondisi sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Tidak ada Peserta PBJ yang lulus evaluasi penawaran;","l":624,"h":340},{"m":"b.","t":"Tidak ada Peserta PBJ yang menyampaikan dokumen penawaran setelah ada pemberian waktu perpanjangan;","l":624,"h":340},{"m":"c.","t":"Ditemukan kesalahan dalam Dokumen Pemilihan atau tidak sesuai dengan ketentuan;","l":624,"h":340},{"m":"d.","t":"Terjadi benturan kepentingan (conflict of interest);","l":624,"h":340},{"m":"e.","t":"Seluruh peserta terindikasi korupsi, kolusi, dan/atau nepotisme;","l":624,"h":340},{"m":"f.","t":"Seluruh peserta terindikasi melakukan persekongkolan/persaingan usaha tidak sehat;","l":624,"h":340},{"m":"g.","t":"Negosiasi biaya pada PBJ tidak tercapai;","l":624,"h":340},{"m":"h.","t":"Sanggahan Penyedia dinyatakan benar;","l":624,"h":340},{"m":"i.","t":"Seluruh harga penawaran atau seluruh harga penawaran terkoreksi melebihi nilai HPS/RAB;","l":624,"h":340},{"m":"j.","t":"Semua Peserta PBJ yang ditetapkan sebagai pemenang mengundurkan diri atau tidak bersedia untuk ditunjuk sebagai pelaksana pekerjaan; atau","l":624,"h":340},{"m":"k.","t":"Seluruh harga penawaran atau seluruh harga penawaran terkoreksi melebihi nilai pagu anggaran.","l":624,"h":340},{"m":"2.","t":"PBJ dinyatakan gagal oleh pimpinan Unit Yang Membidangi Fungsi PBJ, kecuali untuk Pengadaan Langsung dinyatakan oleh pimpinan Unit Bisnis atau Unit Teknis.","l":340,"h":340},{"m":"3.","t":"Tindak lanjut PBJ gagal dapat dilakukan dengan cara sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Evaluasi ulang;","l":624,"h":340},{"m":"b.","t":"Penyampaian penawaran ulang;","l":624,"h":340},{"m":"c.","t":"Tender/Seleksi Terbatas atau Tender/Seleksi Umum ulang; atau","l":624,"h":340},{"m":"d.","t":"Penunjukan Langsung apabila dalam Tender/Seleksi Terbatas atau Tender/Seleksi Umum ulang gagal.","l":624,"h":340},{"m":"4.","t":"Evaluasi ulang sebagaimana dimaksud pada poin 3 (tiga) huruf a, dilakukan dalam hal ditemukan kesalahan evaluasi penawaran.","l":340,"h":340},{"m":"5.","t":"Penyampaian penawaran ulang sebagaimana dimaksud pada poin 3 (tiga) huruf b, dilakukan dalam hal PBJ gagal sebagaimana dimaksud pada poin 1 (satu) huruf b.","l":340,"h":340},{"m":"6.","t":"Tender/Seleksi Terbatas atau Tender/Seleksi Umum ulang sebagaimana dimaksud pada poin 3 (tiga) huruf c, dilakukan untuk PBJ gagal sebagaimana dimaksud pada poin 1 (satu) huruf c sampai dengan huruf k.","l":340,"h":340},{"m":"7.","t":"Perusahaan tidak memberikan ganti rugi kepada Peserta PBJ yang mengikuti Tender/Seleksi Terbatas atau Tender/Seleksi Umum apabila dinyatakan gagal.","l":340,"h":340},{"c":"[BAB IV.L]"}],[{"m":"1.","t":"Tender/ seleksi dinyatakan gagal apabila memenuhi salah satu kondisi sebagai berikut :","l":340,"h":340},{"m":"a.","t":"tidak ada peserta pengadaan barang dan/ atau jasa yang melakukan pendaftaran;","l":624,"h":340},{"m":"b.","t":"tidak ada peserta pengadaan barang dan/ atau jasa yang memasukkan penawaran;","l":624,"h":340},{"m":"c.","t":"tidak ada peserta pengadaan barang dan/ atau jasa yang lulus evaluasi administrasi atau evaluasi teknis;","l":624,"h":340},{"m":"d.","t":"berdasarkan evaluasi harga, tidak ada penawaran yang memenuhi kewajaran harga;","l":624,"h":340},{"m":"e.","t":"pelaksanaan tender tidak sesuai dengan ketentuan;","l":624,"h":340},{"m":"f.","t":"terjadi benturan kepentingan (conflict of interest);","l":624,"h":340},{"m":"g.","t":"sanggahan atau sanggah banding penyedia dinyatakan benar;","l":624,"h":340},{"m":"h.","t":"seluruh harga penawaran melebihi nilai HPS;","l":624,"h":340},{"m":"i.","t":"terbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN), yang melibatkan karyawan Perusahaan dan/ atau peserta pengadaan barang dan/ atau jasa yang terlibat dalam proses pengadaan barang dan/ atau jasa.","l":624,"h":340},{"m":"2.","t":"Tender/ Seleksi dinyatakan gagal oleh Pejabat satu tingkat dibawah Direktur yang membidangi fungsi pengadaan.","l":340,"h":340},{"m":"3.","t":"Tindak lanjut tender/ seleksi gagal dapat dilakukan dengan cara sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Tender/ seleksi ulang atau;","l":624,"h":340},{"m":"b.","t":"Penunjukan langsung apabila dalam tender/ seleksi ulang gagal.","l":624,"h":340},{"m":"4.","t":"Perusahaan tidak memberikan ganti rugi kepada peserta yang mengikuti tender/ seleksi apabila tender/ seleksi dinyatakan gagal.","l":340,"h":340},{"c":"[Pasal 24]"}],[{"t":"PEMILIHAN LANGSUNG"},{"m":"3.3.13.","t":"Pemilihan Langsung Ulang","l":630,"h":630},{"m":"a.","t":"Pemilihan Langsung ulang dilakukan terhadap Pemilihan Langsung yang dinyatakan gagal yang disebabkan oleh salah satu hal sebagai berikut","l":624,"h":340},{"m":"1.","t":"Jumlah Peserta yang mendaftar kurang dari 3 (tiga) Peserta;","l":908,"h":340},{"m":"2.","t":"Peserta yang hadir pada saat penjelasan umum (aanwijzing) kurang dari 2 (dua) Peserta;","l":908,"h":340},{"m":"3.","t":"Peserta yang memasukkan Dokumen Penawaran dan/atau memenuhi syarat administrasi dan teknis kurang dari 2 (dua) Peserta; dan/atau","l":908,"h":340},{"m":"4.","t":"Harga hasil Negosiasi melebihi total pagu anggaran yang tercantum dalam Surat Permintaan Pengadaan (SPP).","l":908,"h":340},{"m":"b.","t":"Pemilihan Langsung ulang dilaksanakan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Sebelum Pemilihan Langsung ulang dilaksanakan, Pelaksana Pengadaan memberitahukan kepada para Peserta bahwa Pemilihan Langsung gagal dan akan dilakukan Pemilihan Langsung ulang.","l":908,"h":340},{"m":"2.","t":"Pemilihan Langsung gagal sebagaimana dimaksud pada huruf a angka 2 s.d. 4 dituangkan dalam Berita Acara.","l":908,"h":340},{"m":"3.","t":"Proses dan tahapan kegiatan Pemilihan Langsung ulang sama dengan proses kegiatan Pemilihan Langsung.","l":908,"h":340},{"m":"4.","t":"Dalam Pemilihan Langsung ulang, Pelaksana dapat mengundang Peserta baru atau Peserta yang tidak memenuhi syarat administrasi atau teknis pada Pemilihan Langsung pertama.","l":908,"h":340},{"m":"5.","t":"Pemilihan Langsung ulang memungkinkan untuk adanya perubahan Spesifikasi Teknis dan/atau Harga Perkiraan Sendiri (HPS)/anggaran.","l":908,"h":340},{"m":"6.","t":"Perubahan Harga Perkiraan Sendiri (HPS) dapat dilakukan apabila terjadi penambahan pagu anggaran untuk spesifikasi yang sama.","l":908,"h":340},{"m":"7.","t":"Dalam Pemilihan Langsung ulang, Unit Spesifikasi Teknis (UST) dapat melakukan perubahan Spesifikasi Teknis dengan pagu anggaran tetap, atau apabila Spesifikasi Teknis tidak dapat diubah, Unit Spesifikasi Teknis (UST) melakukan usulan perubahan anggaran dan menerbitkan Surat Permintaan Pengadaan (SPP) baru.","l":908,"h":340},{"m":"8.","t":"Perubahan Spesifikasi Teknis dan/atau Surat Permintaan Pengadaan (SPP) tidak diperbolehkan ketika proses Pemilihan Langsung sedang berlangsung.","l":908,"h":340},{"m":"9.","t":"Setelah proses Pemilihan Langsung ulang, tetapi hal-hal sebagaimana dimaksud pada huruf a terjadi, Pelaksana Pengadaan membatalkan pengadaan dan menyampaikan laporan tertulis kepada Pejabat Berwenang dan mengembalikan Surat Permintaan Pengadaan (SPP) kepada Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"c.","t":"Apabila terjadi Pemilihan Langsung ulang gagal, maka Pelaksana Pengadaan menyampaikan laporan dan meminta persetujuan kepada Pejabat Berwenang untuk melanjutkan proses Pemilihan Langsung terhadap Peserta yang ada.","l":624,"h":340},{"m":"d.","t":"Apabila dalam Pemilihan Langsung ulang tidak ada Peserta yang mendaftar atau tidak ada Peserta yang memasukkan Dokumen Penawaran, maka Unit Spesifikasi Teknis (UST) dapat mengajukan Penunjukan Langsung kepada perusahaan lain yang dianggap mampu melaksanakan pekerjaan.","l":624,"h":340},{"c":"[BAB 3 angka 3.3.13]"},{"t":"PELELANGAN"},{"m":"3.4.15.","t":"Pelelangan Ulang","l":630,"h":630},{"m":"a.","t":"Pelelangan ulang dilakukan terhadap Pelelangan yang dinyatakan gagal yang disebabkan oleh salah satu hal sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Jumlah Peserta yang mendaftar kurang dari 5 (lima) Peserta;","l":908,"h":340},{"m":"2.","t":"Peserta yang hadir dalam penjelasan umum (aanwijzing) kurang dari 3 (tiga) Peserta;","l":908,"h":340},{"m":"3.","t":"Peserta yang memasukkan penawaran dan memenuhi syarat administrasi dan teknis kurang dari 3 (tiga) Peserta;","l":908,"h":340},{"m":"4.","t":"Harga hasil Negosiasi melebihi total Pagu Anggaran yang tercantum dalam Surat Permintaan Pengadaan (SPP); atau","l":908,"h":340},{"m":"5.","t":"Sanggahan dari Peserta Pelelangan ternyata terbukti benar.","l":908,"h":340},{"m":"b.","t":"Pelelangan ulang dilaksanakan dengan ketentuan sebagai berikut:","l":624,"h":340},{"m":"1.","t":"Sebelum Pelelangan ulang dilaksanakan, Panitia Pengadaan memberitaukan kepada para Peserta bahwa Pelelangan gagal dan akan dilakukan Pelelangan ulang.","l":908,"h":340},{"m":"2.","t":"Pelelangan gagal sebagaimana dimaksud pada huruf a angka 2 s.d. 5 dituangkan dalam Berita Acara.","l":908,"h":340},{"m":"3.","t":"Proses dan tahapan kegiatan Pelelangan ulang sama dengan proses kegiatan Pelelangan.","l":908,"h":340},{"m":"4.","t":"Dalam Pelelangan ulang, Panitia dapat mengundang Peserta baru atau Peserta yang tidak memenuhi syarat administrasi atau teknis pada Pelelangan pertama.","l":908,"h":340},{"m":"5.","t":"Pelelangan ulang memungkinkan untuk adanya perubahan Spesifikasi Teknis dan/atau Harga Perkiraan Sendiri (HPS)/anggaran.","l":908,"h":340},{"m":"6.","t":"Perubahan Spesifikasi Teknis dapat dilakukan apabila Spesifikasi Teknis yang dibutuhkan ternyata harganya diatas anggaran dan tidak dimungkinkan untuk dilakukan penambahan anggaran.","l":908,"h":340},{"m":"7.","t":"Perubahan Harga Perkiraan Sendiri (HPS) dapat dilakukan apabila terjadi penambahan pagu anggaran untuk spesifikasi yang sama.","l":908,"h":340},{"m":"8.","t":"Perubahan pagu anggaran karena perubahan Spesifikasi Teknis tidak diperkenankan dalam Pelelangan ulang.","l":908,"h":340},{"m":"9.","t":"Dalam Pelelangan ulang, Unit Spesifikasi Teknis (UST) dapat melakukan perubahan Spesifikasi Teknis dengan pagu anggaran tetap, atau apabila Spesifikasi Teknis tidak dapat diubah, Unit Spesifikasi Teknis (UST) melakukan usulan perubahan anggaran dan menerbitkan Surat Permintaan Pengadaan (SPP) baru.","l":908,"h":340},{"m":"10.","t":"Perubahan Spesifikasi Teknis dan/atau Surat Permintaan Pengadaan (SPP) tidak diperbolehkan ketika proses Pelelangan sedang berlangsung.","l":908,"h":340},{"m":"11.","t":"Setelah proses Pelelangan ulang tetapi harga yang dajukan oleh Peserta masih berada di atas pagu anggaran yang tersedia, Panitia Pengadaan membatalkan pengadaan dan menyampaikan laporan tertulis kepada Pejabat Berwenang dan mengembalikan Surat Permintaan Pengadaan (SPP) kepada Unit Spesifikasi Teknis (UST).","l":908,"h":340},{"m":"12.","t":"Apabila dalam Pelelangan ulang tidak ada Peserta yang mendaftar atau peserta yang mendaftar tidak memenuhi syarat baik administrasi maupun teknis atau tidak ada Peserta yang memasukkan Dokumen Penawaran, maka Unit Spesifikasi Teknis (UST) dapat mengajukan Penunjukan Langsung kepada perusahaan lain yang dianggap mampu melaksanakan Pekerjaan.","l":908,"h":340},{"t":"Apabila terjadi Pelelangan ulang gagal, maka Panitia Pengadaan menyampaikan laporan dan meminta persetujuan kepada Pejabat Berwenang untuk melanjutkan proses Pelelangan terhadap Peserta yang ada.","l":908},{"c":"[BAB 3 angka 3.4.15]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Pelelangan/ kontes dinyatakan gagal apabila memenuhi salah satu kondisi sebagai berikut :","l":340,"h":340},{"m":"a.","t":"tidak ada peserta pengadaan barang dan/ atau jasa yang melakukan pendaftaran;","l":624,"h":340},{"m":"b.","t":"tidak ada peserta pengadaan barang dan/ atau jasa yang memasukkan penawaran;","l":624,"h":340},{"m":"c.","t":"tidak ada peserta pengadaan barang dan/ atau jasa yang lulus evaluasi administrasi atau evaluasi teknis;","l":624,"h":340},{"m":"d.","t":"berdasarkan evaluasi harga, tidak ada penawaran yang memenuhi kewajaran harga;","l":624,"h":340},{"m":"e.","t":"pelaksanaan pelelangan/ kontes tidak sesuai dengan ketentuan yang berlaku;","l":624,"h":340},{"m":"f.","t":"terjadi benturan kepentingan (conflict of interest);","l":624,"h":340},{"m":"g.","t":"sanggahan atau sanggah banding Penyedia Barang dan/ atau Jasa dinyatakan benar;","l":624,"h":340},{"m":"h.","t":"seluruh harga penawaran melebihi nilai Harga Perkiraan Sendiri (HPS);","l":624,"h":340},{"m":"i.","t":"terbukti telah terjadi tindak Kolusi, Korupsi, Nepotisme (KKN), yang melibatkan karyawan Perusahaan dan/ atau peserta pengadaan barang dan/ atau jasa yang terlibat dalam proses pengadaan barang dan/ atau jasa.","l":624,"h":340},{"m":"2.","t":"Pelelangan/ kontes dinyatakan gagal oleh Pejabat satu tingkat dibawah Direktur yang membidangi fungsi pengadaan.","l":340,"h":340},{"m":"3.","t":"Tindak lanjut pelelangan/ kontes gagal dapat dilakukan dengan cara sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Pelelangan/ kontes ulang atau;","l":624,"h":340},{"m":"b.","t":"Penunjukan langsung apabila dalam pelelangan/ kontes ulang gagal.","l":624,"h":340},{"m":"4.","t":"Perusahaan tidak memberikan ganti rugi kepada peserta yang mengikuti pelelangan/ kontes apabila pelelangan/ kontes dinyatakan gagal.","l":340,"h":340},{"c":"[Pasal 34]"}]]}]},{"heading":"M. PBJ KONDISI KHUSUS","rows":[{"topik":"PBJ KONDISI KHUSUS","cells":[[{"t":"PBJ KONDISI KHUSUS"},{"m":"1.","t":"Pengadaan Barang dan/atau Jasa kondisi khusus adalah Pengadaan Barang dan/atau Jasa yang tidak termasuk dalam perencanaan pengadaan sebagaimana diatur dalam pasal 6 ayat (2).","l":340,"h":340},{"m":"2.","t":"Pelaksanaan Pengadaan Barang dan/atau Jasa sebagaimana ayat (1) pada pasal ini harus terlebih dahulu diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis yang melakukan inisiatif dan/atau memahami inisiatif pengadaan untuk dimintakan persetujuan kepada Direksi dengan tetap memperhatikan ketentuan yang tercantum dalam anggaran dasar dan/atau ketentuan lainnya yang berlaku.","l":340,"h":340},{"m":"3.","t":"Seluruh proses administrasi Pengadaan Barang dan/atau Jasa kondisi khusus disetujui dan/atau ditandatangani oleh Direktur yang membidangi Unit Pemrakarsa dan/atau Unit Teknis yang melakukan inisiatif dan/atau memahami inisiatif pengadaan sebagaimana dimaksud dalam ayat (2) tanpa memperhatikan batasan kewenangan sebagaimana diatur pada Lampiran I Peraturan Direksi ini.","l":340,"h":340},{"m":"4.","t":"Setelah persetujuan Pelaksanaan Pengadaan Barang dan/atau Jasa sebagaimana ayat (2) pasal ini didapatkan, selanjutnya pelaksanaan implementasi pengadaan Barang dan/atau Jasa tetap mengacu pada tata cara implementasi pengadaan Barang dan/atau Jasa pada Peraturan Direksi ini serta memperhatikan Prinsip dan Etika Pengadaan Barang dan/atau Jasa serta ketentuan Anggaran Dasar Perusahaan.","l":340,"h":340},{"c":"[BAB IV.M]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"N. PENUNJUKAN LANGSUNG KEADAAN MENDESAK","rows":[{"topik":"PENUNJUKAN LANGSUNG KEADAAN MENDESAK","cells":[[{"t":"PENUNJUKAN LANGSUNG KEADAAN MENDESAK"},{"m":"1.","t":"Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak dilakukan antara lain untuk pekerjaan yang memenuhi namun tidak terbatas pada kriteria berikut:","l":340,"h":340},{"m":"a.","t":"Kebutuhan atas Barang dan/atau Jasa tersebut merupakan aset kritikal (business critical asset) yang kegagalan atau ketiadaannya akan mengakibatkan terhentinya secara total atau sebagian besar operasional bisnis utama Perusahaan;","l":624,"h":340},{"m":"b.","t":"Barang dan/atau Jasa tersebut hanya dapat dipenuhi oleh satu penyedia tertentu dikarenakan keunikan teknis, perlindungan Hak Kekayaan Intelektual (HKI), kepemilikan paten, atau kebutuhan kompatibilitas mutlak dengan sistem existing yang tidak memungkinkan untuk disediakan oleh penyedia lain;","l":624,"h":340},{"m":"c.","t":"Pengadaan memiliki potensi efisiensi dan penghematan biaya yang nyata, terukur, dan substantif jika dilakukan melalui penyedia tertentu, dan proses tender diperkirakan akan menghilangkan peluang efisiensi tersebut.","l":624,"h":340},{"m":"2.","t":"Proses pengajuan Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis kepada Unit yang Membidangi Fungsi Pengadaan dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Unit Pemrakarsa dan/atau Unit Teknis melampirkan Dokumen Teknis dan form/surat/dokumen pengajuan Penunjukan Langsung Keadaan Mendesak yang mencakup namun tidak terbatas pada:","l":624,"h":340},{"m":"1)","t":"Detail kebutuhan Barang dan/atau Jasa, serta alasan kritikalitasnya;","l":908,"h":340},{"m":"2)","t":"Penjelasan singkat mengapa pengadaan normal tidak dapat dilakukan;","l":908,"h":340},{"m":"3)","t":"Estimasi penghematan/cost saving (apabila diperlukan);","l":908,"h":340},{"m":"4)","t":"Rekomendasi dan persetujuan dari Pejabat Yang Berwenang;","l":908,"h":340},{"m":"b.","t":"Unit yang Membidangi Fungsi Pengadaan melakukan review terhadap kelengkapan dan keabsahan Dokumen Teknis yang diajukan oleh Unit Pemrakarsa dan/atau Unit Teknis.","l":624,"h":340},{"m":"c.","t":"Pejabat Pengadaan dapat menolak pengajuan Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak oleh Unit Pemrakarsa dan/atau Unit Teknis, apabila tidak sesuai dengan ketentuan sebagaimana dimaksud pada ayat (1), serta ketentuan pada Prinsip dan Etika Pengadaan Barang dan/atau Jasa.","l":624,"h":340},{"m":"3.","t":"Pelaksanaan Pengadaan Barang dan/atau Jasa Penunjukan Langsung Keadaan Mendesak diatur dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Dalam pelaksanaannya tetap mematuhi Prinsip dan Etika Pengadaan Barang dan/atau Jasa serta ketentuan Anggaran Dasar Perusahaan.","l":624,"h":340},{"m":"b.","t":"Proses negosiasi harus dilakukan antara Unit Pemrakarsa dan/atau Unit Teknis bersama-sama Panitia Pengadaan dengan Penyedia yang dituangkan dalam berita acara negosiasi.","l":624,"h":340},{"m":"4.","t":"Evaluasi Unit Pemrakarsa dan/atau Unit Teknis terkait Penunjukan Langsung Keadaan Mendesak sebagaimana tersebut dalam Lampiran X Peraturan Direksi ini.","l":340,"h":340},{"m":"5.","t":"Tata Cara Pengadaan Barang dan/atau Jasa melalui Penunjukan Langsung Keadaan Mendesak sebagaimana tersebut dalam Lampiran IX Peraturan Direksi ini.","l":340,"h":340},{"c":"[BAB IV.N]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]}]},{"heading":"BAB V - PERJANJIAN PENGADAAN","subsections":[{"heading":"A. PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN","rows":[{"topik":"PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN","cells":[[{"t":"PEMBUATAN DAN BENTUK PERJANJIAN PENGADAAN"},{"m":"1.","t":"Pelaksanaan PBJ dituangkan dalam Perjanjian Pengadaan dengan Penyedia yang mengatur secara jelas mengenai hak dan kewajiban dengan disetujui oleh Para Pihak.","l":340,"h":340},{"m":"2.","t":"Perjanjian Pengadaan sebagaimana dimaksud pada poin 1, antara lain berbentuk:","l":340,"h":340},{"m":"a.","t":"Kontrak, yang terdiri dari Head of Agreement (HoA), dan Syarat-Syarat Umum Kontrak (SSUK). Untuk pengadaan konstruksi dokumen kontrak ditambahkan dengan Syarat-Syarat Khusus Kontrak (SSKK);","l":624,"h":340},{"m":"b.","t":"PO/Bukti Pembayaran/Bukti Pembelian/Kuitansi.","l":624,"h":340},{"m":"3.","t":"Kontrak harus disusun sesuai format/templat yang berlaku di Perusahaan.","l":340,"h":340},{"m":"4.","t":"Dalam hal terdapat permintaan perubahan klausul dari format/template tersebut, Unit Bisnis atau Unit Teknis harus meminta legal review dari Unit Yang Membidangi Fungsi Legal Perusahaan sesuai ketentuan yang berlaku.","l":340,"h":340},{"m":"5.","t":"Pembuatan kontrak wajib melampirkan:","l":340,"h":340},{"m":"a.","t":"Permohonan Pengadaan Barang dan/atau Jasa (PPBJ);","l":624,"h":340},{"m":"b.","t":"Dokumen Teknis;","l":624,"h":340},{"m":"c.","t":"Dokumen Pemilihan; dan","l":624,"h":340},{"m":"d.","t":"Dokumen Legalitas Penyedia.","l":624,"h":340},{"m":"6.","t":"Untuk Pengadaan Langsung, PO dibuat dengan melampirkan :","l":340,"h":340},{"m":"a.","t":"KAK (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));","l":624,"h":340},{"m":"b.","t":"HPS (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah));","l":624,"h":340},{"m":"c.","t":"Berita Acara Negosiasi/Hasil Evaluasi Penawaran Harga (untuk Pengadaan di atas Rp50.000.000,- (lima puluh juta rupiah)).","l":624,"h":340},{"m":"7.","t":"Untuk Pengadaan Langsung, Perjanjian Pengadaannya berbentuk PO/Bukti Pembelian/Kuitansi, atau mengikuti standar toko daring yang bersangkutan.","l":340,"h":340},{"m":"8.","t":"Perubahan terhadap dokumen Kontrak/PO Pengadaan harus disertai dengan alasan yang jelas (waktu, nilai, dan ruang lingkup pekerjaan) dan disetujui oleh Para Pihak.","l":340,"h":340},{"c":"[BAB V.A]"}],[{"m":"1.","t":"Bukti perjanjian yang diakui di Perusahaan adalah sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Purchase Order (PO) digunakan untuk pengadaan barang dan/ atau jasa dengan nilai paling banyak Rp. 50.000.000,00 (lima puluh juta rupiah).","l":624,"h":340},{"m":"b.","t":"Surat Perintah Kerja (SPK) digunakan untuk pengadaan barang dan/ atau jasa dengan nilai diatas Rp. 50.000.000,00 (lima puluh juta rupiah) sampai dengan Rp. 1.000.000.000,00 (satu milyar rupiah).","l":624,"h":340},{"m":"c.","t":"Surat perjanjian/ kontrak digunakan untuk pengadaan barang dan/ atau jasa dengan nilai di atas Rp. 1.000.000.000,00 (satu milyar rupiah) atau pekerjaan tertentu yang sifatnya senantiasa dibutuhkan secara berulang (rutin) dan/ atau dalam jangka waktu tertentu.","l":624,"h":340},{"m":"2.","t":"Penyusunan dan pengelolaan dokumen surat perjanjian/ kontrak dilakukan oleh fungsi legal Perusahaan.","l":340,"h":340},{"m":"11.","t":"Dalam pembuatan jenis Purchase Order (PO) dan Surat Perintah Kerja (SPK) mengikuti aturan jenis kontrak berdasarkan cara pembayarannya.","l":340,"h":340},{"c":"[Pasal 34 ayat (1)-(2), (11)]"}],[{"t":"KRITERIA IKATAN KERJA"},{"m":"4.1.1.","t":"Fungsi Ikatan Kerja dalam Pengadaan Barang dan/atau Jasa adalah untuk menjamin adanya kepastian hukum dalam proses pelaksanaan pekerjaan sampai dengan proses pembayaran","l":540,"h":540},{"m":"4.1.2.","t":"Bentuk-Bentuk Ikatan Kerja:","l":540,"h":540},{"m":"a.","t":"Surat Pemesanan (Purchase Order/PO); dan","l":624,"h":340},{"m":"b.","t":"Perjanjian.","l":624,"h":340},{"m":"4.1.3.","t":"Surat Pemesanan (Purchase Order/PO) dipergunakan untuk Pengadaan Barang dan/atau Jasa sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Barang dan/atau Jasa di Kantor Pusat dan/atau Kantor Cabang dengan Nilai Pengadaan sampai dengan Rp50.000.000,- (lima puluh juta rupiah); dan","l":624,"h":340},{"m":"b.","t":"Penyelesaian pekerjaannya/penyerahan barangnya sekaligus tidak lebih dari 14 hari kerja sejak diterbitkannya Surat Perintah Kerja (SPK).","l":624,"h":340},{"m":"4.1.4.","t":"Surat Pemesanan (Purchase Order/PO) juga dapat digunakan untuk Perjanjian dengan Blanket Order.","l":540,"h":540},{"m":"4.1.5.","t":"Surat Pemesanan (Purchase Order/PO) untuk Perjanjian dengan Blanke
