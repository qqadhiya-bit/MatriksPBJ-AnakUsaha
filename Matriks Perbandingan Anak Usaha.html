<script id="matrix-data" type="application/json">{"cols":["Draft IAS","AP Supports","Gapura","IAS Hospitality","IAS Property","IAS Support"],"intro":["Matriks ini membandingkan 6 (enam) aturan PBJ: Draft Kebijakan PBJ PT Integrasi Aviasi Solusi (Draft IAS 30072026), Peraturan PBJ PT Angkasa Pura Suport (AP Supports), Manual PBJ PT Gapura Angkasa (Gapura), Kebijakan PBJ PT IAS Hospitality Indonesia (IAS Hospitality), Prosedur PBJ PT IAS Property Indonesia (IAS Property), dan Peraturan Direksi PBJ PT IAS Support Indonesia (IAS Support).","Matriks utama mengikuti susunan BAB dan bagian Draft IAS sebagai acuan. Isi aturan lain dimasukkan ke topik Draft IAS yang isinya sepadan (padanan). Ketentuan aturan lain yang tidak memiliki padanan di Draft IAS tidak dimasukkan.","Teks dikutip utuh sesuai sumber, termasuk penomoran. Untuk Draft IAS, Gapura, dan dokumen lain yang memuat tracked changes, perubahan yang masih berupa tracked changes dibaca dalam kondisi sudah diterima (teks yang dihapus tidak dimuat, teks yang ditambahkan dimuat), dan bagian yang distabilo tetap dimasukkan tanpa warna. Rujukan ditulis di akhir setiap kutipan. Tanda (Istilah terdekat - \"…\") dipakai jika istilahnya berbeda tetapi isinya setara. \"Tidak diatur.\" atau \"Tidak didefinisikan.\" berarti aturan tersebut tidak memuat topik itu.","Lampiran (matriks kewenangan, formulir, dan tabel lampiran lainnya) tidak dimasukkan, kecuali tabel yang berada di dalam isi aturan."],"babs":[{"heading":"BAB I - PENDAHULUAN","subsections":[{"heading":"A. LATAR BELAKANG","rows":[{"topik":"LATAR BELAKANG","cells":[[{"t":"LATAR BELAKANG"},{"t":"Pengadaan Barang dan/atau Jasa merupakan kegiatan yang dimulai dari identifikasi kebutuhan barang dan/atau jasa sampai dengan serah terima hasil pekerjaan. Pelaksanaan Pengadaan Barang dan/atau Jasa meliputi kegiatan perencanaan Pengadaan Barang dan/atau Jasa, pelaksanaan Pemilihan Penyedia, penyusunan Perjanjian dan Addendum (jika ada) dan pelaksanaan pekerjaan."},{"t":"Pedoman ini merupakan acuan pelaksanaan Pengadaan Barang dan/atau Jasa di lingkungan PT Integrasi Aviasi Solusi yang selanjutnya disebut Pengadaan Barang dan/atau Jasa (“PBJ”)."},{"c":"[BAB I.A]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENDAHULUAN"},{"t":"Pengadaan Barang dan/atau Jasa merupakan salah satu kegiatan yang memiliki peranan cukup penting dalam suatu perusahaan dalam rangka pemenuhan terhadap kebutuhan perusahaan akan Barang dan/atau Jasa. Pengadaan Barang dan/atau Jasa yang efisien, efektif, kompetitif, transparan, adil dan wajar, terbuka dan akuntabel sangat diperlukan bagi ketersediaan Barang dan/atau Jasa yang terjangkau dan berkualitas sehingga akan dapat mendukung operasional dan peningkatan pelayanan terhadap pelanggan."},{"t":"Bahwa untuk mewujudkan Pengadaan Barang dan/atau Jasa di lingkungan PT Gapura Angkasa yang efisien, terbuka dan kompetitif perlu pengaturan mengenai tata cara Pengadaan Barang dan/atau Jasa yang sederhana, jelas dan komprehensif, sesuai dengan tata kelola perusahaan yang baik/Good Corporate Governance (GCG), sehingga dapat menjadi pengaturan yang efektif bagi para pihak yang terkait dengan Pengadaan Barang dan/atau Jasa di lingkungan PT Gapura Angkasa."},{"c":"[BAB 1 angka 1.1.0]"}],[{"t":"LATAR BELAKANG KEBIJAKAN"},{"t":"Pengadaan barang dan atau Jasa merupakan kegiatan yang dimulai dari identifikasi kebutuhan pengadaan barang dan atau jasa sampai dengan serah terima pekerjaan. Pelaksanaan pengadaan barang dan atau jasa meliputi kegiatan perencanaan pengadaan barang dan atau jasa, persiapan pemilihan penyedia, pelaksanaan pemilihan penyedia, penyusunan kontrak dan Addendum (apabila ada) dan pelaksanaan pekerjaan. Kebijakan ini merupakan pedoman dari Keputusan Direksi PT. IAS Hospitality Indonesia yang selanjutnya disebut Kebijakan Pengadaan Barang dan atau Jasa Inbound."},{"c":"[BAB I.A]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"B. RUANG LINGKUP","rows":[{"topik":"RUANG LINGKUP","cells":[[{"t":"RUANG LINGKUP"},{"t":"Ruang lingkup Pedoman ini mencakup seluruh pengadaan barang dan/atau jasa di lingkungan PT Integrasi Aviasi Solusi yang pembiayaannya berasal dari anggaran perusahaan yang telah ditetapkan oleh Perusahaan."},{"c":"[BAB I.B]"}],[{"m":"1.","t":"Peraturan Direksi ini berlaku untuk pengadaan barang dan/ atau jasa di lingkungan Perusahaan.","l":340,"h":340},{"m":"2.","t":"Jenis pengadaan barang dan/ atau jasa dalam Peraturan Direksi ini meliputi :","l":340,"h":340},{"m":"a.","t":"Barang;","l":624,"h":340},{"m":"b.","t":"Pekerjaan konstruksi;","l":624,"h":340},{"m":"c.","t":"Jasa konsultansi;","l":624,"h":340},{"m":"d.","t":"Jasa Lainnya.","l":624,"h":340},{"m":"3.","t":"Pengadaan Barang dan/ atau Jasa yang dimaksud pada ayat 2 dapat dilaksanakan secara terintegrasi.","l":340,"h":340},{"c":"[Pasal 2]"}],[{"t":"RUANG LINGKUP"},{"m":"1.4.1.","t":"Ruang lingkup Manual Pengadaan Barang dan/atau Jasa ini mencakup seluruh ketentuan yang mengatur proses Pengadaan Barang dan/atau Jasa untuk keperluan Perusahaan terdiri dari Pengadaan barang Investasi, eksploitasi dan jasa berdasarkan anggaran yang telah disetujui dalam Rencana Kerja dan Anggaran Perusahaan (RKAP).","l":540,"h":540},{"m":"1.4.2.","t":"Barang dan/atau Jasa dalam Manual Pengadaan Barang dan/atau Jasa ini meliputi:","l":540,"h":540},{"m":"a.","t":"Barang Umum;","l":624,"h":340},{"m":"b.","t":"Barang penunjang ground handling/Peralatan Ground Support Equipment (GSE);","l":624,"h":340},{"m":"c.","t":"Jasa Penyediaan SDM dan/atau Paket Pekerjaan; dan/atau","l":624,"h":340},{"m":"d.","t":"Jasa lainnya.","l":624,"h":340},{"m":"1.4.3.","t":"Cara Pengadaan Barang dan/atau Jasa disesuaikan dengan kebutuhan Perusahaan serta dilaksanakan dengan memperhatikan prinsip sebagaimana dimaksud pada butir 1.6.0. dan praktik yang berlaku umum (best practice).","l":540,"h":540},{"m":"1.4.4.","t":"Cara Pengadaan Barang dan/atau Jasa sebagaimana dimaksud pada butir 1.4.3. dilakukan antara lain melalui:","l":540,"h":540},{"m":"a.","t":"Pengadaan Langsung;","l":624,"h":340},{"m":"b.","t":"Penunjukan Langsung;","l":624,"h":340},{"m":"c.","t":"Pemilihan Langsung;","l":624,"h":340},{"m":"d.","t":"Pelelangan; atau","l":624,"h":340},{"m":"e.","t":"Swakelola.","l":624,"h":340},{"m":"1.4.5.","t":"Proses pelaksanaan Pengadaan Barang dan/atau Jasa dengan cara Pengadaan Langsung dapat dilakukan melalui E-Purchasing.","l":540,"h":540},{"m":"1.4.6.","t":"Proses pelaksanaan Pengadaan Barang dan/atau Jasa dengan cara Pemilihan Langsung dan Pelelangan dapat dilakukan melalui E-Procurement.","l":540,"h":540},{"m":"1.4.7.","t":"Ketentuan Pengadaan Barang dan/atau Jasa yang dananya baik sebagian atau seluruhnya berasal dari pinjaman/hibah baik dari luar maupun dari dalam negeri berpedoman pada ketentuan Manual Pengadaan Barang dan/atau Jasa ini.","l":540,"h":540},{"c":"[BAB 1 angka 1.4.0]"}],[{"t":"RUANG LINGKUP KEBIJAKAN"},{"t":"Ruang lingkup pedoman ini mencakup semua Pengadaan Barang dan/atau Jasa yang dilakukan oleh Perusahaan yang pembiayaannya berasal dari anggaran Perusahaan, termasuk yang dananya bersumber dari penyertaan modal negara, dana Perusahaan untuk pelaksanaan subsidi/kewajiban pelayanan umum (public service obligation)/penugasan pemerintah yang diganti dari Anggaran Pendapatan dan Belanja Negara (APBN) atau Anggaran Pendapatan dan Belanja Daerah (APBD), dan pinjaman Perusahaan dari pemerintah."},{"c":"[BAB I.E]"}],[{"m":"(1)","t":"Prosedur Pengadaan Barang dan/atau Jasa ini berlaku untuk keseluruhan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan yang diprogramkan dan dianggarkan di dalam Anggaran Sendiri/Rencana Kerja dan Anggaran Perusahaan (RKAP) atau anggaran dari sumber lainnya.","l":340,"h":340},{"m":"(2)","t":"Jenis Pengadaan Barang dan/atau Jasa dalam Keputusan Direksi ini meliputi:","l":340,"h":340},{"m":"a.","t":"Barang;","l":624,"h":340},{"m":"b.","t":"Jasa;","l":624,"h":340},{"m":"c.","t":"Jasa Konsultasi; dan","l":624,"h":340},{"m":"d.","t":"Jasa Lainnya.","l":624,"h":340},{"m":"(3)","t":"Jenis Pengadaan Barang dan/atau Jasa sebagaimana ayat (2) Pasal ini akan diatur lebih lanjut dalam Standar Operasional Prosedur (SOP) Pengadaan Barang dan Jasa di Lingkungan Perusahaan.","l":340,"h":340},{"c":"[Pasal 2]"}],[{"m":"(1)","t":"Ruang lingkup berlakunya Pedoman Pelaksanaan Pengadaan Barang dan/ atau Jasa ini adalah untuk pengadaan barang dan atau jasa di lingkungan Perusahaan yang seluruh pembiayaannya berasal dari Perusahaan atau pihak lain di luar Perusahaan yang memiliki perikatan hukum dengan Perusahaan, mencakup penyediaan barang dan/ atau jasa untuk memenuhi sebagian atau seluruh kebutuhan pelaksanaan proyek/ kerja sama bisnis dari Pemberi Kerja atau pihak di luar Perusahaan.","l":340,"h":340},{"m":"(2)","t":"Jenis pengadaan barang dan/ atau jasa dalam Peraturan Direksi ini meliputi :","l":340,"h":340},{"m":"a.","t":"Barang;","l":624,"h":340},{"m":"b.","t":"Pekerjaan konstruksi;","l":624,"h":340},{"m":"c.","t":"Jasa konsultansi;","l":624,"h":340},{"m":"d.","t":"Jasa Lainnya.","l":624,"h":340},{"m":"(3)","t":"Pelaksanaan pengadaan barang dan/ atau jasa dilakukan melalui:","l":340,"h":340},{"m":"a.","t":"Swakelola; dan/ atau","l":624,"h":340},{"m":"b.","t":"Pemilihan Penyedia Barang dan/ atau Jasa.","l":624,"h":340},{"c":"[Pasal 2]"}]]}]},{"heading":"C. TUJUAN PEDOMAN","rows":[{"topik":"TUJUAN PEDOMAN","cells":[[{"t":"TUJUAN PEDOMAN"},{"t":"Pedoman ini bertujuan untuk pengaturan mengenai PBJ guna:"},{"m":"1.","t":"Menghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan Penyedia;","l":340,"h":340},{"m":"2.","t":"Mendukung penciptaan nilai tambah di Perusahaan;","l":340,"h":340},{"m":"3.","t":"Meningkatkan efisiensi;","l":340,"h":340},{"m":"4.","t":"Menyederhanakan dan mempercepat proses pengambilan keputusan;","l":340,"h":340},{"m":"5.","t":"Meningkatkan kemandirian, tanggung jawab, dan profesionalisme;","l":340,"h":340},{"m":"6.","t":"Mewujudkan pengadaan yang menghasilkan value for money dengan cara yang fleksibel dan inovatif namun tetap kompetitif, transparan, akuntabel dilandasi etika pengadaan yang baik;","l":340,"h":340},{"m":"7.","t":"Meningkatkan penggunaan produksi dalam negeri;","l":340,"h":340},{"m":"8.","t":"Meningkatkan peran pelaku usaha nasional;","l":340,"h":340},{"m":"9.","t":"Meningkatkan sinergi dengan BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN.","l":340,"h":340},{"c":"[BAB I.C]"}],[{"m":"1.","t":"Maksud ditetapkannya Peraturan Direksi ini adalah untuk :","l":340,"h":340},{"m":"a.","t":"Menyeragamkan pola pikir, pengertian serta menjadi pedoman proses pengadaan barang dan/ atau jasa, sehingga memudahkan para pihak dalam melaksanakan tugas, tanggung jawab, dan kewenangan, serta hak dan kewajibannya; dan","l":624,"h":340},{"m":"b.","t":"Memberikan batasan dan arahan kebijakan dalam proses pengadaan barang dan/ atau jasa, sehingga dapat meningkatkan value untuk Perusahaan.","l":624,"h":340},{"m":"2.","t":"Tujuan Peraturan Direksi ini adalah agar pelaksanaan pengadaan barang dan/ atau jasa:","l":340,"h":340},{"m":"a.","t":"memperhatikan prinsip-prinsip dan etika pengadaan, dan prinsip tata kelola Perusahaan yang baik (good corporate governance); dan","l":624,"h":340},{"m":"b.","t":"menghasilkan barang dan/ atau jasa yang tepat dari setiap uang yang dibelanjakan, diukur dari aspek kualitas, kuantitas, waktu, biaya, lokasi, dan penyedia.","l":624,"h":340},{"c":"[Pasal 3]"}],[{"t":"TUJUAN"},{"t":"Manual Pengadaan Barang dan/atau Jasa ini dibuat sebagai pedoman tentang tata cara pelaksanaan dan pengendalian proses Pengadaan Barang dan/atau Jasa di lingkungan PT Gapura Angkasa."},{"c":"[BAB 1 angka 1.2.0]"},{"t":"TUJUAN PENGADAAN BARANG DAN/ATAU JASA"},{"t":"Pengadaan Barang dan/atau Jasa diselenggarakan dengan tujuan untuk:"},{"m":"a.","t":"Menghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi dan penyedia;","l":340,"h":340},{"m":"b.","t":"Mendukung penciptaan nilai tambah bagi Perusahaan;","l":340,"h":340},{"m":"c.","t":"Meningkatkan efisiensi;","l":340,"h":340},{"m":"d.","t":"Menyederhanakan dan mempercepat proses pengambilan keputusan;","l":340,"h":340},{"m":"e.","t":"Meningkatkan kemandirian, tanggung jawab dan profesionalisme;","l":340,"h":340},{"m":"f.","t":"Mewujudkan pengadaan yang menghasilkan nilai untuk uang (value for money) dengan cara yang fleksibel dan inovatif, namun tetap kompetitif, transparan, akuntabel dengan dilandasi etika Pengadaan Barang dan/atau Jasa yang baik;","l":340,"h":340},{"m":"g.","t":"Meningkatkan penggunaan produksi dalam negeri;","l":340,"h":340},{"m":"h.","t":"Meningkatkan peran pelaku usaha nasional termasuk Usaha Mikro dan Usaha Kecil; dan","l":340,"h":340},{"m":"i.","t":"Meningkatkan sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN.","l":340,"h":340},{"c":"[BAB 1 angka 1.5.0]"}],[{"t":"TUJUAN KEBIJAKAN"},{"t":"Tujuan pengaturan mengenai Pengadaan Barang dan/atau Jasa ini adalah:"},{"m":"1.","t":"Menghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia;","l":340,"h":340},{"m":"2.","t":"Mendukung penciptaan nilai tambah di Perusahaan;","l":340,"h":340},{"m":"3.","t":"Meningkatkan efisiensi;","l":340,"h":340},{"m":"4.","t":"Menyederhanakan dan mempercepat proses pengambilan keputusan;","l":340,"h":340},{"m":"5.","t":"Meningkatkan kemandirian, tanggung jawab, dan profesionalisme;","l":340,"h":340},{"m":"6.","t":"Mewujudkan Pengadaan yang menghasilkan value for money dengan cara yang fleksibel dan inovatif namun tetap kompetitif, transparan, akuntabel dilandasi etika Pengadaan yang baik;","l":340,"h":340},{"m":"7.","t":"Meningkatkan penggunaan produksi dalam negeri;","l":340,"h":340},{"m":"8.","t":"Meningkatkan peran pelaku usaha nasional;","l":340,"h":340},{"m":"9.","t":"Meningkatkan sinergi dengan BUMN, Anak Perusahaan BUMN, dan/atau dengan Perusahaan Terafiliasi BUMN.","l":340,"h":340},{"c":"[BAB I.G]"}],[{"m":"(1)","t":"Maksud ditetapkannya Keputusan Direksi ini adalah untuk:","l":340,"h":340},{"m":"a.","t":"Mengatur pelaksanaan Pengadaan Barang dan/atau Jasa di Lingkungan Perusahaan;","l":624,"h":340},{"m":"b.","t":"Menyeragamkan pola pikir, pengertian serta menjadi pedoman dalam proses Pengadaan Barang dan/atau Jasa, sehingga memudahkan para pihak dalam melaksanakan tugas, tanggung jawab, dan kewenangan, serta hak dan kewajibannya; dan","l":624,"h":340},{"m":"c.","t":"Memberikan batasan dan arahan kebijakan dalam proses Pengadaan Barang dan/atau Jasa, sehingga dapat meningkatkan value untuk Perusahaan.","l":624,"h":340},{"m":"(2)","t":"Tujuan Keputusan Direksi ini adalah untuk:","l":340,"h":340},{"m":"a.","t":"menghasilkan Barang dan/atau Jasa yang tepat kualitas, jumlah, waktu, biaya, lokasi, dan penyedia;","l":624,"h":340},{"m":"b.","t":"mendukung penciptaan nilai tambah bagi Perusahaan;","l":624,"h":340},{"m":"c.","t":"meningkatkan efisiensi;","l":624,"h":340},{"m":"d.","t":"menyederhanakan dan mempercepat proses pengambilan Keputusan dalam proses Pengadaan Barang dan/atau Jasa;","l":624,"h":340},{"m":"e.","t":"meningkatkan kemandirian, tanggung jawab, dan profesionalisme;","l":624,"h":340},{"m":"f.","t":"mewujudkan Pengadaan yang menghasilkan nilai untuk uang (value for money) dengan cara yang fleksibel dan inovatif, namun tetap kompetitif, transparan, akuntabel dengan dilandasi etika Pengadaan yang baik dan prinsip tata kelola perusahaan yang baik (good corporate governance)","l":624,"h":340},{"m":"g.","t":"meningkatkan penggunaan produksi dalam negeri;","l":624,"h":340},{"m":"h.","t":"meningkatkan peran pelaku usaha nasional termasuk Usaha Mikro dan Usaha Kecil; dan","l":624,"h":340},{"m":"i.","t":"meningkatkan sinergi antar BUMN, Anak Perusahaan BUMN, dan/atau Perusahaan Terafiliasi BUMN.","l":624,"h":340},{"c":"[Pasal 3]"}],[{"m":"1.","t":"Maksud ditetapkannya Peraturan Direksi ini adalah untuk :","l":340,"h":340},{"m":"a.","t":"Menyeragamkan pola pikir, pengertian serta menjadi pedoman proses pengadaan barang dan/ atau jasa, sehingga memudahkan para pihak dalam melaksanakan tugas, tanggung jawab, dan kewenangan, serta hak dan kewajibannya; dan","l":624,"h":340},{"m":"b.","t":"Memberikan batasan dan arahan kebijakan dalam proses pengadaan barang dan/ atau jasa, sehingga dapat meningkatkan value untuk Perusahaan.","l":624,"h":340},{"m":"2.","t":"Tujuan Peraturan Direksi ini adalah agar pelaksanaan pengadaan barang dan/ atau jasa:","l":340,"h":340},{"m":"a.","t":"memperhatikan prinsip-prinsip dan etika pengadaan, dan prinsip tata kelola Perusahaan yang baik (good corporate governance); dan","l":624,"h":340},{"m":"b.","t":"menghasilkan barang dan/ atau jasa yang tepat dari setiap uang yang dibelanjakan, diukur dari aspek kualitas, kuantitas, waktu, biaya, lokasi, dan penyedia","l":624,"h":340},{"c":"[Pasal 3]"}]]}]},{"heading":"D. PRINSIP DASAR","rows":[{"topik":"Prinsip PBJ","cells":[[{"t":"PRINSIP DASAR"},{"m":"1.","t":"Sesuai tata kelola Perusahaan yang baik (Good Corporate Governance/GCG) dan ketentuan peraturan perundang-undangan yang berlaku, PBJ di lingkungan Perusahaan wajib menerapkan prinsip-prinsip:","l":340,"h":340},{"m":"a.","t":"Efisien, berarti pengadaan barang dan/atau jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah. Untuk pengadaan barang dan/atau jasa strategis yang memiliki nilai yang signifikan dapat menyampaikan analisa kelayakan;","l":624,"h":340},{"m":"b.","t":"Efektif, berarti pengadaan barang dan/atau jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan;","l":624,"h":340},{"m":"c.","t":"Kompetitif, berarti pengadaan barang dan/atau jasa harus terbuka bagi Penyedia yang memenuhi persyaratan, dan untuk metode tertentu dilakukan melalui persaingan yang sehat di antara Penyedia yang setara dan memenuhi syarat/ kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;","l":624,"h":340},{"m":"d.","t":"Transparan, berarti semua ketentuan dan informasi mengenai pengadaan barang dan/atau jasa, termasuk syarat teknis administrasi Pengadaan, tata cara evaluasi, hasil evaluasi, penetapan Penyedia, sifatnya terbuka bagi peserta Penyedia yang berminat;","l":624,"h":340},{"m":"e.","t":"Adil dan wajar, berarti memberikan perlakuan yang sama bagi semua Penyedia yang memenuhi syarat;","l":624,"h":340},{"m":"f.","t":"Terbuka, berarti pengadaan barang dan/atau jasa dapat diikuti oleh semua Penyedia yang memenuhi syarat;","l":624,"h":340},{"m":"g.","t":"Akuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan.","l":624,"h":340},{"c":"[BAB I.D angka 1]"}],[{"t":"Pengadaan barang dan/ atau Jasa wajib menerapkan prinsip-prinsip:"},{"m":"1.","t":"Efisien, berarti pengadaan barang dan/ atau jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah.","l":340,"h":340},{"m":"2.","t":"Efektif, berarti pengadaan barang dan/ atau jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan.","l":340,"h":340},{"m":"3.","t":"Kompetitif, berarti pengadaan barang dan/ atau jasa harus terbuka bagi penyedia yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara penyedia barang dan/ jasa yang setara dan memenuhi syarat/ kriteria tertentu berdasarkan ketentuan dan prosedur yang berlaku.","l":340,"h":340},{"m":"4.","t":"Transparan, berarti semua ketentuan dan informasi mengenai pengadaan barang dan/ atau jasa, termasuk syarat teknis administrasi pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon penyedia barang dan/ jasa.","l":340,"h":340},{"m":"5.","t":"Adil dan wajar, berarti memberikan perlakuan yang sama bagi semua calon penyedia barang dan/ jasa yang memenuhi syarat.","l":340,"h":340},{"m":"6.","t":"Terbuka, berarti pengadaan barang dan/ atau jasa dapat diikuti oleh semua calon penyedia barang dan/ jasa yang memenuhi syarat.","l":340,"h":340},{"m":"7.","t":"Akuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan.","l":340,"h":340},{"c":"[Pasal 5]"}],[{"t":"PRINSIP DASAR PENGADAAN BARANG DAN/ATAU JASA"},{"m":"1.6.1.","t":"Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan wajib menerapkan prinsip-prinsip sebagai berikut:","l":540,"h":540},{"m":"a.","t":"Efisien, berarti Pengadaan Barang dan/atau Jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah, dengan pengecualian untuk Pengadaan Barang dan/atau Jasa strategis yang memiliki nilai signifikan dapat dilakukan pendekatan penghitungan semua biaya (total cost of ownership);","l":624,"h":340},{"m":"b.","t":"Efektif, berarti Pengadaan Barang dan/atau Jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat sesuai dengan sasaran yang ditetapkan;","l":624,"h":340},{"m":"c.","t":"Kompetitif, berarti Pengadaan Barang dan/atau Jasa harus terbuka bagi Penyedia Barang dan/atau Jasa yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia Barang dan/atau Jasa yang setara dan memenuhi syarat/kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;","l":624,"h":340},{"m":"d.","t":"Transparan, berarti semua ketentuan dan informasi mengenai Pengadaan Barang dan/atau Jasa, termasuk syarat teknis administrasi pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia Barang dan/atau Jasa, harus terbuka bagi Peserta Penyedia Barang dan/atau Jasa yang berminat;","l":624,"h":340},{"m":"e.","t":"Adil dan wajar, berarti dalam pelaksanaan Pengadaan Barang dan/atau Jasa, Perusahaan memberikan perlakuan yang sama bagi semua calon Penyedia Barang dan/atau Jasa yang memenuhi syarat;","l":624,"h":340},{"m":"f.","t":"Terbuka, berarti pelaksanaan Pengadaan Barang dan/atau Jasa dapat diikuti oleh semua Penyedia Barang dan/atau Jasa yang memenuhi syarat; dan","l":624,"h":340},{"m":"g.","t":"Akuntabel, berarti pelaksanaan Pengadaan Barang dan/atau Jasa harus mencapai sasaran dan dapat dipertanggungjawabkan, sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan.","l":624,"h":340},{"m":"h.","t":"Sustainability dan Profitability, berarti Pengadaan Barang dan/atau Jasa harus bisa mencapai Value for Money dengan cara mempertimbangkan purchase cost (harga yang paling efisien), life cycle cost (mempertimbangkan masa pakai), dan schedules (kecepatan dalam penyediaan barang dan/atau jasa).","l":624,"h":340},{"c":"[BAB 1 angka 1.6.1]"}],[{"t":"PRINSIP UMUM KEBIJAKAN"},{"m":"1.","t":"Sesuai tata kola perusahaan yang sehat (good corporate governance/GCG) dan ketentuan peraturan perundang-undangan yang berlaku, Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan wajib menerapkan prinsip-prinsip:","l":340,"h":340},{"m":"a.","t":"Efisien, berarti Pengadaan Barang dan/atau Jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah. Untuk Pengadaan Barang dan/atau Jasa strategis yang memiliki nilai yang signifikan dapat menyampaikan analisa kelayakan;","l":624,"h":340},{"m":"b.","t":"Efektif, berarti Pengadaan Barang dan/atau Jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar- besarnya sesuai dengan sasaran yang ditetapkan;","l":624,"h":340},{"m":"c.","t":"Kompetitif, berarti Pengadaan Barang dan/atau Jasa harus terbuka bagi Penyedia Barang dan/atau Jasa yang memenuhi persyaratan, dan untuk metode tertentu dilakukan melalui persaingan yang sehat di antara Penyedia Barang dan/atau Jasa yang setara dan memenuhi syarat/ kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;","l":624,"h":340},{"m":"d.","t":"Transparan, berarti semua ketentuan dan informasi mengenai Pengadaan Barang dan/atau Jasa, termasuk syarat teknis administrasi Pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia Barang dan Jasa, sifatnya terbuka bagi peserta Penyedia Barang dan/atau Jasa yang berminat;","l":624,"h":340},{"m":"e.","t":"Adil dan wajar, berarti memberikan perlakuan yang sama bagi semua calon Penyedia Barang /Jasa yang memenuhi syarat;","l":624,"h":340},{"m":"f.","t":"Terbuka, berarti Pengadaan Barang dan/atau Jasa dapat diikuti oleh semua Penyedia Barang dan/atau Jasa yang memenuhi syarat;","l":624,"h":340},{"m":"g.","t":"Akuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dan potensi penyalahgunaan dan penyimpangan.","l":624,"h":340},{"c":"[BAB I.F angka 1]"}],[{"m":"(1)","t":"Pengadaan Barang dan/atau Jasa wajib menerapkan prinsip-prinsip sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Efisien","l":624,"h":340},{"t":"Pengadaan Barang dan/atau Jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya berdasarkan pada harga terendah. Untuk Pengadaan Barang dan/atau Jasa yang memiliki nilai yang signifikan dapat dilakukan pendekatan total cost of ownership (TCO);","l":624},{"m":"b.","t":"Efektif","l":624,"h":340},{"t":"Pengadaan Barang dan/atau Jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan;","l":624},{"m":"c.","t":"Kompetitif","l":624,"h":340},{"t":"Pengadaan Barang dan/atau Jasa harus terbuka bagi Penyedia Barang dan Jasa yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia Barang dan Jasa yang setara dan memenuhi syarat/kriteria tertentu berdasarkan ketentuan dan prosedur yang jelas dan transparan;","l":624},{"m":"d.","t":"Transparan","l":624,"h":340},{"t":"Semua ketentuan dan informasi mengenai Pengadaan Barang dan/atau Jasa, termasuk syarat teknis administrasi pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia Barang dan Jasa, sifatnya terbuka bagi Peserta Pengadaan yang berminat;","l":624},{"m":"e.","t":"Adil dan Wajar","l":624,"h":340},{"t":"Memberikan perlakuan yang sama bagi semua calon Penyedia Barang dan Jasa yang memenuhi syarat;","l":624},{"m":"f.","t":"Terbuka","l":624,"h":340},{"t":"Pengadaan Barang dan/atau Jasa dapat diikuti oleh semua penyedia barang dan jasa yang memenuhi syarat; dan","l":624},{"m":"g.","t":"Akuntabel","l":624,"h":340},{"t":"Harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan.","l":624},{"c":"[Pasal 4 ayat (1)]"}],[{"t":"Pengadaan barang dan/ atau Jasa wajib menerapkan prinsip-prinsip:"},{"m":"1.","t":"Efisien, berarti pengadaan barang dan/ atau jasa harus diusahakan untuk mendapatkan hasil yang optimal dan terbaik dalam waktu yang cepat dengan menggunakan dana dan kemampuan seoptimal mungkin secara wajar dan bukan hanya didasarkan pada harga terendah.","l":340,"h":340},{"m":"2.","t":"Efektif, berarti pengadaan barang dan/ atau jasa harus sesuai dengan kebutuhan yang telah ditetapkan dan memberikan manfaat yang sebesar-besarnya sesuai dengan sasaran yang ditetapkan.","l":340,"h":340},{"m":"3.","t":"Kompetitif, berarti pengadaan barang dan/ atau jasa harus terbuka bagi Penyedia Barang dan/ atau Jasa yang memenuhi persyaratan dan dilakukan melalui persaingan yang sehat di antara Penyedia Barang dan/ atau Jasa yang setara dan memenuhi syarat/ kriteria tertentu berdasarkan ketentuan dan prosedur yang berlaku.","l":340,"h":340},{"m":"4.","t":"Transparan, berarti semua ketentuan dan informasi mengenai pengadaan barang dan/ atau jasa, termasuk syarat teknis administrasi pengadaan, tata cara evaluasi, hasil evaluasi, penetapan calon Penyedia Barang dan/ atau Jasa.","l":340,"h":340},{"m":"5.","t":"Adil dan wajar, berarti memberikan perlakuan yang sama bagi semua calon penyedia barang dan/ atau jasa yang memenuhi syarat.","l":340,"h":340},{"m":"6.","t":"Terbuka, berarti pengadaan barang dan/ atau atau jasa dapat diikuti oleh semua calon Penyedia Barang dan/ atau Jasa yang memenuhi syarat.","l":340,"h":340},{"m":"7.","t":"Akuntabel, berarti harus mencapai sasaran dan dapat dipertanggungjawabkan sehingga menjauhkan dari potensi penyalahgunaan dan penyimpangan.","l":340,"h":340},{"c":"[Pasal 6]"}]]},{"topik":"Pengutamaan dan Preferensi Produksi Dalam Negeri","cells":[[{"t":"PRINSIP DASAR"},{"m":"2.","t":"Perusahaan mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional, serta perluasan kesempatan bagi usaha kecil sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan.","l":340,"h":340},{"m":"3.","t":"Perusahaan dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku dalam rangka mendorong pertumbuhan industri dalam negeri.","l":340,"h":340},{"c":"[BAB I.D angka 2-3]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PRINSIP UMUM KEBIJAKAN"},{"m":"2.","t":"Pengguna Barang dan/atau Jasa mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional, serta perluasan kesempatan bagi usaha kecil sepanjang kualitas, harga, dan tujuannya dapat dipertanggungjawabkan;","l":340,"h":340},{"m":"3.","t":"Pengguna Barang dan/atau Jasa dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku dalam rangka mendorong pertumbuhan industri dalam negeri;","l":340,"h":340},{"c":"[BAB I.F angka 2-3]"},{"t":"PREFERENSI HARGA"},{"m":"1.","t":"Preferensi harga merupakan insentif bagi Penyedia Barang dan/atau Jasa yang menggunakan produk dalam negeri pada pemilihan Penyedia, yaitu berupa kelebihan harga yang dapat diterima;","l":340,"h":340},{"m":"2.","t":"Preferensi harga diberlakukan untuk Pengadaan Barang dan/atau Jasa dengan nilai yang signifikan;","l":340,"h":340},{"m":"3.","t":"Pengguna Barang dan/atau Jasa memberikan preferensi harga atas produk dalam negeri yang memiliki nilai tingkat komponen dalam negeri lebih besar atau sama dengan 25% (dua puluh lima persen);","l":340,"h":340},{"m":"4.","t":"Preferensi harga produk dalam negeri untuk barang diberikan paling tinggi 25% (dua puluh lima persen);","l":340,"h":340},{"m":"5.","t":"Preferensi harga produk dalam negeri untuk jasa konstruksi yang dikerjakan oleh perusahaan dalam negeri diberikan paling tinggi 7,5% (tujuh koma lima persen);","l":340,"h":340},{"m":"6.","t":"Preferensi harga diperhitungkan dalam evaluasi harga penawaran yang telah memenuhi persyaratan administrasi dan teknis;","l":340,"h":340},{"m":"7.","t":"Penetapan pemenang berdasarkan urutan harga terendah Hasil Evaluasi Akhir (HEA);","l":340,"h":340},{"m":"8.","t":"HEA dihitung sesuai dengan rumus yang diatur di dalam peraturan perundang- undangan yang berlaku;","l":340,"h":340},{"m":"9.","t":"Dalam hal terdapat 2 (dua) atau lebih penawaran dengan HEA terendah yang sama, penawar dengan TKDN lebih besar ditetapkan sebagai pemenang.","l":340,"h":340},{"c":"[BAB VI.C]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"2.","t":"Pada saat pelaksanaan pengadaan barang dan/ atau jasa, Perusahaan dapat memberlakukan Preferensi Harga.","l":340,"h":340},{"c":"[Pasal 60 ayat (2)]"}]]},{"topik":"Sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN","cells":[[{"t":"PRINSIP DASAR"},{"m":"4.","t":"Perusahaan dapat melakukan sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN.","l":340,"h":340},{"c":"[BAB I.D angka 4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PRINSIP DASAR PENGADAAN BARANG DAN/ATAU JASA"},{"m":"1.6.2.","t":"Selain menerapkan prinsip-prinsip sebagaimana disebutkan di atas, Perusahaan:","l":540,"h":540},{"m":"b.","t":"Dapat melakukan sinergi antar BUMN, anak perusahaan BUMN dan/atau perusahaan terafiliasi BUMN; dan","l":624,"h":340},{"c":"[BAB 1 angka 1.6.2 huruf b]"},{"t":"KETENTUAN LAIN DALAM PELAKSANAAN PENGADAAN BARANG DAN/ATAU JASA"},{"m":"3.7.6.","t":"Pengadaan Melalui Kerjasama Dengan BUMN, Anak Perusahaan BUMN dan Perusahaan Terafiliasi BUMN","l":540,"h":540},{"m":"a.","t":"Pengadaan Barang dan/atau Jasa dapat dilakukan melalui kerjasama dengan BUMN/ Anak Perusahaan BUMN/Perusahaan terafiliasi BUMN.","l":624,"h":340},{"m":"b.","t":"Pelaksanaan Pengadaan melalui kerjasama dengan BUMN/Anak Perusahaan BUMN/Perusahaan terafiliasi BUMN harus mendapat persetujuan Pejabat Berwenang.","l":624,"h":340},{"m":"c.","t":"Pengadaan melalui kerjasama dengan BUMN/Anak Perusahaan BUMN/Perusahaan terafiliasi BUMN dapat dilaksanakan dengan memilih di antara beberapa BUMN/Anak Perusahaan BUMN/Perusahaan terafiliasi BUMN dengan manfaat yang paling optimal yang diperoleh oleh Perusahaan.","l":624,"h":340},{"m":"d.","t":"Selain mempertimbangkan manfaat yang paling optimal, harga yang disepakati tidak boleh melebihi harga pasar atau harga Penyedia Barang dan/atau Jasa lain dengan kualitas yang sama.","l":624,"h":340},{"c":"[BAB 3 angka 3.7.6]"}],[{"t":"PRINSIP UMUM KEBIJAKAN"},{"m":"4.","t":"Pengguna Barang dan/atau Jasa dapat melakukan sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN;","l":340,"h":340},{"c":"[BAB I.F angka 4]"}],[{"m":"(2)","t":"Selain menerapkan prinsip sebagaimana dimaksud pada ayat (1), Pengguna:","l":340,"h":340},{"m":"b.","t":"dapat melakukan sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN sepanjang kualitas harga dan tujuannya dapat dipertanggungjawabkan; dan","l":624,"h":340},{"c":"[Pasal 4 ayat (2) huruf b]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]},{"topik":"Penyedia sebagai Pemilik Produk/Layanan","cells":[[{"t":"PRINSIP DASAR"},{"m":"5.","t":"Penyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan.","l":340,"h":340},{"c":"[BAB I.D angka 5]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PRINSIP DASAR PENGADAAN BARANG DAN/ATAU JASA"},{"m":"c.","t":"Memastikan Penyedia Barang dan/atau Jasa merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan.","l":340,"h":340},{"c":"[BAB 1 angka 1.6.2 huruf c]"}],[{"t":"PRINSIP UMUM KEBIJAKAN"},{"m":"5.","t":"Penyedia Barang dan/atau Jasa merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia Barang dan/atau Jasa bersangkutan.","l":340,"h":340},{"c":"[BAB I.F angka 5]"}],[{"m":"c.","t":"memastikan Penyedia merupakan pemilik produk atau layanan sesuai dengan bidang usaha dari Penyedia bersangkutan.","l":340,"h":340},{"c":"[Pasal 4 ayat (2) huruf c]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"E. PEDOMAN UMUM PBJ","rows":[{"topik":"PEDOMAN UMUM PBJ","cells":[[{"t":"PEDOMAN UMUM PBJ"},{"t":"PBJ wajib menerapkan Pedoman antara lain:"},{"m":"1.","t":"Meningkatkan kualitas perencanaan yang konsolidatif dan strategi PBJ untuk mengoptimalkan value for money;","l":340,"h":340},{"m":"2.","t":"Menyelaraskan tujuan pengadaan dengan pencapaian tujuan Perusahaan;","l":340,"h":340},{"m":"3.","t":"Melaksanakan PBJ yang lebih transparan, kompetitif, dan akuntabel;","l":340,"h":340},{"m":"4.","t":"Mengutamakan penggunaan produksi dalam negeri sesuai ketentuan pendayagunaan produksi dalam negeri;","l":340,"h":340},{"m":"5.","t":"Memberi kesempatan pada pelaku usaha nasional, usaha mikro dan usaha kecil;","l":340,"h":340},{"m":"6.","t":"Memperkuat kapasitas kelembagaan dan Sumber Daya Manusia di bidang PBJ;","l":340,"h":340},{"m":"7.","t":"Memanfaatkan teknologi informasi;","l":340,"h":340},{"m":"8.","t":"Memberikan kesempatan kepada Anak Perusahaan dan/atau sinergi antar BUMN/Anak Perusahaan/Perusahaan Terafiliasi BUMN;","l":340,"h":340},{"m":"9.","t":"Melaksanakan pengadaan yang strategis, modern, inovatif; dan/atau","l":340,"h":340},{"m":"10.","t":"Memperkuat pengukuran kinerja PBJ dan pengelolaan risiko.","l":340,"h":340},{"c":"[BAB I.E]"}],[{"t":"Kebijakan umum pengadaan barang dan/ atau jasa adalah:"},{"m":"1.","t":"Meningkatkan kualitas perencanaan yang konsolidatif dan strategi pengadaan barang dan/ atau jasa untuk mengoptimalkan value for money, melalui pengadaan yang lebih transparan, kompetitif dan akuntabel;","l":340,"h":340},{"m":"2.","t":"Menyelaraskan tujuan pengadaan dengan pencapaian tujuan perusahaan;","l":340,"h":340},{"m":"3.","t":"Mengutamakan produk dalam negeri dan memberi kesempatan pada pelaku usaha kecil;","l":340,"h":340},{"m":"4.","t":"Memanfaatkan teknologi informasi;","l":340,"h":340},{"m":"5.","t":"Memberikan kesempatan kepada anak perusahaan dan/ atau sinergi antar BUMN/ anak Perusahaan/ Perusahaan terafiliasi BUMN;","l":340,"h":340},{"m":"6.","t":"Melaksanakan pengadaan yang strategis, modern, inovatif; dan/ atau","l":340,"h":340},{"m":"7.","t":"Memperkuat pengukuran kinerja pengadaan dan pengelolaan risiko.","l":340,"h":340},{"c":"[Pasal 4]"}],[{"t":"KEBIJAKAN PENGADAAN BARANG DAN JASA"},{"t":"Dalam melaksanakan Pengadaan Barang dan/atau Jasa, Perusahaan harus menerapkan kebijakan paling sedikit untuk:"},{"m":"a.","t":"meningkatkan kualitas perencanaan yang konsolidatif dan strategi Pengadaan Barang dan/atau Jasa guna mengoptimalkan value for money;","l":340,"h":340},{"m":"b.","t":"menyelaraskan tujuan Pengadaan Barang dan/atau Jasa dengan pencapaian tujuan perusahaan;","l":340,"h":340},{"m":"c.","t":"melaksanakan Pengadaan Barang dan/atau Jasa yang transparan, kompetitif, dan akuntabel;","l":340,"h":340},{"m":"d.","t":"mengutamakan produksi dalam negeri sesuai ketentuan pendayagunaan produk dalam negeri;","l":340,"h":340},{"m":"e.","t":"memberi kesempatan pada pelaku usaha nasional dan usaha mikro dan usaha kecil;","l":340,"h":340},{"m":"f.","t":"memperkuat kapasitas kelembagaan dan sumber daya manusia dibidang Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"g.","t":"memanfaatkan teknologi informasi;","l":340,"h":340},{"m":"h.","t":"memberikan kesempatan kepada Anak Perusahaan BUMN dan/atau sinergi antar BUMN, Anak Perusahaan BUMN dan/atau Perusahaan Terafiliasi BUMN;","l":340,"h":340},{"m":"i.","t":"melaksanakan Pengadaan Barang dan/atau Jasa yang strategis, modern, inovatif; dan/atau","l":340,"h":340},{"m":"j.","t":"memperkuat pengukuran kinerja Pengadaan Barang dan/atau Jasa dan pengelolaan risiko.","l":340,"h":340},{"c":"[BAB 1 angka 1.7.0]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Kebijakan umum pengadaan barang dan/ atau jasa adalah:"},{"m":"1.","t":"Meningkatkan kualitas perencanaan yang konsolidatif dan strategi pengadaan barang dan/ atau jasa untuk mengoptimalkan value for money, melalui pengadaan yang lebih transparan, kompetitif dan akuntabel;","l":340,"h":340},{"m":"2.","t":"Menyelaraskan tujuan pengadaan dengan pencapaian tujuan perusahaan;","l":340,"h":340},{"m":"3.","t":"Mengutamakan produk dalam negeri dan memberi kesempatan pada pelaku usaha kecil;","l":340,"h":340},{"m":"4.","t":"Memanfaatkan teknologi informasi;","l":340,"h":340},{"m":"5.","t":"Memberikan kesempatan kepada grup holding (InJourney Group) dan/ atau sinergi antar Badan Usaha Milik Negara (BUMN)/ anak Perusahaan/ Perusahaan terafiliasi Badan Usaha Milik Negara (BUMN);","l":340,"h":340},{"m":"6.","t":"Melaksanakan pengadaan yang strategis, modern, inovatif; dan/ atau","l":340,"h":340},{"m":"7.","t":"Memperkuat pengukuran kinerja pengadaan dan pengelolaan risiko","l":340,"h":340},{"c":"[Pasal 4]"}]]}]},{"heading":"F. ETIKA PBJ","rows":[{"topik":"ETIKA PBJ","cells":[[{"t":"ETIKA PBJ"},{"t":"Semua Pihak yang terlibat dalam pengadaan barang dan/atau jasa di lingkungan Perusahaan wajib mematuhi etika sebagai berikut:"},{"m":"1.","t":"Melaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan PBJ;","l":340,"h":340},{"m":"2.","t":"Bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan PBJ;","l":340,"h":340},{"m":"3.","t":"Tidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;","l":340,"h":340},{"m":"4.","t":"Menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis Pihak yang terkait;","l":340,"h":340},{"m":"5.","t":"Menghindari dan mencegah terjadinya pertentangan/benturan kepentingan Pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat dalam PBJ;","l":340,"h":340},{"m":"6.","t":"Menghindari dan mencegah pemborosan dan kebocoran keuangan Negara/Perusahaan;","l":340,"h":340},{"m":"7.","t":"Menghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan/atau","l":340,"h":340},{"m":"8.","t":"Tidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi dan/atau menerima hadiah, imbalan, komisi, rabat, serta hal lainnya dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan PBJ.","l":340,"h":340},{"c":"[BAB I.F]"}],[{"t":"Penyelenggaraan pengadaan barang dan/ atau jasa harus memiliki sikap dan perilaku sebagai berikut :"},{"m":"1.","t":"Melaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"2.","t":"Bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"3.","t":"Tidak saling mempengaruhi, menghindari dan mencegah terjadinya pertentangan, baik langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat;","l":340,"h":340},{"m":"4.","t":"Menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis pihak yang terkait;","l":340,"h":340},{"m":"5.","t":"Menghindari dan mencegah terjadinya pertentangan kepentingan para pihak yang terkait langsung maupun tidak langsung dalam proses pengadaan barang dan/ atau jasa (conflict of interest)","l":340,"h":340},{"m":"6.","t":"Menghindari dan mencegah pemborosan dan kebocoran keuangan Perusahaan;","l":340,"h":340},{"m":"7.","t":"Menghindari dan mencegah penyalahgunaan wewenang dan/ atau kolusi dengan tujuan untuk keuntungan pribadi, golongan atau pihak lain yang berkaitan dengan pengadaan barang dan/ atau jasa; dan","l":340,"h":340},{"m":"8.","t":"Tidak menerima, tidak menawarkan atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan pengadaan barang dan/ atau jasa.","l":340,"h":340},{"c":"[Pasal 6]"}],[{"t":"ETIKA PENGADAAN"},{"t":"Pihak-pihak yang terkait dalam proses Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan diwajibkan dapat mematuhi etika sebagai berikut:"},{"m":"a.","t":"Melaksanakan tugas dan kewajiban dengan tertib disertai rasa tanggung jawab untuk dapat mencapai sasaran kelancaran dan ketepatan dalam tercapainya tujuan Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"m":"b.","t":"Bekerja secara professional dan mandiri atas dasar kejujuran, serta menjaga kerahasiaan Dokumen Pengadaan Barang dan/atau Jasa yang seharusnya dirahasiakan untuk mencegah terjadinya penyimpangan dalam proses Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"m":"c.","t":"Tidak saling mempengaruhi baik secara langsung maupun tidak langsung untuk mencegah dan menghindari terjadinya persaingan yang tidak sehat.","l":340,"h":340},{"m":"d.","t":"Menerima dan bertanggung jawab atas segala keputusan yang telah ditetapkan sesuai dengan kesepakatan para pihak.","l":340,"h":340},{"m":"e.","t":"Menghindari dan mencegah terjadinya pertentangan kepentingan para pihak yang terkait, langsung maupun tidak langsung dalam proses Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"m":"f.","t":"Menghindari dan mencegah terjadinya pemborosan dan kebocoran keuangan Perusahaan dalam proses Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"m":"g.","t":"Menghindari dan mencegah terjadinya penyalahgunaan wewenang dan atau melakukan kolusi dengan tujuan untuk keuntungan pribadi, golongan atau pihak lain yang secara langsung maupun tidak langsung dapat mengakibatkan kerugian Perusahaan.","l":340,"h":340},{"m":"h.","t":"Tidak menerima, menawarkan atau menjanjikan untuk memberi atau menerima hadiah, imbalan berbentuk apa saja kepada siapapun yang diketahui atau patut dapat diduga akan dapat mempengaruhi proses dan pengambilan keputusan Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"m":"i.","t":"Tidak dibenarkan dalam suatu proses Pengadaan melibatkan Peserta yang mempunyai hubungan sedarah sampai dengan derajat ke tiga baik menurut garis lurus maupun garis kesamping atau hubungan semenda antara Penyedia Barang dan/atau Jasa dengan sesama Penyedia Barang dan/atau Jasa dan atau antara Penyedia Barang dan/atau Jasa dengan Pelaksana Pengadaan.","l":340,"h":340},{"m":"j.","t":"Tidak dibenarkan dalam suatu Badan Usaha, seorang anggota Direksi atau Dewan Komisaris merangkap sebagai anggota Direksi atau anggota Dewan Komisaris pada badan usaha lainnya yang menjadi Peserta pada Pelelangan/seleksi yang sama.","l":340,"h":340},{"m":"k.","t":"Tidak dibenarkan dalam pekerjaan konstruksi, konsultan perencana bertindak sebagai Pelaksana Pekerjaan atau konsultan pengawas pekerjaan yang direncanakannya, kecuali dalam pelaksanaan pengadaan pekerjaan terintegrasi.","l":340,"h":340},{"m":"l.","t":"Tidak dibenarkan Pengurus koperasi pegawai yang mengikuti Pengadaan Barang dan/atau Jasa dan bersaing dengan perusahaan lainnya, merangkap sebagai anggota Pelaksana Pengadaan atau Pejabat Berwenang menentukan pemenang.","l":340,"h":340},{"m":"m.","t":"Menyatakan seluruh komitmen Pengadaan sebagaimana tersebut di atas dituangkan dalam formulir Pakta Integritas yang ditandatangani oleh para pihak yang terlibat dalam proses Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"c":"[BAB 1 angka 1.8.0]"}],[{"t":"ETIKA"},{"t":"Semua pihak yang terlibat dalam Pengadaan Barang dan/atau Jasa di lingkungan Perusahaan wajib mematuhi etika sebagai berikut:"},{"m":"1.","t":"Melaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran, dan ketepatan tujuan Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"2.","t":"Bekerja secara profesional, mandiri, dan menjaga kerahasiaan informasi yang menurut sifatnya harus dirahasiakan untuk mencegah penyimpangan Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"3.","t":"Tidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat persaingan usaha tidak sehat;","l":340,"h":340},{"m":"4.","t":"Menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis pihak yang terkait;","l":340,"h":340},{"m":"5.","t":"Menghindari dan mencegah terjadinya pertentangan/benturan kepentingan pihak yang terkait, baik secara langsung maupun tidak langsung, yang berakibat persaingan usaha tidak sehat dalam Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"6.","t":"Menghindari dan mencegah pemborosan dan kebocoran keuangan negara/perusahaan;","l":340,"h":340},{"m":"7.","t":"Menghindari dan mencegah penyalahgunaan wewenang dan/atau kolusi; dan/atau;","l":340,"h":340},{"m":"8.","t":"Tidak menerima, tidak menawarkan, atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat, dan apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"c":"[BAB I.H]"}],[{"t":"Seluruh pihak yang terkait dalam pelaksanaan Pengadaan Barang dan/atau Jasa harus memiliki etika sebagai berikut:"},{"m":"a.","t":"Melaksanakan tugas secara tertib, disertai rasa tanggung jawab untuk mencapai sasaran kelancaran dan ketepatan tercapainya tujuan Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"b.","t":"Bekerja secara professional dan mandiri, atas dasar kejujuran, serta menjaga kerahasiaan Dokumen Pengadaan yang menurut sifatnya harus dirahasiakan untuk mencegah terjadinya penyimpangan dalam Pengadaan Barang dan/atau Jasa;","l":340,"h":340},{"m":"c.","t":"Tidak saling mempengaruhi baik langsung maupun tidak langsung, untuk mencegah dan menghindari terjadinya persaingan tidak sehat;","l":340,"h":340},{"m":"d.","t":"Menerima dan bertanggung jawab atas segala Peraturan yang ditetapkan sesuai dengan kesepakatan para pihak;","l":340,"h":340},{"m":"e.","t":"Menghindari dan mencegah terjadinya benturan kepentingan para pihak yang terkait langsung maupun tidak langsung dalam proses Pengadaan Barang dan/atau Jasa (conflict of interest);","l":340,"h":340},{"m":"f.","t":"Menghindari serta mencegah terjadinya pemborosan dan kebocoran keuangan perusahaan;","l":340,"h":340},{"m":"g.","t":"Menghindari serta mencegah penyalahgunaan wewenang dan/atau kolusi dengan tujuan untuk keuntungan pribadi, golongan atau pihak lain secara langsung atau tidak langsung merugikan Perusahaan; dan","l":340,"h":340},{"m":"h.","t":"Tidak menerima, tidak menawar atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan berupa apapun kepada siapapun yang diketahui atau patut dapat diduga berkaitan dengan Pengadaan Barang dan/atau Jasa.","l":340,"h":340},{"c":"[Pasal 5]"}],[{"t":"Penyelenggaraan Pengadaan Barang dan/ atau Jasa harus memiliki sikap dan prilaku sebagai berikut:"},{"m":"a.","t":"Melaksanakan tugas secara tertib dengan mematuhi peraturan yang berlaku, disertai rasa tanggung jawab untuk mencapai sasaran, kelancaran dan ketepatan tercapainya tujuan pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"b.","t":"Bekerja secara profesional dan mandiri, serta menjaga kerahasiaan dokumen pengadaan barang dan/ atau jasa yang menurut sifatnya harus dirahasiakan untuk mencegah terjadinya penyimpangan dalam pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"c.","t":"Tidak saling mempengaruhi baik langsung maupun tidak langsung yang berakibat terjadinya persaingan tidak sehat dan penurunan hasil kerja;","l":340,"h":340},{"m":"d.","t":"Menerima dan bertanggung jawab atas segala keputusan yang ditetapkan sesuai dengan kesepakatan tertulis para pihak;","l":340,"h":340},{"m":"e.","t":"Menghindari dan mencegah terjadinya pertentangan kepentingan (conflict of interest) para pihak yang terkait, baik secara langsung maupun tidak langsung dalam proses pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"f.","t":"Menghindari dan mencegah terjadinya pemborosan dan kebocoran dalam pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"g.","t":"Menghindari dan mencegah penyalahgunaan wewenang, tidak terpengaruh oleh kepentingan lain diluar kepentingan Perusahaan dan/ atau kolusi dengan tujuan untuk keuntungan pribadi, golongan atau pihak lain yang secara langsung atau tidak langsung merugikan Perusahaan;","l":340,"h":340},{"m":"h.","t":"Tidak menerima, tidak menawarkan atau tidak menjanjikan untuk memberi atau menerima hadiah, imbalan, komisi, rabat dan berupa apa saja dari atau kepada siapapun yang diketahui atau patut diduga berkaitan dengan pengadaan barang dan/ atau jasa;","l":340,"h":340},{"m":"i.","t":"Tidak menggunakan dokumen-dokumen yang tidak dapat dipertanggung-jawabkan keaslian dan kebenarannya.","l":340,"h":340},{"c":"[Pasal 7]"}]]}]},{"heading":"G. PENDAYAGUNAAN PRODUKSI DALAM NEGERI","rows":[{"topik":"Penggunaan Produksi Dalam Negeri","cells":[[{"t":"PENDAYAGUNAAN PRODUKSI DALAM NEGERI"},{"m":"1.","t":"Unit Bisnis atau Unit Teknis mengutamakan penggunaan produksi dalam negeri, rancang bangun, dan perekayasaan nasional.","l":340,"h":340},{"m":"2.","t":"Unit Bisnis atau Unit Teknis wajib memenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan.","l":340,"h":340},{"m":"3.","t":"Dalam melakukan PBJ, baik barang jadi, barang setengah jadi, peralatan suku cadang, komponen utama, dan komponen pembantu/pelengkap serta tenaga ahli/konsultan yang berbadan hukum, diupayakan sedapat mungkin hasil produksi dalam negeri dan tenaga asli Indonesia.","l":340,"h":340},{"m":"4.","t":"Ketentuan sebagaimana dimaksud pada poin (2) dicantumkan dalam KAK dan Dokumen Pemilihan.","l":340,"h":340},{"c":"[BAB I.G angka 1-4]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"PENGGUNAAN PRODUKSI DALAM NEGERI DAN PRODUK USAHA MIKRO DAN USAHA KECIL"},{"m":"1.10.1.","t":"Perusahaan mengutamakan penggunaan produksi dalam negeri dan pemberdayaan produk Usaha Mikro dan Usaha Kecil.","l":630,"h":630},{"m":"1.10.2.","t":"Perusahaan diharuskan untuk:","l":630,"h":630},{"m":"a.","t":"memenuhi penggunaan produksi dalam negeri sesuai dengan ketentuan peraturan perundang-undangan; dan","l":624,"h":340},{"m":"b.","t":"memberikan preferensi harga penggunaan produksi dalam negeri dalam rangka mendorong pertumbuhan industri dalam negeri dengan tetap memperhatikan ketentuan peraturan perundangundangan.","l":624,"h":340},{"c":"[BAB 1 angka 1.10.0]"}],[{"t":"PENDAYAGUNAAN PRODUKSI DALAM NEGERI"},{"m":"1.","t":"Untuk Pengadaan Barang dan/atau Jasa Inbound, Unit Pengguna wajib meminta Unit Pembuat Spesifikasi Teknis untuk mengutamakan penggunaan produksi dalam negeri, rancang bangun dan perekayasaan nasional di dalam pembuatan KAK/spesifikasi teknis.","l":340,"h":340},{"m":"2.","t":"Dalam rangka mendorong pertumbuhan industri dalam negeri, Unit Pengguna dapat memberikan preferensi penggunaan produksi dalam negeri dengan tetap mengindahkan ketentuan peraturan perundang-undangan yang berlaku;","l":340,"h":340},{"m":"3.","t":"Kewajiban penggunaan produk dalam negeri sebagaimana dimaksud pada ayat","l":340,"h":340},{"m":"(1)","t":"dilakukan jika terdapat peserta yang menawarkan Barang dan/atau Jasa","l":624,"h":340},{"t":"dengan nilai Tingkat Komponen Dalam Negeri (TKDN) ditambah nilai Bobot Manfaat Perusahaan (BMP) paling rendah 40% (empat puluh persen);","l":340},{"m":"4.","t":"Ketentuan sebagaimana dimaksud pada ayat (2) dan ayat (3) dicantumkan dalam KAK, dan Dokumen Pemilihan;","l":340,"h":340},{"m":"5.","t":"Dalam melakukan Pengadaan Barang dan/atau Jasa, baik barang jadi, barang setengah jadi, peralatan suku cadang, komponen utama dan komponen pembantu/pelengkap serta tenaga ahli/konsultan yang berbadan hukum, diupayakan sedapat mungkin hasil produksi dalam negeri dan tenaga asli Indonesia;","l":340,"h":340},{"c":"[BAB VI.A angka 1-5]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Peningkatan Penggunaan Barang dan/ atau Jasa Produksi Dalam Negeri"},{"m":"1.","t":"Dalam pelaksanaan pengadaan barang dan/ atau jasa, Perusahaan wajib:","l":340,"h":340},{"m":"a.","t":"Memaksimalkan penggunaan barang dan/ atau jasa hasil produksi dalam negeri, termasuk rancang bangun dan perekayasaan nasional dalam Pengadaan Barang/Jasa;","l":624,"h":340},{"m":"b.","t":"Memaksimalkan penggunaan penyedia barang dan/ atau jasa nasional; dan","l":624,"h":340},{"m":"c.","t":"Memaksimalkan penyediaan paket-paket pekerjaan untuk Usaha Mikro dan Usaha Kecil serta koperasi kecil.","l":624,"h":340},{"m":"2.","t":"Kewajiban Perusahaan sebagaimana dimaksud pada ayat (1) dilakukan pada setiap tahapan pengadaan barang dan/ atau jasa, mulai dari persiapan sampai dengan berakhirnya Surat Perjanjian/ Kontrak.","l":340,"h":340},{"m":"3.","t":"Surat Perjanjian/ Kontrak dapat mencantumkan persyaratan penggunaan:","l":340,"h":340},{"m":"a.","t":"Standar Nasional Indonesia (SNI) atau standar lain yang berlaku dan/ atau standar internasional yang setara dan ditetapkan oleh instansi terkait yang berwenang;","l":624,"h":340},{"m":"b.","t":"Produksi dalam negeri sesuai dengan kemampuan industri nasional; dan","l":624,"h":340},{"m":"c.","t":"Tenaga ahli dan/ atau Penyedia barang dan/ atau jasa dalam negeri.","l":624,"h":340},{"m":"4.","t":"Pendayagunaan produksi dalam negeri pada proses pengadaan barang dan/ atau jasa dilakukan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Ketentuan dan syarat penggunaan hasil produksi dalam negeri dimuat dalam Dokumen Pengadaan dan dijelaskan kepada semua peserta;","l":624,"h":340},{"m":"b.","t":"Dalam proses evaluasi pengadaan barang dan/ atau jasa harus diteliti sebaik-baiknya agar benar-benar merupakan hasil produksi dalam negeri dan bukan barang dan/ atau jasa impor yang dijual di dalam negeri sesuai persyaratan yang ditentukan dalam Dokumen Pengadaan;","l":624,"h":340},{"m":"c.","t":"Dalam hal sebagian bahan untuk menghasilkan barang dan/ atau jasa produksi dalam negeri berasal dari impor, dipilih barang dan/ atau jasa yang memiliki komponen dalam negeri paling besar; dan","l":624,"h":340},{"m":"d.","t":"Dalam mempersiapkan pengadaan barang dan/ atau jasa, sedapat mungkin digunakan standar nasional dan memperhatikan kemampuan atau potensi nasional.","l":624,"h":340},{"m":"5.","t":"Dalam pelaksanaan pengadaan barang dan/ atau jasa diupayakan agar Penyedia Barang dan/ atau Jasa dalam negeri bertindak sebagai Penyedia Barang dan/ atau Jasa Utama, sedangkan Penyedia Barang dan/ atau Jasa Asing dapat berperan sebagai sub-Penyedia Barang dan/ atau Jasa sesuai dengan kebutuhan.","l":340,"h":340},{"m":"6.","t":"Penggunaan Tenaga Ahli Asing yang keahliannya belum dapat diperoleh di Indonesia, harus disusun berdasarkan keperluan yang nyata dan diusahakan secara terencana untuk semaksimal mungkin terjadinya pengalihan keahlian pada tenaga kerja Indonesia.","l":340,"h":340},{"m":"7.","t":"Pengadaan Barang yang terdiri atas bagian atau komponen dalam negeri dan bagian atau komponen yang masih harus diimpor, dilakukan dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pemilahan atau pembagian komponen harus benar-benar mencerminkan bagian atau komponen yang telah dapat diproduksi di dalam negeri dan bagian atau komponen yang masih harus diimpor; dan","l":624,"h":340},{"m":"b.","t":"Calon Penyedia Barang dan/ atau Jasa dapat membuat daftar barang yang diimpor yang dilengkapi dengan spesifikasi teknis, jumlah dan harga yang dilampirkan pada Dokumen Penawaran.","l":624,"h":340},{"m":"8.","t":"Pengadaan Pekerjaan Terintegrasi yang terdiri atas bagian atau komponen dalam negeri dan bagian atau komponen yang masih harus diimpor, dilakukan dengan ketentuan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Pemilahan atau pembagian komponen harus benar-benar mencerminkan bagian atau komponen yang telah dapat diproduksi di dalam negeri dan bagian atau komponen yang masih harus diimpor;","l":624,"h":340},{"m":"b.","t":"Pekerjaan pemasangan, pabrikasi, pengujian dan lainnya sedapat mungkin dilakukan di dalam negeri; dan","l":624,"h":340},{"m":"c.","t":"Calon Penyedia Barang dan/ atau Jasa dapat membuat daftar Barang yang diimpor yang dilengkapi dengan spesifikasi teknis, jumlah dan harga yang dilampirkan pada Dokumen Penawaran.","l":624,"h":340},{"m":"9.","t":"Pengadaan barang impor dimungkinkan dalam hal:","l":340,"h":340},{"m":"a.","t":"Barang tersebut belum dapat diproduksi di dalam negeri;","l":624,"h":340},{"m":"b.","t":"Spesifikasi teknis Barang yang diproduksi di dalam negeri belum memenuhi persyaratan; dan/ atau","l":624,"h":340},{"m":"c.","t":"Volume produksi dalam negeri tidak mampu memenuhi kebutuhan;","l":624,"h":340},{"m":"d.","t":"Penyedia Barang dan/ atau Jasa yang melaksanakan pengadaan barang dan/ atau jasa yang diimpor langsung, semaksimal mungkin menggunakan jasa pelayanan yang ada di dalam negeri.","l":624,"h":340},{"c":"[Pasal 56]"},{"t":"Penggunaan Produk Dalam Negeri dan Preferensi Harga"},{"m":"1.","t":"Perusahaan dapat mempersyaratkan ketentuan penggunaan produk dalam negeri sesuai besaran komponen dalam negeri pada setiap barang dan/ atau jasa yang ditunjukkan dengan nilai Tingkat Komponen Dalam Negeri (TKDN), yang ketentuan dan tata cara penghitungannya merujuk pada peraturan yang berlaku umum di Indonesia.","l":340,"h":340},{"c":"[Pasal 60 ayat (1)]"}]]},{"topik":"PBJ dari Luar Negeri","cells":[[{"t":"PENDAYAGUNAAN PRODUKSI DALAM NEGERI"},{"m":"5.","t":"Apabila sebagian Pengadaan Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum tersebut di atas harus diimpor (luar negeri), maka diusahakan seoptimal mungkin menggunakan sebagian besar Barang dan/atau Jasa produksi dalam negeri dan tenaga ahli/konsultan yang berbadan hukum nasional.","l":340,"h":340},{"m":"6.","t":"Pengadaan untuk Barang dan/atau Jasa serta tenaga ahli/konsultan yang berbadan hukum dari luar negeri hanya dimungkinkan apabila:","l":340,"h":340},{"m":"a.","t":"Barang tersebut belum diproduksi di dalam negeri; dan/atau","l":624,"h":340},{"m":"b.","t":"Tenaga ahli/konsultan tersebut tidak tersedia di dalam negeri; dan/atau","l":624,"h":340},{"m":"c.","t":"Volume produksi dalam negeri belum mampu memenuhi kebutuhan, atau tenaga ahli/konsultan Indonesia belum ada atau belum mampu memenuhi kebutuhan; dan/atau","l":624,"h":340},{"m":"d.","t":"Harga produksi penawaran dalam negeri melebihi harga impor setelah ditambah preferensi harga; dan/atau","l":624,"h":340},{"m":"e.","t":"Prinsipal luar negeri yang memasok barang-barang yang membutuhkan pelayanan purna jual harus mempunyai agen resmi pemegang merek yang ditunjuk dan berkantor di wilayah Indonesia; dan/atau","l":624,"h":340},{"m":"f.","t":"Penyedia yang melaksanakan Pengadaan Barang dan/atau Jasa yang diimpor langsung diwajibkan untuk semaksimal mungkin menggunakan jasa pelayanan yang ada di dalam negeri antara lain, asuransi, expedisi, perbankan, dan pemeliharaan; dan/atau","l":624,"h":340},{"m":"g.","t":"Tenaga ahli/konsultan berbadan hukum dalam negeri belum tersedia dan/atau belum memenuhi persyaratan kebutuhan pekerjaan.","l":624,"h":340},{"c": ur."},{"c":"[-]"}],[{"t":"MANAJEMEN RISIKO"},{"tbl":{"rows":[[{"t":"NO"},{"t":"JENIS RISIKO"},{"t":"PENYEBAB"},{"t":"CARA MENGELOLA RISIKO"}],[{"t":"1"},{"t":"Risiko Kepatuhan dan Legal"},{"t":"1. Adanya ketidakpatuhan terhadap manual.\n2. Adanya Proses Pengadaan yang tidak dilakukan sesuai dengan Manual yang berlaku.\n3. Ketidakselarasan dengan perubahan peraturan perundang-undangan."},{"t":"1. Melakukan audit atas tingkat kepatuhan terhadap manual pengadaan secara berkala untuk memastikan bahwa manual ini diimplementasikan dengan baik.\n2. Melaksanakan sosialisasi atau pelatihan mengenai regulasi dan kebijakan tata kelola terintegrasi.\n3. Melakukan mitigasi terhadap perubahan peraturan perundang-undangan."}],[{"t":"2"},{"t":"Risiko Operasional"},{"t":"1. Ketidaksesuaian antara proses pengadaan dan pedoman tata kelola yang diterapkan\n2. Gangguan dan perubahan operasional/struktur organisasi yang menyebabkan implementasi manual pengadaan tidak efektif dan efisien"},{"t":"1. Melakukan review dan penyesuaian proses secara berkala untuk sinkronisasi proses dengan manual.\n2. Menerima kritik/saran dan melakukan evaluasi terhadap implementasi manual pengadaan untuk memastikan efektivitasnya"}],[{"t":"3"},{"t":"Risiko Reputasi"},{"t":"1. Kegagalan dalam proses pengadaan yang disebabkan oleh Nilai Penawaran dan negosiasi melebihi nilai dari pagu anggaran.\n2. Melakukan persekongkolan dengan Peserta lainnya untuk mengatur harga penawaran sehingga mengurangi/menghambat dan/atau meniadakan persaingan yang sehat dan/atau merugikan pihak lain"},{"t":"1. Meningkatkan komunikasi dan koordinasi secara proaktif terkait kebijakan dan langkah-langkah yang diambil untuk mengatasi kegagalan dalam proses pengadaan.\n2. Mengembangkan strategi managemen krisis dan integritas yang tinggi untuk mengurangi potensi persekongkolan antara pelaksana pengadaan dengan peserta pengadaan"}],[{"t":"4"},{"t":"Risiko Sistem Infrastruktur Teknologi dan Keamanan Siber"},{"t":"3. Gangguan sistem surat elektronik dan infrastruktur pendukung"},{"t":"Menerapkan back up sistem down, surat menyurat dapat mengacu pada Manual Naskah Dinas & Tata Arsip yang berlaku diperusahaan"}]],"hdr":1}},{"c":"[BAB 1 angka 1.13.0]"}],[{"t":"RISIKO KEBIJAKAN"},{"tbl":{"rows":[[{"t":"JENIS RISIKO"},{"t":"PENYEBAB"},{"t":"CARA MENGELOLA RISIKO"}],[{"t":"Risiko Kepatuhan dan Hukum"},{"t":"Adanya perubahan peraturan internal dan atau eksternal"},{"t":"Procurement Group melakukan sosialisasi tata laksana dan penetapan peraturan kepada pihak internal/eksternal"}],[{"t":"Risiko Operasional"},{"t":"Kendala proses pengadaan barang dan atau jasa"},{"t":"Melakukan proses secara berkala dan membuat penjelasan mengenai hal- hal teknis yang belum diatur ke dalam prosedur dan atau petunjuk teknis"}],[{"t":"Risiko Reputasi"},{"t":"Adanya teguran atau sanksi yang muncul akibat keterlambatan dalam pengkinian peraturan internal"},{"t":"Divisi pengusul secara reguler melakukan evaluasi dan pengkinian untuk memastikan setiap peraturan yang ditetapkan sesuai dengan peraturan internal maupun peraturan perundang-undang lainnya yang relevan dan berlaku"}]],"hdr":1}},{"c":"[BAB I.C]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"K. MUTU BAKU","rows":[{"topik":"MUTU BAKU","cells":[[{"t":"MUTU BAKU"},{"t":"Standar mutu baku sebagaimana dimaksud pada Tabel I.2 dibawah ini bertujuan untuk memastikan setiap tahapan pengadaan dilaksanakan sesuai dengan peraturan yang berlaku."},{"tbl":{"rows":[[{"t":"No."},{"t":"Kegiatan"},{"t":"Mutu Baku"},{"t":"Kualitas"}],[{"t":"1"},{"t":"Penyusunan Dokumen Teknis"},{"t":"Dokumen Teknis 100% lengkap dan telah disetujui oleh Unit Bisnis atau Unit Teknis."},{"t":"Setelah terbit dokumen konfirmasi anggaran"}],[{"t":"2"},{"t":"Pengumuman dan Pemberian Penjelasan (Aanwijzing)"},{"t":"Pengumuman dilakukan secara luas dan Aanwijzing harus menghasilkan Berita Acara yang ditandatangani."},{"t":"Setelah dokumen teknis telah lengkap diterima oleh U n pengendalian internal memadai.","l":340,"h":340},{"m":"6.","t":"Memerintahkan penundaan dan/atau tindakan korektif terhadap pelaksanaan Perjanjian Pengadaan apabila terdapat indikasi penyimpangan/kecurangan sesuai Pedoman ini.","l":340,"h":340},{"m":"7.","t":"Membentuk tim tertentu (misalnya Tim TKDN) apabila diperlukan sesuai Pedoman ini.","l":340,"h":340},{"m":"8.","t":"Memastikan ketersediaan sumber daya, sistem, dan pengendalian internal yang memadai untuk pelaksanaan PBJ.","l":340,"h":340},{"m":"9.","t":"Menyampaikan laporan hasil pelaksanaan PBJ kepada Dewan Komisaris apabila diperlukan sebagai pertanggungjawaban.","l":340,"h":340},{"c":"[BAB II.B]"}],[{"m":"1.","t":"Direksi memiliki tugas dan kewenangan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Memastikan implementasi prosedur dan kebijakan pengadaan sesuai dengan strategi dan rencana jangka panjang Perusahaan;","l":624,"h":340},{"m":"b.","t":"Mengawasi penerapan prinsip kepatuhan dalam Good Corporate Governance (GCG) dalam proses bisnis pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"c.","t":"Menandatangani Bukti Perjanjian pengadaan barang dan/ atau jasa sesuai dengan kewenangan dalam lampiran Peraturan Direksi ini;","l":624,"h":340},{"m":"d.","t":"Menjatuhkan sanksi daftar hitam kepada mitra pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"e.","t":"Menetapkan penunjukan langsung untuk tender/ seleksi ulang gagal untuk nilai pengadaan yang sesuai dengan batas kewenangan dalam lampiran Peraturan Direksi ini;","l":624,"h":340},{"m":"f.","t":"Menetapkan usulan penunjukan langsung berdasarkan kriteria yang telah ditetapkan, dan berdasarkan nilai pengadaan yang sesuai dengan batas kewenangan dalam lampiran Peraturan Direksi ini.","l":624,"h":340},{"c":"[Pasal 8 ayat (1)]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"m":"1.","t":"Direksi memiliki tugas dan kewenangan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Memastikan implementasi prosedur dan kebijakan pengadaan sesuai dengan strategi dan rencana jangka panjang Perusahaan;","l":624,"h":340},{"m":"b.","t":"Mengawasi penerapan prinsip kepatuhan dalam Good Corporate Governance (GCG) dalam proses bisnis pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"c.","t":"Menandatangani Bukti Perjanjian pengadaan barang dan/ atau jasa sesuai dengan kewenangan dalam lampiran Peraturan Direksi ini;","l":624,"h":340},{"m":"d.","t":"Menjatuhkan sanksi daftar hitam kepada mitra pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"e.","t":"Menetapkan penunjukan langsung untuk kontes/ pelelangan ulang gagal untuk nilai pengadaan barang dan/ atau jasa yang sesuai dengan batas kewenangan dalam lampiran Peraturan Direksi ini;","l":624,"h":340},{"m":"f.","t":"Menetapkan usulan Penunjukan Langsung berdasarkan kriteria yang telah ditetapkan, dan berdasarkan nilai pengadaan yang sesuai dengan batas kewenangan dalam lampiran Peraturan Direksi ini.","l":624,"h":340},{"c":"[Pasal 10 ayat (1)]"}]]}]},{"heading":"C. WEWENANG DAN TANGGUNG JAWAB DIREKTUR YANG MEMBIDANGI PBJ","rows":[{"topik":"WEWENANG DAN TANGGUNG JAWAB DIREKTUR YANG MEMBIDANGI PBJ","cells":[[{"t":"WEWENANG DAN TANGGUNG JAWAB DIREKTUR YANG MEMBIDANGI PBJ"},{"m":"1.","t":"Bertanggung jawab mengoordinasikan dan mengendalikan pelaksanaan PBJ sesuai ketentuan Pedoman ini dan ketentuan internal Perusahaan.","l":340,"h":340},{"m":"2.","t":"Memberikan arahan pelaksanaan PBJ dan memastikan penerapan prinsip GCG.","l":340,"h":340},{"m":"3.","t":"Menyetujui/menetapkan keputusan PBJ sesuai batas kewenangan Direktur Terkait.","l":340,"h":340},{"m":"4.","t":"Menetapkan prioritas/kebutuhan pengadaan tertentu sesuai program kerja dan/atau kebutuhan operasionalPerusahaan.","l":340,"h":340},{"m":"5.","t":"Menetapkan dan/atau mengesahkan penunjukan pelaksana/pejabat PBJ sesuai ketentuan internal.","l":340,"h":340},{"m":"6.","t":"Mengusulkan kepada Direksi hal-hal yang memerlukan persetujuan Direksi dan/atau Dewan Komisaris.","l":340,"h":340},{"m":"7.","t":"Memastikan koordinasi Unit Bisnis atau Unit Teknis, Unit Yang Membidangi Fungsi PBJ Kegiatan Bisnis atau Kegiatan Kantor Pusat dan unit pendukung (anggaran, akuntansi, legal, IT) berjalan efektif.","l":340,"h":340},{"c":"[BAB II.C]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"TUGAS DAN WEWENANG DIREKTUR BIDANG PENGADAAN"},{"m":"1.","t":"Melakukan pembinaan administratif fungsi pengadaan barang dan atau jasa di lingkungan pengadaan yang meliputi organisasi dan peraturan-peraturan bidang pengadaan barang dan atau jasa;","l":340,"h":340},{"m":"2.","t":"Menetapkan dan atau menyetujui program kerja dan strategi pengadaan;","l":340,"h":340},{"m":"3.","t":"Menetapkan dan atau menyetujui usulan pemenang seluruh pekerjaan yang menjadi kewenangan Direktur Yang Membidangi Pengadaan;","l":340,"h":340},{"m":"4.","t":"Memberikan persetujuan atas hasil Pemilihan Penyedia yang menjadi Kewenangan Direktur Yang Membidangi Pengadaan;","l":340,"h":340},{"m":"5.","t":"Merekomendasi hasil Pemilihan Penyedia sesuai dengan metode pelaksanaan Pemilihan Penyedia yang telah dilaksanakandengan nilai pekerjaan di atas 250 juta kepada Pejabat Yang Berwenang untuk diterbitkan Surat Penunjukan;","l":340,"h":340},{"c":"[BAB II.F]"}],[{"t":"Tidak diatur."},{"c":"[-]"}],[{"t":"Tidak diatur."},{"c":"[-]"}]]}]},{"heading":"D. UNIT YANG MEMBIDANGI FUNGSI PBJ KEGIATAN KANTOR PUSAT","rows":[{"topik":"UNIT YANG MEMBIDANGI FUNGSI PBJ KEGIATAN KANTOR PUSAT","cells":[[{"t":"UNIT YANG MEMBIDANGI FUNGSI PBJ KEGIATAN KANTOR PUSAT"},{"m":"1.","t":"Membina tata kelola PBJ di lingkungan Perusahaan sesuai ketentuan yang berlaku.","l":340,"h":340},{"m":"2.","t":"Merumuskan pedoman pelaksanaan PBJ.","l":340,"h":340},{"m":"3.","t":"Menentukan dan menerapkan strategi PBJ.","l":340,"h":340},{"m":"4.","t":"Melakukan evaluasi dan usulan perubahan kepada Unit Bisnis atau Unit Teknis atas dokumen teknis PBJ.","l":340,"h":340},{"m":"5.","t":"Melakukan prakualifikasi terhadap Penyedia.","l":340,"h":340},{"m":"6.","t":"Melakukan hubungan pengelolaan Penyedia.","l":340,"h":340},{"m":"7.","t":"Memutakhirkan daftar rekam jejak Penyedia dengan melakukan evaluasi terhadap kinerjanya.","l":340,"h":340},{"m":"8.","t":"Menetapkan status Penyedia di sistem e-Procurement Perusahaan.","l":340,"h":340},{"m":"9.","t":"Bertanggungjawab terhadap terlaksananya proses pemilihan Penyedia.","l":340,"h":340},{"m":"10.","t":"Melakukan evaluasi penilaian administrasi dan harga terhadap dokumen penawaran peserta serta membuat berita acara hasil evaluasi/penilaian dokumen teknis.","l":340,"h":340},{"m":"11.","t":"Menandatangani pakta integritas.","l":340,"h":340},{"m":"12.","t":"Menyusun Dokumen Perjanjian Pengadaan.","l":340,"h":340},{"m":"13.","t":"Dapat dibantu oleh tenaga ahli dan/atau tim ahli dalam pelaksanaan proses pemilihan jika diperlukan.","l":340,"h":340},{"c":"[BAB II.D]"}],[{"t":"Tugas dan Kewenangan"},{"m":"7.","t":"Pejabat satu tingkat dibawah Direktur yang membidangi fungsi pengadaan memiliki tugas dan kewenangan sebagai berikut :","l":340,"h":340},{"m":"a.","t":"Menetapkan program kerja dan anggaran divisi sesuai dengan tujuan perusahaan;","l":624,"h":340},{"m":"b.","t":"Mengajukan usulan kebijakan, Peraturan Direksi, prosedur dan petunjuk langkah-langkah dalam upaya penerapan Good Corporate Governance (GCG);","l":624,"h":340},{"m":"c.","t":"Meningkatkan kompetensi SDM perusahaan dibidang pengadaan barang dan/ atau jasa;","l":624,"h":340},{"m":"d.","t":"Menetapkan cara pengadaan barang dan/ atau jasa dengan dasar yang tepat dengan memperhatikan efektivitas dalam pelaksanaan dan efisiensi biaya-biaya;","l":624,"h":340},{"m":"e.","t":"Memberikan arahan kepada Manajer dan officer terkait kebijakan dalam proses pengadaan;","l":624,"h":340},{"m":"f.","t":"Menetapkan usulan penunjukan langsung berdasarkan kriteria yang telah ditetapkan untuk nilai pengadaan yang sesuai dengan batas kewenangan dalam lampiran Peraturan Direksi ini.","l":624,"h":340},{"m":"g.","t":"Menetapkan usulan pemenang sesuai dengan batas kewenangan dalam lampiran Peraturan Direksi ini.","l":624,"h":340},{"m":"h.","t":"Menyetujui dokumen pengadaan.","l":624,"h":340},{"m":"8.","t":"Departemen Vendor Management (VM) memiliki tugas dan kewenangan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Melakukan prakualifikasi proses pendaftaran calon penyedia;","l":624,"h":340},{"m":"b.","t":"Melakukan pricelist management;","l":624,"h":340},{"m":"c.","t":"Melakukan penilaian kinerja penyedia;","l":624,"h":340},{"m":"d.","t":"Menerapkan blacklist terhadap penyedia;","l":624,"h":340},{"m":"e.","t":"Menonaktifkan akun penyedia yang dikenakan sanksi daftar hitam atau black list;","l":624,"h":340},{"m":"f.","t":"Melakukan analisa dan verifikasi atas dokumen pengajuan terkait pembuatan kontrak oleh fungsi legal perusahaan;","l":624,"h":340},{"m":"9.","t":"Departemen Purchasing memiliki tugas dan kewenangan sebagai berikut:","l":340,"h":340},{"m":"a.","t":"Melakukan analisa dan verifikasi permintaan pengadaan barang dan/ atau jasa dari unit teknis dan verifikasi kelengkapan dokumen;","l":624,"h":340},{"m":"b.","t":"Melaksanakan proses pengadaan;","l":624,"h":340},{"m":"c.","t":"Menerbitkan dokumen-dokumen pengadaan yaitu :","l":624,"h":340},{"t":"- Analisa pemilihan penyedia","l":624},{"t":"- Formulir analisa untuk pemilihan penyedia dengan penunjukan langsung","l":624},{"m":"d.","t":"Melakukan negosiasi dan menerbitkan Berita Acara negosiasi;","l":624,"h":340},{"m":"e.","t":"Mengajukan usulan pemenang tender/ seleksi dan mengumumkan pemenang tender/ seleksi;","l":624,"h":340},{"m":"f.","t":"Menerbitkan draft Purchase Order (PO) dan Surat Perintah Kerja (SPK);","l":624,"h":340},{"c":"[Pasal 8 ayat (7)-(9)]"},{"t":"Pelaksana Pengadaan Barang dan/ Jasa"},{"m":"1.","t":"Pelaksana pengadaan barang dan/ atau jasa perusahaan dilaksanakan melalui tim purchasing;","l":340,"h":340},{"m":"2.","t":"Tim purchasing haru
