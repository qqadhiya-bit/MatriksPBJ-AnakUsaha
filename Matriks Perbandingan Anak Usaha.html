<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matriks Perbandingan Anak Usaha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E;
    --ink-soft:#3A4568;
    --paper:#F1F2EE;
    --card:#FFFFFF;
    --line:#DBDCD3;
    --line-soft:#EAEAE3;
    --gold:#9C7A24;
    --gold-soft:#F3E9CE;
    --teal:#2F6459;
    --teal-soft:#E1EDE9;
    --navybadge:#233761;
    --navybadge-soft:#E4E8F1;
    --mark:#FBE39A;
    --shadow:0 1px 2px rgba(22,33,62,.05), 0 6px 20px -8px rgba(22,33,62,.15);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--mark);}
  a{color:var(--navybadge);}
  h1,h2,h3{font-family:'IBM Plex Serif', Georgia, serif; margin:0;}
  button{font-family:inherit;}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:2px;}

  .hero{border-bottom:3px solid var(--ink); background:linear-gradient(180deg, rgba(22,33,62,0.035), rgba(22,33,62,0) 60%), var(--paper); padding:38px 24px 26px;}
  .hero-inner{max-width:1180px; margin:0 auto;}
  .hero h1{font-size:clamp(24px,4vw,36px); font-weight:700; color:var(--ink); line-height:1.18;}
  .hero .regs{margin-top:12px; font-size:13.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; line-height:1.8; display:flex; flex-wrap:wrap; gap:8px 18px;}
  .hero .regs span{display:inline-flex; align-items:center; gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .dot.injourney{background:var(--navybadge);}
  .dot.apindo{background:var(--gold);}
  .dot.draft{background:var(--teal);}

  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 16px; min-width:118px; box-shadow:var(--shadow);}
  .stat .n{font-family:'IBM Plex Serif',serif; font-size:22px; font-weight:700; color:var(--ink);}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:2px;}

  .toolbar{position:sticky; top:0; z-index:40; background:rgba(241,242,238,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 24px;}
  .toolbar-inner{max-width:1180px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .search-wrap{position:relative; flex:1 1 260px; min-width:200px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5;}
  #search{width:100%; padding:11px 40px 11px 38px; border-radius:999px; border:1.5px solid var(--line); font-size:14.5px; background:var(--card); color:var(--ink); font-family:inherit;}
  #search:focus{border-color:var(--gold);}
  .kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); border-radius:5px; padding:2px 6px; background:var(--paper); pointer-events:none;}
  .clear-btn{position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:16px; display:none; line-height:1; padding:4px;}
  .toggles{display:flex; gap:6px; flex-wrap:wrap;}
  .chip-toggle{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px 7px 10px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); user-select:none; transition:border-color .15s, color .15s;}
  .chip-toggle input{accent-color:var(--ink); margin:0; width:14px; height:14px;}
  .chip-toggle.on{color:var(--ink); border-color:var(--ink-soft);}
  .results-note{max-width:1180px; margin:10px auto 0; padding:0 24px; font-size:12.5px; color:var(--ink-soft);}

  .layout{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:285px 1fr; gap:28px; padding:22px 24px 80px;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} .sidebar{display:none;} .mobile-nav{display:block;} }
  .mobile-nav{display:none; margin:0 0 6px;}
  .mobile-nav select{width:100%; padding:11px 14px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); font-family:inherit; font-size:14px; color:var(--ink);}

  .sidebar{position:sticky; top:74px; align-self:start; max-height:calc(100vh - 96px); overflow-y:auto; padding-right:4px;}
  .sidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; margin:0 0 8px 4px;}
  .accordion-actions{display:flex; gap:8px; margin-bottom:14px;}
  .mini-btn{border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:7px 11px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .mini-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .nav-group{margin-bottom:2px;}
  .nav-item{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px 10px; border-radius:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; border:1px solid transparent; width:100%; background:none; text-align:left;}
  .nav-item:hover{background:var(--card); color:var(--ink);}
  .nav-item .left{display:flex; align-items:baseline; gap:8px; min-width:0;}
  .nav-item .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); flex:none;}
  .nav-item .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); opacity:.7; flex:none;}
  .chev-mini{transition:transform .15s; flex:none; color:var(--ink-soft); opacity:.6;}
  .nav-group.open .chev-mini{transform:rotate(90deg);}
  .nav-subs{display:none; margin:2px 0 8px; padding-left:8px; border-left:1.5px solid var(--line-soft);}
  .nav-group.open .nav-subs{display:block;}
  .nav-sub{display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:6px 10px 6px 14px; border-radius:6px; font-size:11.8px; color:var(--ink-soft); line-height:1.4;}
  .nav-sub:hover{background:var(--card); color:var(--ink);}
  .nav-sub .code{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--teal); margin-right:5px;}

  .bagian{margin-bottom:14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:80px;}
  .bagian-head{display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; padding:16px 20px; background:none; border:none; cursor:pointer; text-align:left;}
  .bagian-head:hover{background:var(--line-soft);}
  .bagian-head .left{display:flex; align-items:baseline; gap:12px; min-width:0;}
  .bagian-head .code{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold); font-weight:600; flex:none;}
  .bagian-head h2{font-size:16px; color:var(--ink);}
  .bagian-head .meta{display:flex; gap:8px; align-items:center; flex:none;}
  .badge-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px 9px;}
  .chev{transition:transform .18s; color:var(--ink-soft); flex:none;}
  .bagian.open .chev{transform:rotate(90deg);}
  .bagian-body{display:none; padding:4px 20px 18px;}
  .bagian.open .bagian-body{display:block;}

  .subsection{margin-top:16px; scroll-margin-top:90px;}
  .subsection-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; padding-bottom:6px; border-bottom:1.5px solid var(--line-soft);}
  .subsection-head .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); font-weight:600;}
  .subsection-head h3{font-size:14px; color:var(--ink); font-weight:600; font-family:'IBM Plex Sans',sans-serif;}
  .subsection-head .cnt{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  .topic-card{border:1px solid var(--line-soft); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .topic-card:last-child{margin-bottom:0;}
  .topic-title{background:var(--paper); padding:9px 14px; font-weight:600; font-size:13.5px; color:var(--ink); border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .cols{display:grid; grid-template-columns:repeat(3, 1fr);}
  @media (max-width:760px){ .cols{grid-template-columns:1fr;} }
  .col{padding:12px 14px; font-size:13px; line-height:1.55; color:var(--ink-soft); border-left:1px solid var(--line-soft);}
  .col:first-child{border-left:none;}
  @media (max-width:760px){ .col{border-left:none; border-top:1px solid var(--line-soft);} .col:first-child{border-top:none;} }
  .col.hidden-col{display:none;}
  .col-label{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .col-label.injourney{color:var(--navybadge); background:var(--navybadge-soft);}
  .col-label.apindo{color:#8A6A1E; background:var(--gold-soft);}
  .col-label.draft{color:var(--teal); background:var(--teal-soft);}
  .col-text{color:var(--ink);}
  .col-text p{margin:0 0 8px; line-height:1.55; text-align:justify; text-justify:inter-word;}
  .col-text p:last-child{margin-bottom:0;}
  .col-text p.cite-line{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); opacity:.8; margin-top:-2px; text-align:left;}
  .col-text p.list-line-1{padding-left:20px; text-indent:-20px;}
  .col-text p.list-line-2{padding-left:38px; text-indent:-20px;}
  .col-text p.list-line-3{padding-left:56px; text-indent:-20px;}
  .col-text p.list-line-4{padding-left:74px; text-indent:-20px;}
  .col-text p.list-line-5{padding-left:92px; text-indent:-20px;}
  .col-text p.list-line-6{padding-left:110px; text-indent:-20px;}
  .col-text p.list-line-7{padding-left:128px; text-indent:-20px;}
  .col-text p.plain-line{text-align:justify;}
  mark{background:var(--mark); color:inherit; padding:0 1px; border-radius:2px;}
  .extra-block{border-top:1px solid var(--line-soft); padding:12px 16px; font-size:12.5px; line-height:1.6; text-align:justify; text-justify:inter-word;}
  .extra-label{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; margin-bottom:6px; padding:2px 7px; border-radius:5px;}
  .analysis-block .extra-label{color:#8A6A1E; background:var(--gold-soft);}
  .analysis-block .extra-text{color:var(--ink); font-style:normal;}
  .analysis-block .extra-text.empty{color:var(--ink-soft); font-style:italic; text-align:left;}
  .note-block .extra-label{color:var(--ink-soft); background:var(--paper);}
  .note-block .extra-text{color:var(--ink-soft); font-style:italic; text-align:left;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state .big{font-family:'IBM Plex Serif',serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .top-btn{position:fixed; right:22px; bottom:22px; width:42px; height:42px; border-radius:50%; background:var(--ink); color:#fff; border:none; cursor:pointer; box-shadow:var(--shadow); display:none; align-items:center; justify-content:center; z-index:50;}
  .top-btn.show{display:flex;}

  footer{max-width:1180px; margin:0 auto; padding:6px 24px 40px; color:var(--ink-soft); font-size:12px;}
  :root{--colw:300px; --c0:#0F6E56; --c1:#233761; --c2:#9C7A24; --c3:#6A4C93; --c4:#B5543A; --c5:#3B6E8F;}
  .layout{max-width:1500px;} .toolbar-inner,.hero-inner,.results-note,footer{max-width:1500px;}
  main{min-width:0;}
  .dot.c0{background:var(--c0);} .dot.c1{background:var(--c1);} .dot.c2{background:var(--c2);} .dot.c3{background:var(--c3);} .dot.c4{background:var(--c4);} .dot.c5{background:var(--c5);}
  .col-label.c0{color:var(--c0); background:#E1F2EC;} .col-label.c1{color:var(--c1); background:#E4E8F1;} .col-label.c2{color:#7E6219; background:#F3E9CE;}
  .col-label.c3{color:var(--c3); background:#EEE8F6;} .col-label.c4{color:var(--c4); background:#F8E7E1;} .col-label.c5{color:var(--c5); background:#E2EDF4;}
  .about{margin-top:16px; font-size:13px; color:var(--ink-soft); max-width:1000px;}
  .about summary{cursor:pointer; font-weight:600; color:var(--ink);}
  .about p{margin:8px 0 0; line-height:1.6; text-align:justify;}
  .width-ctl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .width-ctl button{border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft);}
  .width-ctl button.on{background:var(--navybadge); border-color:var(--navybadge); color:#fff;}
  /* sticky column header bar inside main */
  .colbar{position:sticky; top:var(--tbh,66px); z-index:30; display:flex; align-items:stretch; margin-bottom:14px; background:rgba(241,242,238,.96); backdrop-filter:blur(6px); padding:8px 0;}
  .nav-arrow{position:absolute; top:50%; transform:translateY(-50%); z-index:2; width:30px; height:30px; border-radius:50%; box-shadow:0 2px 8px -2px rgba(22,33,62,.3); border:1.5px solid var(--line); background:var(--card); cursor:pointer; font-size:15px; color:var(--ink);}
  .nav-arrow:hover{border-color:var(--navybadge);}
  .nav-arrow:disabled{opacity:.35; cursor:default;}
  .colbar-scroll{flex:none; overflow-x:auto; overflow-y:hidden; border-radius:8px; scrollbar-width:thin; scrollbar-color:#9EA3B5 transparent; padding-bottom:2px;}
  .colbar-scroll::-webkit-scrollbar{height:9px;} .colbar-scroll::-webkit-scrollbar-thumb{background:#9EA3B5; border-radius:8px;}
  #prevCol{left:-12px;} #nextCol{right:-12px;}
  .colbar{position:sticky;}
  .colbar-inner{display:grid; grid-auto-flow:column; grid-auto-columns:var(--colw); gap:0;}
  .colbar-inner div{display:flex; align-items:center; gap:7px; padding:8px 14px 8px 22px; background:var(--card); border:1px solid var(--line); border-right:none; font-size:12.5px; font-weight:700; color:var(--ink);}
  .colbar-inner div:last-child{border-right:1px solid var(--line);}
  .colbar-inner .pos{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); font-weight:500;}
  .h-scroll{overflow:hidden;}
  .h-scroll::-webkit-scrollbar{height:8px;} .h-scroll::-webkit-scrollbar-thumb{background:#C9CBC2; border-radius:8px;}
  .cols6{display:grid; grid-auto-flow:column; grid-auto-columns:var(--colw); background:var(--line-soft);}
  .cols6 .col{background:var(--card); padding:12px 14px; border-right:1px solid var(--line-soft); scroll-snap-align:start; min-width:0;}
  .cols6 .col:last-child{border-right:none;}
  .cols6 .col.hidden-col{display:none;}
  .col-text p{margin:0 0 6px;}
  .col-text p.li{display:grid; grid-template-columns:var(--mw) 1fr; text-align:justify;}
  .col-text p.li .mk{white-space:nowrap; padding-right:4px;}
  .col-text p.caps{font-weight:700; font-size:12px; letter-spacing:.02em; text-align:left; margin-top:8px;}
  .col-text p.cite-line{font-style:italic; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-align:left; margin-bottom:10px;}
  .col-text .none{color:var(--ink-soft);}
  .in-tbl-wrap{overflow-x:auto; margin:4px 0 8px;}
  .in-tbl{border-collapse:collapse; width:100%; font-size:11.5px; line-height:1.45;}
  .in-tbl th,.in-tbl td{border:1px solid var(--line); padding:5px 7px; vertical-align:top; text-align:left;}
  .in-tbl th{background:var(--navybadge); color:#fff; font-weight:600;}
  .topic-card .topic-title.same{display:none;}
  .scroll-hint{font-size:11.5px; color:var(--ink-soft); margin:-6px 0 12px;}

  .side-toggle{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;}
  .side-toggle:hover{border-color:var(--navybadge);}
  .layout.no-side{grid-template-columns:minmax(0,1fr);}
  .layout.no-side .sidebar{display:none;}
  @media (max-width:900px){ .side-toggle{display:none;} }

  :root{--t0:#EDF6F2; --t1:#EEF1F7; --t2:#FAF5E8; --t3:#F4F0F9; --t4:#FAF0EC; --t5:#ECF3F7;}
  .cols6 .col.c0{background:var(--t0);} .cols6 .col.c1{background:var(--t1);} .cols6 .col.c2{background:var(--t2);}
  .cols6 .col.c3{background:var(--t3);} .cols6 .col.c4{background:var(--t4);} .cols6 .col.c5{background:var(--t5);}
  .cols6 .col{border-right:1px solid rgba(255,255,255,.9);}
  .colbar-inner div.c0{background:var(--t0); border-top:3px solid var(--c0);} .colbar-inner div.c1{background:var(--t1); border-top:3px solid var(--c1);}
  .colbar-inner div.c2{background:var(--t2); border-top:3px solid var(--c2);} .colbar-inner div.c3{background:var(--t3); border-top:3px solid var(--c3);}
  .colbar-inner div.c4{background:var(--t4); border-top:3px solid var(--c4);} .colbar-inner div.c5{background:var(--t5); border-top:3px solid var(--c5);}
  .colbar-inner div{font-size:12px;}
  .cols6 .col .in-tbl td{background:rgba(255,255,255,.65);}
  .in-tbl{font-size:10.5px; line-height:1.4;}
  .in-tbl th,.in-tbl td{padding:4px 5px; overflow-wrap:break-word; word-break:normal;}
  .in-tbl{table-layout:fixed;}
  :root{--c0:#C9A100; --c2:#0F6E56; --t0:#FFF8DB; --t2:#EDF6F2;}
  .col-label.c0{color:#7A6200; background:#FFEFB8;} .col-label.c2{color:#0F6E56; background:#E1F2EC;}
  /* palet lembut tanpa hijau */
  :root{
    --c0:#B8923A; --t0:#FBF6E6;   /* Draft IAS – kuning pasir */
    --c1:#4A6085; --t1:#F1F4F8;   /* AP Supports – biru batu */
    --c2:#A0607A; --t2:#F9F1F4;   /* Gapura – merah muda pudar */
    --c3:#7468A0; --t3:#F4F2F9;   /* IAS Hospitality – lavender */
    --c4:#B07255; --t4:#FAF2EE;   /* IAS Property – terakota lembut */
    --c5:#8A7F72; --t5:#F5F3F0;   /* IAS Support – abu kecokelatan */
  }
  .col-label.c0{color:#7A5F1E; background:#F3E8C4;} .col-label.c1{color:#34496B; background:#E2E8F1;}
  .col-label.c2{color:#7D4560; background:#F1E1E8;} .col-label.c3{color:#554A80; background:#E6E2F2;}
  .col-label.c4{color:#8A5038; background:#F2E2DA;} .col-label.c5{color:#5E554A; background:#E8E3DC;}
  .colbar-inner div{border-top-width:2px !important;}
  .col-text p.li{grid-template-columns:minmax(var(--mw), max-content) 1fr;}
  .col-text p.li .mk{padding-right:6px;}
  .in-tbl{table-layout:auto;}
  .in-tbl th{text-align:center; vertical-align:middle; background:#3A4A66;}
  .in-tbl.has-no td:first-child{width:26px; text-align:center;}
  .in-tbl.plain td{border:none; padding:2px 4px; background:transparent !important;}
  .in-tbl td{overflow-wrap:break-word;}
  /* Gapura & IAS Hospitality: warna netral */
  :root{ --c2:#3C7FA0; --t2:#EEF5F8; --c3:#5A6270; --t3:#F2F3F5; }
  .col-label.c2{color:#2C5F78; background:#DCEBF2;} .col-label.c3{color:#424954; background:#E3E5E9;}
  .in-tbl-wrap{scrollbar-width:thin;}
  .tbl-expand{display:inline-flex; align-items:center; gap:5px; margin:2px 0 6px; border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 9px; font-size:11.5px; font-weight:600; color:var(--navybadge); cursor:pointer; font-family:inherit;}
  .tbl-expand:hover{border-color:var(--navybadge);}
  .tbl-modal{position:fixed; inset:0; z-index:300; background:rgba(22,33,62,.45); display:none; align-items:center; justify-content:center; padding:24px;}
  .tbl-modal.show{display:flex;}
